<style>
  :root {
    --yellow: #ffd23f;
    --red: #ff3b3b;
    --blood: #b3121b;
    --green: #8bdc3b;
    --orange: #ff7a1a;
    --ink: #f6efe4;
    --dim: #b8aba2;
    --panel: rgba(20, 13, 16, 0.86);
    --line: rgba(255, 255, 255, 0.13);
    --display: "Bungee", Impact, "Arial Black", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1014; color: var(--ink);
    font: 15px/1.4 "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  kbd { font: inherit; font-weight: 600; font-size: 0.9em; background: rgba(255,255,255,0.1); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; overflow: hidden; display: none; }
  #hud.on { display: block; }
  .hudv { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; display: none; }
  .hudv.on { display: block; }
  .hudv.half, .hudv.quarter { outline: 2px solid rgba(0,0,0,0.85); outline-offset: -1px; }
  .ov { position: absolute; inset: 0; opacity: 0; }
  .ov-hurt { background: radial-gradient(ellipse at center, transparent 45%, rgba(200,10,20,0.75) 100%); }
  .ov-blood, .ov-puke, .ov-poop { filter: blur(0.3px); }

  .h-lap { position: absolute; left: 18px; top: 14px; text-shadow: 0 2px 0 #000, 0 0 10px rgba(0,0,0,0.6); }
  .h-lap-n { font-family: var(--display); font-size: 30px; letter-spacing: 0.02em; }
  .h-lap-n b { color: var(--yellow); font-weight: 400; }
  .h-lap-n span { color: var(--dim); font-size: 20px; }
  .h-time { font-weight: 800; font-size: 20px; font-variant-numeric: tabular-nums; }
  .h-circ { font-size: 12px; color: var(--yellow); font-weight: 600; letter-spacing: 0.04em; margin-top: 2px; }
  .h-laps { font-size: 12.5px; color: var(--dim); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .h-laps b { color: var(--ink); font-weight: 600; }

  .h-item { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); text-align: center; }
  .h-item-box { position: relative; width: 84px; height: 84px; margin: 0 auto; border-radius: 16px; background: rgba(20,13,16,0.72);
    border: 3px solid rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,0.5); }
  .h-item.ready .h-item-box { border-color: var(--yellow); box-shadow: 0 4px 0 rgba(0,0,0,0.5), 0 0 22px rgba(255,210,63,0.45); }
  .h-item.rolling .h-item-box { border-color: var(--orange); }
  .h-item.fire .h-item-box { border-color: var(--red); box-shadow: 0 0 26px rgba(255,80,30,0.8); }
  .h-item-icon { font-size: 50px; line-height: 1; }
  .h-item-uses { position: absolute; right: -10px; bottom: -8px; font-family: var(--display); font-size: 20px; color: var(--yellow); text-shadow: 0 2px 0 #000; }
  .h-item-name { margin-top: 6px; font-weight: 800; font-size: 14px; letter-spacing: 0.06em; text-transform: uppercase; text-shadow: 0 2px 0 #000; min-height: 18px; }

  .h-map { position: absolute; right: 14px; top: 12px; width: 190px; height: 190px; border-radius: 14px; background: rgba(20,13,16,0.55); }
  .h-map canvas { width: 190px; height: 190px; display: block; }
  .h-feed { position: absolute; right: 14px; top: 212px; width: 340px; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .f { background: rgba(20,13,16,0.75); padding: 4px 10px; border-radius: 6px; font-size: 13.5px; text-align: right; max-width: 100%;
    border-right: 3px solid transparent; }
  .f.kill.mine { border-right-color: var(--red); background: rgba(70,8,12,0.8); }
  .f.taunt { font-size: 13px; color: #e8dccd; }
  .f.taunt i { font-style: italic; font-weight: 600; }

  .h-health { position: absolute; left: 18px; bottom: 18px; width: 260px; }
  .h-name { font-family: var(--display); font-size: 18px; text-shadow: 0 2px 0 #000; margin-bottom: 4px; }
  .h-bar { height: 16px; border-radius: 8px; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.25); overflow: hidden; }
  .h-bar i { display: block; height: 100%; width: 100%; background: var(--green); transition: width 0.15s; }

  .h-pos { position: absolute; right: 22px; bottom: 54px; font-family: var(--display); text-shadow: 0 4px 0 #000, 0 0 18px rgba(0,0,0,0.5); line-height: 1; }
  .h-pos b { font-size: 92px; font-weight: 400; color: var(--yellow); }
  .h-pos sup { font-size: 34px; vertical-align: top; position: relative; top: 8px; color: var(--yellow); }
  .h-pos small { font-size: 24px; color: var(--dim); margin-left: 2px; }
  .h-best { position: absolute; right: 22px; bottom: 58px; text-align: right; display: none; text-shadow: 0 3px 0 #000; }
  .h-best span { display: block; font-size: 12px; letter-spacing: 0.14em; color: var(--dim); font-weight: 800; }
  .h-best b { font-family: var(--display); font-weight: 400; font-size: 34px; color: var(--yellow); font-variant-numeric: tabular-nums; }
  .hudv.trial .h-pos { display: none; }
  .hudv.trial .h-best { display: block; }
  /* Split screen: smaller HUD pieces */
  .hudv.half .h-map, .hudv.half .h-map canvas { width: 120px; height: 120px; }
  .hudv.half .h-feed { top: 138px; width: 260px; }
  .hudv.half .h-pos b { font-size: 58px; }
  .hudv.half .h-pos { bottom: 40px; }
  .hudv.half .h-item-box { width: 64px; height: 64px; }
  .hudv.half .h-item-icon { font-size: 38px; }
  .hudv.half .h-ann-t { font-size: clamp(26px, 4.5vw, 54px); }
  .hudv.quarter .h-map, .hudv.quarter .h-map canvas { width: 96px; height: 96px; }
  .hudv.quarter .h-feed { top: 112px; width: 210px; font-size: 11px; }
  .hudv.quarter .f { font-size: 11.5px; padding: 3px 7px; }
  .hudv.quarter .h-lap-n { font-size: 20px; }
  .hudv.quarter .h-time { font-size: 15px; }
  .hudv.quarter .h-laps { display: none; }
  .hudv.quarter .h-pos b { font-size: 46px; }
  .hudv.quarter .h-pos sup { font-size: 20px; }
  .hudv.quarter .h-pos { bottom: 34px; right: 12px; }
  .hudv.quarter .h-speed b { font-size: 18px; }
  .hudv.quarter .h-health { width: 160px; bottom: 12px; left: 12px; }
  .hudv.quarter .h-name { font-size: 13px; }
  .hudv.quarter .h-item { top: 8px; }
  .hudv.quarter .h-item-box { width: 52px; height: 52px; border-width: 2px; }
  .hudv.quarter .h-item-icon { font-size: 30px; }
  .hudv.quarter .h-item-name { font-size: 11px; }
  .hudv.quarter .h-ann-t { font-size: clamp(20px, 3.4vw, 40px); -webkit-text-stroke: 1px #000; }
  .hudv.quarter .h-ann-s { font-size: 13px; }
  .hudv.quarter .h-warn { font-size: 16px; }
  .hudv.quarter .h-help, .hudv.half .h-help { font-size: 11px; }
  .hudv.quarter .h-best b { font-size: 22px; }
  .h-speed { position: absolute; right: 24px; bottom: 16px; font-weight: 800; text-shadow: 0 2px 0 #000; display: flex; align-items: baseline; gap: 6px; }
  .h-speed b { font-size: 26px; font-variant-numeric: tabular-nums; min-width: 52px; text-align: right; }
  .h-speed span { color: var(--dim); font-size: 13px; }
  .h-drift { display: flex; gap: 4px; margin-left: 8px; align-self: center; }
  .h-drift i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 1px solid rgba(0,0,0,0.6); }
  .h-drift i.on.t1 { background: #ffd23f; box-shadow: 0 0 8px #ffd23f; }
  .h-drift i.on.t2 { background: #ff7a1a; box-shadow: 0 0 8px #ff7a1a; }
  .h-drift i.on.t3 { background: #ff2a6d; box-shadow: 0 0 10px #ff2a6d; }

  .h-ann { position: absolute; left: 50%; top: 26%; transform: translate(-50%, -50%); text-align: center; opacity: 0; width: 92%; }
  .h-ann.on { animation: pop 0.35s cubic-bezier(.2,1.6,.4,1) forwards; }
  .h-ann-t { font-family: var(--display); font-size: clamp(36px, 7.5vw, 86px); line-height: 1.02; letter-spacing: 0.01em;
    text-shadow: 0 5px 0 #000, 0 0 30px rgba(0,0,0,0.6); -webkit-text-stroke: 2px #000; }
  .h-ann-s { font-weight: 800; font-size: clamp(15px, 2vw, 22px); margin-top: 8px; text-shadow: 0 2px 0 #000, 0 0 10px #000; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.8); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }

  .h-warn { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-family: var(--display); font-size: clamp(20px, 3.2vw, 34px);
    color: #fff; background: rgba(200,10,20,0.8); padding: 6px 18px; border-radius: 8px; opacity: 0; white-space: nowrap; }
  .h-warn.on { animation: blink 0.5s steps(2) infinite; }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.35; } }
  .h-help { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); font-size: 13px; color: #e8dccd; background: rgba(20,13,16,0.7);
    padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
  .h-fps { position: absolute; left: 50%; top: 116px; transform: translateX(-50%); font-size: 12px; color: var(--dim); }

  /* ---------- Menus ---------- */
  #menu { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; overflow: auto;
    background: radial-gradient(ellipse at center, rgba(26,12,16,0.25), rgba(26,12,16,0.8)); }
  #menu.on { display: flex; }
  #menu.s-title { background: linear-gradient(90deg, rgba(20,8,12,0.88) 0%, rgba(20,8,12,0.55) 45%, rgba(20,8,12,0) 75%); justify-content: flex-start; }
  button { font: inherit; color: var(--ink); cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }

  .m-title { padding: 0 6vw; display: flex; flex-direction: column; gap: 18px; max-width: 640px; }
  .logo { font-family: var(--display); font-size: clamp(48px, min(11vw, 15vh), 132px); line-height: 0.88; letter-spacing: -0.01em;
    display: flex; flex-direction: column; transform: rotate(-4deg); transform-origin: left center; }
  .logo .l1 { color: var(--yellow); text-shadow: 6px 6px 0 #000, 0 0 40px rgba(255,180,40,0.35); }
  .logo .l2 { color: var(--red); text-shadow: 6px 6px 0 #000, 0 0 50px rgba(255,60,30,0.55); margin-left: 0.5em; }
  .tagline { font-size: 18px; font-weight: 600; color: #f0dcc8; text-shadow: 0 2px 0 #000; margin-top: 8px; }
  .m-btns { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .center .m-btns { align-items: stretch; }
  button.big { font-family: var(--display); font-size: 22px; letter-spacing: 0.03em; padding: 12px 26px; border-radius: 6px;
    background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.22); transform: skewX(-8deg); transition: transform 0.1s, background 0.1s;
    box-shadow: 0 4px 0 rgba(0,0,0,0.6); }
  button.big:hover { background: rgba(255,255,255,0.16); transform: skewX(-8deg) translateX(4px); }
  button.big.primary { background: var(--red); border-color: #ff8a7a; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  button.big.primary:hover { background: #ff5a4a; }
  .m-title button.big { min-width: 240px; text-align: left; }
  .m-title .m-btns { display: grid; grid-template-columns: repeat(2, auto); justify-content: start; gap: 10px 14px; }
  #menu.s-title { align-items: safe center; }
  .rating { display: flex; gap: 12px; align-items: center; font-size: 13px; color: #e8dccd; margin-top: 10px; }
  .rating b { font-family: var(--display); font-size: 30px; width: 46px; height: 52px; display: flex; align-items: center; justify-content: center;
    background: #f4f1ea; color: #111; border-radius: 4px; border: 3px solid #111; box-shadow: 0 0 0 2px #f4f1ea; flex-shrink: 0; }
  .rating small { color: var(--dim); }
  .ver { color: var(--dim); font-size: 12px; }

  .m-panel { width: min(900px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 24px; box-shadow: 0 30px 80px rgba(0,0,0,0.55); user-select: text; -webkit-user-select: text; }
  .m-panel.wide { width: min(1120px, 100%); }
  .m-panel.narrow { width: min(560px, 100%); }
  .m-panel.center { text-align: center; }
  .m-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .head-btns { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .head-btns .waiting { margin: 0; }
  .head-btns button.big { font-size: 17px; padding: 9px 18px; }
  .m-head h2, .big-h { font-family: var(--display); font-weight: 400; font-size: 30px; margin: 0; color: var(--yellow); text-shadow: 3px 3px 0 #000; }
  .big-h { font-size: 44px; margin-bottom: 18px; }
  button.ghost { background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; }
  button.ghost:hover { background: rgba(255,255,255,0.14); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .card { text-align: left; background: rgba(255,255,255,0.04); border: 2px solid var(--line); border-radius: 10px; padding: 0 0 10px; overflow: hidden;
    transition: transform 0.1s, border-color 0.1s; }
  .card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.35); }
  .card.on { border-color: var(--yellow); background: rgba(255,210,63,0.1); box-shadow: 0 0 24px rgba(255,210,63,0.25); }
  .card-band { height: 10px; background: var(--c); border-bottom: 2px solid rgba(0,0,0,0.4); }
  .card-name { font-family: var(--display); font-size: 17px; padding: 8px 12px 2px; color: var(--n); text-shadow: 2px 2px 0 #000; }
  .card-bio { font-size: 12px; color: var(--dim); padding: 0 12px; min-height: 46px; }
  .card-stats { padding: 6px 12px 0; display: grid; gap: 3px; }
  .stat { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--dim); }
  .pips { display: flex; gap: 3px; }
  .pips i { width: 14px; height: 7px; border-radius: 2px; background: rgba(255,255,255,0.12); }
  .pips i.on { background: var(--c); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); }

  .m-row { display: flex; gap: 14px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
  .opt-group { display: flex; flex-direction: column; gap: 4px; }
  .opt-group label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .seg { display: flex; gap: 4px; }
  .seg button { background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-radius: 7px; padding: 7px 14px; font-weight: 600; }
  .seg button.on { background: var(--yellow); color: #1a1006; border-color: transparent; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .tile { text-align: left; background: rgba(255,255,255,0.04); border: 2px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .tile:hover { border-color: rgba(255,255,255,0.35); }
  .tile.on { border-color: var(--yellow); background: rgba(255,210,63,0.1); }
  .tile b { display: block; font-family: var(--display); font-weight: 400; font-size: 15px; }
  .tile span { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
  .paints { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .paints label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); margin-right: 6px; }
  .paint { display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,0.05); border: 2px solid var(--line); border-radius: 8px; padding: 4px 10px 4px 4px; font-size: 12.5px; font-weight: 600; }
  .paint i { width: 26px; height: 26px; border-radius: 5px; border: 1px solid rgba(0,0,0,0.5); flex-shrink: 0; }
  .paint.on { border-color: var(--yellow); background: rgba(255,210,63,0.12); }
  .paint.locked { opacity: 0.5; }
  .paint.locked i { filter: grayscale(1) brightness(0.6); }
  .hint { margin-top: 6px; font-size: 13px; color: var(--yellow); }
  .unlock { display: flex; gap: 12px; align-items: center; background: rgba(139,220,59,0.12); border: 1px solid var(--green); border-radius: 10px; padding: 10px 14px; margin: 0 auto 12px; max-width: 560px; }
  .unlock i { width: 46px; height: 46px; border-radius: 8px; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.5); }
  .unlock b { display: block; color: var(--green); font-family: var(--display); font-weight: 400; font-size: 16px; }
  .unlock span { font-size: 12.5px; color: #e8dccd; }
  .card { position: relative; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" integrity="sha384-nlUQ8ZqCbvStErob+biJNzSgltf6urV3VGqhfIfzhmg9RXmpeRm76ELw0pYnKlTR" crossorigin="anonymous"></script>
<script>
/* ---- js/core.js ---- */
/* BuggyBoom — core: version, settings, small helpers.
   Every other file hangs its pieces off the global BB object. */
(function () {
  'use strict';
  const BB = (window.BB = window.BB || {});

  BB.GAME_VERSION = '1.7';
  BB.DEG = Math.PI / 180;
  BB.TAU = Math.PI * 2;

  BB.clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  BB.lerp = (a, b, t) => a + (b - a) * t;
  BB.damp = (a, b, rate, dt) => a + (b - a) * (1 - Math.exp(-rate * dt));
  BB.approach = (v, target, step) => (v < target ? Math.min(v + step, target) : Math.max(v - step, target));
  BB.smoothstep = (a, b, x) => {
    const t = BB.clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  BB.easeOut = (t) => 1 - (1 - t) * (1 - t);
  BB.rand = (a, b) => a + Math.random() * (b - a);
  BB.pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
  BB.wrapAngle = (a) => {
    a = (a + Math.PI) % BB.TAU;
    if (a < 0) a += BB.TAU;
    return a - Math.PI;
  };
  BB.lerpAngle = (a, b, t) => a + BB.wrapAngle(b - a) * t;
  // Whole numbers of particles per frame from a per-second rate, without frame-rate drift.
  BB.count = (rate, dt) => Math.floor(rate * dt + Math.random());

  // Small seeded random numbers, so the scenery is the same every time.
  BB.rng = (seed) => {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };

  BB.shuffle = (arr) => {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  };

  // Browser storage that never throws (private windows, blocked storage).
  BB.store = {
    get(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    },
    set(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (e) {
        /* storage unavailable: settings just won't persist */
      }
    },
  };

  const params = new URLSearchParams(location.search);
  BB.params = params;
  // ?mute (or ?volume=0) forces silence without touching saved settings. Test copies use this.
  BB.forceMute = params.has('mute') || params.get('volume') === '0';

  BB.DEFAULT_SETTINGS = {
    volume: 0.6,
    music: 0.45,
    track: 'dumpster',
    mode: 'single',
    circuit: 'trash',
    paints: {}, // racer id -> paint id
    karts: {}, // racer id -> kart id
    swearing: true,
    gore: true,
    shake: true,
    shadows: true,
    showFps: false,
    laps: 3,
    difficulty: 'normal', // CPU preset: pushover, easy, normal, nasty, psycho, or custom
    cpuCount: 7,
    cpuCustom: {}, // racer id -> level or 'out' (custom mode)
    players: 1, // local split-screen players
    racer: 'meat', // player 1's racer
    picks: ['mercy', 'chad', 'rita'], // players 2-4
    name: '', // name shown to others online
  };

  function merge(base, extra) {
    const copy = (v) => (v && typeof v === 'object' ? JSON.parse(JSON.stringify(v)) : v);
    const out = {};
    for (const k of Object.keys(base)) out[k] = copy(base[k]);
    if (!extra || typeof extra !== 'object') return out;
    for (const k of Object.keys(base)) {
      if (k in extra && typeof extra[k] === typeof base[k]) out[k] = copy(extra[k]);
    }
    return out;
  }

  const SETTINGS_KEY = 'buggyboom.settings.v1';
  BB.settings = merge(BB.DEFAULT_SETTINGS, BB.store.get(SETTINGS_KEY, null));
  const listeners = [];
  BB.onSettings = (fn) => listeners.push(fn);
  BB.saveSettings = () => {
    BB.store.set(SETTINGS_KEY, BB.settings);
    for (const fn of listeners) fn(BB.settings);
  };
  BB.resetSettings = () => {
    BB.settings = merge(BB.DEFAULT_SETTINGS, null);
    BB.saveSettings();
  };

  BB.volume = () => (BB.forceMute ? 0 : BB.settings.volume);
  BB.musicVolume = () => (BB.forceMute ? 0 : BB.settings.music);

  // Swear words are written in {braces}. With swearing off they become grawlix: "{shit}" -> "$#!%".
  const GRAWLIX = '#@$%&!*';
  BB.say = (text) =>
    String(text).replace(/\{([^}]+)\}/g, (m, w) => {
      if (BB.settings.swearing) return w;
      let s = '';
      for (let i = 0; i < Math.max(3, w.length); i++) s += GRAWLIX[(i * 3 + w.length) % GRAWLIX.length];
      return s;
    });

  BB.esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Escaped and censored, ready for innerHTML.
  BB.text = (s) => BB.esc(BB.say(s));

  BB.ordinal = (n) => {
    const s = ['th', 'st', 'nd', 'rd'];
    const v = n % 100;
    return s[(v - 20) % 10] || s[v] || s[0];
  };

  // 83.456 -> "1:23.46". Rounded to hundredths first, so 59.996 shows as 1:00.00, not 0:60.00.
  BB.fmtTime = (t) => {
    if (!(t >= 0) || !isFinite(t)) return '-:--.--';
    const cs = Math.round(t * 100);
    const m = Math.floor(cs / 6000);
    const s = (cs - m * 6000) / 100;
    return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);
  };

  // A canvas drawn once and used as a repeating texture.
  BB.canvasTexture = (w, h, draw, repeat) => {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    draw(c.getContext('2d'), w, h);
    const t = new THREE.CanvasTexture(c);
    if (repeat !== false) t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = 8;
    return t;
  };

  // Speckle a canvas with noise: n dots in shades around a base colour.
  BB.speckle = (g, w, h, n, colors, maxR) => {
    for (let i = 0; i < n; i++) {
      g.fillStyle = colors[(Math.random() * colors.length) | 0];
      const r = Math.random() * (maxR || 1.5) + 0.4;
      g.fillRect(Math.random() * w, Math.random() * h, r, r);
    }
  };
})();

<script>
/* ---- js/audio.js ---- */
/* BuggyBoom — audio. Every sound is synthesized here with Web Audio; there are no sound files.
   At volume 0 nothing is created or played at all. Built on Range One's sound engine. */
(function () {
  'use strict';
  const BB = window.BB;

  class Audio {
    constructor() {
      this.ctx = null;
      this.engs = {}; // engine loops, one per player on this computer
      this.listeners = [{ x: 0, y: 0, z: 0 }]; // every player's camera
    }

    // Creates the audio graph on first use (only if something is audible). Returns true if it exists.
    context() {
      if (BB.forceMute) return false;
      if (!this.ctx) {
        if (BB.volume() <= 0 && BB.musicVolume() <= 0) return false;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return false;
        try {
          this.ctx = new AC();
        } catch (e) {
          return false;
        }
        this.build();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
      this.sfxGain.gain.value = BB.volume();
      this.musicGain.gain.value = BB.musicVolume();
      return true;
    }

    // Returns true when sound effects should play.
    ensure() {
      return this.context() && BB.volume() > 0;
    }

    // Returns true when music should play.
    ensureMusic() {
      return this.context() && BB.musicVolume() > 0;
    }

    build() {
      const c = this.ctx;
      this.master = c.createGain();
      this.master.connect(c.destination);
      this.musicGain = c.createGain();
      const mcomp = c.createDynamicsCompressor(); // keeps loud riffs from clipping
      mcomp.threshold.value = -12;
      mcomp.knee.value = 6;
      mcomp.ratio.value = 6;
      mcomp.attack.value = 0.003;
      mcomp.release.value = 0.2;
      this.musicGain.connect(mcomp);
      mcomp.connect(this.master);
      this.sfxGain = c.createGain();
      this.sfxGain.connect(this.master);
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.knee.value = 8;
      comp.ratio.value = 5;
      comp.attack.value = 0.002;
      comp.release.value = 0.2;
      this.out = c.createGain();
      this.out.gain.value = 0.85;
      this.out.connect(comp);
      comp.connect(this.sfxGain);

      // A short echo off the junk piles, for explosions and gunfire.
      this.echo = c.createGain();
      const delay = c.createDelay(1);
      delay.delayTime.value = 0.18;
      const fb = c.createGain();
      fb.gain.value = 0.3;
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 1200;
      this.echo.connect(delay);
      delay.connect(lp);
      lp.connect(fb);
      fb.connect(delay);
      lp.connect(this.out);

      const len = c.sampleRate;
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
    }

    // Loudness of a sound at a world position, heard from the nearest player's camera.
    at(x, y, z) {
      let d = Infinity;
      for (const l of this.listeners) d = Math.min(d, Math.hypot(x - l.x, y - l.y, z - l.z));
      const g = BB.clamp(1 - d / 160, 0, 1);
      return g * g;
    }

    noise(t, o) {
      const c = this.ctx;
      const src = c.createBufferSource();
      src.buffer = this.noiseBuf;
      src.loop = true;
      src.playbackRate.value = o.rate || 1;
      const f = c.createBiquadFilter();
      f.type = o.type || 'bandpass';
      f.frequency.setValueAtTime(o.freq, t);
      if (o.freqTo) f.frequency.exponentialRampToValueAtTime(o.freqTo, t + (o.attack || 0.001) + o.decay);
      f.Q.value = o.q == null ? 1 : o.q;
      const g = c.createGain();
      const a = o.attack || 0.001;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(Math.max(0.0002, o.gain), t + a);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + o.decay);
      src.connect(f);
      f.connect(g);
      g.connect(this.out);
      if (o.send) {
        const s = c.createGain();
        s.gain.value = o.send;
        g.connect(s);
        s.connect(this.echo);
      }
      src.start(t, Math.random() * 0.8, a + o.decay + 0.05);
    }

    tone(t, o) {
      const c = this.ctx;
      const osc = c.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(o.from, t);
      if (o.to && o.to !== o.from) osc.frequency.exponentialRampToValueAtTime(o.to, t + o.decay);
      const g = c.createGain();
      const a = o.attack || 0;
      if (a) {
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(o.gain, t + a);
      } else g.gain.setValueAtTime(o.gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + a + o.decay);
      osc.connect(g);
      g.connect(this.out);
      osc.start(t);
      osc.stop(t + a + o.decay + 0.05);
    }

    // ---------- the player's engine, drift screech and flamethrower: always-on loops ----------

    // key: which player; n: how many engines will play (each is quieter when several share the speakers).
    startEngine(key = 0, n = 1) {
      if (this.engs[key] || !this.ensure()) return;
      const c = this.ctx;
      const o1 = c.createOscillator();
      o1.type = 'sawtooth';
      const o2 = c.createOscillator();
      o2.type = 'square';
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 700;
      lp.Q.value = 3;
      const g = c.createGain();
      g.gain.value = 0;
      o1.connect(lp);
      o2.connect(lp);
      lp.connect(g);
      const vol = c.createGain();
      vol.gain.value = 1 / Math.sqrt(n);
      vol.connect(this.out);
      g.connect(vol);

      const nz = c.createBufferSource();
      nz.buffer = this.noiseBuf;
      nz.loop = true;
      const bp = c.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 2400;
      bp.Q.value = 5;
      const sg = c.createGain();
      sg.gain.value = 0;
      nz.connect(bp);
      bp.connect(sg);
      sg.connect(vol);

      const n2 = c.createBufferSource();
      n2.buffer = this.noiseBuf;
      n2.loop = true;
      n2.playbackRate.value = 0.7;
      const flp = c.createBiquadFilter();
      flp.type = 'lowpass';
      flp.frequency.value = 900;
      const fg = c.createGain();
      fg.gain.value = 0;
      n2.connect(flp);
      flp.connect(fg);
      fg.connect(vol);

      o1.start();
      o2.start();
      nz.start();
      n2.start();
      this.engs[key] = { o1, o2, lp, g, n: nz, sg, bp, n2, fg };
    }

    // speed in m/s; fake gear changes make it sound like it's working hard.
    setEngine(key, speed, throttle, drifting, boosting, flaming) {
      const e = this.engs[key];
      if (!e) return;
      const t = this.ctx.currentTime;
      const gears = [0, 8, 15, 22, 29, 60];
      const s = Math.abs(speed);
      let gi = 0;
      while (gi < gears.length - 2 && s > gears[gi + 1]) gi++;
      const frac = BB.clamp((s - gears[gi]) / (gears[gi + 1] - gears[gi]), 0, 1);
      const rpm = 0.25 + frac * 0.75 + gi * 0.06 + (boosting ? 0.25 : 0);
      const f = 38 + rpm * 95;
      e.o1.frequency.setTargetAtTime(f, t, 0.04);
      e.o2.frequency.setTargetAtTime(f * 0.5, t, 0.04);
      e.lp.frequency.setTargetAtTime(380 + rpm * 1300 + (boosting ? 900 : 0), t, 0.05);
      e.g.gain.setTargetAtTime(0.05 + 0.06 * Math.max(0, throttle) + (boosting ? 0.03 : 0), t, 0.08);
      e.sg.gain.setTargetAtTime(drifting ? 0.05 : 0, t, 0.05);
      e.bp.frequency.setTargetAtTime(2200 + s * 25, t, 0.1);
      e.fg.gain.setTargetAtTime(flaming ? 0.5 : 0, t, 0.06);
    }

    // Stop one player's engine, or all of them.
    stopEngine(key) {
      const keys = key == null ? Object.keys(this.engs) : [key];
      for (const k of keys) {
        const e = this.engs[k];
        if (!e) continue;
        delete this.engs[k];
        try {
          const t = this.ctx.currentTime;
          e.g.gain.setTargetAtTime(0, t, 0.05);
          e.sg.gain.setTargetAtTime(0, t, 0.05);
          e.fg.gain.setTargetAtTime(0, t, 0.05);
          for (const s of [e.o1, e.o2, e.n, e.n2]) s.stop(t + 0.3);
        } catch (err) {
          /* already stopped */
        }
      }
    }

    // ---------- one-shot sounds. g = loudness 0..1 (use at() for world sounds) ----------

    explosion(g = 1, big = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'lowpass', freq: 1800 * big, freqTo: 120, q: 0.7, gain: 1.1 * g, decay: 0.9 * big, send: 0.5 * g });
      this.tone(t, { from: 110, to: 28, gain: 0.9 * g, decay: 0.7 * big });
      this.noise(t + 0.02, { freq: 3000, q: 0.6, gain: 0.35 * g, decay: 0.25 });
      for (let i = 0; i < 4; i++) this.noise(t + 0.1 + Math.random() * 0.4, { freq: 1500 + Math.random() * 2000, q: 3, gain: 0.12 * g, decay: 0.05 });
    }

    rocket(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'bandpass', freq: 2500, freqTo: 600, q: 1.2, gain: 0.6 * g, decay: 0.5, attack: 0.02 });
      this.tone(t, { type: 'sawtooth', from: 220, to: 90, gain: 0.08 * g, decay: 0.35 });
    }

    shotgun(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { freq: 900, q: 0.6, gain: 1.0 * g, decay: 0.12 });
      this.noise(t, { type: 'highpass', freq: 3500, q: 0.5, gain: 0.4 * g, decay: 0.06 });
      this.tone(t, { from: 140, to: 45, gain: 0.7 * g, decay: 0.22 });
      this.noise(t + 0.004, { type: 'lowpass', freq: 700, q: 0.4, gain: 0.5 * g, decay: 0.5, attack: 0.005, send: 0.5 * g });
      // pump
      this.noise(t + 0.32, { freq: 1800, q: 4, gain: 0.2 * g, decay: 0.05 });
      this.noise(t + 0.42, { freq: 1300, q: 4, gain: 0.22 * g, decay: 0.06 });
    }

    saw(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.tone(t, { type: 'sawtooth', from: 900, to: 1400, gain: 0.08 * g, decay: 0.4 });
      this.noise(t, { freq: 4000, q: 3, gain: 0.25 * g, decay: 0.35 });
    }

    slice(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { freq: 5000, freqTo: 1500, q: 2, gain: 0.6 * g, decay: 0.25 });
      this.tone(t, { type: 'sawtooth', from: 1600, to: 500, gain: 0.12 * g, decay: 0.3 });
    }

    flame(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'lowpass', freq: 800, q: 0.5, gain: 0.5 * g, decay: 0.5, attack: 0.05 });
    }

    splat(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      for (let i = 0; i < 3; i++) this.noise(t + i * 0.045, { type: 'lowpass', freq: 650 - i * 120, q: 4, gain: 0.55 * g, decay: 0.09 });
      this.tone(t, { from: 160, to: 55, gain: 0.35 * g, decay: 0.18 });
    }

    puke(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.tone(t, { type: 'sawtooth', from: 180, to: 70, gain: 0.18 * g, decay: 0.6, attack: 0.05 });
      for (let i = 0; i < 5; i++) this.noise(t + 0.1 + i * 0.07, { type: 'lowpass', freq: 500, q: 6, gain: 0.35 * g, decay: 0.06 });
    }

    mine(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { freq: 1200, q: 3, gain: 0.3 * g, decay: 0.05 });
      this.tone(t + 0.05, { type: 'square', from: 1400, gain: 0.04 * g, decay: 0.05 });
    }

    crate(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { freq: 700, q: 1.5, gain: 0.45 * g, decay: 0.08 });
      [660, 880, 1320].forEach((f, i) => this.tone(t + i * 0.05, { type: 'triangle', from: f, gain: 0.08 * g, decay: 0.1 }));
    }

    tick() {
      if (!this.ensure()) return;
      this.tone(this.ctx.currentTime, { type: 'square', from: 1700, gain: 0.025, decay: 0.025 });
    }

    itemGet() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      this.tone(t, { type: 'triangle', from: 990, gain: 0.12, decay: 0.12 });
      this.tone(t + 0.07, { type: 'triangle', from: 1480, gain: 0.12, decay: 0.2 });
    }

    countdown(go) {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      if (go) {
        this.tone(t, { type: 'square', from: 880, gain: 0.1, decay: 0.6 });
        this.tone(t, { type: 'square', from: 1320, gain: 0.05, decay: 0.6 });
      } else this.tone(t, { type: 'square', from: 440, gain: 0.1, decay: 0.3 });
    }

    boost(tier) {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'bandpass', freq: 600, freqTo: 3000, q: 1, gain: 0.35 + 0.1 * tier, decay: 0.45, attack: 0.03 });
      this.tone(t, { type: 'sawtooth', from: 120, to: 260, gain: 0.06, decay: 0.4 });
    }

    hop() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'lowpass', freq: 500, q: 1, gain: 0.15, decay: 0.06 });
    }

    land(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'lowpass', freq: 300, q: 0.8, gain: 0.5 * g, decay: 0.15 });
      this.tone(t, { from: 90, to: 50, gain: 0.3 * g, decay: 0.12 });
    }

    bump(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { freq: 500, q: 1.2, gain: 0.5 * g, decay: 0.08 });
      this.tone(t, { type: 'triangle', from: 200, to: 120, gain: 0.15 * g, decay: 0.08 });
    }

    scrape(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { freq: 3200, q: 2, gain: 0.18 * g, decay: 0.09, attack: 0.01 });
    }

    hurt() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'lowpass', freq: 400, q: 1, gain: 0.4, decay: 0.12 });
      this.tone(t, { type: 'sawtooth', from: 160, to: 80, gain: 0.08, decay: 0.15 });
    }

    hitConfirm() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      this.tone(t, { type: 'triangle', from: 1500, gain: 0.08, decay: 0.07 });
    }

    kill() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      [523, 659, 784, 1046].forEach((f, i) => this.tone(t + i * 0.06, { type: 'square', from: f, gain: 0.06, decay: 0.16 }));
    }

    death() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      [392, 330, 262, 196].forEach((f, i) => this.tone(t + i * 0.13, { type: 'sawtooth', from: f, to: f * 0.97, gain: 0.06, decay: 0.2 }));
    }

    siren() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      this.tone(t, { type: 'square', from: 960, gain: 0.05, decay: 0.12 });
      this.tone(t + 0.14, { type: 'square', from: 720, gain: 0.05, decay: 0.12 });
    }

    finish(place) {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      const good = [523, 659, 784, 1046, 784, 1046];
      const bad = [392, 370, 349, 330];
      const notes = place <= 3 ? good : bad;
      notes.forEach((f, i) => this.tone(t + i * 0.12, { type: place <= 3 ? 'square' : 'sawtooth', from: f, gain: 0.07, decay: 0.22 }));
    }

    geyser(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'lowpass', freq: 300, freqTo: 1800, q: 0.8, gain: 0.9 * g, decay: 1.0, attack: 0.08, send: 0.3 * g });
      this.tone(t, { from: 70, to: 40, gain: 0.5 * g, decay: 0.9 });
    }

    hiss(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'highpass', freq: 4000, q: 0.5, gain: 0.18 * g, decay: 0.9, attack: 0.3 });
    }

    crunch(g = 1) {
      if (g < 0.01 || !this.ensure()) return;
      const t = this.ctx.currentTime;
      for (let i = 0; i < 3; i++) this.noise(t + i * 0.03, { freq: 700 + i * 300, q: 2, gain: 0.45 * g, decay: 0.07 });
      this.tone(t, { type: 'triangle', from: 140, to: 70, gain: 0.25 * g, decay: 0.12 });
    }

    squawk() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      this.tone(t, { type: 'sawtooth', from: 1500, to: 1050, gain: 0.07, decay: 0.14 });
      this.tone(t + 0.16, { type: 'sawtooth', from: 1350, to: 800, gain: 0.07, decay: 0.2 });
      for (let i = 0; i < 3; i++) this.noise(t + 0.45 + i * 0.05, { type: 'lowpass', freq: 600, q: 5, gain: 0.3, decay: 0.05 });
    }

    trick() {
      if (!this.ensure()) return;
      const t = this.ctx.currentTime;
      this.noise(t, { type: 'bandpass', freq: 700, freqTo: 3200, q: 1.5, gain: 0.3, decay: 0.35, attack: 0.02 });
    }

    ui() {
      if (!this.ensure()) return;
      this.tone(this.ctx.currentTime, { type: 'triangle', from: 880, gain: 0.06, decay: 0.05 });
    }
  }

  BB.Audio = Audio;
})();
</script>
<script>
/* ---- js/music.js ---- */
/* BuggyBoom — music, made in code. A small step sequencer plays drums, a distorted bass, power-
   chord guitar (or a carnival organ, or a twangy pluck) and a lead melody, in a style per track.
   Notes are scheduled a little ahead on the audio clock so timing stays tight. */
(function () {
  'use strict';
  const BB = window.BB;

  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const SCALES = {
    minor: [0, 3, 5, 7, 10],
    phrygian: [0, 1, 3, 5, 7, 8, 10],
    harmonic: [0, 2, 3, 5, 7, 8, 11],
    major: [0, 2, 4, 7, 9],
  };

  // steps: 16 = 4/4 in sixteenths, 12 = 3/4. prog: one chord per bar, in semitones from root.
  // Pattern strings: x = hit, o = open hat / accent, . = rest.
  BB.MUSIC = {
    menu: { bpm: 132, steps: 16, root: 40, prog: [0, 0, 3, 5, 0, 0, 7, 5], kick: 'x.....x...x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.xo', gtr: 'x..x..x...x.x...', bass: 'x..x..x...x.x...', scale: 'minor', seed: 3 },
    dumpster: { bpm: 172, steps: 16, root: 40, prog: [0, 0, 5, 3, 0, 0, 7, 5], kick: 'x.....x.x.......', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.x.', gtr: 'x.x.x.x.x.x.x.x.', mute: true, bass: 'x.x.x.x.x.x.x.x.', scale: 'minor', seed: 11 },
    landfill: { bpm: 124, steps: 16, root: 38, prog: [0, 3, 5, 6, 0, 3, 8, 7], kick: 'x.....x...x.....', snare: '....x.......x...', hat: 'x.x.x.x.x.x.x.xo', gtr: 'x.....x...x.....', bass: 'x.....x...x.x...', scale: 'minor', seed: 23 },
    sewer: { bpm: 92, steps: 16, root: 35, prog: [0, 0, 1, 0, 0, 0, 6, 5], kick: 'x.........x.....', snare: '........x.......', hat: 'x...x...x...x...', gtr: 'x.......x.......', bass: 'x.........x.....', scale: 'phrygian', seed: 5 },
    funland: { bpm: 168, steps: 12, root: 45, prog: [0, 7, 0, 5, 0, 7, 2, 7], kick: 'x...........', snare: '....x...x...', hat: '..x...x...x.', organ: true, bass: 'x...........', scale: 'harmonic', seed: 66, leadAlways: true },
    butcher: { bpm: 184, steps: 16, root: 38, prog: [0, 0, 1, 0, 0, 0, 6, 5], kick: 'x.x.x.x.x.x.x.x.', snare: '....x.......x...', hat: 'x...x...x...x...', gtr: 'xxxxxxxxxxxxxxxx', mute: true, bass: 'x.x.x.x.x.x.x.x.', scale: 'phrygian', seed: 13 },
    trailer: { bpm: 196, steps: 16, root: 43, prog: [0, 0, 5, 5, 7, 7, 0, 0], kick: 'x...x...x...x...', snare: '..x...x...x...x.', hat: 'xxxxxxxxxxxxxxxx', twang: true, bass: 'x...x...x...x...', walk: true, scale: 'major', seed: 42 },
  };

  class Music {
    constructor(audio) {
      this.audio = audio;
      this.want = null; // style that should be playing
      this.cur = null; // style that is playing
      this.timer = null;
      this.duckLevel = 1;
      // Start once the browser allows sound (after the first click or key).
      const wake = () => this.refresh();
      window.addEventListener('pointerdown', wake);
      window.addEventListener('keydown', wake);
    }

    play(id) {
      this.want = id;
      this.refresh();
    }

    stop() {
      this.want = null;
      this.refresh();
    }

    // Quieter while paused.
    duck(on) {
      this.duckLevel = on ? 0.35 : 1;
      if (this.bus) this.bus.gain.setTargetAtTime(this.duckLevel * 0.6, this.audio.ctx.currentTime, 0.2);
    }

    // Start, stop or switch to match `want` and the music volume.
    refresh() {
      const audio = this.audio;
      const ok = this.want && audio.ensureMusic();
      if (!ok || this.cur !== this.want) this.halt();
      if (!ok || this.cur === this.want) return;
      this.start(this.want);
    }

    halt() {
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      const bus = this.bus;
      if (bus) {
        const t = this.audio.ctx.currentTime;
        bus.gain.cancelScheduledValues(t);
        bus.gain.setTargetAtTime(0, t, 0.12);
        setTimeout(() => bus.disconnect(), 800);
      }
      this.bus = null;
      this.cur = null;
    }

    start(id) {
      const c = this.audio.ctx;
      const st = BB.MUSIC[id] || BB.MUSIC.menu;
      this.cur = id;
      this.st = st;
      const bus = (this.bus = c.createGain());
      bus.gain.value = this.duckLevel * 0.6;
      bus.connect(this.audio.musicGain);

      // Shared effect chains: distorted guitar (open and palm-muted), and a little echo for leads.
      const shaper = (amount) => {
        const ws = c.createWaveShaper();
        const n = 1024;
        const curve = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          const x = (i / (n - 1)) * 2 - 1;
          curve[i] = ((1 + amount) * x) / (1 + amount * Math.abs(x));
        }
        ws.curve = curve;
        return ws;
      };
      const chain = (cut, drive, gain) => {
        const input = c.createGain();
        const ws = shaper(drive);
        const lp = c.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.value = cut;
        const out = c.createGain();
        out.gain.value = gain;
        input.connect(ws);
        ws.connect(lp);
        lp.connect(out);
        out.connect(bus);
        return input;
      };
      this.gOpen = chain(3200, 30, 0.22);
      this.gMute = chain(1300, 40, 0.24);
      this.bassIn = chain(900, 4, 0.5);
      const echo = c.createDelay(1);
      echo.delayTime.value = (60 / st.bpm) * 0.75;
      const fb = c.createGain();
      fb.gain.value = 0.3;
      echo.connect(fb);
      fb.connect(echo);
      echo.connect(bus);
      this.echo = echo;

      // A seeded lead melody for this style: two bars, reused so it sounds like a hook.
      const rnd = BB.rng(st.seed || 1);
      const scale = SCALES[st.scale] || SCALES.minor;
      this.phrase = [];
      for (let i = 0; i < st.steps * 2; i += 2) {
        if (rnd() < 0.3) this.phrase.push(null);
        else this.phrase.push({ deg: Math.floor(rnd() * scale.length), oct: rnd() < 0.25 ? 1 : 0, len: rnd() < 0.3 ? 4 : 2 });
      }
      this.scale = scale;

      this.step = 0;
      this.stepDur = 60 / st.bpm / (st.steps === 12 ? 3 : 4);
      this.next = c.currentTime + 0.1;
      this.timer = setInterval(() => this.tick(), 30);
    }

    tick() {
      const c = this.audio.ctx;
      if (!c || !this.bus) return;
      if (this.next < c.currentTime - 0.5) this.next = c.currentTime + 0.05; // tab was asleep
      while (this.next < c.currentTime + 0.15) {
        this.schedule(this.step, this.next);
        this.next += this.stepDur;
        this.step++;
      }
    }

    schedule(n, t) {
      const st = this.st;
      const S = st.steps;
      const i = n % S;
      const bar = Math.floor(n / S);
      const cyc = bar % st.prog.length;
      const chord = st.root + st.prog[cyc];
      const last = cyc === st.prog.length - 1;
      const at = (pat, k) => pat && pat[k % pat.length] !== '.';

      // Drums, with a fill on the last bar of each cycle and a crash at the top.
      if (i === 0 && cyc === 0 && bar > 0) this.crash(t);
      if (at(st.kick, i)) this.kick(t);
      if (last && i >= S - 4) this.snare(t, 0.8);
      else if (at(st.snare, i)) this.snare(t, 1);
      if (at(st.hat, i)) this.hat(t, st.hat[i] === 'o');

      // Bass follows the chord root; the country one walks up to the next chord.
      if (at(st.bass, i)) {
        let m = chord - 12;
        if (st.walk && i % 8 === 4) m += 7;
        this.bass(t, m, this.stepDur * (st.steps === 12 ? 3 : 2));
      }

      // Rhythm part.
      if (st.organ) {
        if (i === 4 || i === 8) this.organ(t, chord + 12, this.stepDur * 3);
      } else if (st.twang) {
        if (i % 4 === 2) this.pluck(t, chord + 12, this.stepDur * 2);
        if (i % 8 === 0) this.pluck(t, chord + 7, this.stepDur * 2);
      } else if (at(st.gtr, i)) {
        const accent = i === 0 || st.prog[cyc] !== st.prog[(cyc + st.prog.length - 1) % st.prog.length];
        this.guitar(t, chord, st.mute && !(accent && i === 0) ? this.stepDur * 0.9 : this.stepDur * 4, st.mute && !(accent && i === 0));
      }

      // Lead melody on the second half of every other cycle (always, for the carnival).
      const leadOn = st.leadAlways || (Math.floor(bar / st.prog.length) % 2 === 1 && cyc >= st.prog.length / 2);
      if (leadOn && i % 2 === 0) {
        const p = this.phrase[((bar % 2) * S + i) / 2];
        if (p) {
          const m = st.root + 24 + this.scale[p.deg] + p.oct * 12;
          this.lead(t, m, this.stepDur * p.len, st.organ);
        }
      }
    }

    // ---------- instruments ----------

    env(g, t, peak, attack, decay) {
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(peak, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    }

    osc(type, f, t, dur, dest, peak, attack) {
      const c = this.audio.ctx;
      const o = c.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(f, t);
      const g = c.createGain();
      this.env(g, t, peak, attack || 0.004, dur);
      o.connect(g);
      g.connect(dest);
      o.start(t);
      o.stop(t + (attack || 0.004) + dur + 0.05);
      return o;
    }

    noise(t, type, freq, q, peak, decay) {
      const c = this.audio.ctx;
      const src = c.createBufferSource();
      src.buffer = this.audio.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = type;
      f.frequency.value = freq;
      f.Q.value = q;
      const g = c.createGain();
      this.env(g, t, peak, 0.001, decay);
      src.connect(f);
      f.connect(g);
      g.connect(this.bus);
      src.start(t, Math.random() * 0.5, decay + 0.05);
    }

    kick(t) {
      const c = this.audio.ctx;
      const o = c.createOscillator();
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
      const g = c.createGain();
      this.env(g, t, 0.9, 0.002, 0.28);
      o.connect(g);
      g.connect(this.bus);
      o.start(t);
      o.stop(t + 0.35);
    }

    snare(t, v) {
      this.noise(t, 'bandpass', 1900, 0.7, 0.42 * v, 0.15);
      this.osc('triangle', 200, t, 0.08, this.bus, 0.22 * v);
    }

    hat(t, open) {
      this.noise(t, 'highpass', 7500, 0.6, open ? 0.12 : 0.08, open ? 0.14 : 0.03);
    }

    crash(t) {
      this.noise(t, 'highpass', 4500, 0.4, 0.16, 1.3);
    }

    bass(t, m, dur) {
      this.osc('sawtooth', hz(m), t, dur * 0.9, this.bassIn, 0.35);
      this.osc('sine', hz(m), t, dur * 0.9, this.bus, 0.25);
    }

    guitar(t, m, dur, muted) {
      const dest = muted ? this.gMute : this.gOpen;
      for (const [iv, det] of [[0, -6], [7, 5], [12, 3]]) {
        const o = this.osc('sawtooth', hz(m + iv), t, dur, dest, 0.18);
        o.detune.value = det;
      }
    }

    organ(t, m, dur) {
      for (const iv of [0, 3, 7]) {
        this.osc('square', hz(m + iv), t, dur, this.bus, 0.035, 0.01);
        this.osc('triangle', hz(m + iv + 12), t, dur, this.bus, 0.03, 0.01);
      }
    }

    pluck(t, m, dur) {
      const c = this.audio.ctx;
      for (const [type, peak] of [['triangle', 0.16], ['sawtooth', 0.05]]) {
        const o = c.createOscillator();
        o.type = type;
        o.frequency.setValueAtTime(hz(m + 0.6), t);
        o.frequency.exponentialRampToValueAtTime(hz(m), t + 0.04);
        const g = c.createGain();
        this.env(g, t, peak, 0.002, Math.min(0.35, dur));
        o.connect(g);
        g.connect(this.bus);
        o.start(t);
        o.stop(t + 0.45);
      }
    }

    lead(t, m, dur, organ) {
      const c = this.audio.ctx;
      const o = c.createOscillator();
      o.type = organ ? 'triangle' : 'square';
      o.frequency.setValueAtTime(hz(m), t);
      const vib = c.createOscillator();
      vib.frequency.value = organ ? 6.5 : 5;
      const vg = c.createGain();
      vg.gain.value = organ ? 9 : 4;
      vib.connect(vg);
      vg.connect(o.detune);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = organ ? 3000 : 2200;
      const g = c.createGain();
      this.env(g, t, organ ? 0.09 : 0.065, 0.01, dur);
      o.connect(lp);
      lp.connect(g);
      g.connect(this.bus);
      const send = c.createGain();
      send.gain.value = 0.35;
      g.connect(send);
      send.connect(this.echo);
      o.start(t);
      vib.start(t);
      o.stop(t + dur + 0.1);
      vib.stop(t + dur + 0.1);
    }
  }

  BB.Music = Music;
})();
</script>
<script>
/* ---- js/input.js ---- */
/* BuggyBoom — keyboard and gamepads, for up to 4 players on one computer.
   One player: every key and every gamepad works. Two or more: P1 has WASD, P2 has the arrow keys,
   and each player also gets their own gamepad (P3 and P4 need one).
   Keys use KeyboardEvent.code (layout independent): 'KeyW', 'Space', 'ShiftLeft', ... */
(function () {
  'use strict';
  const BB = window.BB;

  const SETS = {
    all: { up: ['KeyW', 'ArrowUp'], down: ['KeyS', 'ArrowDown'], left: ['KeyA', 'ArrowLeft'], right: ['KeyD', 'ArrowRight'], drift: ['Space', 'ShiftLeft', 'ShiftRight'], fire: ['KeyE', 'KeyJ', 'Enter'], back: ['KeyQ', 'KeyK'], look: ['KeyC'], reset: ['KeyR'] },
    p1: { up: ['KeyW'], down: ['KeyS'], left: ['KeyA'], right: ['KeyD'], drift: ['Space', 'ShiftLeft'], fire: ['KeyE'], back: ['KeyQ'], look: ['KeyC'], reset: ['KeyR'] },
    p2: { up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'], drift: ['ShiftRight', 'ControlRight'], fire: ['Enter', 'Period'], back: ['Comma'], look: ['Slash'], reset: ['Backslash'] },
    none: { up: [], down: [], left: [], right: [], drift: [], fire: [], back: [], look: [], reset: [] },
  };
  const GAME_KEYS = new Set([].concat(...Object.values(SETS.all), ...Object.values(SETS.p2)));

  // Controls shown on each player's HUD.
  BB.controlsText = (i, n) => {
    const pad = 'or gamepad ' + (i + 1);
    if (n === 1) return '<kbd>W</kbd> gas · <kbd>S</kbd> brake · <kbd>A</kbd><kbd>D</kbd> steer · <kbd>SPACE</kbd> hop &amp; drift · <kbd>E</kbd> use item · <kbd>Q</kbd> use backward · <kbd>C</kbd> look back · <kbd>ESC</kbd> pause';
    if (i === 0) return '<kbd>WASD</kbd> drive · <kbd>SPACE</kbd> drift · <kbd>E</kbd>/<kbd>Q</kbd> item · <kbd>C</kbd> look back · ' + pad;
    if (i === 1) return '<kbd>ARROWS</kbd> drive · <kbd>R-SHIFT</kbd> drift · <kbd>ENTER</kbd>/<kbd>,</kbd> item · <kbd>/</kbd> look back · ' + pad;
    return 'Gamepad ' + (i + 1) + ': stick steer · A gas · B brake · RB drift · X item · Y look back';
  };

  class Input {
    constructor() {
      this.keys = new Set();
      this.pressed = new Set(); // keys that went down this frame
      this.capture = false; // stop arrow keys and space scrolling the page while racing
      this.pads = []; // connected gamepads, in order
      this.padPrev = [];
      this.padHits = []; // per pad: buttons that went down this frame
      this.padHit = new Set(); // any pad
      this.states = [0, 1, 2, 3].map(() => ({ throttle: 0, steer: 0, drift: false, driftHit: false, fire: false, fireBack: false, lookBack: false, respawn: false, pause: false }));

      window.addEventListener('keydown', (e) => this.key(e, true));
      window.addEventListener('keyup', (e) => this.key(e, false));
      window.addEventListener('blur', () => this.clear());
    }

    key(e, down) {
      const c = e.code;
      if (down) {
        if (!this.keys.has(c)) this.pressed.add(c);
        this.keys.add(c);
      } else this.keys.delete(c);
      if (this.capture && GAME_KEYS.has(c)) e.preventDefault();
    }

    down(...codes) {
      for (const c of codes) if (this.keys.has(c)) return true;
      return false;
    }

    hit(...codes) {
      for (const c of codes) if (this.pressed.has(c)) return true;
      return false;
    }

    // Read every gamepad once per frame. Standard mapping: A gas, B brake, X item, Y look back,
    // LB/RB drift, LT/RT brake/gas, Start pause, d-pad steer.
    poll() {
      this.pads = [];
      const list = navigator.getGamepads ? navigator.getGamepads() : [];
      for (const p of list) if (p && p.connected) this.pads.push(p);
      this.padHit.clear();
      this.pads.forEach((p, pi) => {
        const prev = this.padPrev[pi] || (this.padPrev[pi] = []);
        const hits = this.padHits[pi] || (this.padHits[pi] = new Set());
        hits.clear();
        p.buttons.forEach((b, i) => {
          if (b.pressed && !prev[i]) {
            hits.add(i);
            this.padHit.add(i);
          }
          prev[i] = b.pressed;
        });
      });
      this.pause = this.hit('Escape', 'KeyP') || this.padHit.has(9);
    }

    // One frame of driving controls for player i of n.
    read(i, n) {
      const s = this.states[i];
      const set = n <= 1 ? SETS.all : i === 0 ? SETS.p1 : i === 1 ? SETS.p2 : SETS.none;
      const pads = n <= 1 ? this.pads.map((p, pi) => pi) : this.pads[i] ? [i] : [];
      const pd = (b) => pads.some((pi) => this.pads[pi].buttons[b] && this.pads[pi].buttons[b].pressed);
      const pv = (b) => pads.reduce((m, pi) => Math.max(m, this.pads[pi].buttons[b] ? this.pads[pi].buttons[b].value : 0), 0);
      const ph = (b) => pads.some((pi) => this.padHits[pi] && this.padHits[pi].has(b));

      let thr = this.down(...set.up) || pd(0) ? 1 : 0;
      thr = Math.max(thr, pv(7));
      let brake = this.down(...set.down) || pd(1) ? 1 : 0;
      brake = Math.max(brake, pv(6));
      s.throttle = BB.clamp(thr - brake, -1, 1);

      let steer = 0;
      if (this.down(...set.left) || pd(14)) steer -= 1;
      if (this.down(...set.right) || pd(15)) steer += 1;
      let stickBack = false;
      for (const pi of pads) {
        const ax = this.pads[pi].axes[0] || 0;
        if (Math.abs(ax) > 0.15) steer += Math.sign(ax) * ((Math.abs(ax) - 0.15) / 0.85);
        if ((this.pads[pi].axes[1] || 0) > 0.6) stickBack = true;
      }
      s.steer = BB.clamp(steer, -1, 1);

      s.drift = this.down(...set.drift) || pd(4) || pd(5);
      s.driftHit = this.hit(...set.drift) || ph(4) || ph(5);
      s.fire = this.hit(...set.fire) || (ph(2) && !stickBack);
      s.fireBack = this.hit(...set.back) || (ph(2) && stickBack);
      s.lookBack = this.down(...set.look) || pd(3);
      s.respawn = this.hit(...set.reset);
      s.pause = this.pause;
      return s;
    }

    endFrame() {
      this.pressed.clear();
    }

    clear() {
      this.keys.clear();
      this.pressed.clear();
    }
  }

  BB.Input = Input;
})();
</script>

  // A racer's colour for text on the dark menus and HUD (Sister Mercy's black becomes off-white).
  BB.ink = (color) => (color === '#22222b' ? '#f4f1ea' : color);

  // Stats (1-6, after the kart's changes) to driving numbers.
  BB.racerPhysics = (r, kart) => {
    const s = BB.kartStats ? BB.kartStats(r, kart) : r.stats;
    return {
      top: 28 + s.speed * 0.95, // m/s
      accel: 12 + s.accel * 2.6,

      hp: 70 + s.tough * 10,
      weight: 0.8 + s.tough * 0.18,

  // ---------- models ----------

  let S = null;
  function shared() {
    if (S) return S;
    const T = THREE;
    S = {
      dark: new T.MeshStandardMaterial({ color: 0x1d1c21, roughness: 0.8, metalness: 0.2 }),
      tire: new T.MeshStandardMaterial({ color: 0x151515, roughness: 0.95 }),
      chrome: new T.MeshStandardMaterial({ color: 0xc9ccd2, roughness: 0.25, metalness: 0.9 }),
      metal: new T.MeshStandardMaterial({ color: 0x5a5d63, roughness: 0.5, metalness: 0.7 }),
      white: new T.MeshStandardMaterial({ color: 0xf2f0ea, roughness: 0.7 }),
      black: new T.MeshStandardMaterial({ color: 0x0b0b0b, roughness: 0.4 }),
      red: new T.MeshStandardMaterial({ color: 0xd8262a, roughness: 0.5 }),
      blood: new T.MeshStandardMaterial({ color: 0x7e0f12, roughness: 0.4 }),
      wood: new T.MeshStandardMaterial({ color: 0x8a5a32, roughness: 0.8 }),
      bone: new T.MeshStandardMaterial({ color: 0xeee4cf, roughness: 0.7 }),
      green: new T.MeshStandardMaterial({ color: 0x3f8a46, roughness: 0.5, metalness: 0.3 }),
      orange: new T.MeshStandardMaterial({ color: 0xff7d1a, roughness: 0.6 }),
      ember: new T.MeshBasicMaterial({ color: 0xff6a1a }),
      geo: {
        box: new T.BoxGeometry(1, 1, 1),
        cyl: new T.CylinderGeometry(1, 1, 1, 16),
        cyl8: new T.CylinderGeometry(1, 1, 1, 8),
        sph: new T.SphereGeometry(1, 16, 12),
        hemi: new T.SphereGeometry(1, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2),
        cone: new T.ConeGeometry(1, 1, 12),
        tor: new T.TorusGeometry(1, 0.16, 8, 22),
      },
    };
    return S;
  }
  BB.sharedMats = shared;

  function part(geo, mat, x, y, z, sx, sy, sz, rx, ry, rz) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
    m.castShadow = true;
    return m;
  }
  BB.part = part;

  function std(color, rough, metal) {
    return new THREE.MeshStandardMaterial({ color, roughness: rough == null ? 0.6 : rough, metalness: metal || 0 });
  }

  // The driver: torso, arms on the wheel, a head and a hat. Origin is the seat.
  BB.buildDriver = function (r) {
    const T = THREE;
    const s = shared();
    const G = s.geo;
    const g = new T.Group();
    const shirt = std(r.shirt, 0.8);
    const skin = std(r.skin, 0.65);
    const bw = r.build || 1;
    g.add(part(G.box, shirt, 0, 0.36, 0, 0.62 * bw, 0.72, 0.44 * bw));
    // arms reaching for the steering wheel, hands on it
    for (const sd of [-1, 1]) {
      g.add(part(G.box, shirt, sd * 0.33 * bw, 0.52, 0.2, 0.15, 0.15, 0.52, 0.55, 0, 0));
      if (r.hook && sd < 0) g.add(part(G.tor, s.chrome, sd * 0.2, 0.42, 0.47, 0.09, 0.09, 0.2, 0, Math.PI / 2, 0)); // hook hand
      else g.add(part(G.sph, skin, sd * 0.2, 0.38, 0.47, 0.085, 0.085, 0.085));
    }
    g.add(part(G.sph, skin, 0, 0.98, 0.02, 0.26, 0.27, 0.26)); // head
    for (const sd of [-1, 1]) g.add(part(G.sph, s.black, sd * 0.09, 1.02, 0.24, 0.04, 0.045, 0.03)); // eyes
    g.add(part(G.box, s.blood, 0, 0.88, 0.25, 0.1, 0.025, 0.02)); // mouth

    const hat = (geo, mat, x, y, z, sx, sy, sz, rx, ry, rz) => g.add(part(geo, mat, x, y, z, sx, sy, sz, rx, ry, rz));
    switch (r.hat) {
      case 'curlers': {
        hat(G.hemi, std('#b9b4c4', 0.9), 0, 1.0, -0.01, 0.285, 0.3, 0.285);
        const pink = std('#ff7bbd', 0.5);
        for (let i = 0; i < 4; i++) hat(G.cyl8, pink, 0, 1.17 + (i % 2) * 0.05, -0.15 + i * 0.1, 0.05, 0.32, 0.05, 0, 0, Math.PI / 2);
        hat(G.cyl8, s.white, 0.09, 0.88, 0.33, 0.018, 0.2, 0.018, Math.PI / 2 - 0.2, 0, 0.3); // cigarette
        hat(G.sph, s.ember, 0.115, 0.9, 0.43, 0.024, 0.024, 0.024);
        break;
      }
      case 'hardhat': {
        const y = std('#f2c414', 0.4);
        hat(G.hemi, y, 0, 1.06, 0, 0.3, 0.26, 0.31);
        hat(G.cyl, y, 0, 1.07, 0.03, 0.36, 0.03, 0.38);
        hat(G.box, std('#fff8c0', 0.2), 0, 1.18, 0.28, 0.1, 0.07, 0.04); // lamp
        break;
      }
      case 'veil': {
        hat(G.hemi, s.black, 0, 0.98, -0.02, 0.32, 0.36, 0.32);
        hat(G.box, s.black, 0, 0.82, -0.18, 0.56, 0.5, 0.12);
        hat(G.box, s.white, 0, 1.12, 0.2, 0.46, 0.07, 0.07);
        hat(G.box, s.white, 0, 0.58, 0.23, 0.08, 0.26, 0.02); // the cross
        hat(G.box, s.white, 0, 0.64, 0.23, 0.2, 0.06, 0.02);
        break;
      }
      case 'butcher': {
        hat(G.box, s.white, 0, 1.24, 0, 0.44, 0.16, 0.32);
        hat(G.box, s.white, 0, 0.32, 0.235 * bw, 0.5 * bw, 0.55, 0.02); // apron
        hat(G.box, s.blood, 0.08, 0.3, 0.25 * bw, 0.22, 0.18, 0.02);
        hat(G.box, s.blood, -0.12, 0.45, 0.25 * bw, 0.1, 0.12, 0.02);
        break;
      }
      case 'backcap': {
        const blue = std('#1f4fb0', 0.6);
        hat(G.hemi, blue, 0, 1.04, 0, 0.28, 0.22, 0.28);
        hat(G.box, blue, 0, 1.05, -0.33, 0.3, 0.03, 0.24);
        hat(G.box, s.black, 0, 1.02, 0.25, 0.38, 0.08, 0.03); // shades
        break;
      }
      case 'cowboy': {
        const br = std('#6b4423', 0.85);
        hat(G.cyl, br, 0, 1.14, 0, 0.46, 0.04, 0.46);
        hat(G.cyl, br, 0, 1.27, 0, 0.21, 0.24, 0.23);
        hat(G.box, std('#c23b22', 0.7), 0, 0.84, 0.18, 0.4, 0.14, 0.18); // bandana
        break;
      }
      case 'surgical': {
        const teal = std('#4fb3a5', 0.7);
        hat(G.hemi, teal, 0, 1.03, 0, 0.29, 0.24, 0.29);
        hat(G.box, std('#bfe6df', 0.8), 0, 0.89, 0.22, 0.34, 0.17, 0.08); // mask
        hat(G.cyl, s.chrome, 0, 1.17, 0.26, 0.09, 0.02, 0.09, Math.PI / 2, 0, 0); // head mirror
        hat(G.box, s.blood, 0.05, 0.9, 0.265, 0.06, 0.05, 0.01);
        break;
      }
      case 'clown': {
        const orange = std('#ff6a1a', 0.9);
        hat(G.sph, orange, 0.28, 1.06, -0.03, 0.17, 0.17, 0.17);
        hat(G.sph, orange, -0.28, 1.06, -0.03, 0.17, 0.17, 0.17);
        hat(G.sph, s.red, 0, 0.96, 0.27, 0.07, 0.07, 0.07);
        hat(G.cone, std('#7a3bd0', 0.6), 0, 1.36, 0, 0.12, 0.3, 0.12, -0.15, 0, 0.15);

      }
      case 'hairnet': {

        hat(G.sph, std('#8a5a3a', 0.9), 0, 1.12, -0.22, 0.14, 0.14, 0.14); // bun
        const net = new T.MeshStandardMaterial({ color: 0xffffff, wireframe: true, roughness: 0.9 });
        hat(G.hemi, net, 0, 1.0, -0.02, 0.31, 0.34, 0.31);
        hat(G.sph, net, 0, 1.12, -0.23, 0.16, 0.16, 0.16);
        for (const sd of [-1, 1]) hat(G.tor, std('#c23a8a', 0.4), sd * 0.09, 1.02, 0.25, 0.065, 0.055, 0.065); // glasses
        hat(G.sph, std('#5a3020', 0.8), 0.13, 0.91, 0.23, 0.02, 0.02, 0.02); // mole
        hat(G.box, std('#e8e2d0', 0.8), 0, 0.3, 0.235 * bw, 0.52 * bw, 0.5, 0.02); // smock
        hat(G.box, std('#c8a03a', 0.7), -0.1, 0.25, 0.25 * bw, 0.14, 0.1, 0.02); // gravy stain
        break;
      }
      case 'copcap': {
        const navy = std('#1d2b4f', 0.6);
        hat(G.cyl, navy, 0, 1.21, 0.02, 0.3, 0.12, 0.3);
        hat(G.cyl, s.black, 0, 1.12, 0.02, 0.27, 0.08, 0.27);
        hat(G.box, s.black, 0, 1.11, 0.27, 0.36, 0.03, 0.18, 0.15, 0, 0); // visor
        const gold = std('#e2c044', 0.3, 0.8);
        hat(G.box, gold, 0, 1.21, 0.31, 0.07, 0.08, 0.02); // cap badge
        hat(G.box, gold, -0.15, 0.55, 0.23 * bw, 0.08, 0.1, 0.02); // chest badge
        for (const sd of [-1, 1]) hat(G.box, s.chrome, sd * 0.09, 1.02, 0.25, 0.11, 0.065, 0.02); // aviators
        hat(G.box, std('#4a3020', 0.9), 0, 0.92, 0.26, 0.2, 0.05, 0.03); // mustache
        break;
      }
      case 'trucker': {
        const red = std('#c2382f', 0.7);
        hat(G.hemi, red, 0, 1.04, 0, 0.28, 0.24, 0.28);
        hat(G.box, s.white, 0, 1.12, 0.19, 0.3, 0.16, 0.08); // front panel
        hat(G.box, red, 0, 1.03, 0.34, 0.3, 0.03, 0.22); // brim
        hat(G.sph, std('#8a8478', 0.95), 0, 0.84, 0.15, 0.25, 0.25, 0.17); // beard
        break;
      }
      case 'captain': {
        hat(G.cyl, s.white, 0, 1.18, 0, 0.29, 0.14, 0.29);
        hat(G.box, s.black, 0, 1.11, 0.27, 0.32, 0.03, 0.16, 0.12, 0, 0); // brim
        hat(G.box, std('#e2c044', 0.3, 0.8), 0, 1.2, 0.29, 0.06, 0.08, 0.02); // anchor badge
        hat(G.box, s.black, 0.09, 1.02, 0.25, 0.1, 0.09, 0.03); // eyepatch
        hat(G.box, s.black, 0, 1.06, 0.06, 0.54, 0.02, 0.4, 0, 0, -0.25); // strap
        hat(G.sph, s.white, 0, 0.86, 0.15, 0.25, 0.2, 0.16); // beard
        break;
      }
      case 'mascot': {
        const fur = std(r.skin, 0.95);
        const tan = std('#d9b48a', 0.9);
        hat(G.sph, fur, 0, 1.06, 0.02, 0.38, 0.36, 0.36); // the big head
        for (const sd of [-1, 1]) {
          hat(G.sph, fur, sd * 0.27, 1.37, 0, 0.13, 0.13, 0.08); // ears
          hat(G.sph, tan, sd * 0.27, 1.37, 0.04, 0.08, 0.08, 0.05);
          hat(G.sph, s.white, sd * 0.13, 1.16, 0.3, 0.1, 0.11, 0.06); // googly eyes
          hat(G.sph, s.black, sd * 0.1, 1.14, 0.355, 0.045, 0.05, 0.02);
        }
        hat(G.sph, tan, 0, 0.97, 0.32, 0.17, 0.13, 0.12); // snout

        hat(G.box, std('#c8302a', 0.8), 0, 0.42, 0, 0.66 * bw, 0.46, 0.47 * bw); // jersey
        hat(G.box, std(r.accent, 0.8), 0, 0.46, 0.24 * bw, 0.14, 0.2, 0.01); // number
        break;
      }
    }
    return g;
  };

  function addProp(kind, body) {
    const s = shared();
    const G = s.geo;
    const add = (geo, mat, x, y, z, sx, sy, sz, rx, ry, rz) => body.add(part(geo, mat, x, y, z, sx, sy, sz, rx, ry, rz));
    switch (kind) {
      case 'oxygen':
        add(G.cyl, s.green, 0.48, 1.0, -0.72, 0.13, 0.7, 0.13, 0.2, 0, 0);
        add(G.cyl8, s.chrome, 0.48, 1.38, -0.65, 0.05, 0.1, 0.05);
        break;
      case 'plunger':
        add(G.cyl8, s.wood, -0.5, 1.35, -0.85, 0.035, 1.1, 0.035, -0.25, 0, 0);
        add(G.hemi, s.red, -0.5, 1.88, -0.99, 0.17, 0.14, 0.17, Math.PI - 0.25, 0, 0);
        break;
      case 'shotgun':
        add(G.cyl8, s.black, -0.86, 0.72, 0.15, 0.045, 1.1, 0.045, Math.PI / 2, 0, 0);
        add(G.cyl8, s.black, -0.86, 0.79, 0.15, 0.045, 1.1, 0.045, Math.PI / 2, 0, 0);
        add(G.box, s.wood, -0.86, 0.72, -0.55, 0.08, 0.16, 0.4);
        break;
      case 'cleaver':
        add(G.box, s.chrome, 0.9, 0.95, 0.3, 0.03, 0.34, 0.5);
        add(G.box, s.blood, 0.92, 0.92, 0.36, 0.02, 0.12, 0.2);
        add(G.cyl8, s.wood, 0.9, 0.95, -0.12, 0.04, 0.32, 0.04, Math.PI / 2, 0, 0);
        break;
      case 'chainsaw':
        add(G.box, s.orange, 0.9, 0.75, -0.2, 0.22, 0.26, 0.45);
        add(G.box, s.metal, 0.9, 0.75, 0.4, 0.05, 0.12, 0.8);
        break;
      case 'antlers':
        for (const sd of [-1, 1]) {
          add(G.cyl8, s.bone, sd * 0.2, 0.85, 1.25, 0.03, 0.45, 0.03, 0.3, 0, sd * -0.6);
          add(G.cyl8, s.bone, sd * 0.38, 1.04, 1.32, 0.025, 0.25, 0.025, 0.3, 0, sd * 0.3);
          add(G.cyl8, s.bone, sd * 0.32, 0.96, 1.4, 0.025, 0.2, 0.025, -0.6, 0, sd * -0.2);
        }
        add(G.sph, s.bone, 0, 0.72, 1.32, 0.14, 0.12, 0.2);
        break;
      case 'bonesaw':
        add(G.box, s.chrome, -0.9, 0.85, 0.25, 0.03, 0.22, 0.7);
        add(G.box, s.blood, -0.92, 0.8, 0.4, 0.02, 0.1, 0.3);
        add(G.box, s.white, -0.9, 0.9, -0.2, 0.06, 0.18, 0.2);
        break;
      case 'balloon':
        add(G.cyl8, s.white, -0.45, 1.65, -0.85, 0.01, 1.3, 0.01);
        add(G.sph, s.red, -0.45, 2.45, -0.85, 0.32, 0.38, 0.32);
        break;
      case 'ladle':
        add(G.cyl8, s.chrome, 0.9, 1.05, 0.2, 0.03, 0.8, 0.03, 0.5, 0, 0);
        add(G.hemi, s.chrome, 0.9, 1.4, 0.42, 0.13, 0.1, 0.13, Math.PI, 0, 0);
        add(G.sph, std('#8a7a3a', 0.6), 0.9, 1.39, 0.42, 0.11, 0.04, 0.11); // slop
        break;
      case 'beacon': {
        // A flashing light on a pole. Mall security has standards.
        add(G.cyl8, s.chrome, 0.35, 1.5, -0.85, 0.025, 0.9, 0.025);
        add(G.box, s.black, 0.35, 1.96, -0.85, 0.42, 0.06, 0.14);
        add(G.sph, new THREE.MeshBasicMaterial({ color: 0xff2030 }), 0.24, 2.04, -0.85, 0.09, 0.09, 0.09);
        add(G.sph, new THREE.MeshBasicMaterial({ color: 0x2a5cff }), 0.46, 2.04, -0.85, 0.09, 0.09, 0.09);
        add(G.cyl, s.black, -0.86, 0.8, 0.3, 0.07, 0.5, 0.07, Math.PI / 2, 0, 0); // flashlight
        add(G.cyl, new THREE.MeshBasicMaterial({ color: 0xfff4c0 }), -0.86, 0.8, 0.56, 0.065, 0.02, 0.065, Math.PI / 2, 0, 0);
        break;
      }
      case 'jug': {
        const clay = std('#c9a46a', 0.7);
        const label = new THREE.MeshStandardMaterial({ map: jugLabel(), roughness: 0.8 });
        for (const [x, y, z] of [[0.55, 0.85, -0.05], [-0.5, 1.02, -1.15]]) {
          add(G.sph, clay, x, y, z, 0.2, 0.22, 0.2);
          add(G.cyl8, clay, x, y + 0.24, z, 0.06, 0.1, 0.06);
          add(G.box, label, x, y, z + 0.19, 0.16, 0.1, 0.02);
        }
        break;
      }
      case 'harpoon':
        add(G.cyl8, s.wood, -0.86, 0.85, 0.3, 0.04, 1.8, 0.04, Math.PI / 2, 0, 0);
        add(G.cone, s.chrome, -0.86, 0.85, 1.32, 0.08, 0.26, 0.08, Math.PI / 2, 0, 0);
        add(G.box, s.chrome, -0.86, 0.85, 1.18, 0.02, 0.2, 0.06, 0.6, 0, 0); // barb
        add(G.tor, std('#f4f1ea', 0.6), 0, 1.25, -1.5, 0.3, 0.3, 0.6); // life ring
        add(G.box, s.red, 0, 1.55, -1.5, 0.1, 0.1, 0.14);
        add(G.box, s.red, 0, 0.95, -1.5, 0.1, 0.1, 0.14);
        break;
      case 'foamfinger': {
        const foam = std('#f2c14e', 0.9);
        add(G.cyl8, s.wood, 0.95, 1.15, -0.2, 0.03, 0.6, 0.03);
        add(G.box, foam, 0.95, 1.6, -0.2, 0.32, 0.4, 0.14);
        add(G.box, foam, 0.95, 2.0, -0.2, 0.1, 0.45, 0.12);
        add(G.box, foam, 0.8, 1.66, -0.2, 0.08, 0.18, 0.1, 0, 0, 0.6);
        break;
      }
    }
  }

  // "XXX" on a moonshine jug.
  let jugTex = null;
  function jugLabel() {
    if (!jugTex) {
      jugTex = BB.canvasTexture(64, 40, (g, w, h) => {
        g.fillStyle = '#f2ead6';
        g.fillRect(0, 0, w, h);
        g.fillStyle = '#1a1208';
        g.font = 'bold 26px Impact, "Arial Black", sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('XXX', w / 2, h / 2 + 1);
      }, false);
    }
    return jugTex;
  }

  // A kart: the chosen body (karts.js), its wheels, the driver and their prop. Nose points to +z.
  BB.buildKart = function (r, paintId, kartId) {
    const T = THREE;
    const s = shared();
    const G = s.geo;
    const kart = BB.kartById ? BB.kartById(kartId) : { id: 'buggy' };
    const look = BB.paintLook ? BB.paintLook(paintId || 'stock', r) : { color: r.color, roughness: 0.42, metalness: 0.35 };
    const paint = new T.MeshStandardMaterial(look);
    const trim = new T.MeshStandardMaterial({ color: r.accent, roughness: 0.5, metalness: 0.2 });
    const root = new T.Group();
    root.rotation.order = 'YXZ';
    const pivot = new T.Group(); // tricks rotate this, around the kart's middle
    pivot.position.y = 0.7;
    root.add(pivot);
    const body = new T.Group();
    body.position.y = -0.7;
    pivot.add(body);
    const add = (m) => (body.add(m), m);
    const panels = paintId && paintId !== 'stock' ? paint : trim; // paint jobs cover the side pods and wing too

    const wheels = [];
    const wheel = (x, z, rad, w, front) => {
      const steer = new T.Group();
      steer.position.set(x, rad, z);
      const spin = new T.Group();
      steer.add(spin);
      spin.add(part(G.cyl, s.tire, 0, 0, 0, rad, w, rad, 0, 0, Math.PI / 2));
      const out = Math.sign(x) * (w / 2 + 0.01);
      spin.add(part(G.cyl, trim, out, 0, 0, rad * 0.55, 0.04, rad * 0.55, 0, 0, Math.PI / 2));
      spin.add(part(G.box, s.chrome, out + Math.sign(x) * 0.02, 0, 0, 0.03, rad * 1.0, 0.12));
      body.add(steer);
      wheels.push({ steer, spin, rad, front });
    };
    // The steering wheel sits where the driver's hands are.
    const steering = (seat) => {
      const [x, y, z] = seat;
      add(part(G.cyl8, s.dark, x, y + 0.18, z + 0.68, 0.035, 0.55, 0.035, 0.95, 0, 0)); // column
      add(part(G.tor, s.dark, x, y + 0.38, z + 0.44, 0.2, 0.2, 0.2, 0.95, 0, 0)); // wheel
    };
    const build = (BB.KART_BODIES && BB.KART_BODIES[kart.id]) || BB.KART_BODIES.buggy;
    const spec = build({ T, s, G, paint, trim, panels, body, add, part, std, wheel, steering });

    const driver = BB.buildDriver(r);
    driver.position.set(spec.seat[0], spec.seat[1], spec.seat[2]);
    body.add(driver);
    const props = new T.Group();
    props.position.set(spec.props[0], spec.props[1], spec.props[2]);
    body.add(props);
    addProp(r.prop, props);

    return {
      root, pivot, body, wheels, driver, paint, trim, kart: kart.id,
      paintColor: new T.Color(look.color), trimColor: new T.Color(r.accent),
      exhausts: spec.exhausts.map((e) => new T.Vector3(e[0], e[1], e[2])),
      tagY: Math.max(2.9, spec.top + 0.9), // name tag height
    };
  };
})();
</script>
<script>
/* ---- js/karts.js ---- */
/* BuggyBoom — kart bodies. Any racer can drive any kart they've unlocked. Each kart nudges the
   racer's stats up or down (every kart's changes add up to zero, so none is simply better), and
   has its own look, built from simple shapes like everything else. Nose points to +z. */
(function () {
  'use strict';
  const BB = window.BB;

  BB.KARTS = [
    { id: 'buggy', name: 'Buggy', icon: '🏎️', blurb: 'The classic. Does everything okay.', mods: {} },
    { id: 'cart', name: 'Shopping Cart', icon: '🛒', blurb: 'Stolen from outside a liquor store. Quick off the line. Folds like a lawn chair.', mods: { speed: -1, accel: 2, handling: 1, tough: -2 }, unlock: 2 },
    { id: 'mower', name: 'Ride-On Mower', icon: '🚜', blurb: 'Cuts grass. Cuts corners. Cuts people.', mods: { speed: -1, handling: 2, tough: -1 }, unlock: 4 },
    { id: 'hearse', name: 'Hearse', icon: '⚰️', blurb: 'Long, heavy and roomy in the back. Comes with a passenger.', mods: { speed: 1, accel: -1, handling: -1, tough: 1 }, unlock: 6 },
    { id: 'tub', name: 'Bathtub', icon: '🛁', blurb: 'Clawfoot tub, outboard motor, one rubber duck. Fast and slippery.', mods: { speed: 1, accel: 1, handling: -1, tough: -1 }, unlock: 8 },
    { id: 'monster', name: 'Monster Truck', icon: '🛻', blurb: 'Four tons of midlife crisis. Shrugs off rockets. Steers like a fridge.', mods: { accel: -1, handling: -2, tough: 3 }, unlock: 10 },
    { id: 'couch', name: 'Rocket Couch', icon: '🛋️', blurb: 'A recliner with a jet engine. Cup holders included. Brakes not.', mods: { speed: 2, handling: -1, tough: -1 }, unlock: 14 },
  ];
  BB.kartById = (id) => BB.KARTS.find((k) => k.id === id) || BB.KARTS[0];

  const STATS = [['speed', 'Speed'], ['accel', 'Accel'], ['handling', 'Handling'], ['tough', 'Tough']];
  BB.STAT_NAMES = STATS;

  // A racer's stats in this kart (each stays between 1 and 6).
  BB.kartStats = (racer, kart) => {
    const m = (kart && kart.mods) || {};
    const out = {};
    for (const [k] of STATS) out[k] = BB.clamp(racer.stats[k] + (m[k] || 0), 1, 6);
    return out;
  };

  // "+2 Accel · −2 Tough", for the menus.
  BB.kartModText = (kart) => {
    const m = kart.mods || {};
    const bits = STATS.filter(([k]) => m[k]).map(([k, label]) => (m[k] > 0 ? '+' : '−') + Math.abs(m[k]) + ' ' + label);
    return bits.length ? bits.join(' · ') : 'No changes';
  };

  // ---------- bodies ----------
  // c gives each body what it needs: shapes (c.G), shared materials (c.s), this kart's paint and
  // trim, c.add(mesh), c.part(...), c.std(color), c.wheel(x, z, radius, width, steers) and
  // c.steering(seat). Each returns where the driver sits, how far to shift the racer's prop from
  // where it sits on the buggy, where the boost flames come out, and roughly how tall it is.

  const BODIES = {
    buggy(c) {
      const { s, G, paint, panels, add, part } = c;
      add(part(G.box, paint, 0, 0.42, 0.05, 1.5, 0.26, 2.5)); // floor pan
      add(part(G.box, paint, 0, 0.6, 0.95, 1.1, 0.26, 1.0, 0.16, 0, 0)); // nose
      add(part(G.box, s.dark, 0, 0.34, 1.45, 1.75, 0.22, 0.24)); // bumper
      for (const sd of [-1, 1]) add(part(G.box, panels, sd * 0.78, 0.52, 0.05, 0.22, 0.32, 1.45)); // side pods
      add(part(G.box, s.dark, 0, 0.62, -0.35, 0.8, 0.12, 0.8)); // seat
      add(part(G.box, s.dark, 0, 0.98, -0.74, 0.8, 0.7, 0.14, -0.15, 0, 0)); // seat back
      add(part(G.box, s.metal, 0, 0.8, -1.12, 0.95, 0.5, 0.55)); // engine
      add(part(G.box, s.dark, 0, 1.08, -1.12, 0.6, 0.1, 0.4)); // intake
      for (const sd of [-1, 1]) add(part(G.cyl8, s.chrome, sd * 0.28, 1.05, -1.45, 0.08, 0.55, 0.08, Math.PI / 2 - 0.55, 0, 0)); // exhausts
      for (const sd of [-1, 1]) add(part(G.box, s.dark, sd * 0.5, 1.28, -1.32, 0.06, 0.5, 0.08)); // spoiler struts
      add(part(G.box, panels, 0, 1.52, -1.38, 1.75, 0.08, 0.45)); // spoiler
      const seat = [0, 0.68, -0.32];
      c.steering(seat);
      c.wheel(0.9, 0.98, 0.36, 0.32, true);
      c.wheel(-0.9, 0.98, 0.36, 0.32, true);
      c.wheel(0.92, -0.95, 0.44, 0.42, false);
      c.wheel(-0.92, -0.95, 0.44, 0.42, false);
      return { seat, props: [0, 0, 0], exhausts: [[0.28, 1.18, -1.7], [-0.28, 1.18, -1.7]], top: 1.6 };
    },

    // A wire basket on casters with a leaf blower strapped to the back.
    cart(c) {
      const { s, G, paint, trim, add, part } = c;

      const W = 0.66;
      const Z0 = -0.95;
      const Z1 = 1.2;
      const Y0 = 0.5;
      const Y1 = 1.22;
