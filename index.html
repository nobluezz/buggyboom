          c.textBaseline = 'middle';
          if (text) {
            c.fillStyle = '#ffd23f';
            c.fillText(text.toUpperCase(), w / 2, h / 2 + 4, w - 60);
          } else {
            c.fillStyle = '#ffd23f';
            c.fillText('BUGGY', w / 2 - 130, h / 2 + 4);
            c.fillStyle = '#ff3b3b';
            c.fillText('BOOM', w / 2 + 150, h / 2 + 4);
          }
          c.fillStyle = '#ffd23f';
          for (let x = 0; x < w; x += 40) c.fillRect(x, 0, 20, 6), c.fillRect(x + 20, h - 6, 20, 6);
        }, false);
      for (const sd of [1, -1]) {
        const b = new T.Mesh(new T.PlaneGeometry(26, 2.4), new T.MeshBasicMaterial({ map: banner(sd < 0 ? null : this.name) }));
        b.position.set(0, 8, sd * 0.47);
        if (sd < 0) b.rotation.y = Math.PI;
        g.add(b);
      }
      this.lightMats = [];
      for (let i = 0; i < 3; i++) {
        const mat = new T.MeshBasicMaterial({ color: 0x331111 });
        for (const sd of [1, -1]) {
          const l = new T.Mesh(S.geo.sph, mat);
          l.scale.setScalar(0.55);
          l.position.set((i - 1) * 1.6, 6.6, sd * 0.45);
          g.add(l);
        }
        this.lightMats.push(mat);
      }
      this.group.add(g);
    }

    // n: 3, 2, 1 = that many red lights; 0 = all green; -1 = dark.
    setLights(n) {
      if (this._lights === n) return;
      this._lights = n;
      this.lightMats.forEach((m, i) => {
        if (n === 0) m.color.set(0x3dff6a);
        else if (n > 0 && i < 4 - n) m.color.set(0xff2a2a);
        else m.color.set(0x331111);
      });
    }

    // ---------- boost pads and item crates ----------

    buildPads() {
      const T = THREE;
      this.padTex = BB.canvasTexture(64, 128, (g, w, h) => {
        g.fillStyle = '#3a1606';
        g.fillRect(0, 0, w, h);
        for (let k = 0; k < 3; k++) {
          const y = 10 + k * 40;
          g.fillStyle = k === 1 ? '#ffd23f' : '#ff7a1a';
          g.beginPath();
          g.moveTo(6, y);
          g.lineTo(w / 2, y + 22);
          g.lineTo(w - 6, y);
          g.lineTo(w - 6, y + 12);
          g.lineTo(w / 2, y + 34);
          g.lineTo(6, y + 12);
          g.fill();
        }
        g.strokeStyle = '#ffd23f';
        g.lineWidth = 4;
        g.strokeRect(2, 2, w - 4, h - 4);
      });
      const mat = new T.MeshBasicMaterial({ map: this.padTex, polygonOffset: true, polygonOffsetFactor: -3 });
      const geo = new T.PlaneGeometry(4, 7);
      geo.rotateX(-Math.PI / 2);
      for (const spec of this.def.pads || []) this.pads.push({ s: this.sOf(spec), d: spec.d || 0 });
      for (const pad of this.pads) {
        const p = pad.sc ? pad.sc.path.sampleAt(pad.u, {}) : this.sampleAt(pad.s, {});
        const m = new T.Mesh(geo, mat);
        m.position.set(p.x + p.rx * pad.d, p.y + 0.06, p.z + p.rz * pad.d);
        m.rotation.y = Math.atan2(p.tx, p.tz);
        this.group.add(m);
      }
      for (const f of this.def.crates || []) {
        const p = this.sampleAt(f * this.L, {});
        for (const dd of [-6, -3, 0, 3, 6]) this.crateSpots.push({ x: p.x + p.rx * dd, y: p.y + 1.15, z: p.z + p.rz * dd });
      }
    }

    // Is a kart at this spot on a boost pad?
    onPad(info) {
      for (const p of this.pads) {
        if (p.sc) {
          if (info.sc !== p.sc) continue;
          if (Math.abs(info.u - p.u) < 3.5 && Math.abs(info.d - p.d) < 2.4) return true;
          continue;
        }
        if (info.sc) continue;
        const ds = this.delta(info.s - p.s);
        if (ds > -3.5 && ds < 3.5 && Math.abs(info.d - p.d) < 2.4) return true;
      }
      return false;
    }

    // ---------- hazards ----------

    buildHazards() {
      const T = THREE;
      const S = BB.sharedMats();
      const def = this.def;

      // Sludge (slow) and blood slicks (no grip) painted on the road.
      for (const z of def.zones || []) {
        const s0 = this.sOf({ f: z.f0, s: z.s0, at: z.at0 });
        let len = z.len || 30;
        const zone = { s0, s1: s0 + len, d0: z.d0, d1: z.d1, kind: z.kind };
        this.zones.push(zone);
        const tex = z.kind === 'slick' ? Track.slickTex || (Track.slickTex = TEX.puddle('#5a0608', false)) : Track.sludgeTex || (Track.sludgeTex = TEX.puddle('#4f6a1c', true));
        const mat =
          z.kind === 'slick'
            ? new T.MeshPhongMaterial({ map: tex, color: 0xffffff, shininess: 90, specular: 0x664444, transparent: true, opacity: 0.92, polygonOffset: true, polygonOffsetFactor: -4 })
            : new T.MeshLambertMaterial({ map: tex, emissive: 0x0e1a02, transparent: true, opacity: 0.95, polygonOffset: true, polygonOffsetFactor: -4 });
        const a = Math.round(s0 / this.step);
        const b = a + Math.round(len / this.step);
        this.strip(this.main, z.d0, z.d1, (i, p) => p.Y[i] + 0.05, (i, p) => p.Y[i] + 0.05, mat, 8, a, b);
        if (z.kind === 'sludge') this.anims.push((dt) => (tex.offset.y = (tex.offset.y + dt * 0.12) % 1));
      }

      // Methane geysers: vents in the road that blow a column of fire every few seconds.
      for (const gd of def.geysers || []) {
        const s = this.sOf(gd);
        const p = this.sampleAt(s, {});
        const x = p.x + p.rx * (gd.d || 0);
        const z = p.z + p.rz * (gd.d || 0);
        const ring = new T.Mesh(S.geo.tor, new T.MeshLambertMaterial({ color: 0x3a3a34 }));
        ring.rotation.x = Math.PI / 2;
        ring.scale.set(2.2, 2.2, 2.2);
        ring.position.set(x, p.y + 0.12, z);
        const hole = new T.Mesh(new T.CircleGeometry(2.1, 20), new T.MeshBasicMaterial({ color: 0x0c0a08 }));
        hole.rotation.x = -Math.PI / 2;
        hole.position.set(x, p.y + 0.06, z);
        // The flame column: a solid orange sheath round a bright core.
        const col = new T.Group();
        const sheath = new T.Mesh(new T.CylinderGeometry(1.0, 2.2, 1, 14, 1, true), new T.MeshBasicMaterial({ color: 0xff6a1a, transparent: true, opacity: 0.85, depthWrite: false, side: T.DoubleSide }));
        const core = new T.Mesh(new T.CylinderGeometry(0.5, 1.3, 1, 10, 1, true), new T.MeshBasicMaterial({ color: 0xffe08a, transparent: true, opacity: 0.9, blending: T.AdditiveBlending, depthWrite: false }));
        col.add(sheath, core);
        col.material = sheath.material;
        col.position.set(x, p.y, z);
        col.visible = false;
        this.group.add(ring, hole, col);
        this.geysers.push({ x, y: p.y, z, s, d: gd.d || 0, period: gd.period || 6, offset: gd.offset || 0, col, state: 'idle', cycle: -1 });
      }

      // Carnival spinners: a big arm that sweeps across the road.
      for (const sd of def.spinners || []) {
        const s = this.sOf(sd);
        const p = this.sampleAt(s, {});
        const side = sd.side || 1;
        const px = p.x + p.rx * (this.WALL + 3) * side;
        const pz = p.z + p.rz * (this.WALL + 3) * side;
        const len = sd.len || 22;
        const g = new T.Group();
        g.position.set(px, p.y, pz);
        const base = new T.Mesh(S.geo.cyl, new T.MeshLambertMaterial({ color: 0x3a2a4a }));
        base.scale.set(1.6, 3, 1.6);
        base.position.y = 1.5;
        g.add(base);
        const arm = new T.Group();
        arm.position.y = 1.3;
        const beam = new T.Mesh(S.geo.box, new T.MeshLambertMaterial({ color: sd.color || 0xd83a8a }));
        beam.scale.set(len, 0.7, 0.9);
        beam.position.x = len / 2;
        beam.castShadow = true;
        arm.add(beam);
        const cart = new T.Mesh(S.geo.box, new T.MeshLambertMaterial({ color: 0xffd23f }));
        cart.scale.set(2.6, 1.6, 2.2);
        cart.position.set(len, 0.4, 0);
        cart.castShadow = true;
        arm.add(cart);
        for (let k = 2; k < len; k += 2.5) {
          const bulb = new T.Mesh(S.geo.sph, new T.MeshBasicMaterial({ color: k % 5 < 2.5 ? 0xfff2a0 : 0xff6be0 }));
          bulb.scale.setScalar(0.18);
          bulb.position.set(k, 0.45, 0);
          arm.add(bulb);
        }
        g.add(arm);
        this.group.add(g);
        this.spinners.push({ x: px, y: p.y, z: pz, len, speed: sd.speed || 0.9, a: sd.phase || 0, arm });
      }

      // Propane tanks by the road that blow up on a timer.
      for (const td of def.tanks || []) {
        const s = this.sOf(td);
        const p = this.sampleAt(s, {});
        const side = td.side || 1;
        const x = p.x + p.rx * (this.WALL + 2.2) * side;
        const z = p.z + p.rz * (this.WALL + 2.2) * side;
        const g = new T.Group();
        g.position.set(x, p.y, z);
        g.rotation.y = Math.atan2(p.tx, p.tz);
        const white = new T.MeshLambertMaterial({ color: 0xe8e4dc });
        const body = new T.Mesh(S.geo.cyl, white);
        body.scale.set(0.9, 2.4, 0.9);
        body.rotation.z = Math.PI / 2;
        body.position.y = 1.1;
        g.add(body);
        for (const e of [-1, 1]) {
          const cap = new T.Mesh(S.geo.sph, white);
          cap.scale.set(0.5, 0.9, 0.9);
          cap.position.set(e * 1.2, 1.1, 0);
          g.add(cap);
        }
        const light = new T.MeshBasicMaterial({ color: 0x401010 });
        const bulb = new T.Mesh(S.geo.sph, light);
        bulb.scale.setScalar(0.22);
        bulb.position.set(0, 2.1, 0);
        g.add(bulb);
        const sign = BB.canvasTexture(128, 64, (c, w, h) => {
          c.fillStyle = '#c01f1f';
          c.fillRect(0, 0, w, h);
          c.fillStyle = '#fff';
          c.font = 'bold 22px Impact, sans-serif';
          c.textAlign = 'center';
          c.fillText('PROPANE', w / 2, 28);
          c.font = 'bold 14px Arial, sans-serif';
          c.fillText('FLAMMABLE AS HELL', w / 2, 50);
        }, false);
        const plate = new T.Mesh(new T.PlaneGeometry(1.6, 0.8), new T.MeshLambertMaterial({ map: sign }));
        plate.position.set(0, 1.15, -0.92 * side);
        plate.rotation.y = side > 0 ? Math.PI : 0;
        g.add(plate);
        g.traverse((o) => (o.castShadow = true));
        this.group.add(g);
        this.tanks.push({ x, y: p.y, z, period: td.period || 9, offset: td.offset || 0, g, light, cycle: -1, hidden: 0 });
      }

      // Seagulls circling the dump.
      if (def.gulls) this.buildGulls(def.gulls);
    }

    buildGulls(n) {
      const T = THREE;
      const S = BB.sharedMats();
      const white = new T.MeshLambertMaterial({ color: 0xf2f0ea });
      const grey = new T.MeshLambertMaterial({ color: 0x9a9a9a });
      const beak = new T.MeshLambertMaterial({ color: 0xf2b414 });
      const B = this.bounds;
      this.gulls = [];
      for (let k = 0; k < n; k++) {
        const g = new T.Group();
        const body = new T.Mesh(S.geo.sph, white);
        body.scale.set(0.35, 0.3, 0.8);
        g.add(body);
        const head = new T.Mesh(S.geo.sph, white);
        head.scale.setScalar(0.22);
        head.position.set(0, 0.15, 0.7);
        g.add(head);
        const b = new T.Mesh(S.geo.cone, beak);
        b.scale.set(0.07, 0.25, 0.07);
        b.rotation.x = Math.PI / 2;
        b.position.set(0, 0.12, 0.98);
        g.add(b);
        const wings = [];
        for (const sd of [-1, 1]) {
          const pivot = new T.Group();
          pivot.position.set(sd * 0.25, 0.08, 0);
          const w = new T.Mesh(S.geo.box, grey);
          w.scale.set(1.4, 0.05, 0.5);
          w.position.x = sd * 0.7;
          pivot.add(w);
          g.add(pivot);
          wings.push({ pivot, sd });
        }
        this.group.add(g);
        this.gulls.push({
          g, wings,
          cx: BB.lerp(B.minX, B.maxX, Math.random()), cz: BB.lerp(B.minZ, B.maxZ, Math.random()),
          r: 20 + Math.random() * 60, h: 18 + Math.random() * 30, w: (0.25 + Math.random() * 0.3) * (Math.random() < 0.5 ? -1 : 1), a: Math.random() * 6, ph: Math.random() * 6,
        });
      }
    }

    // Reset hazard timers for a new race.
    resetGame() {
      for (const g of this.geysers) {
        g.cycle = -1;
        g.state = 'idle';
        g.col.visible = false;
      }
      for (const t of this.tanks) {
        t.cycle = -1;
        t.hidden = 0;
        t.g.visible = true;
      }
      for (const p of this.pieces) this.restorePiece(p);
      this.poopT = 14 + Math.random() * 10;
    }

    restorePiece(p) {
      p.broken = false;
      p.m.visible = true;
    }

    // Gameplay for this track's hazards, run by the race each frame. t = race time.
    updateGame(race, dt) {
      const t = race.time;
      const fx = race.fx;
      const audio = race.audio;

      for (const g of this.geysers) {
        const ph = (((t + g.offset) % g.period) + g.period) % g.period;
        const cyc = Math.floor((t + g.offset) / g.period);
        const near = audio.at(g.x, g.y, g.z);
        if (ph < 1.1) {
          if (g.state !== 'erupt') {
            g.state = 'erupt';
            audio.geyser(near);
            fx.fire(g.x, g.y + 1, g.z, 30, 2.2, 0, 14, 0, 3);
          }
          const k = ph / 1.1;
          g.col.visible = true;
          const hgt = 16 * Math.sin(Math.min(1, k * 3) * Math.PI * 0.5) * (1 - Math.max(0, k - 0.7) / 0.3);
          g.col.scale.set(1, Math.max(0.1, hgt), 1);
          g.col.position.y = g.y + hgt / 2;
          g.col.material.opacity = 0.75 * (1 - k * 0.6);
          if (fx.near(g.x, g.z, 160)) {
            for (let i = BB.count(160, dt); i > 0; i--) {
              fx.glow.spawn(g.x + (Math.random() - 0.5) * 2.4, g.y + 0.3, g.z + (Math.random() - 0.5) * 2.4, (Math.random() - 0.5) * 3, 16 + Math.random() * 9, (Math.random() - 0.5) * 3, 0.5 + Math.random() * 0.4, 1.4, 0.4, 0xfff09a, 0xc0300a, 0.9, 6, 0.6);
            }
          }
          for (const kk of race.karts) {
            if (kk.dead || kk.puppet || kk.remote || kk.geyserCycle === g.offset * 1000 + cyc) continue;
            const dx = kk.pos.x - g.x;
            const dz = kk.pos.z - g.z;
            if (dx * dx + dz * dz > 3.4 * 3.4 || kk.pos.y - g.y > 4) continue;
            kk.geyserCycle = g.offset * 1000 + cyc;
            kk.launch(16 + Math.random() * 2);
            kk.speed *= 0.85;
            kk.damage(6, null, 'geyser', { quiet: true });
            fx.fire(kk.pos.x, kk.pos.y + 0.5, kk.pos.z, 18, 1.4, 0, 8, 0, 3);
            if (kk.isPlayer) fx.addShake(0.5);
          }
        } else {
          g.col.visible = false;
          if (ph > g.period - 1.6) {
            if (g.state !== 'warn') {
              g.state = 'warn';
              audio.hiss(near);
            }
            if (fx.near(g.x, g.z, 140) && Math.random() < dt * 30) {
              fx.puff.spawn(g.x + (Math.random() - 0.5) * 3, g.y + 0.3, g.z + (Math.random() - 0.5) * 3, 0, 2 + Math.random() * 2, 0, 0.9, 0.8, 2.4, 0x9ab84a, 0x6a7a3a, 0.5, -0.5, 0.8);
            }
          } else g.state = 'idle';
        }
      }

      for (const sp of this.spinners) {
        const ca = Math.cos(sp.a);
        const sa = Math.sin(sp.a);
        for (const kk of race.karts) {
          if (kk.dead || kk.puppet || kk.remote || kk.spinHitT > 0) continue;
          const dx = kk.pos.x - sp.x;
          const dz = kk.pos.z - sp.z;
          const u = dx * ca - dz * sa; // along the arm (arm points along local +x, rotated by -a about y)
          if (u < 2 || u > sp.len + 1.4) continue;
          const v = dx * sa + dz * ca;
          if (Math.abs(v) > 1.9 || kk.pos.y - sp.y > 2.2) continue;
          kk.spinHitT = 1.2;
          const dir = Math.sign(sp.speed);
          // The arm sweeps along d/da of (cos a, -sin a) = (-sin a, -cos a).
          const tx = -sa * dir;
          const tz = -ca * dir;
          if (kk.damage(16, null, 'spinner', { spin: 1.0, kx: tx * (8 + Math.abs(sp.speed) * u * 0.7), kz: tz * (8 + Math.abs(sp.speed) * u * 0.7) })) {
            fx.sparks(kk.pos.x, kk.pos.y + 1, kk.pos.z, 0xffe0a0, 16, 8);
            audio.bump(kk.isPlayer ? 1 : audio.at(kk.pos.x, kk.pos.y, kk.pos.z));
          }
        }
      }

      for (const tk of this.tanks) {
        const ph = (((t + tk.offset) % tk.period) + tk.period) % tk.period;
        const cyc = Math.floor((t + tk.offset) / tk.period);
        if (tk.hidden > 0) {
          tk.hidden -= dt;
          if (tk.hidden <= 0) tk.g.visible = true;
        }
        const warn = ph > tk.period - 1.8;
        tk.light.color.setHex(warn && Math.floor(t * 8) % 2 ? 0xff2020 : 0x401010);
        if (warn && !tk.warned) {
          tk.warned = true;
          audio.hiss(audio.at(tk.x, tk.y, tk.z));
        }
        if (cyc !== tk.cycle) {
          if (tk.cycle >= 0 && race.items) {
            tk.g.visible = false;
            tk.hidden = 2.5;
            race.items.blast(tk.x, tk.y + 1.2, tk.z, 10, 42, null, 'propane', null, true);
          }
          tk.cycle = cyc;
          tk.warned = false;
        }
      }

      // Breakable barricades at shortcut entrances.
      for (const p of this.pieces) {
        if (p.broken) {
          p.t -= dt;
          if (p.t <= 0 && !race.karts.some((k) => Math.abs(k.pos.x - p.x) + Math.abs(k.pos.z - p.z) < 8)) this.restorePiece(p);
          continue;
        }
        for (const kk of race.karts) {
          if (kk.dead) continue;
          const dx = kk.pos.x - p.x;
          const dz = kk.pos.z - p.z;
          if (dx * dx + dz * dz > 2.3 * 2.3 || Math.abs(kk.pos.y + 0.7 - p.y) > 2.2) continue;
          p.broken = true;
          p.t = 14;
          p.m.visible = false;
          const sp = Math.max(6, kk.speed);
          for (let i = 0; i < 4; i++) {
            const s = 0.35 + Math.random() * 0.3;
            fx.chunk(p.x, p.y, p.z, Math.sin(kk.yaw) * sp * 0.6 + (Math.random() - 0.5) * 6, 4 + Math.random() * 5, Math.cos(kk.yaw) * sp * 0.6 + (Math.random() - 0.5) * 6, p.mat, p.sz[0] * s, p.sz[1] * s, p.sz[2] * s + 0.1, 4, false, p.geo);
          }
          kk.speed *= 0.96;
          audio.crunch(kk.isPlayer ? 1 : audio.at(p.x, p.y, p.z));
          break;
        }
      }

      // Seagulls take aim at the player now and then.
      if (this.gulls && race.locals.length && !race.attract && race.clock > 2) {
        this.poopT -= dt;
        if (this.poopT <= 0) {
          this.poopT = (15 + Math.random() * 15) / race.locals.length;
          const victim = BB.pick(race.locals);
          const h = race.hudFor(victim);
          if (h && !victim.dead && !victim.finished) {
            h.poop();
            audio.squawk();
            h.pushFeed(BB.text('A seagull {shat} on you.'), 'taunt');
          }
        }
      }
    }

    // ---------- scenery helpers for track definitions ----------

    clearOf(x, z, min) {
      const m2 = min * min;
      for (let i = 0; i < this.N; i += 3) {
        const dx = x - this.X[i];
        const dz = z - this.Z[i];
        if (dx * dx + dz * dz < m2) return false;
      }
      for (const sc of this.shortcuts) {
        const p = sc.path;
        const m3 = (sc.half + min * 0.6) * (sc.half + min * 0.6);
        for (let i = 0; i < p.n; i += 3) {
          const dx = x - p.X[i];
          const dz = z - p.Z[i];
          if (dx * dx + dz * dz < m3) return false;
        }
      }
      return true;
    }

    inst(geo, mat, list, shadow) {
      if (!list.length) return null;
      const T = THREE;
      const m = new T.InstancedMesh(geo, mat, list.length);
      const o = new T.Object3D();
      const c = new T.Color();
      list.forEach((it, i) => {
        o.position.set(it.x, it.y, it.z);
        o.rotation.set(it.rx || 0, it.ry || 0, it.rz || 0);
        o.scale.set(it.sx || 1, it.sy || 1, it.sz || 1);
        o.updateMatrix();
        m.setMatrixAt(i, o.matrix);
        if (it.c != null) m.setColorAt(i, c.set(it.c));
      });
      m.instanceMatrix.needsUpdate = true;
      if (m.instanceColor) m.instanceColor.needsUpdate = true;
      m.castShadow = !!shadow;
      m.receiveShadow = true;
      m.frustumCulled = false;
      this.group.add(m);
      return m;
    }

    white() {
      return new THREE.MeshLambertMaterial({ color: 0xffffff });
    }

    // A point d metres to the side of the track at distance s, sitting on the ground.
    side(s, d) {
      const p = this.sampleAt(s, {});
      const x = p.x + p.rx * d;
      const z = p.z + p.rz * d;
      return { x, z, y: this.groundAt(x, z, p.i), yaw: Math.atan2(p.tx, p.tz), p };
    }

    // A random spot near the track at least `min` metres from any road. Returns null if none found.
    spot(min, spread) {
      const B = this.bounds;
      spread = spread || 140;
      for (let k = 0; k < 60; k++) {
        const x = B.minX - spread + this.rnd() * (B.maxX - B.minX + spread * 2);
        const z = B.minZ - spread + this.rnd() * (B.maxZ - B.minZ + spread * 2);
        if (this.clearOf(x, z, min)) return { x, z, y: 0 };
      }
      return null;
    }

    addFire(x, y, z, size) {
      const T = THREE;
      const S = BB.sharedMats();
      if (!Track.flameMats) {
        Track.flameMats = [
          new T.MeshBasicMaterial({ color: 0xff8a2a, transparent: true, opacity: 0.85, blending: T.AdditiveBlending, depthWrite: false }),
          new T.MeshBasicMaterial({ color: 0xffd25a, transparent: true, opacity: 0.9, blending: T.AdditiveBlending, depthWrite: false }),
        ];
      }
      const outer = new T.Mesh(S.geo.cone, Track.flameMats[0]);
      outer.position.set(x, y + size * 0.5, z);
      outer.scale.set(size * 0.45, size, size * 0.45);
      const inner = new T.Mesh(S.geo.cone, Track.flameMats[1]);
      inner.position.set(x, y + size * 0.35, z);
      inner.scale.set(size * 0.25, size * 0.7, size * 0.25);
      this.group.add(outer, inner);
      this.flames.push({ m: outer, base: size, ph: this.rnd() * 10 }, { m: inner, base: size * 0.7, ph: this.rnd() * 10 });
    }

    // Burning barrels near the walls.
    barrels(n, colors) {
      const S = BB.sharedMats();
      const list = [];
      for (let k = 0; k < n; k++) {
        const s = this.rnd() * this.L;
        const sd = this.rnd() < 0.5 ? -1 : 1;
        const q = this.side(s, sd * (this.WALL + 3 + this.rnd() * 6));
        if (!this.clearOf(q.x, q.z, this.WALL + 1.5)) continue;
        list.push({ x: q.x, y: q.y + 0.55, z: q.z, sx: 0.45, sy: 1.1, sz: 0.45, c: colors[k % colors.length] });
        this.addFire(q.x, q.y + 1.1, q.z, 1.1 + this.rnd() * 0.6);
      }
      this.inst(S.geo.cyl, this.white(), list, true);
    }

    tyreStacks(chance) {
      const S = BB.sharedMats();
      const tyres = [];
      for (let s = 6; s < this.L; s += 9 + this.rnd() * 7) {
        if (this.rnd() > chance) continue;
        const sd = this.rnd() < 0.5 ? -1 : 1;
        const q = this.side(s, sd * (this.WALL + 1.4));
        if (!this.clearOf(q.x, q.z, this.WALL + 0.8)) continue;
        const n = 2 + ((this.rnd() * 3) | 0);
        const paint = this.rnd() < 0.25 ? (this.rnd() < 0.5 ? 0xd42a2a : 0xe8e2d6) : 0x1a1a1a;
        for (let k = 0; k < n; k++) tyres.push({ x: q.x, y: q.y + 0.22 + k * 0.42, z: q.z, rx: Math.PI / 2, sx: 0.55, sy: 0.55, sz: 1.3, c: k % 2 ? 0x1a1a1a : paint });
      }
      this.inst(S.geo.tor, this.white(), tyres, true);
    }

    wrecks(n, cols) {
      const S = BB.sharedMats();
      cols = cols || [0x7a3b1c, 0x5a6670, 0x8a2f28, 0x3d5a3a, 0x9a7a3a, 0x40404a, 0x6a2a5a];
      const bodies = [];
      const cabins = [];
      for (let k = 0; k < n; k++) {
        const q = this.spot(32, 140);
        if (!q) continue;
        const ry = this.rnd() * BB.TAU;
        const flip = this.rnd() < 0.2;
        bodies.push({ x: q.x, y: flip ? 1.3 : 0.55, z: q.z, ry, rz: flip ? Math.PI : (this.rnd() - 0.5) * 0.2, sx: 2, sy: 1.0, sz: 4.3, c: cols[(this.rnd() * cols.length) | 0] });
        cabins.push({ x: q.x, y: flip ? 0.4 : 1.4, z: q.z, ry, rz: flip ? Math.PI : 0, sx: 1.8, sy: 0.8, sz: 2.1, c: 0x2a2a2e });
      }
      const m = this.white();
      this.inst(S.geo.box, m, bodies, true);
      this.inst(S.geo.box, m, cabins, true);
    }

    crushedStacks(n) {
      const S = BB.sharedMats();
      const cols = [0x7a3b1c, 0x5a6670, 0x8a2f28, 0x3d5a3a, 0x9a7a3a, 0x40404a, 0x6a2a5a];
      const list = [];
      for (let k = 0; k < n; k++) {
        const q = this.spot(34, 120);
        if (!q) continue;
        const c = 3 + ((this.rnd() * 4) | 0);
        const ry = this.rnd() * BB.TAU;
        for (let j = 0; j < c; j++) list.push({ x: q.x + (this.rnd() - 0.5) * 0.6, y: 0.4 + j * 0.82, z: q.z + (this.rnd() - 0.5) * 0.6, ry: ry + (this.rnd() - 0.5) * 0.5, sx: 2.1, sy: 0.8, sz: 4.2, c: cols[(this.rnd() * cols.length) | 0] });
      }
      this.inst(S.geo.box, this.white(), list, true);
    }

    // Cone-shaped piles (junk, garbage, rubble).
    piles(n, colors, rMin, rMax, clear, spread, mat) {
      const list = [];
      for (let k = 0; k < n; k++) {
        const q = this.spot(clear, spread);
        if (!q) continue;
        const rad = rMin + this.rnd() * (rMax - rMin);
        list.push({ x: q.x, y: rad * 0.35, z: q.z, sx: rad, sy: rad * (0.6 + this.rnd() * 0.4), sz: rad * (0.8 + this.rnd() * 0.4), ry: this.rnd() * 6, c: colors[(this.rnd() * colors.length) | 0] });
      }
      this.inst(new THREE.ConeGeometry(1, 1, 7), mat || this.white(), list, false);
    }

    skyline(n, color, rMin, rMax, hMin, hMax, stacks) {
      const S = BB.sharedMats();
      const B = this.bounds;
      const list = [];
      for (let k = 0; k < n; k++) {
        const a = this.rnd() * BB.TAU;
        const d = rMin + this.rnd() * (rMax - rMin);
        const h = hMin + this.rnd() * (hMax - hMin);
        list.push({ x: B.cx + Math.cos(a) * d, y: h / 2, z: B.cz + Math.sin(a) * d, sx: 18 + this.rnd() * 27, sy: h, sz: 18 + this.rnd() * 27, ry: this.rnd() * 3, c: color });
      }
      for (let k = 0; k < (stacks || 0); k++) {
        const a = this.rnd() * BB.TAU;
        const d = rMin - 40 + this.rnd() * (rMax - rMin);
        list.push({ x: B.cx + Math.cos(a) * d, y: 80, z: B.cz + Math.sin(a) * d, sx: 7, sy: 160, sz: 7, c: color });
      }
      this.inst(S.geo.box, this.white(), list, false);
    }

    lightTowers(n, lampColor, poleColor) {
      const T = THREE;
      const S = BB.sharedMats();
      const lampMat = new T.MeshBasicMaterial({ color: lampColor || 0xffe2a8 });
      const poles = [];
      for (let k = 0; k < n; k++) {
        const q = this.side((k / n) * this.L + 20, (k % 2 ? 1 : -1) * (this.WALL + 5));
        if (!this.clearOf(q.x, q.z, this.WALL + 2)) continue;
        poles.push({ x: q.x, y: q.y + 9, z: q.z, sx: 0.25, sy: 18, sz: 0.25, c: poleColor || 0x2d2a30 });
        const lamp = new T.Mesh(S.geo.box, lampMat);
        lamp.position.set(q.x, q.y + 18.3, q.z);
        lamp.scale.set(2.4, 1.0, 0.6);
        lamp.rotation.y = q.yaw + Math.PI / 2;
        this.group.add(lamp);
      }
      this.inst(S.geo.cyl8, this.white(), poles, true);
    }

    // Billboards facing oncoming karts: [{ f, side, title, sub, bg, fg }].
    billboards(list) {
      const T = THREE;
      const S = BB.sharedMats();
      for (const b of list) {
        let s = b.f * this.L;
        let q = this.side(s, b.side * 22);
        for (let tries = 0; tries < 8 && !this.clearOf(q.x, q.z, 16); tries++) {
          s += 15;
          q = this.side(s, b.side * 22);
        }
        const tex = BB.canvasTexture(512, 256, (g, w, h) => {
          g.fillStyle = b.bg;
          g.fillRect(0, 0, w, h);
          g.fillStyle = 'rgba(0,0,0,0.12)';
          for (let i = 0; i < 30; i++) g.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 20, 1 + Math.random() * 3);
          g.fillStyle = b.fg;
          g.textAlign = 'center';
          g.textBaseline = 'middle';
          g.font = 'bold 64px Impact, "Arial Black", sans-serif';
          g.fillText(b.title, w / 2, h * 0.4, w - 30);
          g.font = 'bold 32px "Arial", sans-serif';
          g.fillText(b.sub, w / 2, h * 0.74, w - 40);
          g.strokeStyle = b.fg;
          g.lineWidth = 8;
          g.strokeRect(8, 8, w - 16, h - 16);
        }, false);
        const yaw = Math.atan2(-q.p.tx - b.side * 0.4 * q.p.rx, -q.p.tz - b.side * 0.4 * q.p.rz);
        const board = new T.Mesh(new T.PlaneGeometry(14, 7), new T.MeshLambertMaterial({ map: tex, emissive: b.glow ? 0x404040 : 0x000000, emissiveMap: b.glow ? tex : null }));
        board.position.set(q.x, q.y + 7.5, q.z);
        board.rotation.y = yaw;
        board.castShadow = true;
        const back = new T.Mesh(new T.PlaneGeometry(14, 7), new T.MeshLambertMaterial({ color: 0x2a2628 }));
        back.position.copy(board.position);
        back.rotation.y = yaw + Math.PI;
        this.group.add(board, back);
        for (const sd of [-1, 1]) {
          const post = new T.Mesh(S.geo.box, new T.MeshLambertMaterial({ color: 0x3a3436 }));
          post.position.set(q.x + Math.cos(yaw) * sd * 5, q.y + 2.5, q.z - Math.sin(yaw) * sd * 5);
          post.scale.set(0.4, 5, 0.4);
          this.group.add(post);
        }
      }
    }

    // Bleachers with a crowd, beside the start straight.
    grandstand(side, standColor, shirtCols) {
      const S = BB.sharedMats();
      const crowd = [];
      const heads = [];
      const stand = [];
      shirtCols = shirtCols || [0xd42a2a, 0x2f74e0, 0xf2c414, 0x3f8a46, 0xe8e2d6, 0x7b4fa8, 0xff7d1a, 0x202020];
      for (let row = 0; row < 6; row++) {
        for (let s = -30; s <= 30; s += 2.5) {
          const q = this.side(this.wrapS(s), side * (21 + row * 2.2));
          const top = row * 1.1 + 1.1;
          stand.push({ x: q.x, y: top / 2, z: q.z, ry: q.yaw, sx: 2.6, sy: top, sz: 2.3, c: standColor || 0x4a4650 });
          if (this.rnd() < 0.82) {
            const jx = (this.rnd() - 0.5) * 1.2;
            crowd.push({ x: q.x + q.p.tx * jx, y: top + 0.45, z: q.z + q.p.tz * jx, ry: q.yaw, sx: 0.55, sy: 0.9, sz: 0.4, c: shirtCols[(this.rnd() * shirtCols.length) | 0] });
            heads.push({ x: q.x + q.p.tx * jx, y: top + 1.1, z: q.z + q.p.tz * jx, sx: 0.22, sy: 0.24, sz: 0.22, c: [0xefc6a6, 0xc68a62, 0x8a5a3c, 0xf1d0b5][(this.rnd() * 4) | 0] });
          }
        }
      }
      const m = this.white();
      this.inst(S.geo.box, m, stand, true);
      this.inst(S.geo.box, m, crowd, false);
      this.inst(S.geo.sph, m, heads, false);
    }

    // ---------- every frame (looks only) ----------

    update(dt, time) {
      this.padTex.offset.y = (this.padTex.offset.y + dt * 1.6) % 1;
      for (const f of this.flames) {
        const k = 1 + Math.sin(time * 13 + f.ph) * 0.12 + Math.sin(time * 7.3 + f.ph * 2) * 0.1;
        f.m.scale.y = f.base * k;
        f.m.rotation.y = time * 2 + f.ph;
      }
      for (const sp of this.spinners) {
        sp.a += sp.speed * dt;
        sp.arm.rotation.y = sp.a;
      }
      if (this.gulls) {
        for (const g of this.gulls) {
          g.a += g.w * dt;
          const x = g.cx + Math.cos(g.a) * g.r;
          const z = g.cz + Math.sin(g.a) * g.r;
          g.g.position.set(x, g.h + Math.sin(time * 0.7 + g.ph) * 2, z);
          g.g.rotation.y = Math.atan2(-Math.sin(g.a) * g.w, Math.cos(g.a) * g.w);
          g.g.rotation.z = -g.w * 0.8;
          const flap = Math.sin(time * 9 + g.ph) * 0.6;
          for (const w of g.wings) w.pivot.rotation.z = w.sd * flap;
        }
      }
      for (const a of this.anims) a(dt, time);
    }

    dispose() {
      const shared = new Set();
      const S = BB.sharedMats();
      for (const k in S.geo) shared.add(S.geo[k]);
      for (const k in S) if (S[k] && S[k].isMaterial) shared.add(S[k]);
      const kill = (o) => {
        if (o.geometry && !shared.has(o.geometry)) o.geometry.dispose();
        const ms = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
        for (const m of ms) {
          if (shared.has(m) || m === Track.flameMats?.[0] || m === Track.flameMats?.[1]) continue;
          if (m.map && m.map !== Track.boxTex && m.map !== Track.slickTex && m.map !== Track.sludgeTex) m.map.dispose();
          m.dispose();
        }
      };
      this.group.traverse(kill);
      this.sky.traverse(kill);
      this.scene.remove(this.group);
      this.scene.remove(this.sky);
    }
  }

  BB.Track = Track;
})();

<script>
/* ---- js/effects.js ---- */
/* BuggyBoom — effects: particles (fire, smoke, sparks, blood), explosions, flying debris and
   body parts, ground decals (scorch marks and blood), tracers and camera shake.
   With the Gore switch off, blood and body parts are swapped for smoke and cartoon stars. */
(function () {
  'use strict';
  const BB = window.BB;

  const VERT = `
    attribute vec3 pcolor;
    attribute float psize;
    attribute float palpha;
    uniform float uScale;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vColor = pcolor;
      vAlpha = palpha;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = max(1.0, psize * uScale / max(0.1, -mv.z));
      gl_Position = projectionMatrix * mv;
    }`;
  const FRAG = `
    uniform float uSoft;
    varying vec3 vColor;
    varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - vec2(0.5);
      float d = length(c) * 2.0;
      if (d > 1.0) discard;
      float a = (1.0 - smoothstep(uSoft, 1.0, d)) * vAlpha;
      gl_FragColor = vec4(vColor, a);
    }`;

  const rgbCache = new Map();
  function rgb(hex) {
    let c = rgbCache.get(hex);
    if (!c) {
      c = [((hex >> 16) & 255) / 255, ((hex >> 8) & 255) / 255, (hex & 255) / 255];
      rgbCache.set(hex, c);
    }
    return c;
  }

  // A fixed-size pool of round particles drawn in one call.
  class Pool {
    constructor(scene, max, additive, soft) {
      const T = THREE;
      this.max = max;
      this.n = 0;
      this.pos = new Float32Array(max * 3);
      this.col = new Float32Array(max * 3);
      this.size = new Float32Array(max);
      this.alpha = new Float32Array(max);
      this.v = new Float32Array(max * 3);
      this.life = new Float32Array(max);
      this.maxLife = new Float32Array(max);
      this.s0 = new Float32Array(max);
      this.s1 = new Float32Array(max);
      this.c0 = new Float32Array(max * 3);
      this.c1 = new Float32Array(max * 3);
      this.a0 = new Float32Array(max);
      this.grav = new Float32Array(max);
      this.drag = new Float32Array(max);
      const g = (this.geo = new T.BufferGeometry());
      const mk = (arr, n) => {
        const a = new T.BufferAttribute(arr, n);
        a.setUsage(T.DynamicDrawUsage);
        return a;
      };
      this.aPos = mk(this.pos, 3);
      this.aCol = mk(this.col, 3);
      this.aSize = mk(this.size, 1);
      this.aAlpha = mk(this.alpha, 1);
      g.setAttribute('position', this.aPos);
      g.setAttribute('pcolor', this.aCol);
      g.setAttribute('psize', this.aSize);
      g.setAttribute('palpha', this.aAlpha);
      g.setDrawRange(0, 0);
      this.mat = new T.ShaderMaterial({
        uniforms: { uScale: { value: 400 }, uSoft: { value: soft } },
        vertexShader: VERT,
        fragmentShader: FRAG,
        transparent: true,
        depthWrite: false,
        blending: additive ? T.AdditiveBlending : T.NormalBlending,
      });
      this.points = new T.Points(g, this.mat);
      this.points.frustumCulled = false;
      this.points.renderOrder = additive ? 4 : 3;
      scene.add(this.points);
    }

    spawn(x, y, z, vx, vy, vz, life, s0, s1, c0, c1, a0, grav, drag) {
      let i = this.n;
      if (i >= this.max) i = (Math.random() * this.max) | 0;
      else this.n++;
      const i3 = i * 3;
      this.pos[i3] = x;
      this.pos[i3 + 1] = y;
      this.pos[i3 + 2] = z;
      this.v[i3] = vx;
      this.v[i3 + 1] = vy;
      this.v[i3 + 2] = vz;
      this.life[i] = this.maxLife[i] = life;
      this.s0[i] = s0;
      this.s1[i] = s1;
      const a = rgb(c0);
      const b = rgb(c1);
      this.c0[i3] = a[0];
      this.c0[i3 + 1] = a[1];
      this.c0[i3 + 2] = a[2];
      this.c1[i3] = b[0];
      this.c1[i3 + 1] = b[1];
      this.c1[i3 + 2] = b[2];
      this.a0[i] = a0;
      this.grav[i] = grav;
      this.drag[i] = drag;
      this.size[i] = s0;
      this.alpha[i] = 0;
    }

    move(from, to) {
      const f3 = from * 3;
      const t3 = to * 3;
      for (let k = 0; k < 3; k++) {
        this.pos[t3 + k] = this.pos[f3 + k];
        this.v[t3 + k] = this.v[f3 + k];
        this.c0[t3 + k] = this.c0[f3 + k];
        this.c1[t3 + k] = this.c1[f3 + k];
        this.col[t3 + k] = this.col[f3 + k];
      }
      this.life[to] = this.life[from];
      this.maxLife[to] = this.maxLife[from];
      this.s0[to] = this.s0[from];
      this.s1[to] = this.s1[from];
      this.a0[to] = this.a0[from];
      this.grav[to] = this.grav[from];
      this.drag[to] = this.drag[from];
      this.size[to] = this.size[from];
      this.alpha[to] = this.alpha[from];
    }

    update(dt) {
      let n = this.n;
      for (let i = 0; i < n; ) {
        this.life[i] -= dt;
        if (this.life[i] <= 0) {
          n--;
          if (i !== n) this.move(n, i);
          continue;
        }
        const t = 1 - this.life[i] / this.maxLife[i];
        const i3 = i * 3;
        const dr = Math.exp(-this.drag[i] * dt);
        this.v[i3] *= dr;
        this.v[i3 + 1] = this.v[i3 + 1] * dr - this.grav[i] * dt;
        this.v[i3 + 2] *= dr;
        this.pos[i3] += this.v[i3] * dt;
        this.pos[i3 + 1] += this.v[i3 + 1] * dt;
        this.pos[i3 + 2] += this.v[i3 + 2] * dt;
        this.size[i] = this.s0[i] + (this.s1[i] - this.s0[i]) * t;
        this.col[i3] = this.c0[i3] + (this.c1[i3] - this.c0[i3]) * t;
        this.col[i3 + 1] = this.c0[i3 + 1] + (this.c1[i3 + 1] - this.c0[i3 + 1]) * t;
        this.col[i3 + 2] = this.c0[i3 + 2] + (this.c1[i3 + 2] - this.c0[i3 + 2]) * t;
        this.alpha[i] = this.a0[i] * Math.min(1, t * 8) * (1 - t);
        i++;
      }
      this.n = n;
      this.geo.setDrawRange(0, n);
      if (n > 0) {
        this.aPos.needsUpdate = true;
        this.aCol.needsUpdate = true;
        this.aSize.needsUpdate = true;
        this.aAlpha.needsUpdate = true;
      }
    }

    clear() {
      this.n = 0;
      this.geo.setDrawRange(0, 0);
    }
  }

  class Effects {
    constructor(game) {
      const T = THREE;
      this.game = game;
      this.scene = game.scene;
      this.track = game.track;
      this.glow = new Pool(this.scene, 4000, true, 0.0);
      this.puff = new Pool(this.scene, 3000, false, 0.3);
      this.objs = []; // fireballs, rings, debris, gibs, bodies, tracers
      this.shake = 0;
      this.flash = new T.PointLight(0xffa040, 0, 50, 2);
      this.flash.position.set(0, -100, 0);
      this.scene.add(this.flash);
      this.flashT = 0;

      const S = BB.sharedMats();
      this.geo = {
        ball: new T.SphereGeometry(1, 16, 12),
        ring: new T.RingGeometry(0.7, 1, 40),
        box: S.geo.box,
        sph: S.geo.sph,
      };
      this.geo.ring.rotateX(-Math.PI / 2);
      this.mats = {
        debris: new T.MeshStandardMaterial({ color: 0x2a2624, roughness: 0.8, metalness: 0.3 }),
        hot: new T.MeshBasicMaterial({ color: 0xff7a2a }),
        meat: new T.MeshStandardMaterial({ color: 0x8e1418, roughness: 0.35 }),
        pink: new T.MeshStandardMaterial({ color: 0xd9727a, roughness: 0.4 }),
        bone: S.bone,
      };

      // Ground decals: scorch marks and blood, recycled oldest first.
      const splat = BB.canvasTexture(128, 128, (g, w, h) => {
        g.fillStyle = '#fff';
        const blob = (x, y, r) => {
          g.beginPath();
          g.arc(x, y, r, 0, 7);
          g.fill();
        };
        blob(w / 2, h / 2, 30);
        for (let i = 0; i < 9; i++) {
          const a = Math.random() * BB.TAU;
          const d = 18 + Math.random() * 20;
          blob(w / 2 + Math.cos(a) * d, h / 2 + Math.sin(a) * d, 8 + Math.random() * 12);
        }
        for (let i = 0; i < 18; i++) {
          const a = Math.random() * BB.TAU;
          const d = 36 + Math.random() * 24;
          blob(w / 2 + Math.cos(a) * d, h / 2 + Math.sin(a) * d, 2 + Math.random() * 4);
        }
      }, false);
      const scorch = BB.canvasTexture(128, 128, (g, w) => {
        const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
        gr.addColorStop(0, 'rgba(255,255,255,0.95)');
        gr.addColorStop(0.5, 'rgba(255,255,255,0.6)');
        gr.addColorStop(1, 'rgba(255,255,255,0)');
        g.fillStyle = gr;
        g.fillRect(0, 0, w, w);
      }, false);
      this.decalMats = {
        blood: new T.MeshLambertMaterial({ map: splat, color: 0x6e0a0e, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3 }),
        scorch: new T.MeshLambertMaterial({ map: scorch, color: 0x0b0a0a, transparent: true, opacity: 0.85, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3 }),
        puke: new T.MeshLambertMaterial({ map: splat, color: 0x8bbf2a, emissive: 0x1a2a05, transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -3 }),
      };
      const dg = new T.PlaneGeometry(1, 1);
      dg.rotateX(-Math.PI / 2);
      this.decalGeo = dg;
      this.decals = [];
      this.decalI = 0;
      for (let i = 0; i < 80; i++) {
        const m = new T.Mesh(dg, this.decalMats.blood);
        m.visible = false;
        m.receiveShadow = true;
        m.renderOrder = 1;
        this.scene.add(m);
        this.decals.push(m);
      }
    }

    get gore() {
      return BB.settings.gore;
    }

    setScale(px) {
      this.glow.mat.uniforms.uScale.value = px;
      this.puff.mat.uniforms.uScale.value = px;
    }

    // ---------- particle presets ----------

    sparks(x, y, z, color, n, spd = 7, life = 0.35, size = 0.16) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * BB.TAU;
        const u = Math.random() * 2 - 1;
        const s = spd * (0.4 + Math.random() * 0.8);
        const h = Math.sqrt(1 - u * u);
        this.glow.spawn(x, y, z, Math.cos(a) * h * s, Math.abs(u) * s + 1.5, Math.sin(a) * h * s, life * (0.6 + Math.random() * 0.8), size, size * 0.3, color, 0xff5a1a, 1, 16, 1.5);
      }
    }

    // Streaks thrown in a direction (drift sparks, grinding).
    spray(x, y, z, vx, vy, vz, color, n, spread, life = 0.3, size = 0.14, grav = 18) {
      for (let i = 0; i < n; i++) {
        this.glow.spawn(x, y, z, vx + (Math.random() - 0.5) * spread, vy + Math.random() * spread * 0.6, vz + (Math.random() - 0.5) * spread, life * (0.6 + Math.random() * 0.8), size, size * 0.4, color, 0xff4010, 1, grav, 2);
      }
    }

    fire(x, y, z, n, size = 0.9, vx = 0, vy = 2.5, vz = 0, spread = 1.2) {
      for (let i = 0; i < n; i++) {
        this.glow.spawn(
          x + (Math.random() - 0.5) * spread * 0.4, y, z + (Math.random() - 0.5) * spread * 0.4,
          vx + (Math.random() - 0.5) * spread, vy + Math.random() * 1.5, vz + (Math.random() - 0.5) * spread,
          0.35 + Math.random() * 0.35, size * (0.6 + Math.random() * 0.5), size * 0.2, 0xffd25a, 0xc0200a, 0.9, -3, 1.2
        );
      }
    }

    smoke(x, y, z, n, dark = 0, size = 1.2, vy = 2.2) {
      const c0 = dark > 0.5 ? 0x1a1716 : dark > 0 ? 0x4a4442 : 0x8a8480;
      const c1 = dark > 0.5 ? 0x2e2a2a : 0x6a6260;
      for (let i = 0; i < n; i++) {
        this.puff.spawn(
          x + (Math.random() - 0.5) * 0.6, y, z + (Math.random() - 0.5) * 0.6,
          (Math.random() - 0.5) * 1.5, vy + Math.random(), (Math.random() - 0.5) * 1.5,
          1.0 + Math.random() * 1.2, size * 0.5, size * (1.6 + Math.random()), c0, c1, 0.55, -0.6, 0.9
        );
      }
    }

    dust(x, y, z, n, vx = 0, vz = 0, color = 0x8a7058) {
      for (let i = 0; i < n; i++) {
        this.puff.spawn(x, y, z, vx * 0.2 + (Math.random() - 0.5) * 3, 0.8 + Math.random() * 1.5, vz * 0.2 + (Math.random() - 0.5) * 3, 0.5 + Math.random() * 0.6, 0.5, 1.6, color, 0x6a5848, 0.45, 1, 2.5);
      }
    }

    blood(x, y, z, n, spd = 7, vx = 0, vy = 0, vz = 0) {
      if (!this.gore) return;
      for (let i = 0; i < n; i++) {
        const a = Math.random() * BB.TAU;
        const s = spd * (0.3 + Math.random() * 0.9);
        this.puff.spawn(x, y, z, vx + Math.cos(a) * s, vy + Math.random() * s * 0.9 + 1, vz + Math.sin(a) * s, 0.5 + Math.random() * 0.6, 0.18 + Math.random() * 0.2, 0.12, 0xa0101a, 0x5a0408, 1, 20, 0.4);
      }
    }

    pukeBurst(x, y, z, n, spd = 5) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * BB.TAU;
        const s = spd * (0.3 + Math.random() * 0.9);
        this.puff.spawn(x, y, z, Math.cos(a) * s, Math.random() * s + 2, Math.sin(a) * s, 0.5 + Math.random() * 0.5, 0.25, 0.15, 0xa4d43a, 0x6a8a1a, 1, 18, 0.5);
      }
    }

    stars(x, y, z, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * BB.TAU;
        this.glow.spawn(x, y, z, Math.cos(a) * 4, 3 + Math.random() * 4, Math.sin(a) * 4, 0.8 + Math.random() * 0.5, 0.35, 0.2, 0xffe25a, 0xffa020, 1, 6, 1.5);
      }
    }

    // ---------- mesh effects ----------

    fireball(x, y, z, size) {
      const T = THREE;
      const m = new T.Mesh(this.geo.ball, new T.MeshBasicMaterial({ color: 0xffc050, transparent: true, opacity: 1, blending: T.AdditiveBlending, depthWrite: false }));
      m.position.set(x, y, z);
      m.scale.setScalar(0.3);
      this.scene.add(m);
      this.objs.push({ kind: 'ball', m, t: 0, life: 0.38, size });
    }

    ring(x, y, z, size, color = 0xffb060) {
      const T = THREE;
      const m = new T.Mesh(this.geo.ring, new T.MeshBasicMaterial({ color, transparent: true, opacity: 0.8, blending: T.AdditiveBlending, depthWrite: false, side: T.DoubleSide }));
      m.position.set(x, y + 0.15, z);
      m.scale.setScalar(0.2);
      this.scene.add(m);
      this.objs.push({ kind: 'ring', m, t: 0, life: 0.5, size });
    }

    tracer(x1, y1, z1, x2, y2, z2, color = 0xffe08a) {
      const T = THREE;
      const g = new T.BufferGeometry().setFromPoints([new T.Vector3(x1, y1, z1), new T.Vector3(x2, y2, z2)]);
      const m = new T.Line(g, new T.LineBasicMaterial({ color, transparent: true, opacity: 1, blending: T.AdditiveBlending, depthWrite: false }));
      this.scene.add(m);
      this.objs.push({ kind: 'line', m, t: 0, life: 0.12 });
    }

    // A tumbling chunk with simple physics. gib = leaves a blood trail and a splat where it lands.
    chunk(x, y, z, vx, vy, vz, mat, sx, sy, sz, life, gib, geo) {
      const m = new THREE.Mesh(geo || this.geo.box, mat);
      m.position.set(x, y, z);
      m.scale.set(sx, sy, sz);
      m.castShadow = true;
      this.scene.add(m);
      this.objs.push({
        kind: 'chunk', m, t: 0, life, gib, vx, vy, vz, hint: -1,
        ax: (Math.random() - 0.5) * 14, ay: (Math.random() - 0.5) * 14, az: (Math.random() - 0.5) * 14,
        landed: false, sx, sy, sz,
      });
    }

    // The driver thrown from an exploding kart. Returns a handle so the kart can tidy it up.
    body(obj, vx, vy, vz, splatOnLand) {
      this.scene.add(obj);
      const o = {
        kind: 'body', m: obj, t: 0, life: 7, vx, vy, vz, hint: -1, bounces: 0, splat: splatOnLand,
        ax: (Math.random() - 0.5) * 10, ay: (Math.random() - 0.5) * 8, az: (Math.random() - 0.5) * 10,
      };
      this.objs.push(o);
      return o;
    }

    removeBody(o) {
      if (!o || o.dead) return;
      o.dead = true;
      this.scene.remove(o.m);
    }

    decal(kind, x, z, size, y) {
      const m = this.decals[this.decalI];
      this.decalI = (this.decalI + 1) % this.decals.length;
      m.material = this.decalMats[kind];
      m.position.set(x, (y == null ? this.track.groundAt(x, z) : y) + 0.05, z);
      m.rotation.y = Math.random() * BB.TAU;
      m.scale.set(size, 1, size);
      m.visible = true;
    }

    // ---------- big set pieces ----------

    explode(x, y, z, size = 1) {
      this.fireball(x, y, z, size);
      this.ring(x, this.track.groundAt(x, z), z, size);
      this.fire(x, y, z, Math.round(26 * size), 1.6 * size, 0, 4, 0, 9 * size);
      this.sparks(x, y, z, 0xffd27a, Math.round(30 * size), 14 * size, 0.6, 0.2);
      this.smoke(x, y + 0.5, z, Math.round(14 * size), 0.6, 2 * size, 3.5);
      for (let i = 0; i < Math.round(7 * size); i++) {
        const a = Math.random() * BB.TAU;
        const s = 6 + Math.random() * 9;
        const hot = Math.random() < 0.3;
        const k = 0.15 + Math.random() * 0.3;
        this.chunk(x, y + 0.3, z, Math.cos(a) * s, 6 + Math.random() * 9, Math.sin(a) * s, hot ? this.mats.hot : this.mats.debris, k, k, k * 1.6, 3, false);
      }
      this.decal('scorch', x, z, 5 * size);
      this.flash.position.set(x, y + 2, z);
      this.flash.intensity = 4 * size;
      this.flashT = 0.35;
      let d = Infinity;
      for (const v of this.game.views) d = Math.min(d, v.camera.position.distanceTo({ x, y, z }));
      this.addShake((BB.clamp(1.1 - d / 45, 0, 1) * 0.9 * size) / this.game.views.length);
    }

    // A driver coming apart. Cartoon stars instead when gore is off.
    gib(x, y, z, vx, vy, vz) {
      if (!this.gore) {
        this.stars(x, y, z, 24);
        this.smoke(x, y, z, 10, 0, 1.4);
        return;
      }
      this.blood(x, y, z, 70, 11, vx * 0.3, vy * 0.3, vz * 0.3);
      for (let i = 0; i < 11; i++) {
        const a = Math.random() * BB.TAU;
        const s = 4 + Math.random() * 8;
        const kind = Math.random();
        const mat = kind < 0.55 ? this.mats.meat : kind < 0.85 ? this.mats.pink : this.mats.bone;
        const k = 0.12 + Math.random() * 0.2;
        const geo = kind < 0.85 && Math.random() < 0.5 ? this.geo.sph : this.geo.box;
        this.chunk(x, y, z, vx * 0.3 + Math.cos(a) * s, 5 + Math.random() * 9, vz * 0.3 + Math.sin(a) * s, mat, k, k * (kind > 0.85 ? 3 : 1), k, 9, true, geo);
      }
      this.decal('blood', x, z, 4.5);
      this.decal('blood', x + (Math.random() - 0.5) * 4, z + (Math.random() - 0.5) * 4, 2.5);
    }

    // Is (x, z) within dist of the camera? Used to skip particles nobody will see.
    near(x, z, dist) {
      for (const v of this.game.views) {
        const c = v.camera.position;
        if (Math.abs(c.x - x) + Math.abs(c.z - z) < dist) return true;
      }
      return false;
    }

    addShake(a) {
      if (BB.settings.shake) this.shake = Math.min(1.5, this.shake + a);
    }

    update(dt) {
      this.glow.update(dt);
      this.puff.update(dt);
      this.shake = Math.max(0, this.shake - dt * 2.2);
      if (this.flashT > 0) {
        this.flashT -= dt;
        this.flash.intensity = Math.max(0, this.flash.intensity - dt * 14);
        if (this.flashT <= 0) this.flash.intensity = 0;
      }
      const tr = this.track;
      let n = this.objs.length;
      for (let i = 0; i < n; ) {
        const o = this.objs[i];
        o.t += dt;
        let done = o.dead || o.t >= o.life;
        if (!done) {
          if (o.kind === 'ball') {
            const k = o.t / o.life;
            o.m.scale.setScalar(0.3 + o.size * 2.3 * BB.easeOut(k));
            o.m.material.opacity = (1 - k) * (1 - k);
            o.m.material.color.setRGB(1, 0.85 - k * 0.6, 0.45 - k * 0.4);
          } else if (o.kind === 'ring') {
            const k = o.t / o.life;
            o.m.scale.setScalar(0.2 + o.size * 5.5 * BB.easeOut(k));
            o.m.material.opacity = 0.7 * (1 - k) * (1 - k);
          } else if (o.kind === 'line') {
            o.m.material.opacity = 1 - o.t / o.life;
          } else if (o.kind === 'chunk' || o.kind === 'body') {
            this.fly(o, dt, tr);
          }
        }
        if (done) {
          this.drop(o);
          this.objs[i] = this.objs[n - 1];
          n--;
          continue;
        }
        i++;
      }
      this.objs.length = n;
    }

    fly(o, dt, tr) {
      const m = o.m;
      if (!o.landed) {
        o.vy -= 26 * dt;
        m.position.x += o.vx * dt;
        m.position.y += o.vy * dt;
        m.position.z += o.vz * dt;
        m.rotation.x += o.ax * dt;
        m.rotation.y += o.ay * dt;
        m.rotation.z += o.az * dt;
        if (o.gib && this.gore && Math.random() < 0.5) {
          this.puff.spawn(m.position.x, m.position.y, m.position.z, 0, 0, 0, 0.5, 0.14, 0.08, 0x8e1418, 0x5a0408, 0.9, 8, 0.5);
        }
        const gy = tr.groundAt(m.position.x, m.position.z, o.hint);
        o.hint = tr.lastHint;
        const floor = gy + (o.kind === 'body' ? 0.3 : 0.08);
        if (m.position.y <= floor && o.vy < 0) {
          m.position.y = floor;
          if (o.kind === 'body' && o.splat && this.gore) {
            // The driver hits the ground hard enough to come apart.
            this.gib(m.position.x, m.position.y + 0.3, m.position.z, o.vx, 0, o.vz);
            this.game.audio.splat(this.game.audio.at(m.position.x, m.position.y, m.position.z));
            o.dead = true;
            this.scene.remove(m);
            return;
          }
          if (o.gib && o.bounces === undefined) {
            o.bounces = 0;
            if (Math.random() < 0.5) this.decal('blood', m.position.x, m.position.z, 0.8 + Math.random() * 0.8, gy);
          }
          o.bounces = (o.bounces || 0) + 1;
          o.vy = -o.vy * 0.35;
          o.vx *= 0.55;
          o.vz *= 0.55;
          o.ax *= 0.5;
          o.az *= 0.5;
          if (o.bounces > 3 || Math.abs(o.vy) < 1.2) {
            o.landed = true;
            if (o.kind === 'body') {
              m.rotation.x = Math.PI / 2;
              m.rotation.z = 0;
            }
          }
        }
      }
      // Sink out of sight near the end of its life.
      if (o.kind === 'chunk' && o.t > o.life - 1) {
        m.position.y -= dt * 0.4;
      }
    }

    // Take an effect out of the scene and free what only it uses (chunks and bodies share theirs).
    drop(o) {
      if (!o.dead) this.scene.remove(o.m);
      if (o.kind === 'ball' || o.kind === 'ring' || o.kind === 'line') o.m.material.dispose();
      if (o.kind === 'line') o.m.geometry.dispose();
    }

    clear() {
      this.glow.clear();
      this.puff.clear();
      for (const o of this.objs) this.drop(o);
      this.objs.length = 0;
      for (const d of this.decals) d.visible = false;
      this.shake = 0;
      this.flash.intensity = 0;
    }
  }

  BB.Effects = Effects;
})();
</script>
<script>
/* ---- js/kart.js ---- */
/* BuggyBoom — one kart: driving, drifting, jumping, walls, damage, dying and coming back.
   Directions: yaw 0 faces +z; forward = (sin yaw, cos yaw); right = (-cos yaw, sin yaw).
   Steering +1 is right, which lowers yaw. */
(function () {
  'use strict';
  const BB = window.BB;

  const DRIFT_TIERS = [0.75, 1.6, 2.6]; // seconds of drifting for yellow, orange, red sparks
  const DRIFT_BOOST = [0, 0.55, 0.95, 1.5]; // boost seconds for each tier
  const SPARK_COLORS = [0xbbbbbb, 0xffd23f, 0xff7a1a, 0xff2a6d];
  const GRAV = 30;
  BB.TRICK_TIME = 0.45; // seconds a trick takes
  BB.TRICK_LAND = 0.65; // land after this much of it and it counts

  class Kart {
    // entry: { kind: 'human' (on this computer) | 'remote' (online) | 'cpu', local, level, paint, kart, name }
    constructor(race, racer, index, entry) {
      entry = entry || { kind: 'cpu' };
      this.race = race;
      this.r = racer;
      this.name = racer.name;
      this.idx = index;
      this.kind = entry.kind;
      this.isPlayer = entry.kind === 'human'; // a player on this computer (has a camera and a HUD)
      this.human = entry.kind !== 'cpu'; // any real person, here or online
      this.remote = entry.kind === 'remote';
      this.local = entry.local || 0;
      this.level = entry.level || 'normal';
      this.pname = entry.name || '';
      this.peer = entry.peer || null;
      this.kartDef = BB.kartById(entry.kart);
      this.ph = BB.racerPhysics(racer, this.kartDef);
      this.m = BB.buildKart(racer, entry.paint || 'stock', this.kartDef.id);
      this.tricks = 0; // landed this race (for cred)
      this.shortcuts = 0; // secret shortcuts taken this race
      race.group.add(this.m.root);

      this.pos = new THREE.Vector3();
      this.yaw = 0;
      this.speed = 0;
      this.sx = 0; // sideways shove from hits and bumps
      this.sz = 0;
      this.vy = 0;
      this.onGround = true;
      this.airT = 0;
      this.st = { sc: null, hint: -1, sh: -1 }; // which road we're on (main or a shortcut)
      this.info = {};
      this.tyaw = 0; // direction of travel; lags behind the nose on blood slicks
      this.canTrick = false;
      this.launchVy = 0;
      this.trick = null;
      this.spinHitT = 0;
      this.geyserCycle = -1;
      this.sludge = false;
      this.offroad = false;
      this.speedMul = 1;

      this.hp = this.ph.hp;
      this.dead = false;
      this.deadT = 0;
      this.invT = 0;
      this.spinT = 0;
      this.spinA = 0;
      this.stall = 0;
      this.boostT = 0;
      this.boostPow = 0;
      this.drift = 0;
      this.charge = 0;
      this.tier = 0;
      this.driftVis = 0;
      this.driftAmt = 0; // 0 to 1: how far into the drift (it eases in and out)
      this.driftDir = 0; // which way the current or last drift went
      this.driftLook = 0; // the same easing, for how the kart looks
      this.airGrip = 1; // steering grip, eased between ground (1) and air (0.35)
      this.steerVis = 0;
      this.pitch = 0;
      this.squash = 0;
      this.wheelSpin = 0;
      this.wallT = 0;
      this.padT = 0;

      this.item = null;
      this.itemAge = 0;
      this.rollT = 0;
      this.rollItem = null;
      this.useCD = 0;
      this.flameT = 0;
      this.burnT = 0;
      this.burnBy = null;
      this.grinderT = 0;
      this.grindCD = 0;
      this.blades = null;

      this.raceDist = 0;
      this.lastS = 0;
      this.lap = 0;
      this.lapStart = 0;
      this.lapTimes = [];
      this.bestLap = Infinity;
      this.finished = false;
      this.finishTime = 0;
      this.rank = index;
      this.kills = 0;
      this.deaths = 0;
      this.streak = 0;
      this.lastHitBy = null;
      this.lastHitT = -99;
      this.wrongT = 0;
      this.corpse = null;
      this.ai = null;
      this.tag = null;
    }

    get fx() {
      return this.race.fx;
    }

    get maxHp() {
      return this.ph.hp;
    }

    get hint() {
      return this.st.hint;
    }

    // Seconds until we come down, if the ground stays at the height it is under us now.
    airLeft() {
      if (this.onGround) return 0;
      const h = Math.max(0, this.pos.y - (this.info.y || 0));
      return (this.vy + Math.sqrt(this.vy * this.vy + 2 * GRAV * h)) / GRAV;
    }

    // Thrown into the air by a geyser or similar. Tricks allowed.
    launch(vy) {
      this.vy = vy;
      this.launchVy = vy;
      this.onGround = false;
      this.canTrick = true;
      this.endDrift(false);
    }

    // Put the kart at distance s along the track, d metres to the right of the centre line.
    place(s, d) {
      const tr = this.race.track;
      const p = tr.sampleAt(s, {});
      this.pos.set(p.x + p.rx * d, p.y, p.z + p.rz * d);
      this.yaw = this.tyaw = Math.atan2(p.tx, p.tz);
      this.st.sc = null;
      this.st.hint = -1;
      this.st.sh = -1;
      tr.probe(this.pos.x, this.pos.z, this.st, this.info);
      this.pos.y = this.info.y;
      this.lastS = this.info.s;
      this.speed = 0;
      this.sx = this.sz = this.vy = 0;
      this.onGround = true;
      this.trick = null;
      this.canTrick = false;
      this.driftAmt = this.driftLook = this.driftVis = 0;
      this.airGrip = 1;
      this.visual(0, 0);
    }

    boost(t, pow) {
      if (this.boostT <= 0) this.boostPow = pow;
      else this.boostPow = Math.max(this.boostPow, pow);
      this.boostT = Math.max(this.boostT, t);
      if (this.isPlayer && this.local === 0) this.race.audio.boost(pow);
    }

    endDrift(release) {
      if (!this.drift) return;
      if (release && this.tier > 0) this.boost(DRIFT_BOOST[this.tier], 0.55 + this.tier * 0.2);
      this.drift = 0;
      this.charge = 0;
      this.tier = 0;
    }

    update(dt, c) {
      const tr = this.race.track;
      if (this.dead) {
        this.updateDead(dt);
        return;
      }
      this.boostT = Math.max(0, this.boostT - dt);
      this.spinT = Math.max(0, this.spinT - dt);
      this.invT = Math.max(0, this.invT - dt);
      this.useCD = Math.max(0, this.useCD - dt);
      this.stall = Math.max(0, this.stall - dt);
      this.grindCD = Math.max(0, this.grindCD - dt);
      this.padT = Math.max(0, this.padT - dt);
      this.spinHitT = Math.max(0, this.spinHitT - dt);
      if (this.item) this.itemAge += dt;
      if (this.grinderT > 0) this.grinderT = Math.max(0, this.grinderT - dt);
      if (this.burnT > 0) {
        this.burnT -= dt;
        this.damage(12 * dt, this.burnBy, 'flame', { quiet: true });
        if (this.dead) return;
      }

      let thr = c.throttle;
      let steer = c.steer;
      if (this.spinT > 0 || this.stall > 0) {
        thr = 0;
        steer = 0;
      }
      const ph = this.ph;
      const base = ph.top * this.speedMul;
      let top = base;
      if (this.grinderT > 0) top *= 1.12;
      if ((this.offroad || this.sludge) && this.boostT <= 0 && this.grinderT <= 0) top *= this.sludge ? 0.55 : 0.5;
      const boosting = this.boostT > 0;
      if (boosting) top = base + 9 * this.boostPow;

      // ---- speed ----
      if (this.onGround) {
        if (this.spinT > 0) this.speed = BB.approach(this.speed, 0, 26 * dt);
        else if (boosting) this.speed = this.speed < top ? Math.min(top, this.speed + 42 * dt) : BB.approach(this.speed, top, 8 * dt);
        else if (thr > 0.05) {
          if (this.speed < 0) this.speed += 32 * dt * thr;
          else if (this.speed < top) {
            const f = this.speed / top;
            this.speed = Math.min(top, this.speed + ph.accel * thr * (1 - f * f) * dt + 0.4 * dt);
          } else this.speed = BB.approach(this.speed, top, 14 * dt);
        } else if (thr < -0.05) {
          if (this.speed > 0.5) this.speed -= 34 * dt * -thr;
          else this.speed = BB.approach(this.speed, -9, 12 * dt * -thr);
        } else this.speed = BB.approach(this.speed, 0, (this.offroad || this.sludge ? 10 : 4.5) * dt);
      }

      // ---- drift: hop, then hold and steer ----
      if (c.driftHit && this.onGround && !this.drift && this.speed > 9 && this.spinT <= 0) {
        this.vy = 4.6;
        this.onGround = false;
        this.canTrick = false;
        this.squash = -0.12;
        if (this.isPlayer) this.race.audio.hop();
      }
      if (this.drift) {
        if (!c.drift || this.speed < 7 || this.spinT > 0) this.endDrift(true);
        else {
          this.charge += dt * (0.8 + 0.6 * BB.clamp(steer * this.drift, 0, 1));
          let t = 0;
          while (t < 3 && this.charge >= DRIFT_TIERS[t]) t++;
          if (t > this.tier && this.isPlayer) this.race.audio.tick();
          this.tier = t;
        }
      } else if (c.drift && this.onGround && this.speed > 10 && Math.abs(steer) > 0.35 && this.spinT <= 0) {
        this.drift = Math.sign(steer);
        this.charge = 0;
        this.tier = 0;
      }

      // ---- air tricks: tap drift in the air off a jump, land it for a boost ----
      if (!this.onGround && c.driftHit && this.canTrick && !this.trick && (this.launchVy > 2.5 || this.airT > 0.22) && this.spinT <= 0) {
        this.trick = { t: 0, dur: BB.TRICK_TIME, kind: (Math.random() * 3) | 0 };
        if (this.isPlayer) this.race.audio.trick();
      }
      if (this.trick) this.trick.t += dt;

      // ---- steering ----
      // A drift eases in over about a third of a second (and out a little quicker), so the kart
      // swings into the slide instead of snapping sideways. Grip eases back after a hop or jump too.
      const spd = Math.abs(this.speed);
      const grip = BB.clamp(spd / 6, 0, 1) * (1 - 0.18 * BB.clamp((spd - 22) / 15, 0, 1));
      if (this.drift) this.driftDir = this.drift;
      this.driftAmt = BB.approach(this.driftAmt, this.drift ? 1 : 0, (this.drift ? 3 : 5) * dt);
      const da = BB.smoothstep(0, 1, this.driftAmt);
      let turn = steer * ph.turn * grip * (this.speed < -0.5 ? -1 : 1);
      if (da > 0 && this.driftDir) {
        const into = steer * this.driftDir;
        turn = BB.lerp(turn, this.driftDir * ph.turn * BB.lerp(0.16, 1.2, (into + 1) / 2), da);
      }
      this.airGrip = BB.approach(this.airGrip, this.onGround ? 1 : 0.35, (this.onGround ? 4 : 12) * dt);
      turn *= this.airGrip;
      if (this.spinT <= 0) this.yaw -= turn * dt;
      this.steerVis = BB.damp(this.steerVis, steer, 12, dt);

      // ---- move (on a blood slick the kart keeps sliding the way it was going) ----
      const fx = Math.sin(this.yaw);
      const fz = Math.cos(this.yaw);
      const slick = this.info.zone === 'slick' && this.onGround;
      this.tyaw = BB.lerpAngle(this.tyaw, this.yaw, 1 - Math.exp(-(slick ? 1.3 : 25) * dt));
      let vx = Math.sin(this.tyaw) * this.speed + this.sx;
      let vz = Math.cos(this.tyaw) * this.speed + this.sz;
      if (da > 0 && this.driftDir) {
        const slide = -this.driftDir * this.speed * 0.06 * da;
        vx += -fz * slide;
        vz += fx * slide;
      }
      this.pos.x += vx * dt;
      this.pos.z += vz * dt;
      const kd = Math.exp(-3.5 * dt);
      this.sx *= kd;
      this.sz *= kd;

      // ---- where on the track (main road or a shortcut) ----
      const inf = tr.probe(this.pos.x, this.pos.z, this.st, this.info);
      this.offroad = !!inf.offroad;
      this.sludge = inf.zone === 'sludge';
      this.wallT = Math.max(0, this.wallT - dt);
      if (inf.d > inf.limR) this.hitWall(inf, 1, inf.d - inf.limR);
      else if (inf.d < -inf.limL) this.hitWall(inf, -1, -inf.limL - inf.d);

      if (this.onGround && this.padT <= 0 && tr.onPad(inf)) {
        this.boost(1.1, 1);
        this.padT = 0.4;
      }

      // ---- up and down: follow the road, fly off the jump ----
      const gy = inf.y;
      if (this.onGround) {
        const gv = (gy - this.pos.y) / Math.max(dt, 1e-3);
        // The road drops away faster than gravity can pull us down: we're flying.
        // (Only at speed; creeping over a lump shouldn't count as a jump.)
        const crest = Math.abs(this.speed) > 8 && gv < this.vy - GRAV * dt * 1.3 && this.pos.y - gy > 0.02;
        if (gy < this.pos.y - 0.35 || crest) {
          this.onGround = false;
          this.canTrick = true;
          this.launchVy = this.vy;
        } else {
          this.vy = BB.clamp(gv, -25, 25);
          this.pos.y = gy;
        }
      }
      if (!this.onGround) {
        this.vy -= GRAV * dt;
        this.pos.y += this.vy * dt;
        this.airT += dt;
        if (this.pos.y <= gy) {
          const impact = -this.vy;
          this.pos.y = gy;
          this.onGround = true;
          this.vy = 0;
          this.airT = 0;
          this.land(impact);
          this.landTrick();
        }
      } else this.airT = 0;

      // Wrong way?
      const along = fx * inf.tx + fz * inf.tz;
      if (along < -0.35 && this.speed > 4) this.wrongT += dt;
      else this.wrongT = 0;
    }

    // sg: which side we hit (+1 right, -1 left); over: how far through the wall we went.
    hitWall(inf, sg, over) {
      this.pos.x -= inf.rx * sg * over;
      this.pos.z -= inf.rz * sg * over;
      const sd = (this.sx * inf.rx + this.sz * inf.rz) * sg;
      if (sd > 0) {
        this.sx -= inf.rx * sg * sd * 1.6;
        this.sz -= inf.rz * sg * sd * 1.6;
      }
      if (this.speed <= 0.5) return;
      const fx = Math.sin(this.yaw);
      const fz = Math.cos(this.yaw);
      const into = (fx * inf.rx + fz * inf.rz) * sg;
      if (into <= 0.02) return;
      const dir = fx * inf.tx + fz * inf.tz >= 0 ? 1 : -1;
      const along = Math.atan2(inf.tx * dir, inf.tz * dir);
      const audio = this.race.audio;
      const wx = this.pos.x + inf.rx * sg * 0.9;
      const wz = this.pos.z + inf.rz * sg * 0.9;
      if (into > 0.6 && this.speed > 17) {
        // Head-on: bounce back hard.
        this.speed *= -0.25;
        this.yaw = BB.lerpAngle(this.yaw, along, 0.35);
        this.sx -= inf.rx * sg * 7;
        this.sz -= inf.rz * sg * 7;
        this.endDrift(false);
        this.fx.sparks(wx, this.pos.y + 0.6, wz, 0xffe0a0, 22, 9);
        audio.bump(this.isPlayer ? 1 : audio.at(wx, this.pos.y, wz));
        if (this.isPlayer) this.fx.addShake(0.35);
        this.damage(6, null, 'wall', { quiet: true });
      } else {
        this.yaw = BB.lerpAngle(this.yaw, along, BB.clamp(into * 1.2, 0.15, 0.6));
        this.speed *= 1 - 0.45 * into;
        if (this.speed > 8) {
          this.fx.spray(wx, this.pos.y + 0.4, wz, -Math.sin(this.yaw) * 4, 2, -Math.cos(this.yaw) * 4, 0xffe0a0, 3, 4);
          if (this.wallT <= 0) {
            audio.scrape(this.isPlayer ? 1 : audio.at(wx, this.pos.y, wz) * 0.6);
            this.wallT = 0.12;
          }
        }
      }
    }

    landTrick() {
      const t = this.trick;
      this.canTrick = false;
      if (!t) return;
      this.trick = null;
      if (t.t >= t.dur * BB.TRICK_LAND) {
        this.boost(0.9, 0.9);
        this.race.onTrick(this, true);
      } else {
        this.spinOut(1.1);
        this.damage(8, null, 'bail', { quiet: true });
        this.race.onTrick(this, false);
      }
    }

    land(impact) {
      if (impact > 7) {
        this.squash = BB.clamp(impact / 40, 0.08, 0.3);
        this.fx.dust(this.pos.x, this.pos.y + 0.2, this.pos.z, Math.round(impact / 2), 0, 0);
        if (this.isPlayer) {
          this.race.audio.land(BB.clamp(impact / 20, 0.2, 1));
          this.fx.addShake(BB.clamp(impact / 60, 0, 0.3));
        }
      }
    }

    spinOut(t) {
      if (this.puppet) return; // online: another computer decides
      if (this.remote && this.race.net) return this.race.net.forwardHit(this, 0, null, 'spin', { spin: t, quiet: true });
      if (this.grinderT > 0 || this.invT > 0 || this.dead) return;
      this.spinT = Math.max(this.spinT, t);
      this.speed *= 0.35;
      this.endDrift(false);
    }

    // Returns true if the hit landed. opt: spin (seconds), kx/kz (shove), vy (pop up), quiet.
    damage(amount, by, cause, opt) {
      opt = opt || {};
      if (this.puppet) return false; // online: the host decides, the owner applies it
      if (this.dead || this.finished) return false;
      if (this.invT > 0 || this.grinderT > 0) return false;
      if (this.remote && this.race.net) {
        // Someone online drives this kart: send the hit to their computer.
        this.race.net.forwardHit(this, amount, by, cause, opt);
        if (!opt.quiet) this.fx.blood(this.pos.x, this.pos.y + 1.3, this.pos.z, Math.round(BB.clamp(amount / 3, 3, 16)), 5);
        return true;
      }
      if (opt.burn) {
        this.burnT = Math.max(this.burnT, opt.burn);
        this.burnBy = by;
      }
      this.hp -= amount;
      if (by && by !== this) {
        this.lastHitBy = by;
        this.lastHitT = this.race.time;
      }
      if (opt.spin) this.spinOut(opt.spin);
      if (opt.kx) {
        this.sx += opt.kx;
        this.sz += opt.kz;
      }
      if (opt.vy) {
        this.vy = Math.max(this.vy, opt.vy);
        this.onGround = false;
        this.canTrick = false;
      }
      if (!opt.quiet) {
        this.endDrift(false);
        this.fx.blood(this.pos.x, this.pos.y + 1.3, this.pos.z, Math.round(BB.clamp(amount / 3, 3, 16)), 5);
      }
      this.race.onHurt(this, amount, by, cause, opt);
      if (this.hp <= 0) this.die(by, cause);
      return true;
    }

    die(by, cause) {
      if (this.dead) return;
      const fx = this.fx;
      const audio = this.race.audio;
      this.dead = true;
      this.deadT = 2.8;
      this.hp = 0;
      this.deaths++;
      this.streak = 0;
      let killer = by && by !== this ? by : null;
      if (!killer && this.lastHitBy && this.race.time - this.lastHitT < 5 && this.lastHitBy !== this) killer = this.lastHitBy;
      this.endDrift(false);
      this.item = null;
      this.rollT = 0;
      this.boostT = this.flameT = this.burnT = this.grinderT = 0;
      this.spinT = 0;
      this.trick = null;
      if (this.blades) this.blades.visible = false;

      const p = this.pos;
      fx.explode(p.x, p.y + 0.7, p.z, 1.3);
      audio.explosion(this.isPlayer ? 1 : audio.at(p.x, p.y, p.z), 1.2);

      // The driver goes flying.
      const d = this.m.driver;
      this.m.root.updateMatrixWorld(true);
      const body = d.clone();
      d.matrixWorld.decompose(body.position, body.quaternion, body.scale);
      d.visible = false;
      const fwdx = Math.sin(this.yaw);
      const fwdz = Math.cos(this.yaw);
      const s = Math.max(0, this.speed) * 0.5;
      this.corpse = fx.body(body, fwdx * s + BB.rand(-4, 4), BB.rand(13, 17), fwdz * s + BB.rand(-4, 4), true);
      if (!fx.gore) this.corpse.splat = false;

      // The wreck pops up, burnt black.
      this.vy = 9;
      this.onGround = false;
      this.wreckSpin = BB.rand(-5, 5);
      this.wreckRoll = 0;
      this.char(true);
      this.speed *= 0.35;
      this.race.onKill(killer, this, cause);
    }

    char(on) {
      const m = this.m;
      if (on) {
        m.paint.color.set(0x1b1512);
        m.trim.color.set(0x2a2220);
      } else {
        m.paint.color.copy(m.paintColor);
        m.trim.color.copy(m.trimColor);
      }
    }

    updateDead(dt) {
      const tr = this.race.track;
      this.deadT -= dt;
      const fx = Math.sin(this.yaw);
      const fz = Math.cos(this.yaw);
      this.speed = BB.approach(this.speed, 0, 12 * dt);
      this.pos.x += (fx * this.speed + this.sx) * dt;
      this.pos.z += (fz * this.speed + this.sz) * dt;
      this.sx *= Math.exp(-3 * dt);
      this.sz *= Math.exp(-3 * dt);
      const inf = tr.probe(this.pos.x, this.pos.z, this.st, this.info);
      const over = tr.overWall(inf);
      if (over) {
        this.pos.x -= inf.rx * over;
        this.pos.z -= inf.rz * over;
      }
      if (!this.onGround) {
        this.vy -= GRAV * dt;
        this.pos.y += this.vy * dt;
        this.wreckRoll += this.wreckSpin * dt;
        if (this.pos.y <= inf.y) {
          this.pos.y = inf.y;
          if (this.vy < -6) {
            this.vy = -this.vy * 0.3;
            this.wreckSpin *= 0.5;
          } else {
            this.onGround = true;
            this.vy = 0;
          }
        }
      } else this.pos.y = inf.y;
      if (Math.random() < 0.6) this.fx.smoke(this.pos.x, this.pos.y + 0.8, this.pos.z, 1, 1, 1.4);
      if (Math.random() < 0.5) this.fx.fire(this.pos.x, this.pos.y + 0.6, this.pos.z, 1, 0.9);
      if (this.deadT <= 0) this.respawn();
    }

    // Undo the wreck look: after a respawn, and online when a kart someone else drives comes back.
    revive() {
      this.dead = false;
      this.wreckRoll = 0;
      this.char(false);
      this.m.driver.visible = true;
      if (this.corpse) this.fx.removeBody(this.corpse);
      this.corpse = null;
      this.fx.smoke(this.pos.x, this.pos.y + 0.5, this.pos.z, 8, 0, 1.5);
    }

    // Back on the track a little behind where we died, briefly untouchable.
    respawn(back = 12) {
      const tr = this.race.track;
      const oldS = this.lastS;
      const s = tr.wrapS(this.info.s - back);
      const d = BB.clamp(this.info.d * 0.3, -5, 5);
      this.place(s, d);
      this.raceDist += tr.delta(this.lastS - oldS);
      this.hp = this.maxHp;
      this.invT = 2.2;
      this.spinT = 0;
      this.speed = 10;
      this.revive();
    }

    // ---------- looks ----------

    visual(dt, time) {
      const m = this.m;
      const tr = this.race.track;
      m.root.position.copy(this.pos);
      if (this.dead) {
        m.root.rotation.set(this.wreckRoll * 0.6, this.yaw, this.wreckRoll);
        m.root.visible = true;
        if (this.tag) this.tag.visible = false;
        return;
      }
      // Pitch to the slope of the road, or to the flight path in the air.
      const fx = Math.sin(this.yaw);
      const fz = Math.cos(this.yaw);
      const inf = this.info;
      let target = 0;
      if (this.onGround && inf.s != null) {
        const dir = fx * inf.tx + fz * inf.tz >= 0 ? 1 : -1;
        const a = tr.ahead(inf, 1.6 * dir, 0, this._pa || (this._pa = {})).y;
        const b = tr.ahead(inf, -1.6 * dir, 0, this._pb || (this._pb = {})).y;
        target = -Math.atan((a - b) / 3.2);
      } else if (!this.onGround) target = -Math.atan2(this.vy, Math.max(8, Math.abs(this.speed))) * 0.7;
      this.pitch = dt > 0 ? BB.damp(this.pitch, target, 12, dt) : target;
      const roll = this.drift * 0.07 + this.steerVis * 0.03;
      m.root.rotation.set(this.pitch, this.yaw, roll);

      // The body swings into the drift as it eases in (online karts use this too).
      if (this.drift) this.driftDir = this.drift;
      this.driftLook = BB.approach(this.driftLook, this.drift ? 1 : 0, (this.drift ? 2.5 : 4.5) * dt);
      this.driftVis = BB.damp(this.driftVis, -(this.driftDir || 0) * 0.42 * BB.smoothstep(0, 1, this.driftLook), 8, dt);
      if (this.spinT > 0) this.spinA += dt * 15;
      else this.spinA = BB.damp(this.spinA, Math.round(this.spinA / BB.TAU) * BB.TAU, 8, dt);
      m.body.rotation.y = this.driftVis + this.spinA;
      // Tricks spin the whole kart around its middle: barrel roll, backflip or a flat 360.
      const tk = this.trick;
      const tp = tk ? BB.smoothstep(0, tk.dur, tk.t) * BB.TAU : 0;
      m.pivot.rotation.set(tk && tk.kind === 1 ? -tp : 0, tk && tk.kind === 2 ? tp : 0, tk && tk.kind === 0 ? tp : 0);
      this.squash = BB.damp(this.squash, 0, 9, dt);
      m.body.scale.set(1 + this.squash * 0.5, 1 - this.squash, 1 + this.squash * 0.5);

      this.wheelSpin += (this.speed * dt) / 0.4;
      for (const w of m.wheels) {
        w.spin.rotation.x = this.wheelSpin * (0.4 / w.rad);
        if (w.front) w.steer.rotation.y = -this.steerVis * 0.45;
      }
      m.driver.rotation.z = this.steerVis * 0.18;

      m.root.visible = !(this.invT > 0 && Math.floor(time * 14) % 2 === 0);

      if (this.blades) {
        this.blades.visible = this.grinderT > 0;
        this.blades.rotation.y += dt * 18;
      }

      // Only bother with particles near the camera.
      if (dt <= 0 || !this.fx.near(this.pos.x, this.pos.z, 140)) return;
      const fxs = this.fx;
      const yaw = this.yaw + this.driftVis;
      const sy = Math.sin(yaw);
      const cy = Math.cos(yaw);
      const wp = (lx, ly, lz, out) => {
        out.x = this.pos.x + cy * lx + sy * lz;
        out.y = this.pos.y + ly;
        out.z = this.pos.z - sy * lx + cy * lz;
        return out;
      };
      const p = (this._wp = this._wp || {});

      if (this.drift && this.onGround) {
        const col = SPARK_COLORS[this.tier];
        for (const sd of [-1, 1]) {
          wp(sd * 0.92, 0.1, -1.0, p);
          if (this.tier === 0) fxs.dust(p.x, p.y, p.z, BB.count(14, dt), 0, 0, 0x9a8a7a);
          else fxs.spray(p.x, p.y + 0.1, p.z, -sy * 3 + this.drift * cy * 3, 2.5, -cy * 3 - this.drift * sy * 3, col, BB.count(40 + this.tier * 20, dt), 4, 0.25, 0.13 + this.tier * 0.02);
        }
      }
      if (this.boostT > 0 || this.grinderT > 0) {
        for (const e of m.exhausts) {
          wp(e.x, e.y, e.z, p);
          for (let k = BB.count(70, dt); k > 0; k--) {
            fxs.glow.spawn(p.x, p.y, p.z, -sy * 9 + (Math.random() - 0.5) * 2, 0.6 + Math.random(), -cy * 9 + (Math.random() - 0.5) * 2, 0.16 + Math.random() * 0.1, 0.55, 0.15, 0x9ad8ff, 0xff6a1a, 1, -2, 1);
          }
        }
      }
      if (this.offroad && Math.abs(this.speed) > 8 && this.onGround) {
        wp(0, 0.2, -1.1, p);
        fxs.dust(p.x, p.y, p.z, BB.count(18, dt), -sy * this.speed, -cy * this.speed);
      }
      if ((this.sludge || this.info.zone === 'slick') && Math.abs(this.speed) > 5 && this.onGround) {
        const sl = this.sludge;
        for (const sd of [-1, 1]) {
          wp(sd * 0.9, 0.15, -1.0, p);
          for (let k = BB.count(30, dt); k > 0; k--) {
            fxs.puff.spawn(p.x, p.y, p.z, (Math.random() - 0.5) * 3 + sd * 2 * cy, 2 + Math.random() * 3, (Math.random() - 0.5) * 3 - sd * 2 * sy, 0.45, 0.22, 0.12, sl ? 0x8ab83a : 0x8a0c12, sl ? 0x4a6a1a : 0x4a0408, 0.95, 16, 0.6);
          }
        }
      }
      const hpf = this.hp / this.maxHp;
      if (hpf < 0.5) {
        wp(0, 1.1, -1.1, p);
        fxs.smoke(p.x, p.y, p.z, BB.count(hpf < 0.25 ? 14 : 6, dt), hpf < 0.25 ? 1 : 0.3, 0.8, 1.5);
