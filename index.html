        if (hpf < 0.25) fxs.fire(p.x, p.y, p.z, BB.count(16, dt), 0.6);
      }
      if (this.burnT > 0) fxs.fire(this.pos.x, this.pos.y + 1, this.pos.z, BB.count(40, dt), 0.9, 0, 2.5, 0, 1.6);
      if (this.stall > 0) fxs.smoke(this.pos.x, this.pos.y + 1.1, this.pos.z, BB.count(20, dt), 0.6, 1);
    }

    dispose() {
      this.race.group.remove(this.m.root);
      if (this.corpse) this.fx.removeBody(this.corpse);
    }
  }

  BB.Kart = Kart;
})();
</script>
<script>
/* ---- js/items.js ---- */
/* BuggyBoom — item crates and every weapon: rockets, nail bombs, puke, buzzsaws, the sawed-off,
   the flamethrower, nitro, drone strikes and the meat grinder. */
(function () {
  'use strict';
  const BB = window.BB;

  BB.ITEMS = {
    rocket: { name: 'Rusty Rocket', icon: '🚀', uses: 1, kind: 'rocket', tip: 'Homes in on the kart ahead.' },
    rocket3: { name: 'Rocket Party', icon: '🚀', uses: 3, kind: 'rocket', tip: 'Three homing rockets.' },
    mine: { name: 'Nail Bomb', icon: '💣', uses: 1, kind: 'mine', tip: 'Drop it. Wait for screaming.' },
    puke: { name: 'Puke Puddle', icon: '🤮', uses: 1, kind: 'puke', tip: 'Anyone who drives through it spins out.' },
    saw: { name: 'Buzzsaw', icon: '🪚', uses: 1, kind: 'saw', tip: 'Rolls ahead, bounces off walls, cuts two karts.' },
    shotgun: { name: 'Sawed-Off', icon: '💥', uses: 2, kind: 'shotgun', tip: 'Two blasts. Get close.' },
    flame: { name: 'Flamethrower', icon: '🔥', uses: 1, kind: 'flame', tip: 'Roasts everything in front of you.' },
    nitro: { name: 'Nitro', icon: '⚡', uses: 1, kind: 'nitro', tip: 'Go faster. Think later.' },
    nitro3: { name: 'Triple Nitro', icon: '⚡', uses: 3, kind: 'nitro', tip: 'Three boosts.' },
    drone: { name: 'Drone Strike', icon: '🎯', uses: 1, kind: 'drone', tip: 'Blows up whoever is in 1st.' },
    grinder: { name: 'Meat Grinder', icon: '🥩', uses: 1, kind: 'grinder', tip: "Spinning blades. You can't be hurt." },
  };
  BB.ITEM_IDS = Object.keys(BB.ITEMS);

  // Better items for the karts at the back. p: 0 = leading, 1 = last.
  function weights(p, droneOut) {
    return {
      mine: 28 * (1 - p) + 6,
      puke: 24 * (1 - p) + 5,
      shotgun: 14,
      rocket: 18 + 4 * p,
      saw: 12,
      flame: 6 + 10 * p,
      rocket3: 26 * p * p,
      nitro: 8 + 14 * p,
      nitro3: 22 * p * p,
      drone: p > 0.4 && !droneOut ? 14 * p * p : 0,
      grinder: p > 0.5 ? 14 * p * p : 0,
    };
  }

  BB.rollItem = (rank, n, droneOut) => {
    const p = n > 1 ? rank / (n - 1) : 0;
    const w = weights(p, droneOut);
    let sum = 0;
    for (const k in w) sum += w[k];
    let r = Math.random() * sum;
    for (const k in w) {
      r -= w[k];
      if (r <= 0) return k;
    }
    return 'rocket';
  };

  const KILL_VERBS = {
    rocket: ['blew up', 'launched', 'turned into confetti', 'rocketed'],
    mine: ['nail-bombed', 'shrapnelled', 'perforated'],
    saw: ['sliced', 'julienned', 'sawed in half'],
    shotgun: ['blasted', 'ventilated', 'double-barreled'],
    flame: ['roasted', 'cremated', 'flame-broiled'],
    drone: ['drone-struck', 'erased'],
    grinder: ['ground up', 'turned into sausage', 'mulched'],
    ram: ['flattened'],
    blast: ['blew up'],
  };
  const SELF_DEATHS = {
    wall: ['ate a wall', 'kissed the concrete', 'forgot how steering works'],
    flame: ['burned to death', 'got crispy'],
    geyser: ['got cooked by a methane geyser', 'rode a fart volcano'],
    spinner: ['got swatted by a carnival ride', 'lost to the Tilt-A-Hurl'],
    propane: ["found out about propane", 'got propane\'d'],
    bail: ['bailed a trick and died', 'landed on their face'],
    default: ['exploded for no reason', 'just died'],
  };
  BB.killVerb = (cause) => BB.pick(KILL_VERBS[cause] || KILL_VERBS.blast);
  BB.selfDeath = (cause) => BB.pick(SELF_DEATHS[cause] || SELF_DEATHS.default);

  // Which road a kart is on (main or a shortcut), for something it fires or drops to start on.
  const roadOf = (k) => ({ sc: k.st.sc, hint: k.st.hint, sh: k.st.sh });

  // A crate bobbing and turning.
  const spinCrate = (c, time) => {
    c.m.rotation.set(time * 0.7 + c.ph, time * 1.3 + c.ph, 0);
    c.m.position.y = c.y + Math.sin(time * 2.4 + c.ph) * 0.18;
  };

  let crateTex = null;
  function crateTexture() {
    if (crateTex) return crateTex;
    crateTex = BB.canvasTexture(128, 128, (g, w, h) => {
      g.fillStyle = '#f2c414';
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#141414';
      for (let x = -h; x < w; x += 22) {
        g.save();
        g.beginPath();
        g.rect(0, 0, w, 14);
        g.rect(0, h - 14, w, 14);
        g.clip();
        g.beginPath();
        g.moveTo(x, 0);
        g.lineTo(x + 11, 0);
        g.lineTo(x + 11 + h, h);
        g.lineTo(x + h, h);
        g.fill();
        g.restore();
      }
      g.strokeStyle = '#141414';
      g.lineWidth = 6;
      g.strokeRect(3, 3, w - 6, h - 6);
      g.font = 'bold 84px Impact, "Arial Black", sans-serif';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillStyle = '#141414';
      g.fillText('?', w / 2 + 3, h / 2 + 5);
      g.fillStyle = '#d8262a';
      g.fillText('?', w / 2, h / 2 + 2);
    }, false);
    return crateTex;
  }

  class ItemSystem {
    constructor(race) {
      const T = THREE;
      this.race = race;
      this.game = race.game;
      this.track = race.track;
      this.fx = race.fx;
      this.audio = race.audio;
      this.group = new T.Group();
      race.group.add(this.group);
      this.crates = [];
      this.shots = [];
      this.hazards = [];
      this.drones = [];
      this.droneOut = false;
      this.nextId = 1; // every shot, bomb and drone gets an id (online, the host sends them by id)
      this.buildMeshes();
      if (!race.trial) this.buildCrates(); // time trials: no crates, just three nitros
    }

    buildMeshes() {
      const T = THREE;
      const S = BB.sharedMats();
      const G = S.geo;
      this.crateMat = new T.MeshLambertMaterial({ map: crateTexture(), emissive: 0x3a2a00 });
      this.crateGeo = new T.BoxGeometry(1.4, 1.4, 1.4);
      const part = BB.part;

      // Rocket, nose toward +z.
      const rk = new T.Group();
      rk.add(part(G.cyl8, S.metal, 0, 0, 0, 0.14, 1.0, 0.14, Math.PI / 2, 0, 0));
      rk.add(part(G.cone, S.red, 0, 0, 0.65, 0.14, 0.3, 0.14, Math.PI / 2, 0, 0));
      for (let k = 0; k < 4; k++) rk.add(part(G.box, S.red, Math.cos((k * Math.PI) / 2) * 0.16, Math.sin((k * Math.PI) / 2) * 0.16, -0.4, 0.04 + Math.abs(Math.sin((k * Math.PI) / 2)) * 0.18, 0.04 + Math.abs(Math.cos((k * Math.PI) / 2)) * 0.18, 0.3));
      this.rocketProto = rk;

      // Buzzsaw: a disc with teeth, standing up like a wheel.
      const saw = new T.Group();
      const disc = new T.Group();
      disc.add(part(G.cyl, S.chrome, 0, 0, 0, 0.62, 0.06, 0.62, 0, 0, Math.PI / 2));
      for (let k = 0; k < 12; k++) {
        const a = (k / 12) * BB.TAU;
        const t = part(G.box, S.chrome, 0, Math.cos(a) * 0.66, Math.sin(a) * 0.66, 0.05, 0.16, 0.16);
        t.rotation.x = a;
        disc.add(t);
      }
      disc.add(part(G.cyl8, S.dark, 0, 0, 0, 0.14, 0.1, 0.14, 0, 0, Math.PI / 2));
      saw.add(disc);
      this.sawProto = saw;

      // Nail bomb: a black ball full of nails, with a blinking light.
      const mine = new T.Group();
      mine.add(part(G.sph, S.black, 0, 0.38, 0, 0.38, 0.38, 0.38));
      for (let k = 0; k < 14; k++) {
        const a = Math.random() * BB.TAU;
        const u = Math.random() * 1.6 - 0.3;
        const h = Math.sqrt(Math.max(0, 1 - u * u));
        const n = part(G.cyl8, S.chrome, Math.cos(a) * h * 0.42, 0.38 + u * 0.42, Math.sin(a) * h * 0.42, 0.025, 0.28, 0.025);
        n.lookAt(new T.Vector3(Math.cos(a) * h * 2, 0.38 + u * 2, Math.sin(a) * h * 2));
        n.rotateX(Math.PI / 2);
        mine.add(n);
      }
      this.mineLight = new T.MeshBasicMaterial({ color: 0xff2020 });
      mine.add(part(G.sph, this.mineLight, 0, 0.8, 0, 0.08, 0.08, 0.08));
      this.mineProto = mine;

      // Drone: a body, four arms, four rotors.
      const dr = new T.Group();
      dr.add(part(G.box, S.dark, 0, 0, 0, 0.9, 0.3, 0.9));
      dr.add(part(G.sph, S.red, 0, -0.2, 0.3, 0.15, 0.15, 0.15));
      for (let k = 0; k < 4; k++) {
        const a = (k / 4) * BB.TAU + Math.PI / 4;
        dr.add(part(G.box, S.metal, Math.cos(a) * 0.6, 0, Math.sin(a) * 0.6, 0.12, 0.08, 1.0, 0, -a + Math.PI / 2, 0));
        dr.add(part(G.cyl, S.black, Math.cos(a) * 1.0, 0.12, Math.sin(a) * 1.0, 0.42, 0.02, 0.42));
      }
      dr.add(part(G.box, S.red, 0, -0.32, 0, 0.3, 0.3, 0.6)); // the payload
      dr.scale.setScalar(1.4);
      this.droneProto = dr;

      this.pukeMat = this.fx.decalMats.puke;
    }

    buildCrates() {
      const tr = this.track;
      for (const spot of tr.crateSpots) {
        const m = new THREE.Mesh(this.crateGeo, this.crateMat);
        m.castShadow = true;
        const c = { m, x: spot.x, y: spot.y, z: spot.z, t: 0, ph: Math.random() * 6 };
        m.position.set(c.x, c.y, c.z);
        this.group.add(m);
        this.crates.push(c);
      }
    }

    // ---------- using items ----------

    give(k, id) {
      k.item = { id, uses: BB.ITEMS[id].uses };
      k.itemAge = 0;
    }

    use(k, back) {
      const it = k.item;
      if (!it || k.rollT > 0 || k.dead || k.useCD > 0) return false;
      const kind = BB.ITEMS[it.id].kind;
      switch (kind) {
        case 'rocket': this.fireRocket(k, back); break;
        case 'saw': this.fireSaw(k, back); break;
        case 'mine': this.dropHazard(k, 'mine', back); break;
        case 'puke': this.dropHazard(k, 'puke', back); break;
        case 'shotgun': this.fireShotgun(k, back); break;
        case 'flame':
          this.applyToSelf(k, kind);
          if (!k.isPlayer) this.audio.flame(this.audio.at(k.pos.x, k.pos.y, k.pos.z));
          break;
        case 'nitro': this.applyToSelf(k, kind); break;
        case 'drone': this.launchDrone(k); break;
        case 'grinder':
          this.applyToSelf(k, kind);
          this.audio.saw(k.isPlayer ? 1 : this.audio.at(k.pos.x, k.pos.y, k.pos.z));
          break;
      }
      k.useCD = kind === 'shotgun' ? 0.45 : kind === 'rocket' ? 0.3 : 0.25;
      it.uses--;
      if (it.uses <= 0) k.item = null;
      return true;
    }

    fwd(k, back) {
      const s = back ? -1 : 1;
      return { x: Math.sin(k.yaw) * s, z: Math.cos(k.yaw) * s };
    }

    fireRocket(k, back) {
      const f = this.fwd(k, back);
      const m = this.rocketProto.clone();
      const p = k.pos;
      const x = p.x + f.x * 2.2;
      const z = p.z + f.z * 2.2;
      m.position.set(x, p.y + 0.9, z);
      this.group.add(m);
      const target = back ? null : this.race.findTarget(k, 1, 110, 0.55) || this.race.nextAhead(k);
      this.shots.push({ id: this.nextId++, type: 'rocket', m, x, y: p.y + 0.9, z, dx: f.x, dz: f.z, speed: 62 + Math.max(0, k.speed) * 0.4, owner: k, target, homing: !back, life: 4.5, t: 0, st: roadOf(k), inf: {} });
      this.audio.rocket(k.isPlayer ? 1 : this.audio.at(p.x, p.y, p.z));
    }

    fireSaw(k, back) {
      const f = this.fwd(k, back);
      const m = this.sawProto.clone();
      m.userData.disc = m.children[0];
      const p = k.pos;
      const x = p.x + f.x * 2.4;
      const z = p.z + f.z * 2.4;
      this.group.add(m);
      this.shots.push({ id: this.nextId++, type: 'saw', m, x, y: p.y + 0.7, z, dx: f.x, dz: f.z, speed: 46 + Math.max(0, k.speed) * 0.3, owner: k, life: 7, t: 0, st: roadOf(k), inf: {}, hits: 0, hitList: [] });
      this.audio.saw(k.isPlayer ? 1 : this.audio.at(p.x, p.y, p.z));
    }

    // Drop behind (default) or lob it ahead (back = true).
    dropHazard(k, type, back) {
      const p = k.pos;
      const fx = Math.sin(k.yaw);
      const fz = Math.cos(k.yaw);
      let m;
      if (type === 'mine') m = this.mineProto.clone();
      else {
        m = new THREE.Mesh(this.fx.decalGeo, this.pukeMat);
        m.scale.set(4, 1, 4);
        m.rotation.y = Math.random() * BB.TAU;
      }
      this.group.add(m);
      const h = { id: this.nextId++, type, m, owner: k, armT: type === 'mine' ? 0.6 : 0.3, life: 40, st: roadOf(k), inf: {}, flying: false, x: p.x, y: p.y, z: p.z, vx: 0, vy: 0, vz: 0 };
      if (back) {
        h.flying = true;
        h.x = p.x + fx * 2;
        h.z = p.z + fz * 2;
        h.y = p.y + 1.2;
        const sp = Math.max(0, k.speed) + 14;
        h.vx = fx * sp;
        h.vz = fz * sp;
        h.vy = 7;
      } else {
        h.x = p.x - fx * 2.6;
        h.z = p.z - fz * 2.6;
        h.y = this.track.probe(h.x, h.z, h.st, h.inf).y;
      }
      m.position.set(h.x, h.y + (type === 'puke' ? 0.06 : 0), h.z);
      this.hazards.push(h);
      if (this.hazards.length > 30) this.removeHazard(this.hazards[0]);
      if (type === 'puke') {
        this.fx.pukeBurst(h.x, h.y + 0.8, h.z, 20, 3);
        this.audio.puke(k.isPlayer ? 0.8 : this.audio.at(p.x, p.y, p.z));
      } else this.audio.mine(k.isPlayer ? 1 : this.audio.at(p.x, p.y, p.z));
    }

    removeHazard(h) {
      h.gone = true;
      const i = this.hazards.indexOf(h);
      if (i >= 0) this.hazards.splice(i, 1);
      this.group.remove(h.m);
    }

    fireShotgun(k, back) {
      const f = this.fwd(k, back);
      const p = k.pos;
      const ox = p.x + f.x * 1.6;
      const oz = p.z + f.z * 1.6;
      const oy = p.y + 1.0;
      this.audio.shotgun(k.isPlayer ? 1 : this.audio.at(p.x, p.y, p.z));
      this.fx.fire(ox, oy, oz, 14, 0.7, f.x * 14, 0.5, f.z * 14, 3);
      this.fx.smoke(ox, oy, oz, 6, 0, 0.9, 1);
      if (k.isPlayer) this.fx.addShake(0.25);
      const RANGE = 32;
      for (const o of this.race.karts) {
        if (o === k || o.dead) continue;
        const dx = o.pos.x - p.x;
        const dz = o.pos.z - p.z;
        const d = Math.hypot(dx, dz);
        if (d > RANGE || d < 0.1) continue;
        if ((dx * f.x + dz * f.z) / d < 0.9) continue;
        if (Math.abs(o.pos.y - p.y) > 3) continue;
        const dmg = 14 + 40 * (1 - d / RANGE);
        if (o.damage(dmg, k, 'shotgun', { spin: dmg > 25 ? 0.8 : 0, kx: f.x * 9, kz: f.z * 9 })) {
          this.fx.sparks(o.pos.x, o.pos.y + 1, o.pos.z, 0xffe08a, 10, 6);
          this.race.onHit(k, o);
        }
      }
      for (let i = 0; i < 9; i++) {
        const a = (Math.random() - 0.5) * 0.4;
        const ca = Math.cos(a);
        const sa = Math.sin(a);
        const dx = f.x * ca - f.z * sa;
        const dz = f.x * sa + f.z * ca;
        const len = RANGE * (0.6 + Math.random() * 0.4);
        this.fx.tracer(ox, oy, oz, ox + dx * len, oy + (Math.random() - 0.5) * 1.5, oz + dz * len);
      }
    }

    launchDrone(k) {
      const m = this.droneProto.clone();
      m.position.set(k.pos.x, k.pos.y + 18, k.pos.z);
      this.group.add(m);
      this.droneOut = true;
      this.drones.push({ id: this.nextId++, m, owner: k, target: null, phase: 'hunt', t: 0, x: k.pos.x, y: k.pos.y + 18, z: k.pos.z, beep: 0 });
      this.audio.siren();
    }

    // What nitro, the flamethrower and the meat grinder do to your own kart. Online, the player's
    // own computer does this part straight away (see Net.useItem).
    applyToSelf(k, kind) {
      if (kind === 'nitro') k.boost(1.6, 1.25);
      else if (kind === 'flame') k.flameT = 2.6;
      else if (kind === 'grinder') {
        this.ensureBlades(k);
        k.grinderT = 6;
        k.boost(0.6, 0.6);
      }
    }

    ensureBlades(k) {
      if (!k.blades) {
        const T = THREE;
        const S = BB.sharedMats();
        const g = new T.Group();
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * BB.TAU;
          const b = BB.part(S.geo.box, S.chrome, Math.cos(a) * 1.7, 0.6, Math.sin(a) * 1.7, 0.9, 0.06, 0.28, 0, -a, 0);
          g.add(b);
          g.add(BB.part(S.geo.box, S.blood, Math.cos(a) * 2.0, 0.62, Math.sin(a) * 2.0, 0.3, 0.07, 0.2, 0, -a, 0));
        }
        g.add(BB.part(S.geo.cyl, S.metal, 0, 0.6, 0, 1.5, 0.08, 1.5));
        k.m.root.add(g);
        k.blades = g;
      }
    }

    // Damage everything in a radius. direct takes full damage regardless of distance.
    // localOnly: only hurt karts this computer drives (track hazards, which every computer runs itself).
    blast(x, y, z, radius, dmg, owner, cause, direct, localOnly) {
      this.fx.explode(x, y, z, radius / 6);
      this.audio.explosion(this.audio.at(x, y, z), radius / 6);
      if (this.race.net && !localOnly) this.race.net.fx(x, y, z, radius / 6);
      for (const o of this.race.karts) {
        if (o.dead || (localOnly && (o.puppet || o.remote))) continue;
        const dx = o.pos.x - x;
        const dz = o.pos.z - z;
        const dy = o.pos.y - y;
        const d = Math.hypot(dx, dy, dz);
        if (d > radius && o !== direct) continue;
        if (o === owner && o !== direct) continue;
        const f = o === direct ? 1 : 1 - 0.6 * (d / radius);
        const n = Math.max(0.5, Math.hypot(dx, dz));
        if (o.damage(dmg * f, owner, cause, { spin: 1.1, kx: (dx / n) * 9 * f, kz: (dz / n) * 9 * f, vy: 7 * f })) {
          if (owner && owner !== o) this.race.onHit(owner, o);
        }
      }
      // Chain reaction: nail bombs nearby go off too.
      for (const h of this.hazards.slice()) {
        if (h.type !== 'mine' || h.flying || h.gone) continue;
        if (Math.hypot(h.x - x, h.z - z) < radius) {
          this.removeHazard(h);
          this.blast(h.x, h.y + 0.5, h.z, 6, 40, h.owner, 'mine', null);
        }
      }
    }

    // ---------- every frame ----------

    update(dt) {
      const race = this.race;
      const time = race.time;
      // Crates.
      for (const c of this.crates) {
        if (c.t > 0) {
          c.t -= dt;
          const grow = c.t <= 0 ? 1 : BB.clamp(1 - c.t / 0.4, 0, 1);
          c.m.visible = c.t < 0.4;
          c.m.scale.setScalar(Math.max(0.01, grow));
        }
        spinCrate(c, time);
        if (c.t > 0) continue;
        for (const k of race.karts) {
          if (k.dead) continue;
          const dx = k.pos.x - c.x;
          const dz = k.pos.z - c.z;
          if (dx * dx + dz * dz > 4.4 || Math.abs(k.pos.y + 0.8 - c.y) > 2.5) continue;
          c.t = 3.5;
          c.m.visible = false;
          this.fx.sparks(c.x, c.y, c.z, 0xffd23f, 16, 6, 0.5, 0.2);
          this.fx.dust(c.x, c.y, c.z, 6, 0, 0, 0xc8a040);
          this.audio.crate(k.isPlayer ? 1 : this.audio.at(c.x, c.y, c.z) * 0.5);
          if (!k.item && k.rollT <= 0) {
            k.rollT = k.isPlayer ? 1.3 : BB.rand(0.6, 1.4);
            k.rollItem = BB.rollItem(k.rank, race.karts.length, this.droneOut);
          }
          break;
        }
      }

      // Item roulettes finishing.
      for (const k of race.karts) {
        if (k.rollT > 0) {
          k.rollT -= dt;
          if (k.rollT <= 0) {
            if (!k.dead) {
              this.give(k, k.rollItem);
              if (k.isPlayer) this.audio.itemGet();
            }
          }
        }
        if (k.flameT > 0 && !k.dead) this.flamethrower(k, dt);
      }

      this.updateShots(dt);
      this.updateHazards(dt, time);
      this.updateDrones(dt);
    }

    flamethrower(k, dt) {
      k.flameT -= dt;
      this.flameFx(k, dt);
      const fx = Math.sin(k.yaw);
      const fz = Math.cos(k.yaw);
      for (const o of this.race.karts) {
        if (o === k || o.dead) continue;
        const dx = o.pos.x - k.pos.x;
        const dz = o.pos.z - k.pos.z;
        const d = Math.hypot(dx, dz);
        if (d > 19 || d < 0.1 || (dx * fx + dz * fz) / d < 0.82) continue;
        const fresh = o.burnT <= 0;
        if (o.damage(50 * dt, k, 'flame', { quiet: true, burn: 2.2 }) && fresh) this.race.onHit(k, o);
      }
      if (k.flameT <= 0) k.flameT = 0;
    }

    // Just the fire (online clients draw it for karts other computers drive).
    flameFx(k, dt) {
      const fx = Math.sin(k.yaw);
      const fz = Math.cos(k.yaw);
      const ox = k.pos.x + fx * 1.8;
      const oz = k.pos.z + fz * 1.8;
      const oy = k.pos.y + 0.9;
      const sp = Math.max(0, k.speed);
      for (let i = BB.count(130, dt); i > 0; i--) {
        const s = 18 + Math.random() * 10;
        const a = (Math.random() - 0.5) * 0.5;
        const dx = fx * Math.cos(a) - fz * Math.sin(a);
        const dz = fx * Math.sin(a) + fz * Math.cos(a);
        this.fx.glow.spawn(ox, oy, oz, dx * (s + sp), 1 + Math.random() * 2, dz * (s + sp), 0.45 + Math.random() * 0.25, 0.4, 2.2, 0xfff0a0, 0xd02008, 0.85, -2, 1.5);
      }
      if (Math.random() < dt * 8) this.fx.smoke(ox + fx * 12, oy + 1, oz + fz * 12, 1, 0.6, 1.5);
    }

    // ---------- online clients: crates just spin; what's hidden comes from the host ----------

    crateMask() {
      let m = '';
      for (const c of this.crates) m += c.t > 0 ? '1' : '0';
      return m;
    }

    clientUpdate(dt, mask) {
      const time = this.race.time;
      this.crates.forEach((c, i) => {
        const hidden = mask ? mask[i] === '1' : false;
        if (hidden && c.m.visible) {
          this.fx.sparks(c.x, c.y, c.z, 0xffd23f, 16, 6, 0.5, 0.2);
          this.audio.crate(this.audio.at(c.x, c.y, c.z) * 0.6);
        }
        c.m.visible = !hidden;
        c.m.scale.setScalar(1);
        spinCrate(c, time);
      });
      this.mineLight.color.setHex(Math.floor(time * 4) % 2 ? 0xff2020 : 0x400808);
      for (const k of this.race.karts) {
        if (k.flameT > 0 && !k.dead) this.flameFx(k, dt);
        if (k.grinderT > 0) this.ensureBlades(k);
      }
    }

    updateShots(dt) {
      const tr = this.track;
      const race = this.race;
      for (let i = this.shots.length - 1; i >= 0; i--) {
        const s = this.shots[i];
        s.t += dt;
        let boom = s.t >= s.life;
        if (s.type === 'rocket' && s.homing) {
          // Follow the track, then lock on once the target is close.
          let tx = 0;
          let tz = 0;
          const tg = s.target;
          const valid = tg && !tg.dead && !tg.finished;
          const L = tr.probe(s.x, s.z, s.st, s.inf);
          const dist = valid ? Math.hypot(tg.pos.x - s.x, tg.pos.z - s.z) : Infinity;
          if (valid && dist < 45) {
            tx = tg.pos.x - s.x;
            tz = tg.pos.z - s.z;
          } else {
            const ahead = tr.ahead(L, 14, BB.clamp(L.d * 0.85, -8, 8), this._ah || (this._ah = {}));
            tx = ahead.x - s.x;
            tz = ahead.z - s.z;
          }
          const want = Math.atan2(tx, tz);
          const cur = Math.atan2(s.dx, s.dz);
          const turn = BB.clamp(BB.wrapAngle(want - cur), -5 * dt, 5 * dt);
          const na = cur + turn;
          s.dx = Math.sin(na);
          s.dz = Math.cos(na);
        }
        s.x += s.dx * s.speed * dt;
        s.z += s.dz * s.speed * dt;
        const L = tr.probe(s.x, s.z, s.st, s.inf);
        const wallOver = tr.overWall(L, 0.6);
        if (s.type === 'rocket') {
          s.y = BB.damp(s.y, L.y + 0.9, 10, dt);
          if (wallOver) boom = true;
          this.fx.fire(s.x - s.dx * 0.7, s.y, s.z - s.dz * 0.7, 2, 0.5, -s.dx * 6, 0, -s.dz * 6, 0.8);
          if (Math.random() < 0.7) this.fx.smoke(s.x - s.dx, s.y, s.z - s.dz, 1, 0, 0.6, 0.5);
          s.m.position.set(s.x, s.y, s.z);
          s.m.rotation.set(0, Math.atan2(s.dx, s.dz), s.t * 8);
          // Hit karts.
          for (const k of race.karts) {
            if (k.dead || (k === s.owner && s.t < 0.4)) continue;
            const dx = k.pos.x - s.x;
            const dz = k.pos.z - s.z;
            if (dx * dx + dz * dz < 3.2 && Math.abs(k.pos.y + 0.6 - s.y) < 2) {
              boom = true;
              s.direct = k;
              break;
            }
          }
          // Hit nail bombs.
          for (const h of this.hazards) {
            if (h.type === 'mine' && !h.flying && Math.hypot(h.x - s.x, h.z - s.z) < 1.6) boom = true;
          }
          if (boom) {
            this.blast(s.x, s.y, s.z, 6, 55, s.owner, 'rocket', s.direct || null);
            this.removeShot(i);
          }
        } else if (s.type === 'saw') {
          s.y = L.y + 0.7;
          if (wallOver) {
            // Bounce off the wall.
            const sg = Math.sign(wallOver);
            const dot = s.dx * L.rx + s.dz * L.rz;
            if (dot * sg > 0) {
              s.dx -= 2 * dot * L.rx;
              s.dz -= 2 * dot * L.rz;
              this.fx.sparks(s.x, s.y, s.z, 0xffe0a0, 14, 7);
              this.audio.scrape(this.audio.at(s.x, s.y, s.z));
            }
            s.x -= L.rx * wallOver;
            s.z -= L.rz * wallOver;
          }
          s.m.position.set(s.x, s.y, s.z);
          s.m.rotation.y = Math.atan2(s.dx, s.dz);
          s.m.userData.disc.rotation.x -= dt * 30;
          if (Math.random() < 0.5) this.fx.spray(s.x, s.y - 0.6, s.z, -s.dx * 5, 2, -s.dz * 5, 0xffe0a0, 1, 3);
          for (const k of race.karts) {
            if (k.dead || (k === s.owner && s.t < 0.6) || s.hitList.indexOf(k) >= 0) continue;
            const dx = k.pos.x - s.x;
            const dz = k.pos.z - s.z;
            if (dx * dx + dz * dz < 3.4 && Math.abs(k.pos.y - s.y) < 2.2) {
              s.hitList.push(k);
              if (k.damage(46, s.owner, 'saw', { spin: 1.0, kx: s.dx * 6, kz: s.dz * 6 })) {
                this.race.onHit(s.owner, k);
                this.fx.blood(k.pos.x, k.pos.y + 1.2, k.pos.z, 30, 8);
                this.fx.sparks(k.pos.x, k.pos.y + 0.8, k.pos.z, 0xffe0a0, 16, 8);
                this.audio.slice(this.audio.at(s.x, s.y, s.z));
              }
              s.hits++;
              if (s.hits >= 2) boom = true;
            }
          }
          if (boom) {
            this.fx.sparks(s.x, s.y, s.z, 0xffe0a0, 20, 8);
            this.removeShot(i);
          }
        }
      }
    }

    removeShot(i) {
      this.group.remove(this.shots[i].m);
      this.shots.splice(i, 1);
    }

    updateHazards(dt, time) {
      const race = this.race;
      const tr = this.track;
      this.mineLight.color.setHex(Math.floor(time * 4) % 2 ? 0xff2020 : 0x400808);
      // Loop over a copy: explosions can set off (and remove) other bombs mid-loop.
      for (const h of this.hazards.slice()) {
        if (h.gone) continue;
        if (h.flying) {
          h.vy -= 25 * dt;
          h.x += h.vx * dt;
          h.y += h.vy * dt;
          h.z += h.vz * dt;
          const L = tr.probe(h.x, h.z, h.st, h.inf);
          const over = tr.overWall(L);
          if (over) {
            h.x -= L.rx * over;
            h.z -= L.rz * over;
          }
          if (h.y <= L.y && h.vy < 0) {
            h.y = L.y;
            h.flying = false;
            if (h.type === 'puke') this.fx.pukeBurst(h.x, h.y + 0.3, h.z, 16, 3);
          }
          h.m.position.set(h.x, h.y + (h.type === 'puke' && !h.flying ? 0.06 : 0), h.z);
          continue;
        }
        h.armT -= dt;
        h.life -= dt;
        if (h.type === 'mine') h.m.rotation.y += dt;
        if (h.life <= 0) {
          this.removeHazard(h);
          continue;
        }
        if (h.armT > 0) continue;
        const R2 = h.type === 'mine' ? 2.5 * 2.5 : 2.4 * 2.4;
        for (const k of race.karts) {
          if (k.dead) continue;
          const dx = k.pos.x - h.x;
          const dz = k.pos.z - h.z;
          if (dx * dx + dz * dz > R2 || Math.abs(k.pos.y - h.y) > 2) continue;
          if (h.type === 'mine') {
            this.removeHazard(h);
            this.blast(h.x, h.y + 0.5, h.z, 6, 52, h.owner, 'mine', k);
          } else {
            if (k.grinderT > 0 || k.invT > 0) continue;
            this.removeHazard(h);
            k.spinOut(1.5);
            k.damage(4, h.owner, 'puke', { quiet: true });
            this.fx.pukeBurst(k.pos.x, k.pos.y + 0.6, k.pos.z, 30, 6);
            this.audio.puke(k.isPlayer ? 1 : this.audio.at(h.x, h.y, h.z));
            race.onPuke(k, h.owner);
          }
          break;
        }
      }
    }

    updateDrones(dt) {
      const race = this.race;
      for (let i = this.drones.length - 1; i >= 0; i--) {
        const d = this.drones[i];
        d.t += dt;
        // Always hunt whoever leads right now (not the drone's owner).
        if (d.phase === 'hunt') {
          const leader = race.karts.find((k) => k.rank === 0 && !k.finished);
          let tg = leader && leader !== d.owner ? leader : race.karts.find((k) => k.rank === 1 && !k.finished);
          if (tg && tg.dead) tg = d.target;
          d.target = tg || d.target;
        }
        const tg = d.target;
        if (!tg) {
          this.removeDrone(i);
          continue;
        }
        const tx = tg.pos.x + Math.sin(tg.yaw) * Math.max(0, tg.speed) * 0.25;
        const tz = tg.pos.z + Math.cos(tg.yaw) * Math.max(0, tg.speed) * 0.25;
        const dx = tx - d.x;
        const dz = tz - d.z;
        const dist = Math.hypot(dx, dz);
        if (d.phase === 'hunt') {
          const sp = 75;
          const step = Math.min(dist, sp * dt);
          if (dist > 0.01) {
            d.x += (dx / dist) * step;
            d.z += (dz / dist) * step;
          }
          d.y = BB.damp(d.y, tg.pos.y + 16, 3, dt);
          d.beep -= dt;
          if (d.beep <= 0 && tg.isPlayer) {
            this.audio.siren();
            d.beep = BB.clamp(dist / 120, 0.18, 0.9);
          }
          if (dist < 5 || d.t > 14) {
            d.phase = 'dive';
            d.t = 0;
          }
        } else {
          d.x = BB.damp(d.x, tx, 10, dt);
          d.z = BB.damp(d.z, tz, 10, dt);
          d.y -= 40 * dt;
          if (d.y <= tg.pos.y + 0.8 || d.t > 0.9) {
            this.removeDrone(i);
            this.blast(d.x, Math.max(d.y, tg.pos.y + 0.5), d.z, 9, 75, d.owner, 'drone', dist < 6 ? tg : null);
            continue;
          }
        }
        d.m.position.set(d.x, d.y, d.z);
        d.m.rotation.y = Math.atan2(dx, dz);
        d.m.rotation.x = d.phase === 'dive' ? 0.6 : 0.15;
      }
    }

    removeDrone(i) {
      this.group.remove(this.drones[i].m);
      this.drones.splice(i, 1);
      this.droneOut = this.drones.length > 0;
    }

    // Is a drone hunting this kart right now? (for the HUD warning)
    droneOn(k) {
      for (const d of this.drones) if (d.target === k) return d;
      return null;
    }

    dispose() {
      this.race.group.remove(this.group);
    }
  }

  BB.ItemSystem = ItemSystem;
})();
</script>
<script>
/* ---- js/ai.js ---- */
/* BuggyBoom — computer drivers. Each one aims at a point ahead on whatever road it's on, cuts
   the inside of bends, drifts through long corners, dodges hazards and sludge, sometimes takes a
   secret shortcut, tries tricks off jumps, and uses items when it makes sense. */
(function () {
  'use strict';
  const BB = window.BB;

  class AIDriver {
    constructor(kart, race) {
      this.k = kart;
      this.race = race;
      this.lv = BB.cpuLevel(kart.level);
      this.skill = BB.clamp(this.lv.skill + BB.rand(-0.08, 0.08), 0.05, 1);
      this.lane = BB.rand(-4, 4);
      this.laneT = BB.rand(2, 6);
      this.useT = BB.rand(0.5, 2);
      this.stuckT = 0;
      this.revT = 0;
      this.stucks = 0;
      this.drifting = false;
      this.driftWait = 0;
      this.driftGoal = this.skill > 0.8 ? 2 : 1;
      this.scPlan = null;
      this.scLap = {};
      this.trickTried = false;
      this.c = { throttle: 1, steer: 0, drift: false, driftHit: false, fire: false, fireBack: false };
      this._p = {};
      this._pl = {};
      this._h = {};
    }

    update(dt) {
      const k = this.k;
      const tr = this.race.track;
      const c = this.c;
      c.driftHit = false;
      c.fire = false;
      c.fireBack = false;
      if (k.dead) {
        this.drifting = false;
        this.scPlan = null;
        c.drift = false;
        return c;
      }

      this.laneT -= dt;
      if (this.laneT <= 0) {
        this.lane = BB.rand(-5, 5);
        this.laneT = BB.rand(2, 6);
      }
      const inf = k.info;
      const spd = Math.max(0, k.speed);
      const look = 9 + spd * 0.5;
      let target;
      let bend = 0;
      if (inf.sc) {
        // On a shortcut: follow its centre line.
        this.scPlan = null;
        target = tr.ahead(inf, look, 0, this._p);
        bend = inf.sc.path.bend(inf.u, 30);
      } else {
        this.planShortcut(inf);
        const sc = this.scPlan;
        let ds = sc ? sc.s0 - inf.s : 0;
        if (ds < -tr.L / 2) ds += tr.L;
        if (sc && ds < 22) {
          // Aim through the gap in the wall.
          const L = sc.path.locate(k.pos.x, k.pos.z, -1, this._pl);
          target = sc.path.sampleAt(Math.min(sc.len, Math.max(14, L.s + look)), this._p);
        } else {
          bend = tr.bend(inf.s, 35);
          let lane = this.lane - BB.clamp(bend * 7, -6, 6);
          if (sc) lane = sc.side * 6; // line up for the shortcut
          lane = this.avoid(lane, inf.s);
          lane = BB.clamp(lane, -7.5, 7.5);
          target = tr.ahead(inf, look, lane, this._p);
        }
      }
      const want = Math.atan2(target.x - k.pos.x, target.z - k.pos.z);
      const err = BB.wrapAngle(want - k.yaw);
      let steer = BB.clamp(-err * 2.4, -1, 1);
      let throttle = 1;

      // Drift through long bends, let go once it's charged or the bend ends.
      if (!this.drifting) {
        if (Math.abs(bend) > 0.45 && spd > 17 && Math.sign(steer) === -Math.sign(bend) && Math.random() < this.skill * dt * 5) {
          this.drifting = true;
          c.driftHit = true;
        }
      } else if (!k.drift && k.onGround && k.airT === 0 && this.driftWait > 0.6) {
        this.drifting = false; // the hop didn't turn into a drift
      } else if (k.drift) {
        const done = Math.abs(bend) < 0.12 || (k.tier >= this.driftGoal && Math.abs(bend) < 0.4);
        const wrongWay = Math.sign(steer) === -k.drift && Math.abs(err) > 0.75;
        if (done || wrongWay) this.drifting = false;
      }
      this.driftWait = this.drifting ? this.driftWait + dt : 0;
      c.drift = this.drifting;

      // Tricks off jumps.
      if (k.onGround) this.trickTried = false;
      else if (k.canTrick && !k.trick && !this.trickTried && (k.launchVy > 2.5 || k.airT > 0.22)) {
        // Only try it with enough air left to land it (worse drivers misjudge more).
        this.trickTried = true;
        const margin = 0.2 + (1 - this.skill) * 0.25;
        if (k.airLeft() > BB.TRICK_TIME * BB.TRICK_LAND + margin - 0.15 && Math.random() < 0.3 + this.skill * 0.6) c.driftHit = true;
      }

      // Stuck against something: back up, and if that keeps failing, respawn.
      if (this.race.clock > 1 && !k.finished) {
        if (spd < 1.5 && k.spinT <= 0 && k.stall <= 0 && this.revT <= 0) this.stuckT += dt;
        else this.stuckT = Math.max(0, this.stuckT - dt);
        if (this.stuckT > 1.0) {
          this.stuckT = 0;
          this.revT = 0.9;
          this.stucks++;
          if (this.stucks > 3) {
            this.stucks = 0;
            k.respawn(4);
          }
        }
      }
      if (this.revT > 0) {
        this.revT -= dt;
        throttle = -1;
        steer = -steer;
        c.drift = this.drifting = false;
      } else if (Math.random() < dt * 0.05) this.stucks = Math.max(0, this.stucks - 1);

      c.steer = steer;
      c.throttle = throttle;
      if (this.race.clock > 0) this.items(dt, bend);
      return c;
    }

    // Decide once per lap, a little before each shortcut, whether to go for it.
    planShortcut(inf) {
      const tr = this.race.track;
      const k = this.k;
      if (this.scPlan) {
        const sc = this.scPlan;
        if (tr.delta(inf.s - sc.s0) > 40) this.scPlan = null; // missed it
        return;
      }
      for (const sc of tr.shortcuts) {
        const ds = tr.delta(sc.s0 - inf.s);
        if (ds < 20 || ds > 75 || this.scLap[sc.id] === k.lap) continue;
        this.scLap[sc.id] = k.lap;
        const chance = this.lv.shortcut * (0.8 + Math.random() * 0.4);
        if (Math.random() < chance) this.scPlan = sc;
      }
    }

    // Steer around nail bombs, puke, sludge, blood slicks and geysers on the line ahead.
    avoid(lane, s) {
      const tr = this.race.track;
      const smart = Math.random() < 0.4 + this.skill * 0.6;
      for (const h of this.race.items.hazards) {
        if (h.flying) continue;
        const L = tr.locate(h.x, h.z, h.st ? h.st.hint : -1, this._h);
        const ds = tr.delta(L.s - s);
        if (ds < 2 || ds > 28) continue;
        if (Math.abs(L.d - lane) < 3.2 && smart) lane = L.d > lane ? L.d - 4 : L.d + 4;
      }
      for (const z of tr.zones) {
        const ds = tr.delta(z.s0 - s);
        if (ds > 40 || ds < -(z.s1 - z.s0)) continue;
        if (lane > z.d0 - 2 && lane < z.d1 + 2 && smart) {
          const left = z.d0 - 3;
          const right = z.d1 + 3;
          const lOk = left > -8;
          const rOk = right < 8;
          if (lOk && (!rOk || Math.abs(left - lane) < Math.abs(right - lane))) lane = left;
          else if (rOk) lane = right;
        }
      }
      for (const g of tr.geysers) {
        const ds = tr.delta(g.s - s);
        if (ds < 2 || ds > 35) continue;
        if (Math.abs(g.d - lane) < 4.2 && smart) lane = g.d > lane ? g.d - 5 : g.d + 5;
      }
      return lane;
    }

    items(dt, bend) {
      const k = this.k;
      const c = this.c;
      if (!k.item || k.rollT > 0 || k.finished) return;
      this.useT -= dt;
      if (this.useT > 0) return;
      this.useT = (BB.rand(0.25, 0.7) * (1.4 - this.skill)) / this.lv.aggro;
      const race = this.race;
      const kind = BB.ITEMS[k.item.id].kind;
      const aggro = BB.clamp((0.5 + this.skill * 0.5) * this.lv.aggro, 0, 1);
      switch (kind) {
        case 'rocket': {
          if (race.findTarget(k, 1, 80, 0.75)) c.fire = Math.random() < aggro;
          else if (race.findTarget(k, -1, 30, 0.7) && Math.random() < 0.3) c.fireBack = true;
          else if (k.itemAge > 10) c.fire = true;
          break;
        }
        case 'saw':
          if (race.findTarget(k, 1, 80, 0.8) || k.itemAge > 8) c.fire = true;
          break;
        case 'shotgun': {
          if (race.findTarget(k, 1, 24, 0.92)) c.fire = true;
          else if (race.findTarget(k, -1, 16, 0.92)) c.fireBack = true;
          break;
        }
        case 'flame':
          if (race.findTarget(k, 1, 17, 0.85)) c.fire = true;
          break;
        case 'mine':
        case 'puke': {
          if (race.findTarget(k, -1, 35, 0.7) || k.itemAge > 9) c.fire = true;
          else if (race.findTarget(k, 1, 30, 0.9) && Math.random() < 0.25) c.fireBack = true;
          break;
        }
        case 'nitro':
          if (Math.abs(bend) < 0.3 && !k.offroad && k.boostT <= 0) c.fire = true;
          break;
        case 'drone':
          if (k.itemAge > 0.8) c.fire = true;
          break;
        case 'grinder':
          if (race.findTarget(k, 1, 30, 0.6) || k.itemAge > 4) c.fire = true;
          break;
      }
    }
  }

  BB.AIDriver = AIDriver;
})();
</script>
<script>
/* ---- js/race.js ---- */
/* BuggyBoom — one race: the grid, the countdown, laps and positions, kart-on-kart crashes,
   kills and trash talk, and the finish. Racers can be players on this computer (each with their
   own view and HUD), players online, or CPUs. In attract mode (behind the menus) all 8 are CPUs and
   the race never ends. Online, the host runs the race; clients drive their own kart and show the
   rest as it arrives from the host (see net.js). */
(function () {
  'use strict';
  const BB = window.BB;

  const GO_LINES = ['GO! GO! GO!', 'FLOOR IT!', "KILL 'EM ALL!", 'FLOOR IT, {DUMBASS}!', 'NO RULES! GO!'];
  const KILL_TITLES = ['ROADKILL!', 'SPLATTERED!', 'WRECKED!', 'DEMOLISHED!', 'CHUNKY SALSA!', 'TOASTED!'];
  const STREAK_TITLES = { 2: 'DOUBLE TAP!', 3: 'TRIPLE THREAT!', 4: 'RAMPAGE!', 5: 'WAR CRIMES!' };
  const DEATH_SUBS = ['Nice driving, genius.', 'Walk it off.', "That's gonna leave a mark.", 'Respawning your sorry {ass}...'];
  const PUKE_LINES = ['EW. EW. EW.', 'GROSS!', 'SLIPPED IN PUKE', 'BLEEEURGH'];
  const TRICK_LINES = ['SICK!', 'FILTHY!', 'NASTY!', 'HOLY {SHIT}!', 'DISGUSTING!', 'STYLE POINTS!'];
  const BAIL_LINES = ['BAILED!', 'FACEPLANT!', 'EAT {SHIT}!'];
  const FINISH = {
    1: ['HELL YEAH! 1ST!', 'Nobody saw nothing. Go home.'],
    2: ['2ND PLACE', 'First loser. Still on the podium.'],
    3: ['3RD PLACE', 'Podium. Not bad for a degenerate.'],
    4: ['4TH PLACE', 'Off the podium. Mid.'],
    5: ['5TH PLACE', 'Extremely mid.'],
    6: ['6TH PLACE', 'Your mother is disappointed.'],
    7: ['7TH PLACE', 'Did you even try?'],
    8: ['DEAD LAST', 'You absolute {dumbass}.'],
  };
  const IDLE = { throttle: 0, steer: 0, drift: false, driftHit: false, fire: false, fireBack: false };

  // ---------- time-trial storage: best times and the best lap's ghost, per track ----------
  BB.GHOST_STEP = 0.05; // seconds between ghost samples
  BB.loadGhost = (id) => {
    const g = BB.store.get('buggyboom.ghost.' + id, null);
    return g && Array.isArray(g.f) && g.f.length >= 8 && g.step > 0 ? g : null;
  };
  BB.saveGhost = (id, g) => BB.store.set('buggyboom.ghost.' + id, g);
  BB.bestTimes = (id) => {
    const all = BB.store.get('buggyboom.times', {});
    const b = all[id] || {};
    return { lap: b.lap || 0, race: Object.assign({}, b.race || {}) };
  };
  BB.saveBest = (id, best) => {
    const all = BB.store.get('buggyboom.times', {});
    all[id] = best;
    BB.store.set('buggyboom.times', all);
  };

  class Race {
    // opts: { attract, trial, laps, entries (grid order, see lineup.js), circuitLabel, cpuText, net }
    constructor(game, opts) {
      this.game = game;
      this.track = game.track;
      this.fx = game.effects;
      this.audio = game.audio;
      this.attract = !!opts.attract;
      this.trial = !!opts.trial;
      this.net = opts.net || null;
      this.isClient = !!(this.net && this.net.role === 'client');
      this.laps = this.attract ? 9999 : opts.laps || 3;
      this.circuitLabel = opts.circuitLabel || '';
      this.group = new THREE.Group();
      game.scene.add(this.group);
      this.time = 0;
      this.clock = this.attract ? 1 : -5.2; // seconds since GO; negative during the countdown
      this.state = this.attract ? 'race' : 'countdown';
      this.finishOrder = [];
      this.doneT = 0;
      this.firstHumanDoneT = null;
      this.lastCount = 4;

      let entries = opts.entries;
      if (this.attract) entries = BB.shuffle(BB.unlockedRacers()).slice(0, BB.MAX_RACERS).map((r) => ({ racer: r.id, kind: 'cpu', level: 'normal', kart: BB.cpuKart() }));
      this.track.resetGame();
      this.foundSc = new Set();
      this.karts = entries.map((e, g) => {
        const k = new BB.Kart(this, BB.racerById(e.racer), g, e);
        const row = g >> 1;
        const col = g & 1;
        const tr = this.track;
        k.place(tr.wrapS(-7 - row * 6.5 - col * 3), this.trial ? 0 : col ? 3.6 : -3.6);
        k.raceDist = -(7 + row * 6.5 + col * 3);
        if (this.isClient && !k.isPlayer) k.puppet = true; // shown as the host says
        if (k.kind === 'cpu' && !k.puppet) k.ai = new BB.AIDriver(k, this);
        return k;
      });
      this.locals = this.karts.filter((k) => k.isPlayer).sort((a, b) => a.local - b.local);
      this.player = this.locals[0] || null;
      this.humans = this.karts.filter((k) => k.human);
      if (!this.attract) {
        const lapsTxt = this.laps + (this.laps === 1 ? ' lap' : ' laps');
        const sub = this.trial ? 'Time trial · ' + lapsTxt : opts.circuitLabel || lapsTxt + (opts.cpuText ? ' · ' + opts.cpuText : '');
        this.intro = [this.track.name.toUpperCase(), sub];
      }
      this.items = new BB.ItemSystem(this);
      for (const k of this.karts) if (!this.trial) this.addTag(k);
      if (this.trial) this.setupTrial();
      this.ranks();
      if (this.attract) {
        // Spread the attract-mode karts around the track so there's action everywhere.
        this.karts.forEach((k, i) => {
          const s = (i / this.karts.length) * this.track.L + BB.rand(0, 20);
          k.place(s, BB.rand(-4, 4));
          k.raceDist = s;
          k.speed = 20;
        });
      }
    }

    // A name floating over each kart. Players show their player number or online name.
    addTag(k) {
      const T = THREE;
      let label = k.name;
      if (k.isPlayer && this.locals.length > 1) label = 'P' + (k.local + 1) + ' · ' + k.r.short;
      else if (k.remote || (k.human && k.pname)) label = (k.pname || 'Player') + ' · ' + k.r.short;
      const tex = BB.canvasTexture(320, 64, (g, w, h) => {
        g.font = 'bold 30px "Rubik", "Arial Black", sans-serif';
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.lineWidth = 6;
        g.strokeStyle = 'rgba(0,0,0,0.85)';
        g.strokeText(label, w / 2, h / 2, w - 10);
        g.fillStyle = k.human ? '#ffffff' : BB.ink(k.r.color);
        g.fillText(label, w / 2, h / 2, w - 10);
      }, false);
      const sp = new T.Sprite(new T.SpriteMaterial({ map: tex, depthWrite: false, transparent: true }));
      sp.scale.set(5, 1, 1);
      sp.position.set(0, k.m.tagY || 2.9, 0);
      sp.renderOrder = 5;
      k.m.root.add(sp);
      k.tag = sp;
    }

    // ---------- HUDs ----------

    hudFor(k) {
      return k && k.isPlayer ? this.game.huds[k.local] : null;
    }

    huds() {
      return this.locals.map((k) => this.game.huds[k.local]);
    }

    announceAll(title, sub, color, dur) {
      for (const h of this.huds()) h.announce(title, sub, color, dur);
    }

    say(k, title, sub, color, dur) {
      const h = this.hudFor(k);
      if (h) h.announce(title, sub, color, dur);
    }

    feedAll(killer, victim, cause) {
      for (const h of this.huds()) h.feed(killer, victim, cause);
    }

    tauntAll(k, line) {
      for (const h of this.huds()) h.taunt(k, line);
    }

    // ---------- lookups used by items and AI ----------

    // Nearest kart within range in a cone in front (dir 1) or behind (dir -1). cosMin = cone width.
    findTarget(k, dir, range, cosMin) {
      const fx = Math.sin(k.yaw) * dir;
      const fz = Math.cos(k.yaw) * dir;
      let best = null;
      let bd = range * range;
      for (const o of this.karts) {
        if (o === k || o.dead || o.finished) continue;
        const dx = o.pos.x - k.pos.x;
        const dz = o.pos.z - k.pos.z;
        const d2 = dx * dx + dz * dz;
        if (d2 > bd || d2 < 0.01) continue;
        if ((dx * fx + dz * fz) / Math.sqrt(d2) < cosMin) continue;
        best = o;
        bd = d2;
      }
      return best;
    }

    // The kart one place ahead in the race.
    nextAhead(k) {
      if (k.rank === 0) return null;
      return this.karts.find((o) => o.rank === k.rank - 1 && !o.finished && !o.dead) || null;
    }

    ranks() {
      const list = this.karts.slice().sort((a, b) => {
        if (a.finished && b.finished) return a.finishTime - b.finishTime;
        if (a.finished) return -1;
        if (b.finished) return 1;
        return b.raceDist - a.raceDist;
      });
      list.forEach((k, i) => (k.rank = i));
      this.order = list;
    }

    // ---------- events ----------

    onHit(by, victim) {
      if (by && by.isPlayer && victim !== by) this.audio.hitConfirm();
    }

    onHurt(k, amount, by, cause, opt) {
      const h = this.hudFor(k);
      if (h) {
        if (!(opt && opt.quiet) || amount > 2) {
          h.hurt(Math.min(1, amount / 40));
          this.audio.hurt();
          this.fx.addShake(Math.min(0.6, amount / 60) / this.locals.length);
        } else h.hurt(0.08);
      }
      // Sometimes the victim yells about it.
      if (by && by !== k && !k.human && amount > 15 && Math.random() < 0.25 && this.near(k)) this.tauntAll(k, BB.pick(k.r.hurt));
    }

    onTrick(k, ok) {
      if (ok) k.tricks++;
      if (!k.isPlayer || this.attract) return;
      if (ok) {
        this.say(k, BB.pick(TRICK_LINES), '+ boost', 'green', 0.9);
        this.audio.itemGet();
      } else {
        this.say(k, BB.pick(BAIL_LINES), 'Land it next time.', 'red', 1.2);
        this.audio.hurt();
      }
    }

    onPuke(k, by) {
      const h = this.hudFor(k);
      if (h) {
        h.puke();
        h.announce(BB.pick(PUKE_LINES), by && by !== k ? 'Courtesy of ' + by.name : '', 'green', 1.4);
      }
    }

    onKill(killer, victim, cause) {
      if (killer) {
        killer.kills++;
        killer.streak++;
        killer.hp = Math.min(killer.maxHp, killer.hp + 25);
      }
      if (this.net) this.net.onKill(killer, victim, cause);
      this.feedAll(killer, victim, cause);
      if (this.fx.gore && victim.corpse) {
        this.game.views.forEach((v, i) => {
          const cam = v.camera.position;
          if (this.game.huds[i] && Math.hypot(cam.x - victim.pos.x, cam.z - victim.pos.z) < 12) this.game.huds[i].splatter();
        });
      }
      if (this.attract) return;
      if (killer && killer.isPlayer) {
        this.audio.kill();
        const title = STREAK_TITLES[Math.min(5, killer.streak)] || BB.pick(KILL_TITLES);
        this.say(killer, title, 'You ' + BB.killVerb(cause) + ' ' + victim.name, 'red', 1.8);
        if (Math.random() < 0.5 && !victim.human) this.tauntAll(victim, BB.pick(victim.r.hurt));
      }
      if (victim.isPlayer) {
        this.audio.death();
        if (killer) {
          const line = BB.pick(killer.r.taunts);
          this.say(victim, 'YOU GOT ' + BB.killVerb(cause).toUpperCase(), killer.name + ': "' + line + '"', 'red', 2.6);
          if (!killer.human) this.tauntAll(killer, line);
        } else this.say(victim, 'YOU ' + BB.selfDeath(cause).toUpperCase(), BB.pick(DEATH_SUBS), 'red', 2.6);
      } else if (killer && !killer.isPlayer && !killer.human && Math.random() < 0.45 && (this.near(victim) || Math.random() < 0.3)) {
        this.tauntAll(killer, BB.pick(killer.r.taunts));
      }
    }

    // Is this kart near any player's camera?
    near(k) {
      for (const v of this.game.views) {
        const cam = v.camera.position;
        if (Math.abs(cam.x - k.pos.x) + Math.abs(cam.z - k.pos.z) < 90) return true;
      }
      return false;
    }

    // ---------- crashes between karts ----------

    collide() {
      const ks = this.karts;
      const R = 2.1;
      for (let i = 0; i < ks.length; i++) {
        const a = ks[i];
        if (a.dead) continue;
        for (let j = i + 1; j < ks.length; j++) {
          const b = ks[j];
          if (b.dead) continue;
          // Online: a kart someone else drives can't be pushed from here.
          const aFixed = a.puppet || a.remote;
          const bFixed = b.puppet || b.remote;
          if (aFixed && bFixed) continue;
          const dx = b.pos.x - a.pos.x;
          const dz = b.pos.z - a.pos.z;
          if (Math.abs(b.pos.y - a.pos.y) > 1.6) continue;
          const d2 = dx * dx + dz * dz;
          if (d2 > R * R || d2 < 1e-6) continue;
          const d = Math.sqrt(d2);
          const nx = dx / d;
          const nz = dz / d;
          let over = R - d;
          // A kart from the network is only roughly where it really is: bump it softly, and if
          // the two copies overlap deeply the computers disagree, so just pass through.
          if ((aFixed || bFixed) && over > 1.3) continue;
          if (aFixed || bFixed) over *= 0.5;
          const wa = aFixed ? 1e6 : a.ph.weight * (a.grinderT > 0 ? 3 : 1);
          const wb = bFixed ? 1e6 : b.ph.weight * (b.grinderT > 0 ? 3 : 1);
          const ta = wb / (wa + wb);
          const tb = wa / (wa + wb);
          a.pos.x -= nx * over * ta;
          a.pos.z -= nz * over * ta;
          b.pos.x += nx * over * tb;
          b.pos.z += nz * over * tb;
          const avx = Math.sin(a.yaw) * a.speed + a.sx;
          const avz = Math.cos(a.yaw) * a.speed + a.sz;
          const bvx = Math.sin(b.yaw) * b.speed + b.sx;
          const bvz = Math.cos(b.yaw) * b.speed + b.sz;
          const rel = (bvx - avx) * nx + (bvz - avz) * nz;
          if (rel < 0) {
            const imp = (-rel * 1.2 + 1.5) * (aFixed || bFixed ? 0.5 : 1);
            a.sx -= nx * imp * ta;
            a.sz -= nz * imp * ta;
            b.sx += nx * imp * tb;
            b.sz += nz * imp * tb;
            if (imp > 5) {
              const mx = (a.pos.x + b.pos.x) / 2;
              const mz = (a.pos.z + b.pos.z) / 2;
              this.fx.sparks(mx, a.pos.y + 0.6, mz, 0xffe0a0, Math.round(imp), 6);
              if (a.isPlayer || b.isPlayer) this.audio.bump(BB.clamp(imp / 15, 0.3, 1));
            }
          }
          if (!this.isClient) {
            if (a.grinderT > 0 && b.grinderT <= 0) this.grind(a, b, nx, nz);
            if (b.grinderT > 0 && a.grinderT <= 0) this.grind(b, a, -nx, -nz);
          }
        }
      }
    }

    grind(att, vic, nx, nz) {
      if (vic.grindCD > 0) return;
      vic.grindCD = 0.8;
      if (vic.damage(65, att, 'grinder', { spin: 1.0, kx: nx * 14, kz: nz * 14, vy: 7 })) {
        this.fx.blood(vic.pos.x, vic.pos.y + 1.2, vic.pos.z, 40, 9);
        this.fx.sparks(vic.pos.x, vic.pos.y + 0.8, vic.pos.z, 0xffe0a0, 20, 9);
        this.audio.slice(att.isPlayer || vic.isPlayer ? 1 : this.audio.at(vic.pos.x, vic.pos.y, vic.pos.z));
        this.onHit(att, vic);
      }
    }

    // ---------- every frame ----------

    // inputs: one controls object per local player (index = player number - 1).
    update(dt, inputs) {
      if (this.intro) {
        this.announceAll(this.intro[0], this.intro[1], 'yellow', 2.0);
        this.intro = null;
      }
      this.time += dt;
      this.clock += dt;
      const tr = this.track;
      const racing = this.clock >= 0;

      // Countdown: 3, 2, 1, GO.
      if (this.state === 'countdown') {
        const n = Math.ceil(-this.clock);
        if (n !== this.lastCount && n <= 3) {
          this.lastCount = n;
          if (n > 0) {
            this.audio.countdown(false);
            this.announceAll(String(n), '', 'yellow', 0.9);
            tr.setLights(n);
          } else {
            this.audio.countdown(true);
            this.announceAll(BB.pick(GO_LINES), '', 'green', 1.2);
            tr.setLights(0);
            this.state = 'race';
            this.startBoosts();
          }
        } else if (n > 3) tr.setLights(-1);
      }
      if (this.state === 'race' && this.clock > 3) tr.setLights(-1);

      // Rubber band: CPUs behind the players speed up a little, CPUs far ahead ease off.
      const racingHumans = this.humans.filter((h) => !h.finished);
      const ref = racingHumans.length ? racingHumans.reduce((a, h) => a + h.raceDist, 0) / racingHumans.length : null;
      for (const k of this.karts) {
        if (k.human) continue;
        const band = ref == null ? 1 : BB.clamp(1 + ((ref - k.raceDist) / 500) * 0.12, 0.9, 1.1);
        k.speedMul = BB.cpuLevel(k.level).speed * band;
      }

      // Drive.
      for (const k of this.karts) {
        if (k.puppet || (k.remote && !k.ai)) continue; // moved by the network
        let c;
        if (k.isPlayer && !k.finished) {
          c = (inputs && inputs[k.local]) || IDLE;
          if (!racing) {
            this.watchStart(k, c);
            c = IDLE;
          } else if (c.respawn && !k.dead && Math.abs(k.speed) < 6 && k.spinT <= 0) k.respawn(4);
        } else {
          if (!k.ai) k.ai = new BB.AIDriver(k, this); // a player's kart drives itself after the finish
          c = k.ai.update(dt);
          if (!racing) c = IDLE;
        }
        k.update(dt, c);
        if (racing && (c.fire || c.fireBack)) {
          if (this.isClient) this.net.useItem(k, !!c.fireBack);
          else this.items.use(k, !!c.fireBack);
        }
      }
      this.collide();
      if (racing) {
        if (!this.isClient) this.items.update(dt);
        this.track.updateGame(this, dt);
      }

      // Taking a secret shortcut (counted for cred), and finding one for the first time.
      for (const pl of this.locals) {
        const scId = pl.st.sc ? pl.st.sc.id : null;
        if (scId && scId !== pl.lastSc) pl.shortcuts++;
        pl.lastSc = scId;
        if (!pl.st.sc || this.foundSc.has(pl.st.sc.id)) continue;
        this.foundSc.add(pl.st.sc.id);
        const known = BB.store.get('buggyboom.secrets', {});
        if (!known[pl.st.sc.id]) {
          known[pl.st.sc.id] = true;
          BB.store.set('buggyboom.secrets', known);
          this.say(pl, 'SECRET SHORTCUT!', 'Now it\'s on your map.', 'green', 1.8);
          for (const h of this.huds()) h.buildMap();
          this.audio.kill();
        }
      }

      // Laps and the finish (the host decides for everyone; clients only for their own kart's HUD).
      const L = tr.L;
      for (const k of this.karts) {
        if (k.dead || k.puppet) continue;
        k.raceDist += tr.delta(k.info.s - k.lastS);
        k.lastS = k.info.s;
        const lap = Math.floor(k.raceDist / L) + 1;
        if (lap > k.lap && racing) {
          if (k.lap >= 1) {
            const lt = this.clock - k.lapStart;
            k.lapTimes.push(lt);
            k.bestLap = Math.min(k.bestLap, lt);
            if (this.trial && k.isPlayer) this.trialLap(lt);
          }
          k.lapStart = this.clock;
          if (this.trial && k.isPlayer) this.rec = [];
          if (k.lap >= 1) k.hp = Math.min(k.maxHp, k.hp + 25); // a pit-crew patch-up each lap
          const prev = k.lap;
          k.lap = lap;
          if (k.lap > this.laps && !k.finished) {
            if (!this.isClient) this.finish(k);
          } else if (k.isPlayer && prev >= 1 && !this.trial) {
            if (k.lap === this.laps) this.say(k, 'FINAL LAP', "Don't {screw} it up.", 'yellow', 1.8);
            else this.say(k, 'LAP ' + k.lap, BB.fmtTime(k.lapTimes[k.lapTimes.length - 1]), 'yellow', 1.4);
          }
        }
      }
      if (!this.isClient) this.ranks();
      if (this.trial && this.player) this.updateTrial();

      // Wrong way warnings.
      for (const pl of this.locals) {
        const h = this.hudFor(pl);
        if (h && !pl.finished) h.wrongWay(pl.wrongT > 0.8);
      }

      // End of race: a little while after every player has finished, show results.
      if (!this.isClient && this.humans.length && this.state !== 'done') {
        const left = this.humans.filter((h) => !h.finished).length;
        if (left < this.humans.length && this.firstHumanDoneT == null) this.firstHumanDoneT = this.clock;
        if (left === 0) this.doneT += dt;
        const allDone = this.karts.every((k) => k.finished);
        const giveUp = this.firstHumanDoneT != null && this.clock - this.firstHumanDoneT > 45; // don't wait forever online
        if ((left === 0 && ((allDone && this.doneT > 3) || this.doneT > 9)) || giveUp) {
          this.state = 'done';
          this.game.showResults();
        }
      }

      if (this.net) this.net.tick(dt);
      for (const k of this.karts) k.visual(dt, this.time);
    }

    // The start boost: gas in the last half second before GO. Too early floods the engine.
    watchStart(k, c) {
      if (c.throttle > 0.5) {
        if (k.startPress == null) k.startPress = this.clock;
      } else k.startPress = null;
    }

    startBoosts() {
      for (const k of this.karts) {
        if (k.isPlayer) {
          const t = k.startPress;
          if (t != null && t > -0.6) {
            k.boost(1.3, 1);
            this.say(k, 'ROCKET START!', '', 'green', 1.2);
          } else if (t != null && t < -1.8) {
            k.stall = 1.1;
            this.say(k, 'FLOODED IT', 'Too early, {genius}.', 'red', 1.4);
          }
        } else if (k.ai && Math.random() < BB.cpuLevel(k.level).startBoost) k.boost(1.0, 0.9);
      }
    }

    finish(k) {
      k.finished = true;
      k.finishTime = this.clock;
      this.finishOrder.push(k);
      k.finishPlace = this.finishOrder.length;
      k.endDrift(false);
      if (this.net) this.net.onFinish(k);
      if (k.isPlayer && this.trial) this.trialFinish(k);
      else if (k.isPlayer) this.finishFanfare(k);
    }

    finishFanfare(k) {
      const f = FINISH[k.finishPlace] || FINISH[8];
      this.say(k, f[0], f[1], k.finishPlace <= 3 ? 'green' : 'red', 4);
      this.audio.finish(k.finishPlace);
      k.ai = new BB.AIDriver(k, this);
    }

    // Final standings. Karts still racing get a projected time from how far they have left.
    results() {
      const L = this.track.L;
      const rows = this.karts.map((k) => {
        let time = k.finishTime;
        if (!k.finished) time = this.clock + Math.max(0, this.laps * L - k.raceDist) / 26;
        return { k, time, finished: k.finished };
      });
      rows.sort((a, b) => b.finished - a.finished || a.time - b.time); // finishers first, then by time
      return rows.map((r, i) => ({
        place: i + 1,
        id: r.k.r.id,
        name: r.k.name,
        color: r.k.r.color,
        isPlayer: r.k.isPlayer,
        human: r.k.human,
        kind: r.k.kind,
        who: BB.whoLabel({ kind: r.k.kind, local: r.k.local, name: r.k.pname, level: r.k.level }, this.locals.length),
        time: r.time,
        projected: !r.finished,
        best: r.k.bestLap,
        kills: r.k.kills,
        deaths: r.k.deaths,
      }));
    }

    // ---------- time trial ----------

    setupTrial() {
      this.items.give(this.player, 'nitro3');
      this.rec = [];
      this.best = BB.bestTimes(this.track.id);
      this.lapRecord = false;
      this.raceRecord = false;
      this.ghost = BB.loadGhost(this.track.id);
      this.makeGhostModel();
    }

    // A see-through kart that replays the best lap.
    makeGhostModel() {
      if (this.ghostModel) this.group.remove(this.ghostModel.root);
      this.ghostModel = null;
      if (!this.ghost) return;
      const m = BB.buildKart(BB.racerById(this.ghost.racer), this.ghost.paint, this.ghost.kart);
      const ghostTint = new THREE.Color(0x9ad8ff);
      m.root.traverse((o) => {
        if (o.material) {
          o.material = o.material.clone();
          o.material.transparent = true;
          o.material.opacity = 0.45;
          o.material.depthWrite = false;
          if (o.material.color) o.material.color.lerp(ghostTint, 0.6);
          if (o.material.emissive) o.material.emissive.set(0x1e4a78);
          if (o.material.map) o.material.map = null;
        }
        o.castShadow = false;
      });
      m.root.visible = false;
      this.group.add(m.root);
      this.ghostModel = m;
    }

    updateTrial() {
      const p = this.player;
      const lapOn = p.lap >= 1 && !p.finished && this.clock >= 0;
      const tl = this.clock - p.lapStart;
      // Record this lap.
      if (lapOn) {
        const S = BB.GHOST_STEP;
        while ((this.rec.length / 4) * S <= tl && this.rec.length < 24000) {
          this.rec.push(+p.pos.x.toFixed(2), +p.pos.y.toFixed(2), +p.pos.z.toFixed(2), +p.yaw.toFixed(3));
        }
      }
      // Replay the ghost from the line, each lap.
      const gm = this.ghostModel;
      this.ghostPos = null;
      if (!gm) return;
      let show = false;
      if (lapOn) {
        const F = this.ghost.f;
        const f = tl / this.ghost.step;
        const i = Math.floor(f);
        if (i >= 0 && i < F.length / 4 - 1) {
          const t = f - i;
          const a = i * 4;
          const b = a + 4;
          gm.root.position.set(BB.lerp(F[a], F[b], t), BB.lerp(F[a + 1], F[b + 1], t), BB.lerp(F[a + 2], F[b + 2], t));
          gm.root.rotation.set(0, BB.lerpAngle(F[a + 3], F[b + 3], t), 0);
          show = true;
          this.ghostPos = gm.root.position;
        }
      }
      gm.root.visible = show;
    }

    trialLap(lt) {
      const best = this.best.lap;
      const p = this.player;
      if (!(best > 0) || lt < best) {
        this.best.lap = lt;
        BB.saveBest(this.track.id, this.best);
        this.ghost = { racer: p.r.id, paint: BB.paintFor(p.r.id), kart: p.kartDef.id, lap: lt, step: BB.GHOST_STEP, f: this.rec };
        BB.saveGhost(this.track.id, this.ghost);
        this.makeGhostModel();
        this.lapRecord = true;
        this.say(p, 'NEW BEST LAP!', BB.fmtTime(lt) + (best > 0 ? '   −' + (best - lt).toFixed(2) + 's' : '   Your ghost will chase you now.'), 'green', 2.2);
        this.audio.kill();
      } else {
        this.say(p, 'LAP ' + p.lapTimes.length + '  ' + BB.fmtTime(lt), '+' + (lt - best).toFixed(2) + 's slower than your best', 'red', 1.8);
      }
    }

    trialFinish(k) {
      const total = k.finishTime;
      const key = String(this.laps);
      const prev = this.best.race[key];
      if (!(prev > 0) || total < prev) {
        this.best.race[key] = total;
        BB.saveBest(this.track.id, this.best);
        this.raceRecord = true;
        this.say(k, 'NEW RECORD!', BB.fmtTime(total) + (prev > 0 ? '   −' + (prev - total).toFixed(2) + 's' : ''), 'green', 4);
        this.audio.finish(1);
      } else {
        this.say(k, 'FINISHED', BB.fmtTime(total) + '   +' + (total - prev).toFixed(2) + 's off your record', 'yellow', 4);
        this.audio.finish(4);
      }
    }

    trialResults() {
      const p = this.player;
      return {
        track: this.track.name, laps: p.lapTimes.slice(), lapCount: this.laps, total: p.finishTime,
        bestLap: this.best.lap, bestRace: this.best.race[String(this.laps)], lapRecord: this.lapRecord, raceRecord: this.raceRecord,
        kills: p.kills, deaths: p.deaths,
      };
    }

    // Which kart a camera follows: each local player's own, or a featured kart in attract mode.
    camKart(i) {
      if (this.locals[i]) return this.locals[i];
      if (this.locals.length) return this.leader();
      if (!this.featured || this.time > this.featureUntil) {
        const pool = this.karts.filter((k) => !k.dead);
        this.featured = BB.pick(pool.length ? pool : this.karts);
        this.featureUntil = this.time + 10;
      }
      return this.featured;
    }

    leader() {
      return (this.order && this.order[0]) || this.karts[0];
    }

    dispose() {
      for (const k of this.karts) k.dispose();
      this.items.dispose();
      this.game.scene.remove(this.group);
      this.track.setLights(-1);
    }
  }

  BB.Race = Race;
})();
</script>
<script>
/* ---- js/circuit.js ---- */
/* BuggyBoom — circuits: several races back to back. Points for each finishing place, plus a point
   per kill. Whoever's last in the standings starts at the front of the next grid. */
(function () {
  'use strict';
  const BB = window.BB;

  BB.CIRCUITS = [
    { id: 'trash', name: 'Trash Circuit', blurb: 'Three tracks of pure garbage.', tracks: ['dumpster', 'landfill', 'sewer'] },
    { id: 'sleaze', name: 'Sleaze Circuit', blurb: 'Sunburn, carnies and a meat plant.', tracks: ['trailer', 'funland', 'butcher'] },
    { id: 'bender', name: 'All-Six Bender', blurb: 'Every track, back to back. Bring snacks.', tracks: ['dumpster', 'trailer', 'landfill', 'funland', 'sewer', 'butcher'] },
  ];
  BB.circuitById = (id) => BB.CIRCUITS.find((c) => c.id === id) || BB.CIRCUITS[0];
  BB.POINTS = [15, 12, 10, 8, 6, 4, 2, 1];
  BB.TROPHIES = ['Golden Toilet', 'Silver Spittoon', 'Bronze Bedpan'];

  class Circuit {
    // field: the starting grid from BB.makeField. The same racers run every race.
    constructor(def, field, laps, difficulty) {
      this.def = def;
      this.field = {};
      for (const e of field) this.field[e.racer] = e;
      this.player = (field.find((e) => e.kind !== 'cpu') || field[0]).racer; // whose paint the podium shows
      this.laps = laps;
      this.difficulty = difficulty;
      this.idx = 0;
      this.table = {};
      const here = field.filter((e) => e.kind === 'human').length;
      for (const e of field) {
        const r = BB.racerById(e.racer);
        this.table[r.id] = { id: r.id, name: r.name, color: r.color, pts: 0, kills: 0, deaths: 0, places: [], human: e.kind !== 'cpu', who: BB.whoLabel(e, here) };
      }
      this.order = field.map((e) => e.racer);
    }

    // Is this racer driven by someone on this computer?
    isLocal(id) {
      return this.field[id] && this.field[id].kind === 'human';
    }

    // The grid for the next race, as field entries.
    entries() {
      return this.order.map((id) => this.field[id]);
    }

    get trackId() {
      return this.def.tracks[this.idx];
    }

    get count() {
      return this.def.tracks.length;
    }

    get done() {
      return this.idx >= this.def.tracks.length;
    }

    label() {
      return 'Race ' + (this.idx + 1) + ' of ' + this.count + ' · ' + this.def.name;
    }

    // Add one race's results (rows from Race.results). Fills in each row's points earned.
    record(rows) {
      for (const r of rows) {
        const t = this.table[r.id];
        if (!t) continue;
        r.earned = (BB.POINTS[r.place - 1] || 0) + r.kills;
        t.pts += r.earned;
        t.kills += r.kills;
        t.deaths += r.deaths;
        t.places.push(r.place);
      }
      this.idx++;
      this.order = this.standings().map((s) => s.id).reverse();
    }

    standings() {
      return Object.values(this.table).sort((a, b) => b.pts - a.pts || b.kills - a.kills || a.deaths - b.deaths);
    }
  }

  BB.Circuit = Circuit;
})();
</script>
<script>
/* ---- js/net.js ---- */
/* BuggyBoom — online races, peer to peer through PeerJS (no server of our own).
   One player hosts: their game runs the race (CPUs, items, crates, laps, finishes) and sends
   everyone the state 20 times a second. Every player drives their own kart on their own computer
   and sends it to the host; hits on it are passed back to them to apply. CPUs fill every empty
   spot, and take over for anyone who drops out. */
(function () {
  'use strict';
  const BB = window.BB;

  const PREFIX = 'buggyboom-v1-';
  const SEND_EVERY = 0.05;
  const SILENT_MS = 8000; // this long with no word from someone and they count as gone
  const CODE_CHARS = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const r2 = (v) => Math.round(v * 100) / 100;
  const r3 = (v) => Math.round(v * 1000) / 1000;

  BB.netAvailable = () => typeof window.Peer === 'function';

  // When the page closes, hang up straight away so the others find out fast.
  let current = null;
  window.addEventListener('pagehide', () => {
    if (current) current.close(true);
  });

  // Kart state packed into bits.
  function flagsOf(k) {
    let f = 0;
    if (k.drift === 1) f |= 1;
    if (k.drift === -1) f |= 2;
    f |= (k.tier & 3) << 2;
    if (k.boostT > 0) f |= 1 << 4;
    if (k.spinT > 0) f |= 1 << 5;
    if (k.dead) f |= 1 << 6;
    if (k.grinderT > 0) f |= 1 << 8;
    if (k.flameT > 0) f |= 1 << 9;
    if (k.burnT > 0) f |= 1 << 10;
    if (k.onGround) f |= 1 << 11;
    if (k.trick) f |= (k.trick.kind + 1) << 12;
    if (k.invT > 0) f |= 1 << 14;
    if (k.stall > 0) f |= 1 << 15;
    return f;
  }

  // Apply bits to a kart shown from the network.
  function applyFlags(k, f) {
    k.drift = f & 1 ? 1 : f & 2 ? -1 : 0;
    k.tier = (f >> 2) & 3;
    k.boostT = f & (1 << 4) ? Math.max(k.boostT, 0.15) : 0;
    k.spinT = f & (1 << 5) ? Math.max(k.spinT, 0.15) : 0;
    k.grinderT = f & (1 << 8) ? Math.max(k.grinderT, 0.15) : 0;
    k.flameT = f & (1 << 9) ? Math.max(k.flameT, 0.15) : 0;
    k.burnT = f & (1 << 10) ? Math.max(k.burnT, 0.15) : 0;
    k.onGround = !!(f & (1 << 11));
    const tk = (f >> 12) & 3;
    if (tk && !k.trick) k.trick = { t: 0, dur: 0.45, kind: tk - 1 };
    if (!tk) k.trick = null;
    k.invT = f & (1 << 14) ? Math.max(k.invT, 0.1) : 0;
    k.stall = f & (1 << 15) ? 0.15 : 0;
  }

  class Net {
    constructor(game) {
      this.game = game;
      this.role = null; // 'host' or 'client'
      this.peer = null;
      this.conns = new Map(); // host: peer id -> connection
      this.conn = null; // client: connection to the host
      this.lobby = null; // { code, players: [{ id, name, racer, paint }], state: 'lobby' | 'race' }
      this.myId = null;
      this.status = '';
      this.error = '';
      this.sendT = 0;
      this.hits = new Map(); // host: kart -> pending hit to send to its owner
      this.shotMeshes = new Map(); // client: what the host's rockets, saws, bombs and drones look like here
      this.heard = new Map(); // host: peer id -> when we last heard from them
      this.budget = new Map(); // host: peer id -> { tok, at }: how many messages they may still send (see hostRecv)
      this.hostHeard = 0; // client: when we last heard from the host
      this.hb = null;
      current = this;
    }

    get race() {
      return this.game.race;
    }

    changed() {
      const m = this.game.menu;
      if (m.screen === 'lobby' || (m.screen === 'online' && !this.lobby)) m.show(m.screen);
      else if (m.screen === 'online' && this.lobby) m.show('lobby');
    }

    fail(msg) {
      this.error = msg;
      this.status = '';
      this.changed();
    }

    makeCode() {
      let c = '';
      for (let i = 0; i < 5; i++) c += CODE_CHARS[(Math.random() * CODE_CHARS.length) | 0];
      return c;
    }

    // ---------- hosting ----------

    host(name) {
      if (!BB.netAvailable()) return this.fail('Online play needs the internet (PeerJS did not load).');
      this.role = 'host';
      this.error = '';
      this.status = 'Opening a room...';
      this.code = this.makeCode();
      this.peer = new window.Peer(PREFIX + this.code, { debug: 0 });
      this.peer.on('open', () => {
        this.myId = 'host';
        this.status = '';
        const racer = BB.partyPicks()[0];
        this.lobby = { code: this.code, state: 'lobby', players: [{ id: 'host', name: name || 'Host', racer, paint: BB.paintFor(racer), kart: BB.kartFor(racer) }] };
        this.startBeat();
        this.changed();
      });
      this.peer.on('connection', (conn) => this.accept(conn));
      this.peer.on('error', (e) => {
        if (e.type === 'unavailable-id') {
          this.peer.destroy();
          this.host(name); // code clash: try another
        } else if (!this.lobby) this.fail('Could not open a room: ' + (e.message || e.type));
      });
      this.peer.on('disconnected', () => {
        try {
          this.peer.reconnect();
        } catch (err) {
          /* the race can carry on over the open connections */
        }
      });
    }

    accept(conn) {
      conn.on('data', (m) => this.hostRecv(conn, m));
      conn.on('close', () => this.dropped(conn.peer));
      conn.on('error', () => this.dropped(conn.peer));
    }

    broadcast(m, except) {
      for (const [id, c] of this.conns) if (id !== except && c.open) c.send(m);
    }

    sendTo(id, m) {
      const c = this.conns.get(id);
      if (c && c.open) c.send(m);
    }

    sendLobby() {
      this.sendLobbyQuiet();
      this.changed();
    }

    // Tell the guests what's set up, without redrawing our own menu.
    sendLobbyQuiet() {
      const me = this.lobby.players[0];
      me.racer = BB.partyPicks()[0];
      me.paint = BB.paintFor(me.racer);
      me.kart = BB.kartFor(me.racer);
      this.broadcast({ t: 'lobby', lobby: this.lobby, setup: this.setupText() });
    }

    // What the host has picked, for the guests to see.
    setupText() {
      const st = BB.settings;
      const where = st.mode === 'circuit' ? BB.circuitById(st.circuit).name : BB.trackById(st.track).name;
      return where + ' · ' + st.laps + (st.laps === 1 ? ' lap' : ' laps') + ' · ' + BB.cpuSummary(this.lobby ? this.lobby.players.length : 1);
    }

    // The racer someone asked for, or (if it's taken) one everybody has from the start.
    freeRacer(want) {
      const taken = this.lobby.players.map((p) => p.racer);
      if (want && BB.RACERS.some((x) => x.id === want) && !taken.includes(want)) return want;
      const r = BB.RACERS.find((x) => !x.unlock && !taken.includes(x.id)) || BB.RACERS.find((x) => !taken.includes(x.id));
      return r ? r.id : null;
    }

    hostRecv(conn, m) {
      const now = Date.now();
      this.heard.set(conn.peer, now);
      // About 60 messages a second on average (a racer sends 20); anything faster is dropped.
      const b = this.budget.get(conn.peer) || { tok: 120, at: now };
      b.tok = Math.min(120, b.tok + ((now - b.at) * 60) / 1000);
      b.at = now;
      this.budget.set(conn.peer, b);
      if (b.tok < 1) return;
      b.tok -= 1;
      const L = this.lobby;
      if (!L || !m || typeof m !== 'object') return;
      switch (m.t) {
        case 'hello': {
          if (m.v !== BB.GAME_VERSION) return conn.send({ t: 'nope', why: 'The host has BuggyBoom ' + BB.GAME_VERSION + ' and you have ' + m.v + '. Get the same version.' });
          if (L.state !== 'lobby') return conn.send({ t: 'nope', why: 'That race has already started. Try again when it ends.' });
          if (L.players.length >= BB.MAX_RACERS) return conn.send({ t: 'nope', why: 'That race is full (' + BB.MAX_RACERS + ' players).' });
          const racer = this.freeRacer(m.racer);
          L.players.push({ id: conn.peer, name: String(m.name || 'Player').slice(0, 16), racer, paint: racer === m.racer ? this.paintOK(m.paint) : 'stock', kart: BB.kartById(m.kart).id });
          this.conns.set(conn.peer, conn);
          this.sendLobby();
          break;
        }
        case 'pick': {
          const p = L.players.find((x) => x.id === conn.peer);
          if (p && L.state === 'lobby' && BB.RACERS.some((x) => x.id === m.racer) && !L.players.some((x) => x !== p && x.racer === m.racer)) {
            p.racer = m.racer;
            p.paint = this.paintOK(m.paint);
            p.kart = BB.kartById(m.kart).id;
            this.sendLobby();
          }
          break;
        }
        case 'me':
          this.applyRemote(conn.peer, m);
          break;
        case 'use': {
          const k = this.kartOf(conn.peer);
          if (k && this.race) this.race.items.use(k, !!m.back);
          break;
        }
        case 'died': {
          const k = this.kartOf(conn.peer);
          // Credit goes only to whoever the host saw hit them in the last 10 seconds.
          const lh = k && k.netLastHit;
          const by = lh && lh.by === m.by && now - lh.t < 10000 ? this.race && this.race.karts[m.by] : null;
          if (k && !k.dead && this.race) k.die(by || null, typeof m.cause === 'string' ? m.cause.slice(0, 20) : '');
          break;
        }
        case 'bye':
          this.dropped(conn.peer);
          break;
      }
    }

    // A paint id from a guest: one that exists, or the stock paint.
    paintOK(id) {
      return typeof id === 'string' && BB.PAINTS.some((p) => p.id === id) ? id : 'stock';
    }

    kartOf(peerId) {
      const r = this.race;
      return r ? r.karts.find((k) => k.peer === peerId) : null;
    }

    // Someone left. In the lobby they just go; mid-race a CPU takes their kart.
    dropped(peerId) {
      if (this.role !== 'host' || !this.lobby) return;
      this.conns.delete(peerId);
      const i = this.lobby.players.findIndex((p) => p.id === peerId);
      if (i < 0) return;
      const who = this.lobby.players[i];
      this.lobby.players.splice(i, 1);
      const k = this.kartOf(peerId);
      if (k && this.race && !this.race.attract) {
        this.cpuTakeover(k);
        this.broadcast({ t: 'cpu', i: k.idx });
        this.race.tauntAll(k, 'Bailed out. A CPU took over.');
      }
      // In a circuit, a CPU drives their kart for the rest of it.
      const c = this.game.circuit;
      if (c) {
        for (const id of Object.keys(c.field)) {
          const e = c.field[id];
          if (e.peer !== peerId) continue;
          c.field[id] = Object.assign({}, e, { kind: 'cpu', peer: null, level: this.cpuLevel(), name: (who.name || 'Player') + ' (CPU)' });
          if (c.table[id]) Object.assign(c.table[id], { human: false, who: c.field[id].name });
        }
      }
      this.sendLobby();
    }

    // How good the CPU is that takes over for someone who left.
    cpuLevel() {
      return BB.settings.difficulty === 'custom' ? 'normal' : BB.settings.difficulty;
    }

    cpuTakeover(k) {
      k.remote = false;
      k.human = false;
      k.kind = 'cpu';
      k.peer = null;
      k.level = this.cpuLevel();
      k.pname = (k.pname || 'Player') + ' (CPU)';
      if (k.dead) k.revive();
