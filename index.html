      for (let z = Z0; z <= Z1 + 0.01; z += 0.27) for (const sd of [-1, 1]) add(part(G.cyl8, wire, sd * W, (Y0 + Y1) / 2, z, 0.018, Y1 - Y0, 0.018));
      for (let x = -W + 0.22; x < W; x += 0.22) add(part(G.cyl8, wire, x, (Y0 + Y1) / 2, Z1, 0.018, Y1 - Y0, 0.018));
      for (const y of [0.78, 1.0]) {
        for (const sd of [-1, 1]) add(part(G.cyl8, wire, sd * W, y, midZ, 0.018, len, 0.018, Math.PI / 2, 0, 0));
        add(part(G.cyl8, wire, 0, y, Z1, 0.018, W * 2, 0.018, 0, 0, Math.PI / 2));
      }
      for (const sd of [-1, 1]) add(part(G.box, paint, sd * W, Y1, midZ, 0.07, 0.07, len + 0.07)); // plastic rim
      add(part(G.box, paint, 0, Y1, Z1, W * 2 + 0.07, 0.07, 0.07));
      for (const sd of [-1, 1]) add(part(G.cyl8, wire, sd * W, 1.33, Z0 - 0.1, 0.022, 0.3, 0.022, -0.6, 0, 0)); // handle struts
      add(part(G.cyl, trim, 0, 1.45, Z0 - 0.2, 0.06, W * 2 + 0.1, 0.06, 0, 0, Math.PI / 2)); // handle
      for (const sd of [-1, 1]) add(part(G.box, s.metal, sd * 0.5, 0.36, 0.1, 0.06, 0.06, 2.1)); // frame
      add(part(G.box, wire, 0, 0.3, 0.1, 0.9, 0.02, 1.6)); // bottom rack
      add(part(G.box, s.dark, 0, 0.62, -0.35, 0.8, 0.12, 0.8)); // seat
      add(part(G.box, s.dark, 0, 0.95, -0.74, 0.8, 0.6, 0.12, -0.15, 0, 0));
      add(part(G.box, s.orange, 0, 0.64, -1.32, 0.55, 0.42, 0.45)); // leaf blower
      add(part(G.cyl, s.metal, 0, 0.64, -1.66, 0.12, 0.38, 0.12, Math.PI / 2, 0, 0));
      const seat = [0, 0.68, -0.32];
      c.steering(seat);
      for (const [x, z, front] of [[0.55, 0.98, true], [-0.55, 0.98, true], [0.55, -0.85, false], [-0.55, -0.85, false]]) {
        add(part(G.box, s.dark, x, 0.42, z, 0.08, 0.18, 0.08)); // caster fork
        c.wheel(x, z, 0.24, 0.16, front);
      }
      return { seat, props: [0, 0, 0], exhausts: [[0, 0.64, -1.86]], top: 1.5 };
    },

    // A lawn tractor: long hood, big back wheels, a mower deck and a beer in the cup holder.
    mower(c) {
      const { s, G, paint, trim, add, part } = c;
      add(part(G.box, s.metal, 0, 0.42, 0, 0.8, 0.14, 2.4)); // frame
      add(part(G.box, paint, 0, 0.76, 0.78, 0.92, 0.5, 1.25)); // hood
      add(part(G.cyl, paint, 0, 1.01, 0.78, 0.46, 1.25, 0.2, Math.PI / 2, 0, 0)); // rounded top
      add(part(G.box, s.dark, 0, 0.74, 1.42, 0.8, 0.4, 0.04)); // grille
      for (const sd of [-1, 1]) add(part(G.sph, s.white, sd * 0.3, 0.92, 1.43, 0.08, 0.08, 0.04)); // headlights
      add(part(G.box, paint, 0, 0.82, -0.75, 1.1, 0.12, 1.05)); // seat deck
      for (const sd of [-1, 1]) add(part(G.hemi, paint, sd * 0.78, 0.9, -0.78, 0.27, 0.22, 0.56)); // fenders
      add(part(G.box, s.dark, 0, 0.96, -0.5, 0.75, 0.16, 0.65)); // seat
      add(part(G.box, s.dark, 0, 1.28, -0.86, 0.75, 0.6, 0.12, -0.12, 0, 0));
      add(part(G.box, trim, 0, 0.3, 0.1, 1.55, 0.14, 1.05)); // mower deck
      add(part(G.box, s.dark, 0.86, 0.33, 0.1, 0.35, 0.12, 0.42, 0, 0, -0.3)); // grass chute
      add(part(G.cyl, s.metal, 0.42, 0.9, -1.12, 0.08, 0.04, 0.08)); // cup holder
      add(part(G.cyl, s.red, 0.42, 0.98, -1.12, 0.065, 0.17, 0.065)); // the beer
      const seat = [0, 1.02, -0.45];
      c.steering(seat);
      c.wheel(0.55, 1.0, 0.28, 0.22, true);
      c.wheel(-0.55, 1.0, 0.28, 0.22, true);
      c.wheel(0.78, -0.78, 0.48, 0.38, false);
      c.wheel(-0.78, -0.78, 0.48, 0.38, false);
      return { seat, props: [0, 0.34, -0.13], exhausts: [[0.32, 0.62, -1.3], [-0.32, 0.62, -1.3]], top: 1.95 };
    },

    // Long body, a back compartment with dark windows, and a coffin strapped to the roof.
    hearse(c) {
      const { s, G, paint, trim, add, part, std } = c;
      const glass = std('#151a22', 0.15, 0.6);
      add(part(G.box, paint, 0, 0.62, -0.05, 1.7, 0.5, 3.6)); // body
      add(part(G.box, paint, 0, 0.92, 1.12, 1.5, 0.2, 1.15, 0.06, 0, 0)); // hood
      add(part(G.box, s.chrome, 0, 0.62, 1.78, 1.2, 0.32, 0.08)); // grille
      for (const sd of [-1, 1]) add(part(G.sph, s.white, sd * 0.62, 0.74, 1.8, 0.12, 0.09, 0.05)); // headlights
      add(part(G.box, glass, 0, 1.13, 0.5, 1.4, 0.36, 0.05, -0.5, 0, 0)); // windscreen
      add(part(G.box, paint, 0, 1.27, -1.3, 1.62, 0.78, 1.25)); // the back
      add(part(G.box, trim, 0, 1.68, -1.3, 1.5, 0.05, 1.3)); // roof trim
      for (const sd of [-1, 1]) {
        add(part(G.box, glass, sd * 0.815, 1.32, -1.38, 0.02, 0.42, 0.85)); // side windows
        add(part(G.tor, s.chrome, sd * 0.83, 1.3, -1.0, 0.2, 0.2, 0.2, 0, Math.PI / 2, 0)); // landau bars
      }
      add(part(G.box, s.wood, 0, 1.82, -1.3, 0.6, 0.2, 1.2)); // coffin
      add(part(G.box, s.wood, 0, 1.94, -1.3, 0.5, 0.06, 1.1));
      for (const sd of [-1, 1]) for (const z of [-1.7, -0.9]) add(part(G.box, s.chrome, sd * 0.31, 1.82, z, 0.03, 0.05, 0.16));
      add(part(G.box, s.chrome, 0, 0.42, -1.88, 1.6, 0.14, 0.08)); // bumper
      add(part(G.box, s.dark, 0, 0.75, -0.3, 0.8, 0.12, 0.7)); // seat

      c.steering(seat);
      c.wheel(0.95, 1.12, 0.42, 0.34, true);

      c.wheel(-0.95, -1.2, 0.42, 0.34, false);

    },

    // A clawfoot tub full of bathwater, with an outboard motor on the back.
    tub(c) {
      const { s, G, paint, trim, add, part, std } = c;
      const gold = std('#e6b432', 0.3, 0.9);
      const water = std('#9fd6e8', 0.1, 0.1);
      add(part(G.box, s.dark, 0, 0.36, 0, 1.2, 0.14, 2.2)); // chassis
      add(part(G.box, paint, 0, 0.86, 0, 1.5, 0.62, 2.2)); // tub
      for (const sd of [-1, 1]) add(part(G.cyl, paint, 0, 0.86, sd * 1.1, 0.75, 0.62, 0.42)); // rounded ends
      add(part(G.box, s.white, 0, 1.18, 0, 1.5, 0.04, 2.2)); // the rim
      for (const sd of [-1, 1]) add(part(G.cyl, s.white, 0, 1.18, sd * 1.1, 0.75, 0.04, 0.42));
      add(part(G.box, water, 0, 1.205, 0, 1.3, 0.02, 2.1)); // bathwater
      for (const sd of [-1, 1]) add(part(G.cyl, water, 0, 1.205, sd * 1.05, 0.65, 0.02, 0.33));
      for (let i = 0; i < 7; i++) add(part(G.sph, s.white, BB.rand(-0.55, 0.55), 1.22, BB.rand(-1.1, 1.1), 0.09, 0.05, 0.09)); // bubbles
      for (const sx of [-1, 1]) for (const sz of [-1, 1]) add(part(G.sph, gold, sx * 0.6, 0.5, sz * 1.05, 0.12, 0.15, 0.12)); // claw feet
      add(part(G.cyl8, s.chrome, 0, 1.38, 1.36, 0.04, 0.4, 0.04)); // faucet
      add(part(G.cyl8, s.chrome, 0, 1.56, 1.25, 0.035, 0.28, 0.035, Math.PI / 2, 0, 0));
      for (const sd of [-1, 1]) add(part(G.sph, s.chrome, sd * 0.18, 1.32, 1.34, 0.06, 0.06, 0.06));
      const duck = std('#ffd23f', 0.5);
      add(part(G.sph, duck, 0.48, 1.27, 0.75, 0.13, 0.1, 0.16)); // rubber duck
      add(part(G.sph, duck, 0.48, 1.4, 0.85, 0.08, 0.08, 0.08));
      add(part(G.cone, s.orange, 0.48, 1.39, 0.95, 0.04, 0.1, 0.03, Math.PI / 2, 0, 0));
      add(part(G.box, s.black, 0, 1.16, -1.58, 0.45, 0.55, 0.5)); // outboard motor
      add(part(G.box, trim, 0, 1.33, -1.58, 0.47, 0.12, 0.52));
      add(part(G.box, s.metal, 0, 0.62, -1.62, 0.12, 0.72, 0.14));
      add(part(G.cyl, s.metal, 0, 0.32, -1.76, 0.18, 0.04, 0.18, Math.PI / 2, 0, 0));
      const seat = [0, 0.8, -0.25];
      c.steering(seat);
      c.wheel(0.9, 0.95, 0.34, 0.28, true);
      c.wheel(-0.9, 0.95, 0.34, 0.28, true);
      c.wheel(0.9, -0.95, 0.34, 0.28, false);
      c.wheel(-0.9, -0.95, 0.34, 0.28, false);
      return { seat, props: [0, 0.12, 0.07], exhausts: [[0, 1.3, -1.86]], top: 1.7 };
    },

    // Giant wheels, a roll cage, and exhaust stacks.
    monster(c) {
      const { s, G, paint, trim, add, part } = c;
      add(part(G.box, s.dark, 0, 0.95, 0, 1.0, 0.22, 2.7)); // frame
      for (const z of [-1.05, 1.05]) {
        add(part(G.cyl, s.dark, 0, 0.72, z, 0.09, 2.0, 0.09, 0, 0, Math.PI / 2)); // axle
        for (const sd of [-1, 1]) add(part(G.cyl8, s.chrome, sd * 0.45, 0.95, z, 0.06, 0.6, 0.06, 0, 0, sd * 0.3)); // shocks
      }
      add(part(G.box, paint, 0, 1.42, 1.0, 1.65, 0.45, 1.05)); // hood
      add(part(G.box, paint, 0, 1.42, -1.12, 1.65, 0.45, 1.1)); // bed
      add(part(G.box, s.dark, 0, 1.25, -0.15, 1.5, 0.12, 1.0)); // cab floor
      for (const sd of [-1, 1]) add(part(G.box, paint, sd * 0.78, 1.5, -0.15, 0.1, 0.5, 1.0)); // cab sides
      add(part(G.box, s.chrome, 0, 1.36, 1.53, 1.2, 0.3, 0.06)); // grille
      for (const sd of [-1, 1]) add(part(G.sph, s.white, sd * 0.6, 1.45, 1.54, 0.1, 0.08, 0.04));
      add(part(G.box, s.dark, 0, 1.1, 1.62, 1.8, 0.16, 0.12)); // bumper
      for (const z of [0.3, -0.65]) {
        for (const sd of [-1, 1]) add(part(G.cyl8, s.dark, sd * 0.7, 1.95, z, 0.05, 1.0, 0.05)); // roll cage
        add(part(G.cyl8, s.dark, 0, 2.45, z, 0.05, 1.45, 0.05, 0, 0, Math.PI / 2));
      }
      for (const sd of [-1, 1]) add(part(G.cyl8, s.dark, sd * 0.7, 2.45, -0.175, 0.05, 0.95, 0.05, Math.PI / 2, 0, 0));
      for (let i = 0; i < 4; i++) add(part(G.box, s.white, -0.45 + i * 0.3, 2.53, 0.3, 0.18, 0.12, 0.08)); // light bar
      add(part(G.box, trim, 0, 2.53, 0.38, 1.3, 0.04, 0.02));
      for (const sd of [-1, 1]) add(part(G.cyl8, s.chrome, sd * 0.55, 1.95, -0.85, 0.08, 1.0, 0.08)); // stacks
      add(part(G.box, s.dark, 0, 1.36, -0.25, 0.8, 0.12, 0.7)); // seat
      add(part(G.box, s.dark, 0, 1.68, -0.62, 0.8, 0.55, 0.12));
      const seat = [0, 1.38, -0.2];
      c.steering(seat);
      c.wheel(1.02, 1.05, 0.72, 0.6, true);
      c.wheel(-1.02, 1.05, 0.72, 0.6, true);
      c.wheel(1.02, -1.05, 0.72, 0.6, false);
      c.wheel(-1.02, -1.05, 0.72, 0.6, false);
      return { seat, props: [0, 0.7, 0.12], exhausts: [[0.55, 2.5, -0.85], [-0.55, 2.5, -0.85]], top: 2.7 };
    },

    // A recliner on casters with a jet engine behind it.
    couch(c) {
      const { s, G, paint, trim, add, part } = c;
      add(part(G.box, s.dark, 0, 0.32, 0, 1.3, 0.12, 2.0)); // chassis
      add(part(G.box, paint, 0, 0.48, -0.1, 1.7, 0.32, 1.45)); // base
      add(part(G.box, paint, 0, 0.72, 0, 1.3, 0.2, 1.1)); // cushion
      for (const sd of [-1, 1]) {
        add(part(G.box, paint, sd * 0.78, 0.86, -0.1, 0.3, 0.52, 1.45)); // armrests
        add(part(G.cyl, paint, sd * 0.78, 1.12, -0.1, 0.17, 1.45, 0.17, Math.PI / 2, 0, 0));
      }
      add(part(G.box, paint, 0, 1.12, -0.74, 1.7, 0.95, 0.32, -0.18, 0, 0)); // backrest
      for (const sd of [-1, 1]) add(part(G.box, trim, sd * 0.36, 1.12, -0.55, 0.62, 0.55, 0.2, -0.18, 0, 0)); // pillows
      add(part(G.box, paint, 0, 0.52, 0.95, 1.1, 0.12, 0.55, 0.3, 0, 0)); // footrest
      add(part(G.cyl, s.chrome, 0.78, 1.25, 0.45, 0.08, 0.06, 0.08)); // cup holder
      add(part(G.cyl, s.red, 0.78, 1.34, 0.45, 0.065, 0.2, 0.065)); // big gulp
      add(part(G.box, s.black, -0.78, 1.3, 0.25, 0.1, 0.03, 0.25)); // TV remote
      add(part(G.cyl, s.metal, 0, 1.18, -1.45, 0.36, 0.95, 0.36, Math.PI / 2, 0, 0)); // jet engine
      add(part(G.tor, s.chrome, 0, 1.18, -0.98, 0.36, 0.36, 0.36)); // intake ring
      add(part(G.tor, s.dark, 0, 1.18, -1.93, 0.3, 0.3, 0.3)); // nozzle
      add(part(G.cyl, s.ember, 0, 1.18, -1.92, 0.26, 0.02, 0.26, Math.PI / 2, 0, 0)); // the glow
      for (const sd of [-1, 1]) add(part(G.box, s.dark, sd * 0.3, 1.0, -1.0, 0.08, 0.3, 0.4)); // mounts
      const seat = [0, 0.82, -0.3];
      c.steering(seat);
      c.wheel(0.82, 0.95, 0.26, 0.2, true);
      c.wheel(-0.82, 0.95, 0.26, 0.2, true);
      c.wheel(0.82, -0.95, 0.26, 0.2, false);
      c.wheel(-0.82, -0.95, 0.26, 0.2, false);
      return { seat, props: [0, 0.14, 0.02], exhausts: [[0, 1.18, -2.0]], top: 1.75 };
    },
  };
  BB.KART_BODIES = BODIES;
})();
</script>
<script>
/* ---- js/paints.js ---- */
/* BuggyBoom — kart paint jobs. "Stock" is each racer's own colours. The rest are unlocked by
   doing well in circuits or by reaching a rank, and once unlocked every racer can wear them. */
(function () {
  'use strict';
  const BB = window.BB;

  BB.PAINTS = [
    { id: 'stock', name: 'Stock', how: "The racer's own colours." },
    { id: 'flames', name: 'Hot Rod Flames', how: 'Finish a circuit in the top 3.', test: (r) => r.place <= 3 },
    { id: 'camo', name: 'Swamp Camo', how: 'Win the Trash Circuit.', test: (r) => r.place === 1 && r.circuit === 'trash' },
    { id: 'leopard', name: 'Leopard', how: 'Win the Sleaze Circuit.', test: (r) => r.place === 1 && r.circuit === 'sleaze' },
    { id: 'bloody', name: 'Crime Scene', how: 'Get 10 kills in one circuit.', test: (r) => r.kills >= 10 },
    { id: 'chrome', name: 'Chrome', how: 'Win any circuit against Nasty or Psycho CPUs.', test: (r) => r.place === 1 && (r.difficulty === 'nasty' || r.difficulty === 'psycho') },
    { id: 'gold', name: '24K Gold', how: 'Win the All-Six Bender.', test: (r) => r.place === 1 && r.circuit === 'bender' },
    { id: 'hazard', name: 'Hazard Stripes', how: 'Reach rank 11.', rank: 11 },
    { id: 'toxic', name: 'Toxic Waste', how: 'Reach rank 13.', rank: 13 },
    { id: 'zebra', name: 'Zebra', how: 'Reach rank 15.', rank: 15 },
    { id: 'disco', name: 'Disco Ball', how: 'Reach rank 16, the top.', rank: 16 },
  ];
  BB.paintById = (id) => BB.PAINTS.find((p) => p.id === id) || BB.PAINTS[0];

  const UNLOCK_KEY = 'buggyboom.unlocks';
  BB.paintUnlocked = (id) => {
    if (id === 'stock') return true;
    const p = BB.PAINTS.find((x) => x.id === id);
    if (p && p.rank) return BB.rank() >= p.rank;
    return !!BB.store.get(UNLOCK_KEY, {})[id];
  };

  // Check a finished circuit against every paint. Returns the paints newly unlocked.
  // result: { circuit, place, kills, difficulty }
  BB.checkUnlocks = (result) => {
    const got = BB.store.get(UNLOCK_KEY, {});
    const fresh = [];
    for (const p of BB.PAINTS) {
      if (!p.test || got[p.id]) continue;
      if (p.test(result)) {
        got[p.id] = true;
        fresh.push(p);
      }
    }
    if (fresh.length) BB.store.set(UNLOCK_KEY, got);
    return fresh;
  };

  // The paint a racer is wearing (falls back to stock if it's not unlocked).
  BB.paintFor = (racerId) => {
    const id = (BB.settings.paints || {})[racerId] || 'stock';
    return BB.paintUnlocked(id) ? id : 'stock';
  };

  // ---------- looks ----------

  const cache = {};
  const tex = (id, draw) => {
    if (!cache[id]) cache[id] = BB.canvasTexture(256, 256, draw, false);
    return cache[id];
  };

  const blob = (g, x, y, r) => {
    g.beginPath();
    for (let k = 0; k <= 12; k++) {
      const a = (k / 12) * BB.TAU;
      const rr = r * (0.7 + Math.random() * 0.5);
      const px = x + Math.cos(a) * rr;
      const py = y + Math.sin(a) * rr * 0.75;
      if (k === 0) g.moveTo(px, py);
      else g.lineTo(px, py);
    }
    g.fill();
  };

  const DRAW = {
    flames(g, w, h) {
      g.fillStyle = '#141216';
      g.fillRect(0, 0, w, h);
      const gr = g.createLinearGradient(0, h, 0, h * 0.15);
      gr.addColorStop(0, '#fff3a0');
      gr.addColorStop(0.35, '#ffb020');
      gr.addColorStop(0.7, '#ff5a14');
      gr.addColorStop(1, '#c0141a');
      g.fillStyle = gr;
      for (let i = 0; i < 7; i++) {
        const x = (i / 7) * w + 6;
        const top = h * (0.12 + Math.random() * 0.35);
        const lean = (Math.random() - 0.3) * 40;
        g.beginPath();
        g.moveTo(x - 14, h);
        g.bezierCurveTo(x - 30, h * 0.7, x + lean - 10, top + 50, x + lean, top);
        g.bezierCurveTo(x + lean + 8, top + 40, x + 34, h * 0.6, x + 26, h);
        g.closePath();
        g.fill();
      }
      g.strokeStyle = 'rgba(255,255,255,0.5)';
      g.lineWidth = 2;
      g.stroke();
    },
    camo(g, w, h) {
      g.fillStyle = '#56622e';
      g.fillRect(0, 0, w, h);
      for (const [c, n, r] of [['#2f3a1c', 18, 30], ['#7a6a40', 16, 26], ['#1c1c14', 14, 18], ['#6e7a3a', 10, 22]]) {
        g.fillStyle = c;
        for (let i = 0; i < n; i++) blob(g, Math.random() * w, Math.random() * h, r * (0.6 + Math.random() * 0.8));
      }
    },
    leopard(g, w, h) {
      g.fillStyle = '#d9a95e';
      g.fillRect(0, 0, w, h);
      for (let i = 0; i < 34; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h;
        const r = 8 + Math.random() * 9;
        g.fillStyle = '#a8702e';
        blob(g, x, y, r * 0.8);
        g.strokeStyle = '#24160a';
        g.lineWidth = 4;
        for (let k = 0; k < 3; k++) {
          const a = Math.random() * BB.TAU;
          g.beginPath();
          g.arc(x, y, r, a, a + 1.2 + Math.random());
          g.stroke();
        }
      }
    },
    bloody(g, w, h) {
      g.fillStyle = '#ece8de';
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#8a0c12';
      for (let i = 0; i < 9; i++) {
        const x = Math.random() * w;
        const y = Math.random() * h * 0.7;
        blob(g, x, y, 10 + Math.random() * 26);
        for (let k = 0; k < 6; k++) {
          g.beginPath();
          g.arc(x + (Math.random() - 0.5) * 80, y + (Math.random() - 0.5) * 60, 1.5 + Math.random() * 4, 0, 7);
          g.fill();
        }
        g.fillRect(x - 2, y, 4, 30 + Math.random() * 70); // drip
      }
    },
    hazard(g, w, h) {
      g.fillStyle = '#f2c414';
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#141210';
      for (let i = -h; i < w + h; i += 48) {
        g.beginPath();
        g.moveTo(i, 0);
        g.lineTo(i + 24, 0);
        g.lineTo(i + 24 - h, h);
        g.lineTo(i - h, h);
        g.closePath();
        g.fill();
      }
    },
    toxic(g, w, h) {
      g.fillStyle = '#1b2414';
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#7bea2a';
      for (let i = 0; i < 10; i++) {
        const x = Math.random() * w;
        blob(g, x, Math.random() * h * 0.6, 12 + Math.random() * 20);
        g.fillRect(x - 3, 0, 6, 40 + Math.random() * 120); // ooze
      }
      g.fillStyle = 'rgba(200,255,120,0.7)';
      for (let i = 0; i < 40; i++) {
        g.beginPath();
        g.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 0, 7);
        g.fill();
      }
    },
    zebra(g, w, h) {
      g.fillStyle = '#f4f1ea';
      g.fillRect(0, 0, w, h);
      g.fillStyle = '#121212';
      for (let i = 0; i < 9; i++) {
        const y0 = (i / 9) * h + Math.random() * 10;
        g.beginPath();
        g.moveTo(0, y0);
        for (let x = 0; x <= w; x += 16) g.lineTo(x, y0 + Math.sin(x / 30 + i) * 9 + Math.random() * 3);
        for (let x = w; x >= 0; x -= 16) g.lineTo(x, y0 + 10 + Math.sin(x / 26 + i * 2) * 7 + Math.random() * 4);
        g.closePath();
        g.fill();
      }
    },
    disco(g, w, h) {
      const n = 16;
      const sz = w / n;
      const tones = ['#f4f6fa', '#c8ccd6', '#9aa0ae', '#e8eaf2', '#ff8ad8', '#8ad8ff', '#fff27a'];
      for (let y = 0; y < n; y++) {
        for (let x = 0; x < n; x++) {
          g.fillStyle = Math.random() < 0.85 ? tones[(Math.random() * 4) | 0] : tones[4 + ((Math.random() * 3) | 0)];
          g.fillRect(x * sz, y * sz, sz - 1.5, sz - 1.5);
        }
      }
    },
  };

  // A 64 x 64 canvas filled with evenly spaced colours, top to bottom (or corner to corner).
  function gradCanvas(colors, diagonal) {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, diagonal ? 64 : 0, 64);
    colors.forEach((col, i) => gr.addColorStop(i / (colors.length - 1), col));
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return c;
  }

  // A simple reflection map so the metal paints have something to shine.
  let env = null;
  function envMap() {
    if (env) return env;
    const side = () => gradCanvas(['#fff6e6', '#9a8a86', '#2a2226']);
    env = new THREE.CubeTexture([side(), side(), gradCanvas(['#ffffff', '#fff8ec', '#fff0dc']), gradCanvas(['#1a1416', '#1a1416', '#120e10']), side(), side()]);
    env.needsUpdate = true;
    return env;
  }

  // Material settings for a kart body in this paint.
  BB.paintLook = (paintId, racer) => {
    switch (paintId) {
      case 'flames':
      case 'camo':
      case 'leopard':
      case 'bloody':
      case 'hazard':
      case 'zebra':
        return { color: '#ffffff', map: tex(paintId, DRAW[paintId]), roughness: paintId === 'bloody' ? 0.3 : 0.5, metalness: 0.2 };
      case 'toxic':
        return { color: '#ffffff', map: tex(paintId, DRAW[paintId]), roughness: 0.35, metalness: 0.1, emissive: '#1f4a08' };
      case 'disco':
        return { color: '#ffffff', map: tex(paintId, DRAW[paintId]), roughness: 0.15, metalness: 0.85, envMap: envMap() };
      case 'gold':
        return { color: '#e6b432', metalness: 1, roughness: 0.22, envMap: envMap() };
      case 'chrome':
        return { color: '#f2f2f8', metalness: 1, roughness: 0.06, envMap: envMap() };
      default:
        return { color: racer.color, roughness: 0.42, metalness: 0.35 };
    }
  };

  // A small picture of the paint for the menu.
  const swatches = {};
  BB.paintSwatch = (paintId, racer) => {
    if (paintId === 'stock') return `linear-gradient(135deg, ${racer.color} 0 60%, ${racer.accent} 60% 100%)`;
    if (swatches[paintId]) return swatches[paintId];
    let url;
    if (DRAW[paintId]) url = tex(paintId, DRAW[paintId]).image.toDataURL();
    else url = gradCanvas(paintId === 'gold' ? ['#fff2b0', '#e6b432', '#7a5a10', '#f6d870'] : ['#ffffff', '#b8bcc8', '#4a4e58', '#e8eaf0'], true).toDataURL();
    swatches[paintId] = `url(${url}) center / cover`;
    return swatches[paintId];
  };
})();
</script>
<script>
/* ---- js/progress.js ---- */
/* BuggyBoom — progression. Every race earns Cred: for finishing, for everyone you beat, for kills,
   tricks and shortcuts, and more against tougher CPUs. Cred raises your Rank, and each new rank
   unlocks something: a racer, a kart or a paint job. Saved in this browser, like the settings. */
(function () {
  'use strict';
  const BB = window.BB;

  const KEY = 'buggyboom.progress';

  BB.RANKS = [
    "Learner's Permit",
    'Parking Lot Menace',
    'Fender Bender',
    'Hit and Run',
    'Road Rager',
    'Insurance Nightmare',
    'Demolition Dropout',
    'Wanted in Three Counties',
    'Junkyard Dog',
    'Certified Maniac',
    'Public Menace',
    'Body Count Champ',
    'Lord of the Landfill',
    'Dumpster Royalty',
    'Living Legend',
    'Hall of Shame',
  ];
  BB.MAX_RANK = BB.RANKS.length;
  BB.rankName = (n) => BB.RANKS[BB.clamp(n, 1, BB.MAX_RANK) - 1];

  // Cred to get from rank n to rank n + 1. Early ranks come quickly.
  const step = (n) => 50 + 15 * n;
  // Total cred needed to reach a rank.
  BB.credForRank = (rank) => {
    let c = 0;
    for (let n = 1; n < rank; n++) c += step(n);
    return c;
  };
  BB.rankOf = (cred) => {
    let r = 1;
    while (r < BB.MAX_RANK && cred >= BB.credForRank(r + 1)) r++;
    return r;
  };

  let cache = null;
  const load = () => Object.assign({ cred: 0, races: 0, wins: 0 }, BB.store.get(KEY, {}));
  BB.progress = () => {
    if (!cache) cache = load();
    return cache;
  };
  const save = (p) => {
    cache = p;
    BB.store.set(KEY, p);
  };
  BB.rank = () => BB.rankOf(BB.progress().cred);

  // How far through the current rank, for the bars: { rank, cred, lo, hi, pct, toGo }.
  BB.rankInfo = (cred) => {
    if (cred == null) cred = BB.progress().cred;
    const rank = BB.rankOf(cred);
    const lo = BB.credForRank(rank);
    const hi = rank < BB.MAX_RANK ? BB.credForRank(rank + 1) : null;
    return { rank, cred, lo, hi, pct: hi ? (cred - lo) / (hi - lo) : 1, toGo: hi ? hi - cred : 0 };
  };

  // Everything that unlocks by rank, from the racer, kart and paint lists, in rank order.
  BB.rewards = () => {
    const out = [];
    for (const r of BB.RACERS) if (r.unlock) out.push({ type: 'racer', id: r.id, rank: r.unlock, name: r.name });
    for (const k of BB.KARTS) if (k.unlock) out.push({ type: 'kart', id: k.id, rank: k.unlock, name: k.name });
    for (const p of BB.PAINTS) if (p.rank) out.push({ type: 'paint', id: p.id, rank: p.rank, name: p.name });
    return out.sort((a, b) => a.rank - b.rank);
  };

  BB.racerUnlocked = (id) => {
    const r = BB.RACERS.find((x) => x.id === id);
    return !!r && (!r.unlock || BB.rank() >= r.unlock);
  };
  BB.kartUnlocked = (id) => {
    const k = BB.KARTS.find((x) => x.id === id);
    return !!k && (!k.unlock || BB.rank() >= k.unlock);
  };
  BB.unlockedRacers = () => BB.RACERS.filter((r) => BB.racerUnlocked(r.id));
  BB.unlockedKarts = () => BB.KARTS.filter((k) => BB.kartUnlocked(k.id));

  // The kart a racer drives (falls back to the buggy if it's not unlocked).
  BB.kartFor = (racerId) => {
    const id = (BB.settings.karts || {})[racerId] || 'buggy';
    return BB.kartUnlocked(id) ? id : 'buggy';
  };
  // CPUs drive the buggy about half the time, otherwise any kart you've unlocked.
  BB.cpuKart = () => {
    const open = BB.unlockedKarts();
    return open.length > 1 && Math.random() < 0.5 ? BB.pick(open.slice(1)).id : 'buggy';
  };

  // ---------- earning cred ----------

  const LEVEL_MULT = { pushover: 0.5, easy: 0.75, normal: 1, nasty: 1.35, psycho: 1.75 };
  // How much the CPUs make a race worth: the average of their levels. No CPUs counts as normal.
  BB.credMult = (levels) => {
    if (!levels.length) return 1;
    const m = levels.reduce((a, l) => a + (LEVEL_MULT[l] || 1), 0) / levels.length;
    return Math.round(m * 100) / 100;
  };

  const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
  const tally = (parts, mult) => {
    let total = parts.reduce((a, p) => a + p[1], 0);
    if (mult !== 1 && total > 0) {
      const t2 = Math.round(total * mult);
      parts.push([(mult > 1 ? 'Tough CPUs' : 'Soft CPUs') + ' ×' + mult, t2 - total]);
      total = t2;
    }
    return { total: Math.max(0, total), parts };
  };

  // Cred for one racer's race. row: from Race.results.
  // x: { laps, racers (how many raced), mult, tricks, shortcuts }
  BB.credFor = (row, x) => {
    const lf = x.laps / 3; // longer races pay more
    const parts = [];
    const add = (label, n) => {
      n = Math.round(n);
      if (n > 0) parts.push([label, n]);
    };
    add(row.projected ? 'Showed up' : 'Finished', (row.projected ? 5 : 15) * lf);
    const beaten = x.racers - row.place;
    if (beaten > 0) add('Beat ' + plural(beaten, 'racer', 'racers'), beaten * 4 * lf);
    if (row.place === 1 && x.racers > 1) add('Won', 15 * lf);
    if (row.kills) add(plural(row.kills, 'kill', 'kills'), row.kills * 4);
    if (x.tricks) add(plural(x.tricks, 'trick', 'tricks'), x.tricks);
    if (x.shortcuts) add(plural(x.shortcuts, 'shortcut', 'shortcuts'), x.shortcuts * 3);
    return tally(parts, x.mult);
  };

  // A circuit's trophy bonus. place: where you finished overall.
  BB.circuitCred = (place, races, mult) => {
    const f = races / 3;
    const trophy = [[BB.TROPHIES[0], 60], [BB.TROPHIES[1], 40], [BB.TROPHIES[2], 25]][place - 1];
    const parts = [trophy ? [trophy[0], Math.round(trophy[1] * f)] : ['Finished the circuit', Math.round(10 * f)]];
    return tally(parts, mult);
  };

  // A time trial: a little for every lap, more for beating your best.
  BB.trialCred = (res) => {
    const parts = [[plural(res.laps.length, 'lap', 'laps'), res.laps.length * 4]];
    if (res.lapRecord) parts.push(['New best lap', 15]);
    if (res.raceRecord) parts.push(['New record', 10]);
    return tally(parts, 1);
  };

  // Bank some cred. Returns what changed: { gained, cred, before, after, unlocked: [rewards] }.
  BB.addCred = (n, stats) => {
    const p = load(); // fresh, in case another tab of the game saved since
    const before = BB.rankOf(p.cred);
    p.cred += Math.max(0, Math.round(n));
    if (stats) {
      p.races += stats.races || 0;
      p.wins += stats.wins || 0;
    }
    save(p);
    const after = BB.rankOf(p.cred);
    const unlocked = BB.rewards().filter((r) => r.rank > before && r.rank <= after);
    return { gained: Math.round(n), cred: p.cred, before, after, unlocked };
  };

  // Bank one breakdown from credFor / circuitCred / trialCred, keeping it for the results screen.
  BB.bankCred = (got, stats) => {
    const res = BB.addCred(got.total, stats);
    res.per = [{ label: '', name: '', total: got.total, parts: got.parts }];
    return res;
  };
})();
</script>
<script>
/* ---- js/lineup.js ---- */
/* BuggyBoom — who's racing. Up to 8 racers: local players, online players, and CPUs filling
   every spot nobody's in. CPU difficulty is a preset for all of them, or custom per racer. */
(function () {
  'use strict';
  const BB = window.BB;

  BB.MAX_RACERS = 8; // a full grid: players plus CPUs

  // skill: driving and item smarts (0-1). speed: top-speed multiplier.
  // shortcut: chance to take a secret shortcut. aggro: how keen they are to use items.
  BB.CPU_LEVELS = {
    pushover: { name: 'Pushover', skill: 0.15, speed: 0.82, shortcut: 0.05, aggro: 0.45, startBoost: 0.1, blurb: 'Slow, clumsy, barely uses items.' },
    easy: { name: 'Easy', skill: 0.3, speed: 0.87, shortcut: 0.12, aggro: 0.65, startBoost: 0.25, blurb: 'Takes it easy. Drifts sometimes.' },
    normal: { name: 'Normal', skill: 0.62, speed: 0.95, shortcut: 0.32, aggro: 0.85, startBoost: 0.45, blurb: 'A fair fight.' },
    nasty: { name: 'Nasty', skill: 0.9, speed: 1.02, shortcut: 0.6, aggro: 1, startBoost: 0.65, blurb: 'Fast, drifts well, loves shortcuts, fires everything.' },
    psycho: { name: 'Psycho', skill: 1, speed: 1.07, shortcut: 0.85, aggro: 1.25, startBoost: 0.85, blurb: 'Faster than you. Knows every shortcut. Holds a grudge.' },
  };
  BB.CPU_LEVEL_IDS = Object.keys(BB.CPU_LEVELS);
  BB.cpuLevel = (id) => BB.CPU_LEVELS[id] || BB.CPU_LEVELS.normal;

  // The local players' racer picks, P1 to P4 (always 4 long, all different, all unlocked).
  BB.partyPicks = () => {
    const st = BB.settings;
    const open = BB.unlockedRacers();
    const out = [BB.racerUnlocked(st.racer) ? st.racer : open[0].id];
    for (const id of st.picks || []) if (out.length < 4 && !out.includes(id) && BB.racerUnlocked(id)) out.push(id);
    for (const r of open) if (out.length < 4 && !out.includes(r.id)) out.push(r.id);
    return out;
  };
  // Give player i racer id; if another player has it, they swap.
  BB.setPick = (i, id) => {
    const p = BB.partyPicks();
    const j = p.indexOf(id);
    if (j >= 0 && j !== i) p[j] = p[i];
    p[i] = id;
    BB.settings.racer = p[0];
    BB.settings.picks = p.slice(1);
  };

  // How a racer is labelled in results and standings: "you", "P2", their online name, or
  // "Nasty CPU". e: { kind, local, name, level }; localPlayers: how many play on this computer.
  BB.whoLabel = (e, localPlayers) => {
    if (e.kind === 'human') return localPlayers > 1 ? 'P' + (e.local + 1) : 'you';
    if (e.kind === 'remote') return e.name || 'online';
    return e.name || BB.cpuLevel(e.level).name + ' CPU'; // a CPU named for the player it replaced
  };

  // A short description of the CPU setup, for buttons and intros.
  BB.cpuSummary = (humans) => {
    const st = BB.settings;
    humans = humans || 1;
    const custom = st.difficulty === 'custom';
    const n = custom ? BB.customCpus(BB.partyPicks().slice(0, humans)).length : Math.min(st.cpuCount, BB.MAX_RACERS - humans);
    return n + (n === 1 ? ' CPU' : ' CPUs') + ' · ' + (custom ? 'Custom' : BB.cpuLevel(st.difficulty).name);
  };

  // In custom mode: every unlocked racer not taken by a player, with their own level (or 'out').
  // Only as many as fit (8 racers in all); the rest sit this one out.
  BB.customCpus = (taken) => {
    const custom = BB.settings.cpuCustom || {};
    return BB.unlockedRacers()
      .filter((r) => !taken.includes(r.id))
      .map((r) => ({ racer: r.id, level: custom[r.id] || 'normal' }))
      .filter((c) => c.level !== 'out')
      .slice(0, Math.max(0, BB.MAX_RACERS - taken.length));
  };

  // Build the starting field in grid order.
  // humans: [{ racer, kind: 'human' | 'remote', local, name, paint, kart, peer }]
  BB.makeField = (humans, opts) => {
    opts = opts || {};
    const st = BB.settings;
    const taken = humans.map((h) => h.racer);
    let cpus;
    if (opts.noCpus) cpus = [];
    else if (st.difficulty === 'custom') cpus = BB.customCpus(taken);
    else {
      const free = BB.unlockedRacers().filter((r) => !taken.includes(r.id));
      const n = Math.min(st.cpuCount, BB.MAX_RACERS - humans.length);
      cpus = BB.shuffle(free).slice(0, n).map((r) => ({ racer: r.id, level: st.difficulty }));
    }
    const grid = BB.shuffle(cpus.map((c) => ({ racer: c.racer, kind: 'cpu', level: c.level, kart: BB.cpuKart() })));
    // Players start near the back with a couple of CPUs behind them.
    grid.splice(Math.max(0, grid.length - 2), 0, ...humans.map((h) => Object.assign({ paint: BB.paintFor(h.racer), kart: BB.kartFor(h.racer) }, h)));
    return grid;
  };
})();
</script>
<script>
/* ---- js/path.js ---- */
/* BuggyBoom — a road path: a smooth curve sampled every ~0.8 m.
   The main track is a closed path; shortcuts are open paths that branch off it.
   locate() finds the nearest sample and returns distance along the path (s), sideways offset
   (d, + is right) and road height. Directions: forward (tx, tz), right (rx, rz) = (-tz, tx). */
(function () {
  'use strict';
  const BB = window.BB;

  class Path {
    constructor(points, closed, step) {
      const T = THREE;
      step = step || 0.8;
      const curve = new T.CatmullRomCurve3(points.map((p) => new T.Vector3(p[0], p[1], p[2])), closed, 'centripetal');
      const L = curve.getLength();
      const segs = Math.max(4, Math.round(L / step));
      const pts = curve.getSpacedPoints(segs);
      const n = closed ? segs : segs + 1;
      this.closed = closed;
      this.n = n;
      this.L = L;
      this.step = L / segs;
      this.X = new Float32Array(n);
      this.Y = new Float32Array(n);
      this.Z = new Float32Array(n);
      this.TX = new Float32Array(n);
      this.TZ = new Float32Array(n);
      this.H = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        this.X[i] = pts[i].x;
        this.Y[i] = Math.max(0, pts[i].y);
        this.Z[i] = pts[i].z;
      }
      this.tangents();
      this._loc = {};
      this._smp = {};
    }

    tangents() {
      const n = this.n;
      for (let i = 0; i < n; i++) {
        const a = this.idx(i - 2);
        const b = this.idx(i + 2);
        const tx = this.X[b] - this.X[a];
        const tz = this.Z[b] - this.Z[a];
        const l = Math.hypot(tx, tz) || 1;
        this.TX[i] = tx / l;
        this.TZ[i] = tz / l;
        this.H[i] = Math.atan2(this.TX[i], this.TZ[i]);
      }
    }

    idx(i) {
      const n = this.n;
      if (this.closed) return ((i % n) + n) % n;
      return i < 0 ? 0 : i > n - 1 ? n - 1 : i;
    }

    wrapS(s) {
      if (!this.closed) return BB.clamp(s, 0, this.L);
      s %= this.L;
      return s < 0 ? s + this.L : s;
    }

    // Index of the sample nearest to world point (x, z), searching everything.
    nearest(x, z) {
      let best = 0;
      let bd = Infinity;
      for (let i = 0; i < this.n; i++) {
        const dx = x - this.X[i];
        const dz = z - this.Z[i];
        const d = dx * dx + dz * dz;
        if (d < bd) {
          bd = d;
          best = i;
        }
      }
      return best;
    }

    // Position and direction at distance s along the path.
    sampleAt(s, out) {
      out = out || this._smp;
      s = this.wrapS(s);
      const f = s / this.step;
      let i = Math.floor(f);
      if (!this.closed && i >= this.n - 1) i = this.n - 2;
      i = this.idx(i);
      const j = this.idx(i + 1);
      const t = BB.clamp(f - i, 0, 1);
      out.x = this.X[i] + (this.X[j] - this.X[i]) * t;
      out.y = this.Y[i] + (this.Y[j] - this.Y[i]) * t;
      out.z = this.Z[i] + (this.Z[j] - this.Z[i]) * t;
      this.dir(i, j, t, out);
      out.i = i;
      out.s = s;
      return out;
    }

    // The road's direction t of the way from sample a to sample b: forward (tx, tz), right (rx, rz).
    dir(a, b, t, out) {
      let tx = this.TX[a] + (this.TX[b] - this.TX[a]) * t;
      let tz = this.TZ[a] + (this.TZ[b] - this.TZ[a]) * t;
      const l = Math.hypot(tx, tz) || 1;
      tx /= l;
      tz /= l;
      out.tx = tx;
      out.tz = tz;
      out.rx = -tz;
      out.rz = tx;
    }

    // Signed change of heading over the next `dist` metres. + is a left turn.
    bend(s, dist) {
      const i = this.idx(Math.floor(this.wrapS(s) / this.step));
      const j = this.idx(Math.floor(this.wrapS(s + dist) / this.step));
      return BB.wrapAngle(this.H[j] - this.H[i]);
    }

    // Nearest point on the centre line. hint = last known sample index (or -1 to search everything).
    locate(x, z, hint, out) {
      out = out || this._loc;
      const X = this.X;
      const Z = this.Z;
      let best = 0;
      if (hint == null || hint < 0) best = this.nearest(x, z);
      else {
        let bd = Infinity;
        for (let k = -18; k <= 18; k++) {
          const i = hint + k;
          if (!this.closed && (i < 0 || i >= this.n)) continue;
          const j = this.idx(i);
          const dx = x - X[j];
          const dz = z - Z[j];
          const d = dx * dx + dz * dz;
          if (d < bd) {
            bd = d;
            best = j;
          }
        }
      }
      const st2 = this.step * this.step;
      let a = best;
      let b = this.idx(best + 1);
      if (!this.closed && best === this.n - 1) {
        a = best - 1;
        b = best;
      }
      let t = ((x - X[a]) * (X[b] - X[a]) + (z - Z[a]) * (Z[b] - Z[a])) / st2;
      if (t < 0 && (this.closed || a > 0)) {
        b = a;
        a = this.idx(a - 1);
        t = ((x - X[a]) * (X[b] - X[a]) + (z - Z[a]) * (Z[b] - Z[a])) / st2;
      }
      t = BB.clamp(t, 0, 1);
      const px = X[a] + (X[b] - X[a]) * t;
      const pz = Z[a] + (Z[b] - Z[a]) * t;
      this.dir(a, b, t, out);
      out.i = best;
      out.s = this.wrapS((a + t) * this.step);
      out.y = this.Y[a] + (this.Y[b] - this.Y[a]) * t;
      out.d = (x - px) * out.rx + (z - pz) * out.rz;
      return out;
    }

    // Raise the road for a jump. kind 'kicker': a ramp that ends in a sheer drop at s.
    // kind 'hump': a smooth bump centred on s that throws fast karts into the air.
    addJump(s, len, h, kind) {
      const n = Math.round(len / this.step);
      const c = Math.round(this.wrapS(s) / this.step);
      if (kind === 'hump') {
        for (let k = -n; k <= n; k++) {
          const i = this.idx(c + k);
          const v = Math.cos(((k / n) * Math.PI) / 2);
          this.Y[i] += h * v * v;
        }
      } else {
        for (let k = 0; k <= n; k++) {
          const i = this.idx(c - n + k);
          this.Y[i] += h * Math.pow(k / n, 1.5);
        }
      }
    }

    bounds() {
      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      for (let i = 0; i < this.n; i++) {
        minX = Math.min(minX, this.X[i]);
        maxX = Math.max(maxX, this.X[i]);
        minZ = Math.min(minZ, this.Z[i]);
        maxZ = Math.max(maxZ, this.Z[i]);
      }
      return { minX, maxX, minZ, maxZ, cx: (minX + maxX) / 2, cz: (minZ + maxZ) / 2 };
    }
  }

  BB.Path = Path;
})();
</script>
<script>
/* ---- js/track.js ---- */
/* BuggyBoom — the track engine. Builds any track from a definition in js/tracks/:
   the main road (a closed Path), its look (sky, fog, light, textures), jumps, boost pads, item
   crates, secret shortcuts (open Paths that branch off behind breakable walls), tunnels, and
   per-track hazards (methane geysers, sludge, blood slicks, carnival spinners, propane tanks,
   seagulls). Karts and projectiles ask probe() where they are; it moves them between the main
   road and shortcuts. */
(function () {
  'use strict';
  const BB = window.BB;

  BB.TRACKS = [];
  BB.addTrack = (def) => BB.TRACKS.push(def);
  BB.trackById = (id) => BB.TRACKS.find((t) => t.id === id) || BB.TRACKS[0];

  // ---------- textures ----------

  const TEX = {
    road(o) {
      return BB.canvasTexture(256, 512, (g, w, h) => {
        g.fillStyle = o.base;
        g.fillRect(0, 0, w, h);
        BB.speckle(g, w, h, 9000, o.specks, 1.6);
        for (let i = 0; i < (o.patches == null ? 12 : o.patches); i++) {
          g.fillStyle = `rgba(10,10,12,${0.1 + Math.random() * 0.18})`;
          g.beginPath();
          g.ellipse(Math.random() * w, Math.random() * h, 8 + Math.random() * 30, 6 + Math.random() * 22, Math.random() * 3, 0, 7);
          g.fill();
        }
        if (o.slabs) {
          g.strokeStyle = 'rgba(0,0,0,0.35)';
          g.lineWidth = 2;
          for (let y = 0; y < h; y += 64) {
            g.beginPath();
            g.moveTo(0, y);
            g.lineTo(w, y);
            g.stroke();
          }
          g.beginPath();
          g.moveTo(w / 2, 0);
          g.lineTo(w / 2, h);
          g.stroke();
        }
        if (o.tracks) {
          g.fillStyle = 'rgba(0,0,0,0.16)';
          g.fillRect(w * 0.27, 0, 26, h);
          g.fillRect(w * 0.68, 0, 26, h);
        }
        g.strokeStyle = 'rgba(14,13,15,0.6)';
        g.lineWidth = 1.3;
        for (let i = 0; i < (o.cracks == null ? 7 : o.cracks); i++) {
          g.beginPath();
          let x = Math.random() * w;
          let y = Math.random() * h;
          g.moveTo(x, y);
          for (let k = 0; k < 6; k++) {
            x += (Math.random() - 0.5) * 34;
            y += (Math.random() - 0.5) * 34;
            g.lineTo(x, y);
          }
          g.stroke();
        }
        if (o.grates) {
          g.fillStyle = '#141414';
          g.fillRect(18, h * 0.4, 34, 48);
          g.strokeStyle = '#4a4a4a';
          g.lineWidth = 3;
          for (let y = h * 0.4 + 6; y < h * 0.4 + 46; y += 8) {
            g.beginPath();
            g.moveTo(20, y);
            g.lineTo(50, y);
            g.stroke();
          }
        }
        if (o.edge) {
          if (o.glow) {
            g.shadowColor = o.edge;
            g.shadowBlur = 14;
          }
          g.fillStyle = o.edge;
          g.fillRect(5, 0, 6, h);
          g.fillRect(w - 11, 0, 6, h);
          g.shadowBlur = 0;
        }
        if (o.center) {
          g.fillStyle = o.center;
          if (o.double) {
            g.fillRect(w / 2 - 7, 0, 4, h);
            g.fillRect(w / 2 + 3, 0, 4, h);
          } else g.fillRect(w / 2 - 3, 0, 6, o.dash === false ? h : h * 0.45);
        }
      });
    },

    curb(a, b) {
      return BB.canvasTexture(32, 64, (g, w, h) => {
        g.fillStyle = a;
        g.fillRect(0, 0, w, h / 2);
        g.fillStyle = b;
        g.fillRect(0, h / 2, w, h / 2);
      });
    },

    ground(kind, base) {
      return BB.canvasTexture(256, 256, (g, w, h) => {
        const P = {
          dirt: ['#6a523c', ['#5a4532', '#7a5f45', '#4d3a2a', '#857055', '#3f3022', '#6f5a48']],
          trash: ['#5f523f', ['#4f4434', '#6d5f49', '#3e352a', '#7c6c53', '#2f281f']],
          grass: ['#6f7f3a', ['#5f6f2f', '#80904a', '#4f5f28', '#8a8a4a', '#6a5a38']],
          concrete: ['#77736e', ['#6a6661', '#85817b', '#5d5955', '#8f8a84']],
          sludge: ['#2f3324', ['#262a1c', '#3a3f2b', '#1e2116', '#444a30']],
          lot: ['#2c2830', ['#24212a', '#36323a', '#1c1a20', '#403b44']],
        }[kind] || [base, [base]];
        g.fillStyle = P[0];
        g.fillRect(0, 0, w, h);
        BB.speckle(g, w, h, 7000, P[1], 2.2);
        if (kind === 'trash') {
          const lit = ['#c23b22', '#2f74e0', '#e8e2d6', '#3f8a46', '#f2c414', '#7b4fa8', '#ff7d1a'];
          for (let i = 0; i < 160; i++) {
            g.fillStyle = lit[(Math.random() * lit.length) | 0];
            g.globalAlpha = 0.55 + Math.random() * 0.4;
            g.fillRect(Math.random() * w, Math.random() * h, 2 + Math.random() * 6, 1 + Math.random() * 4);
          }
          g.globalAlpha = 1;
        } else if (kind === 'grass') {
          for (let i = 0; i < 60; i++) {
            g.fillStyle = Math.random() < 0.5 ? 'rgba(150,140,80,0.35)' : 'rgba(110,80,50,0.3)';
            g.beginPath();
            g.arc(Math.random() * w, Math.random() * h, 4 + Math.random() * 14, 0, 7);
            g.fill();
          }
        } else if (kind === 'concrete' || kind === 'lot') {
          g.strokeStyle = 'rgba(0,0,0,0.3)';
          g.lineWidth = 2;
          for (let x = 0; x <= w; x += 64) {
            g.beginPath();
            g.moveTo(x, 0);
            g.lineTo(x, h);
            g.moveTo(0, x);
            g.lineTo(w, x);
            g.stroke();
          }
        }
        for (let i = 0; i < 40; i++) {
          g.fillStyle = `rgba(${30 + Math.random() * 60},${25 + Math.random() * 40},${20 + Math.random() * 30},0.45)`;
          g.beginPath();
          g.arc(Math.random() * w, Math.random() * h, 1 + Math.random() * 3, 0, 7);
          g.fill();
        }
      });
    },

    // Wall faces. Returns { tex, aspect } where aspect = width / height of one repeat.
    wall(kind) {
      const mk = (cw, ch, draw) => ({ tex: BB.canvasTexture(cw, ch, draw), aspect: cw / ch });
      const tag = (g, x, y, text, col, size) => {
        g.save();
        g.translate(x, y);
        g.rotate((Math.random() - 0.5) * 0.25);
        g.font = 'bold ' + size + 'px Impact, "Arial Black", sans-serif';
        g.fillStyle = col;
        g.globalAlpha = 0.85;
        g.fillText(text, 0, 0);
        g.restore();
      };
      switch (kind) {
        case 'bales':
          return mk(1024, 96, (g, w, h) => {
            g.fillStyle = '#2a241c';
            g.fillRect(0, 0, w, h);
            const lit = ['#c23b22', '#2f74e0', '#e8e2d6', '#3f8a46', '#f2c414', '#7b4fa8', '#ff7d1a', '#8a8070'];
            for (let row = 0; row < 2; row++) {
              let x = row ? -40 : 0;
              while (x < w) {
                const bw = 90 + Math.random() * 60;
                const y0 = row * 48 + 2;
                g.fillStyle = ['#6a6152', '#5e5648', '#776d5c'][(Math.random() * 3) | 0];
                g.fillRect(x + 2, y0, bw - 4, 44);
                for (let i = 0; i < bw * 2.2; i++) {
                  g.fillStyle = lit[(Math.random() * lit.length) | 0];
                  g.fillRect(x + 2 + Math.random() * (bw - 8), y0 + Math.random() * 40, 2 + Math.random() * 5, 1 + Math.random() * 3);
                }
                g.fillStyle = '#111';
                g.fillRect(x + 2, y0 + 13, bw - 4, 3);
                g.fillRect(x + 2, y0 + 29, bw - 4, 3);
                x += bw;
              }
            }
          });
        case 'brick':
          return mk(512, 128, (g, w, h) => {
            g.fillStyle = '#2a2420';
            g.fillRect(0, 0, w, h);
            for (let row = 0; row < 8; row++) {
              const off = row % 2 ? 20 : 0;
              for (let x = -off; x < w; x += 40) {
                const v = 60 + Math.random() * 40;
                g.fillStyle = `rgb(${v + 30},${v * 0.55},${v * 0.42})`;
                g.fillRect(x + 1, row * 16 + 1, 38, 14);
              }
            }
            const gr = g.createLinearGradient(0, h, 0, h * 0.45);
            gr.addColorStop(0, 'rgba(70,110,30,0.85)');
            gr.addColorStop(1, 'rgba(70,110,30,0)');
            g.fillStyle = gr;
            g.fillRect(0, 0, w, h);
            for (let i = 0; i < 14; i++) {
              g.fillStyle = 'rgba(90,140,40,0.6)';
              g.fillRect(Math.random() * w, h * 0.3 + Math.random() * 30, 3, 20 + Math.random() * 40);
            }
          });
        case 'neon':
          return mk(1024, 64, (g, w, h) => {
            g.fillStyle = '#1c1024';
            g.fillRect(0, 0, w, h);
            BB.speckle(g, w, h, 2500, ['#251630', '#150c1a', '#2c1a38'], 1.5);
            g.shadowBlur = 14;
            g.shadowColor = '#ff3bd6';
            g.fillStyle = '#ff6be0';
            g.fillRect(0, 20, w, 5);
            g.shadowColor = '#3fe0f0';
            g.fillStyle = '#7ff0ff';
            g.fillRect(0, 44, w, 3);
            g.shadowColor = '#ffd23f';
            g.fillStyle = '#fff2a0';
            for (let x = 8; x < w; x += 32) {
              g.beginPath();
              g.arc(x, 9, 3.5, 0, 7);
              g.fill();
            }
            g.shadowBlur = 0;
          });
        case 'steel':
          return mk(512, 64, (g, w, h) => {
            for (let x = 0; x < w; x += 8) {
              const v = 95 + Math.sin(x / 2.6) * 25;
              g.fillStyle = `rgb(${v},${v},${v + 4})`;
              g.fillRect(x, 0, 8, h);
            }
            for (let i = 0; i < 12; i++) {
              g.fillStyle = `rgba(120,60,30,${0.2 + Math.random() * 0.3})`;
              g.fillRect(Math.random() * w, Math.random() * h, 10 + Math.random() * 40, 4 + Math.random() * 20);
            }
            for (let i = 0; i < 6; i++) {
              g.fillStyle = 'rgba(120,8,12,0.75)';
              const x = Math.random() * w;
              g.fillRect(x, Math.random() * 20, 6 + Math.random() * 10, 10 + Math.random() * 30);
              g.fillRect(x + 3, 10, 3, 40 + Math.random() * 14);
            }
          });
        case 'fence':
          return mk(512, 64, (g, w, h) => {
            for (let x = 0; x < w; x += 22) {
              const v = 0.75 + Math.random() * 0.35;
              g.fillStyle = `rgb(${150 * v},${105 * v},${62 * v})`;
              g.fillRect(x, 0, 20, h);
              g.fillStyle = 'rgba(0,0,0,0.5)';
              g.fillRect(x + 20, 0, 2, h);
            }
            g.fillStyle = 'rgba(0,0,0,0.25)';
            g.fillRect(0, 12, w, 4);
            g.fillRect(0, 46, w, 4);
            tag(g, 40, 40, 'KEEP OUT', '#d8262a', 22);
            tag(g, 300, 42, 'NO TRESPASSIN', '#f4f1ea', 18);
          });
        case 'junk':
          return mk(512, 64, (g, w, h) => {
            g.fillStyle = '#3a3028';
            g.fillRect(0, 0, w, h);
            const cols = ['#7a3b1c', '#5a6670', '#8a2f28', '#3d5a3a', '#9a7a3a', '#40404a', '#6a5a4a'];
            for (let i = 0; i < 60; i++) {
              g.fillStyle = cols[(Math.random() * cols.length) | 0];
              g.fillRect(Math.random() * w, Math.random() * h, 14 + Math.random() * 50, 8 + Math.random() * 24);
            }
          });
        case 'haunt':
          return mk(512, 128, (g, w, h) => {
            for (let x = 0; x < w; x += 32) {
              const v = 30 + Math.random() * 20;
              g.fillStyle = `rgb(${v + 14},${v},${v + 20})`;
              g.fillRect(x, 0, 30, h);
            }
            g.shadowColor = '#c6ff3a';
            g.shadowBlur = 10;
            g.fillStyle = '#d8ff6a';
            for (let i = 0; i < 9; i++) {
              const x = Math.random() * w;
              const y = 20 + Math.random() * 70;
              g.beginPath();
              g.ellipse(x, y, 5, 3, 0, 0, 7);
              g.ellipse(x + 14, y, 5, 3, 0, 0, 7);
              g.fill();
            }
            g.shadowBlur = 0;
          });
        default: // concrete with hazard stripes and graffiti
          return mk(1024, 64, (g, w, h) => {
            g.fillStyle = '#9a958c';
            g.fillRect(0, 0, w, h);
            BB.speckle(g, w, h, 5000, ['#8a857d', '#a8a39a', '#7d786f', '#b3aea4'], 1.5);
            for (let x = -20; x < w + 20; x += 20) {
              g.fillStyle = '#f2c414';
              g.beginPath();
              g.moveTo(x, 0);
              g.lineTo(x + 10, 0);
              g.lineTo(x + 2, 12);
              g.lineTo(x - 8, 12);
              g.fill();
            }
            g.fillStyle = '#141414';
            g.fillRect(0, 12, w, 2);
            const tags = ['BOOM', 'EAT DIRT', 'GARY WUZ HERE', 'NO BRAKES', 'R.I.P. KEVIN', 'HONK', 'SEND IT', 'BUCKETS LIES'];
            const cols = ['#ff3b6b', '#3fe0c5', '#ffd23f', '#8bdc3b', '#ffffff', '#ff7a1a'];
            for (let i = 0; i < 6; i++) tag(g, 60 + i * 165 + Math.random() * 40, 44 + Math.random() * 8, tags[(Math.random() * tags.length) | 0], cols[i % cols.length], 18 + Math.random() * 8);
            g.fillStyle = 'rgba(30,25,20,0.35)';
            g.fillRect(0, h - 6, w, 6);
          });
      }
    },

    // A splotch for sludge and blood slicks drawn on the road.
    puddle(col, bub) {
      return BB.canvasTexture(128, 128, (g, w, h) => {
        g.fillStyle = col;
        g.fillRect(0, 0, w, h);
        for (let i = 0; i < 30; i++) {
          g.fillStyle = `rgba(255,255,255,${0.04 + Math.random() * 0.08})`;
          g.beginPath();
          g.ellipse(Math.random() * w, Math.random() * h, 3 + Math.random() * 14, 2 + Math.random() * 6, Math.random() * 3, 0, 7);
          g.fill();
        }
        if (bub) {
          for (let i = 0; i < 18; i++) {
            g.strokeStyle = 'rgba(200,255,120,0.45)';
            g.lineWidth = 1.5;
            g.beginPath();
            g.arc(Math.random() * w, Math.random() * h, 2 + Math.random() * 5, 0, 7);
            g.stroke();
          }
        }
      });
    },
  };
  BB.TRACK_TEX = TEX;

  const tmpV = {};

  class Track {
    constructor(scene, def) {
      this.scene = scene;
      this.def = def;
      this.id = def.id;
      this.name = def.name;
      const R = def.road || {};
      this.ROAD = R.half || 9;
      this.CURB = R.curb || 10.5;
      this.WALL = R.wall || 14;
      this.EDGE = R.edge || 26;
      this.WALL_H = R.wallH || 1.2;
      this.theme = def.theme;
      this.group = new THREE.Group();
      scene.add(this.group);
      this.flames = [];
      this.anims = []; // functions (dt, time) run every frame
      this.shortcuts = [];
      this.geysers = [];
      this.zones = [];
      this.spinners = [];
      this.tanks = [];
      this.pieces = [];
      this.gulls = null;
      this.crateSpots = [];
      this.pads = [];
      this._loc = {};
      this._sl = {};
      this._ml = {};
      this.rnd = BB.rng(def.seed || 1337);

      // The main road, with its jumps cut in before anything is built on it.
      const main = (this.main = new BB.Path(def.line, true));
      this.jumps = (def.jumps || []).map((j) => {
        const s = this.sOf(j);
        main.addJump(s, j.len || 18, j.h || 2.6, j.kind || 'kicker');
        return { s, kind: j.kind || 'kicker' };
      });
      this.N = main.n;
      this.L = main.L;
      this.step = main.step;
      this.X = main.X;
      this.Y = main.Y;
      this.Z = main.Z;
      this.TX = main.TX;
      this.TZ = main.TZ;
      this.H = main.H;
      this.bounds = main.bounds();

      this.buildEnvironment();
      for (const sc of def.shortcuts || []) this.buildShortcut(sc);
      this.buildSurface();
      this.buildGantry();
      this.buildPads();
      this.buildHazards();
      if (def.scenery) def.scenery(this, this.rnd, (a, b) => a + this.rnd() * (b - a));
    }

    // A position on the main road given as { s } metres, { f } fraction of a lap, or { at: [x, z] }.
    // { back } moves it that many metres earlier.
    sOf(spec) {
      let s;
      if (spec.at) s = this.main.nearest(spec.at[0], spec.at[1]) * this.main.step;
      else if (spec.f != null) s = spec.f * this.main.L;
      else s = spec.s || 0;
      return this.main.wrapS(s - (spec.back || 0));
    }

    wrapS(s) {
      return this.main.wrapS(s);
    }

    // A distance along the lap, the short way round: between -L/2 and L/2.
    delta(ds) {
      const L = this.L;
      if (ds < -L / 2) return ds + L;
      if (ds > L / 2) return ds - L;
      return ds;
    }

    // How far past a wall a probe result is (+ right, - left, 0 inside). margin: only count it
    // once it's at least that far through.
    overWall(L, margin = 0) {
      if (L.d > L.limR + margin) return L.d - L.limR;
      if (L.d < -L.limL - margin) return L.d + L.limL;
      return 0;
    }

    sampleAt(s, out) {
      return this.main.sampleAt(s, out);
    }

    bend(s, dist) {
      return this.main.bend(s, dist);
    }

    locate(x, z, hint, out) {
      return this.main.locate(x, z, hint, out || this._loc);
    }

    // ---------- where am I: main road or a shortcut ----------

    // st: { sc, hint, sh } kept by whoever is moving (kart, rocket). Fills out with
    // s (lap distance), d (sideways on the current road), y, tx/tz, rx/rz, limL/limR (how far
    // left/right before a wall), sc and u (distance along the shortcut).
    probe(x, z, st, out, switched) {
      const W = this.WALL;
      const R = this.ROAD;
      if (st.sc) {
        const sc = st.sc;
        const Ls = sc.path.locate(x, z, st.sh, this._sl);
        st.sh = Ls.i;
        const u = Ls.s;
        const merge = u < sc.mergeIn || u > sc.mergeOut;
        let M = null;
        let inMain = false;
        if (merge) {
          M = this.main.locate(x, z, -1, this._ml);
          inMain = Math.abs(M.d) < W - 0.9;
        }
        const dd = Ls.d * sc.side; // + = away from the main road
        // Back onto the main road (at most one switch per call, so we can't ping-pong).
        if (!switched && (u >= sc.len - 1.5 || (inMain && (M.d * sc.side < R - 1 || dd < -(sc.half - 0.9))))) {
          st.sc = null;
          st.hint = (M || this.main.locate(x, z, -1, this._ml)).i;
          return this.probe(x, z, st, out, true);
        }
        out.sc = sc;
        out.u = u;
        out.s = this.main.wrapS(sc.s0 + (u / sc.len) * sc.span);
        out.d = Ls.d;
        out.y = Ls.y;
        out.tx = Ls.tx;
        out.tz = Ls.tz;
        out.rx = Ls.rx;
        out.rz = Ls.rz;
        out.i = st.hint;
        const lim = inMain ? 1e9 : sc.half - 0.9;
        out.limL = lim;
        out.limR = lim;
        out.offroad = false;
        out.zone = null;
        return out;
      }
      const M = this.main.locate(x, z, st.hint, out);
      st.hint = M.i;
      out.sc = null;
      out.u = 0;
      out.limL = W - 0.9;
      out.limR = W - 0.9;
      out.offroad = Math.abs(M.d) > this.CURB;
      // Driving into a gap in the wall: hop onto the shortcut if we're inside its corridor.
      for (const sc of switched ? [] : this.shortcuts) {
        if (M.d * sc.side <= R + 0.5) continue;
        for (const g of sc.gaps) {
          let ds = M.s - g.s0;
          if (ds < 0) ds += this.L;
          if (ds > g.s1 - g.s0) continue;
          const Ls = sc.path.locate(x, z, -1, this._sl);
          if (Math.abs(Ls.d) < sc.half - 0.4 && Ls.s > 0.5 && Ls.s < sc.len - 3) {
            st.sc = sc;
            st.sh = Ls.i;
            return this.probe(x, z, st, out, true);
          }
        }
      }
      out.zone = this.zones.length ? this.zoneAt(M.s, M.d) : null;
      return out;
    }

    // A point `dist` metres ahead (or behind) along whatever road `info` is on, `lane` to the right.
    ahead(info, dist, lane, out) {
      out = out || tmpV;
      if (info.sc) {
        const sc = info.sc;
        const u = info.u + dist;
        if (u >= 0 && u <= sc.len) {
          const p = sc.path.sampleAt(u, out);
          const l = BB.clamp(lane, -(sc.half - 2), sc.half - 2);
          p.x += p.rx * l;
          p.z += p.rz * l;
          return p;
        }
        const p = this.main.sampleAt(u > sc.len ? sc.s1 + (u - sc.len) : sc.s0 + u, out);
        p.x += p.rx * lane;
        p.z += p.rz * lane;
        return p;
      }
      const p = this.main.sampleAt(info.s + dist, out);
      p.x += p.rx * lane;
      p.z += p.rz * lane;
      return p;
    }

    // Height of whatever is under (x, z): road, shortcut, shoulder, embankment or flat ground.
    // Leaves the road sample it found in lastHint: pass it back next time to search faster.
    groundAt(x, z, hint) {
      const L = this.main.locate(x, z, hint == null ? -1 : hint, this._loc);
      this.lastHint = L.i;
      const ad = Math.abs(L.d);
      if (ad <= this.WALL) return L.y;
      for (const sc of this.shortcuts) {
        if (x < sc.box[0] || x > sc.box[1] || z < sc.box[2] || z > sc.box[3]) continue;
        const S = sc.path.locate(x, z, -1, this._sl);
        if (Math.abs(S.d) <= sc.half + 0.5 && S.s > 0 && S.s < sc.len) return S.y;
      }
      if (ad >= this.EDGE) return 0;
      return BB.lerp(L.y, 0, (ad - this.WALL) / (this.EDGE - this.WALL));
    }

    zoneAt(s, d) {
      for (const z of this.zones) {
        let ds = s - z.s0;
        if (ds < 0) ds += this.L;
        if (ds <= z.s1 - z.s0 && d >= z.d0 && d <= z.d1) return z.kind;
      }
      return null;
    }

    // ---------- sky, fog, lights, ground ----------

    buildEnvironment() {
      const T = THREE;
      const th = this.theme;
      this.scene.fog = new T.Fog(th.fog, th.fogNear || 110, th.fogFar || 680);
      this.scene.background = new T.Color(th.fog);

      const geo = new T.SphereGeometry(900, 32, 18);
      const pos = geo.attributes.position;
      const cols = new Float32Array(pos.count * 3);
      const [hz, md, tp, bl] = th.sky.map((c) => new T.Color(c));
      const c = new T.Color();
      for (let i = 0; i < pos.count; i++) {
        const y = pos.getY(i) / 900;
        if (y < 0) c.copy(hz).lerp(bl, BB.smoothstep(0, 0.15, -y));
        else if (y < 0.25) c.copy(hz).lerp(md, BB.smoothstep(0, 0.25, y));
        else c.copy(md).lerp(tp, BB.smoothstep(0.25, 0.8, y));
        cols[i * 3] = c.r;
        cols[i * 3 + 1] = c.g;
        cols[i * 3 + 2] = c.b;
      }
      geo.setAttribute('color', new T.BufferAttribute(cols, 3));
      this.sky = new T.Mesh(geo, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false, depthWrite: false }));
      this.sky.renderOrder = -10;
      this.scene.add(this.sky);

      const sun = th.sun;
      this.sunDir = new T.Vector3(sun.dir[0], sun.dir[1], sun.dir[2]).normalize();
      const stops = sun.glow || ['rgba(255,240,200,1)', 'rgba(255,200,120,0.9)', 'rgba(255,130,70,0.25)'];
      const sunTex = BB.canvasTexture(128, 128, (g, w) => {
        const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
        gr.addColorStop(0, stops[0]);
        gr.addColorStop(0.18, stops[1]);
        gr.addColorStop(0.45, stops[2]);
        gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = gr;
        g.fillRect(0, 0, w, w);
      }, false);
      const sp = new T.Sprite(new T.SpriteMaterial({ map: sunTex, fog: false, depthWrite: false, blending: T.AdditiveBlending, transparent: true }));
      sp.scale.set(sun.size || 260, sun.size || 260, 1);
      sp.position.copy(this.sunDir).multiplyScalar(820);
      sp.renderOrder = -9;
      this.sky.add(sp);

      if (th.stars) {
        const n = 700;
        const p = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          const a = Math.random() * BB.TAU;
          const y = 0.08 + Math.random() * 0.92;
          const r = Math.sqrt(1 - y * y);
          p[i * 3] = Math.cos(a) * r * 850;
          p[i * 3 + 1] = y * 850;
          p[i * 3 + 2] = Math.sin(a) * r * 850;
        }
        const g = new T.BufferGeometry();
        g.setAttribute('position', new T.BufferAttribute(p, 3));
        const stars = new T.Points(g, new T.PointsMaterial({ color: 0xfff6e0, size: 1.6, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.85, depthWrite: false }));
        stars.renderOrder = -9;
        this.sky.add(stars);
      }

      // Lights belong to the track, so each one can set its own mood.
      const hemi = th.hemi || ['#ffc49a', '#3a2a30', 0.8];
      this.group.add(new T.HemisphereLight(hemi[0], hemi[1], hemi[2]));
      const amb = th.ambient || ['#6a4a5a', 0.35];
      this.group.add(new T.AmbientLight(amb[0], amb[1]));
      const sl = (this.sun = new T.DirectionalLight(sun.color || '#ffd2a8', sun.intensity == null ? 1.15 : sun.intensity));
      sl.castShadow = true;
      sl.shadow.mapSize.set(2048, 2048);
      const sc = sl.shadow.camera;
      sc.left = -45;
      sc.right = 45;
      sc.top = 45;
      sc.bottom = -45;
      sc.near = 1;
      sc.far = 320;
      sl.shadow.bias = -0.0006;
      sl.shadow.normalBias = 0.02;
      this.group.add(sl, sl.target);

      this.tex = { dirt: TEX.ground(th.ground || 'dirt') };
      const groundTex = this.tex.dirt.clone();
      groundTex.needsUpdate = true;
      groundTex.repeat.set(160, 160);
      const ground = new T.Mesh(new T.PlaneGeometry(1600, 1600), new T.MeshLambertMaterial({ map: groundTex, color: th.groundTint || 0x9a8068 }));
      ground.rotation.x = -Math.PI / 2;
      ground.position.set(this.bounds.cx, -0.06, this.bounds.cz);
      ground.receiveShadow = true;
      this.group.add(ground);
    }

    // ---------- road meshes ----------

    // A flat band between sideways offsets a < b along `path`, rows i0..i1 (default: all).
    strip(path, a, b, yA, yB, mat, vLen, i0, i1, skip) {
      const rowsAll = path.closed ? path.n + 1 : path.n;
      i0 = i0 == null ? 0 : i0;
      i1 = i1 == null ? rowsAll - 1 : i1;
      const rows = i1 - i0 + 1;
      const pos = new Float32Array(rows * 6);
      const uv = new Float32Array(rows * 4);
      for (let r = 0; r < rows; r++) {
        const k = i0 + r;
        const i = path.idx(k);
        const rx = -path.TZ[i];
        const rz = path.TX[i];
        const v = (k * path.step) / vLen;
        let o = r * 6;
        pos[o] = path.X[i] + rx * a;
        pos[o + 1] = yA(i, path);
        pos[o + 2] = path.Z[i] + rz * a;
        pos[o + 3] = path.X[i] + rx * b;
        pos[o + 4] = yB(i, path);
        pos[o + 5] = path.Z[i] + rz * b;
        o = r * 4;
        uv[o] = 0;
        uv[o + 1] = v;
        uv[o + 2] = 1;
        uv[o + 3] = v;
      }
      const idx = [];
      for (let r = 0; r < rows - 1; r++) {
        if (skip && skip(path.idx(i0 + r))) continue;
        const A = r * 2;
        const B = A + 1;
        idx.push(A, B, A + 2, B, B + 2, A + 2);
      }
      return this.bandMesh(pos, uv, idx, mat);
    }

    // Positions, texture coordinates and triangles to a mesh on the track (for strip and wall).
    bandMesh(pos, uv, idx, mat) {
      const T = THREE;
      const geo = new T.BufferGeometry();
      geo.setAttribute('position', new T.BufferAttribute(pos, 3));
      geo.setAttribute('uv', new T.BufferAttribute(uv, 2));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      const m = new T.Mesh(geo, mat);
      m.receiveShadow = true;
      this.group.add(m);
      return m;
    }

    // A vertical band at sideways offset `off`, `h` tall, from `base` above the road. skip(i) leaves gaps.
    wall(path, off, h, mat, uLen, skip, i0, i1, base) {
      const rowsAll = path.closed ? path.n + 1 : path.n;
      i0 = i0 == null ? 0 : i0;
      i1 = i1 == null ? rowsAll - 1 : i1;
      base = base || 0;
      const rows = i1 - i0 + 1;
      const pos = new Float32Array(rows * 6);
      const uv = new Float32Array(rows * 4);
      for (let r = 0; r < rows; r++) {
        const k = i0 + r;
        const i = path.idx(k);
        const x = path.X[i] - path.TZ[i] * off;
        const z = path.Z[i] + path.TX[i] * off;
        const u = (k * path.step) / uLen;
        let o = r * 6;
        pos[o] = x;
        pos[o + 1] = path.Y[i] + base;
        pos[o + 2] = z;
        pos[o + 3] = x;
        pos[o + 4] = path.Y[i] + base + h;
        pos[o + 5] = z;
        o = r * 4;
        uv[o] = u;
        uv[o + 1] = 0;
        uv[o + 2] = u;
        uv[o + 3] = 1;
      }
      const idx = [];
      for (let r = 0; r < rows - 1; r++) {
        if (skip && (skip(path.idx(i0 + r)) || skip(path.idx(i0 + r + 1)))) continue;
        const A = r * 2;
        idx.push(A, A + 2, A + 1, A + 1, A + 2, A + 3);
      }
      const m = this.bandMesh(pos, uv, idx, mat);
      m.castShadow = h > 2;
      return m;
    }

    wallMat(kind, h) {
      const w = TEX.wall(kind);
      return { mat: new THREE.MeshLambertMaterial({ map: w.tex, side: THREE.DoubleSide }), uLen: h * w.aspect };
    }

    // A roofed section: tall walls and a ceiling with lamps, rows i0..i1 of path.
    tunnel(path, i0, i1, half, h, kind, roofColor, lampColor) {
      const T = THREE;
      const wm = this.wallMat(kind, h);
      this.wall(path, -half - 0.3, h, wm.mat, wm.uLen, null, i0, i1);
      this.wall(path, half + 0.3, h, wm.mat, wm.uLen, null, i0, i1);
      const roofMat = new T.MeshLambertMaterial({ color: roofColor || 0x2a2628, side: T.DoubleSide });
      const roof = this.strip(path, -half - 0.6, half + 0.6, (i, p) => p.Y[i] + h, (i, p) => p.Y[i] + h, roofMat, 10, i0, i1);
      roof.castShadow = true;
      const lamp = new T.MeshBasicMaterial({ color: lampColor || 0xffe2a8 });
      const S = BB.sharedMats();
      for (let k = i0; k <= i1; k += Math.round(12 / path.step)) {
        const i = path.idx(k);
        const m = new T.Mesh(S.geo.box, lamp);
        m.position.set(path.X[i], path.Y[i] + h - 0.15, path.Z[i]);
        m.scale.set(half * 1.2, 0.12, 0.5);
        m.rotation.y = path.H[i]; // long side across the road
        this.group.add(m);
      }
      // Portal frames at both ends.
      const frameMat = new T.MeshLambertMaterial({ color: 0x1a1618 });
      for (const k of [i0, i1]) {
        const i = path.idx(k);
        const g = new T.Group();
        g.position.set(path.X[i], path.Y[i], path.Z[i]);
        g.rotation.y = path.H[i];
        const top = new T.Mesh(S.geo.box, frameMat);
        top.scale.set(half * 2 + 3, 1.2, 1.2);
        top.position.y = h + 0.5;
        g.add(top);
        for (const sd of [-1, 1]) {
          const post = new T.Mesh(S.geo.box, frameMat);
          post.scale.set(1.2, h + 1, 1.2);
          post.position.set(sd * (half + 0.9), (h + 1) / 2, 0);
          g.add(post);
        }
        this.group.add(g);
      }
    }

    buildSurface() {
      const T = THREE;
      const th = this.theme;
      const main = this.main;
      const R = this.ROAD;
      const C = this.CURB;
      const W = this.WALL;
      const E = this.EDGE;
      const yr = (i, p) => p.Y[i] + 0.02;
      const y0 = (i, p) => p.Y[i];
      const flat = () => 0;
      this.strip(main, -R, R, yr, yr, new T.MeshLambertMaterial({ map: TEX.road(th.road) }), 14);
      const curbMat = new T.MeshLambertMaterial({ map: TEX.curb(th.curb[0], th.curb[1]) });
      this.strip(main, -C, -R, yr, yr, curbMat, 4);
      this.strip(main, R, C, yr, yr, curbMat, 4);
      const dirtMat = new T.MeshLambertMaterial({ map: this.tex.dirt, color: th.shoulder || 0xb59a80 });
      this.strip(main, -W, -C, y0, y0, dirtMat, 10);
      this.strip(main, C, W, y0, y0, dirtMat, 10);
      const bankMat = new T.MeshLambertMaterial({ map: this.tex.dirt, color: th.bank || 0x9a8068 });
      this.strip(main, -E, -W, flat, y0, bankMat, 10);
      this.strip(main, W, E, y0, flat, bankMat, 10);
      const wm = this.wallMat(th.wall || 'concrete', this.WALL_H);
      const gapL = this.gapSet(-1);
      const gapR = this.gapSet(1);
      this.wall(main, -W, this.WALL_H, wm.mat, wm.uLen, (i) => gapL.has(i));
      this.wall(main, W, this.WALL_H, wm.mat, wm.uLen, (i) => gapR.has(i));

      // Roofed sections of the main road.
      for (const t of this.def.tunnels || []) {
        const a = Math.round(this.sOf({ f: t.f0, s: t.s0, at: t.at0 }) / main.step);
        let b = Math.round(this.sOf({ f: t.f1, s: t.s1, at: t.at1 }) / main.step);
        if (b < a) b += main.n;
        this.tunnel(main, a, b, W, t.h || 6, t.kind || th.wall, t.roof, t.lamp);
      }

      // Start / finish line.
      const checker = BB.canvasTexture(128, 16, (g, w, h) => {
        for (let x = 0; x < w; x += 8) {
          for (let y = 0; y < h; y += 8) {
            g.fillStyle = (x + y) % 16 === 0 ? '#f4f1ea' : '#121212';
            g.fillRect(x, y, 8, 8);
          }
        }
      }, false);
      const line = new T.Mesh(new T.PlaneGeometry(R * 2, 1.8), new T.MeshLambertMaterial({ map: checker, polygonOffset: true, polygonOffsetFactor: -2 }));
      line.geometry.rotateX(-Math.PI / 2);
      const p = this.sampleAt(0);
      line.position.set(p.x, p.y + 0.04, p.z);
      line.rotation.y = Math.atan2(p.tx, p.tz);
      line.receiveShadow = true;
      this.group.add(line);
    }

    gapSet(side) {
      const set = new Set();
      for (const sc of this.shortcuts) {
        if (sc.side !== side) continue;
        for (const i of sc.gapIdx) set.add(i);
      }
      return set;
    }

    // ---------- secret shortcuts ----------

    // def: { from, to (metres along the lap), side (-1 left / 1 right), half, mid: [[x,y,z]],
    //        tunnel: { u0, u1, kind }, jumps: [{ u, len, h, kind }], crates: [u], pads: [u],
    //        entrance: 'boxes' | 'bags' | 'planks' } — u values are fractions of the shortcut.
    buildShortcut(d) {
      const T = THREE;
      const main = this.main;
      const side = d.side;
      const half = d.half || 5.5;
      const s0 = this.sOf({ s: d.from, f: d.f0 });
      let s1 = this.sOf({ s: d.to, f: d.f1 });
      let span = s1 - s0;
      if (span < 0) span += main.L;
      const off = (s, dd) => {
        const p = main.sampleAt(s, {});
        return [p.x + p.rx * dd * side, p.y, p.z + p.rz * dd * side];
      };
      const pts = [off(s0, 6), off(s0 + 18, 21), ...(d.mid || []), off(s0 + span - 18, 21), off(s0 + span, 6)];
      const path = new BB.Path(pts, false);
      for (const j of d.jumps || []) path.addJump(j.u * path.L, j.len || 14, j.h || 2.4, j.kind || 'kicker');
      const sc = { def: d, path, side, half, s0, s1, span, len: path.L, id: this.id + ':' + this.shortcuts.length };

      // Where the shortcut corridor leaves and rejoins the main road.
      const clear = this.WALL + half + 1;
      let mergeIn = 0;
      let mergeOut = path.L;
      let i = 0;
      while (i < path.n && Math.abs(main.locate(path.X[i], path.Z[i], -1, this._ml).d) < clear) i++;
      mergeIn = i * path.step;
      i = path.n - 1;
      while (i > 0 && Math.abs(main.locate(path.X[i], path.Z[i], -1, this._ml).d) < clear) i--;
      mergeOut = i * path.step;
      sc.mergeIn = mergeIn;
      sc.mergeOut = mergeOut;

      // Gaps in the main wall where the corridor crosses it.
      const gapIdx = [];
      const near = Math.round(70 / main.step);
      for (const sEnd of [s0, s0 + span]) {
        const c = Math.round(main.wrapS(sEnd) / main.step);
        for (let k = -near; k <= near; k++) {
          const ii = main.idx(c + k);
          const wx = main.X[ii] - main.TZ[ii] * this.WALL * side;
          const wz = main.Z[ii] + main.TX[ii] * this.WALL * side;
          const Ls = path.locate(wx, wz, -1, this._sl);
          if (Math.abs(Ls.d) < half + 0.3 && Ls.s > 0.5 && Ls.s < path.L - 0.5) gapIdx.push(ii);
        }
      }
      sc.gapIdx = gapIdx;
      // Runs of gap samples, as lap-distance ranges with a little padding.
      const sorted = gapIdx.slice().sort((a, b) => a - b);
      const gaps = [];
      for (const ii of sorted) {
        const g = gaps[gaps.length - 1];
        if (g && ii - g.b <= 2) g.b = ii;
        else gaps.push({ a: ii, b: ii });
      }
      sc.gaps = gaps.map((g) => ({ s0: main.wrapS(g.a * main.step - 3), s1: main.wrapS(g.a * main.step - 3) + (g.b - g.a) * main.step + 6 }));

      let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
      for (let k = 0; k < path.n; k++) {
        minX = Math.min(minX, path.X[k]);
        maxX = Math.max(maxX, path.X[k]);
        minZ = Math.min(minZ, path.Z[k]);
        maxZ = Math.max(maxZ, path.Z[k]);
      }
      sc.box = [minX - half - 2, maxX + half + 2, minZ - half - 2, maxZ + half + 2];

      // Looks: a rough road, low junk walls where it's outside the main corridor, maybe a tunnel.
      const th = this.theme;
      const road = TEX.road(th.scRoad || { base: '#4a4238', specks: ['#3a332b', '#5a5045', '#2e2822', '#6a5e50'], tracks: true, cracks: 3, patches: 6 });
      const roadMat = new T.MeshLambertMaterial({ map: road, polygonOffset: true, polygonOffsetFactor: -1 });
      this.strip(path, -half - 0.6, half + 0.6, (k, p) => p.Y[k] + 0.03, (k, p) => p.Y[k] + 0.03, roadMat, 14);
      const inMain = (k, dd) => {
        const x = path.X[k] - path.TZ[k] * dd;
        const z = path.Z[k] + path.TX[k] * dd;
        return Math.abs(main.locate(x, z, -1, this._ml).d) < this.WALL + 0.6;
      };
      const skipL = new Set();
      const skipR = new Set();
      for (let k = 0; k < path.n; k++) {
        const u = k * path.step;
        if (u > mergeIn + 4 && u < mergeOut - 4) continue;
        if (inMain(k, -half)) skipL.add(k);
        if (inMain(k, half)) skipR.add(k);
      }
      const wm = this.wallMat(th.scWall || 'junk', 1.6);
      this.wall(path, -half, 1.6, wm.mat, wm.uLen, (k) => skipL.has(k));
      this.wall(path, half, 1.6, wm.mat, wm.uLen, (k) => skipR.has(k));
      if (d.tunnel) {
        const a = Math.max(Math.round((d.tunnel.u0 * path.L) / path.step), Math.round(mergeIn / path.step) + 2);
        const b = Math.min(Math.round((d.tunnel.u1 * path.L) / path.step), Math.round(mergeOut / path.step) - 2);
        if (b > a) this.tunnel(path, a, b, half, d.tunnel.h || 5.5, d.tunnel.kind || 'junk', d.tunnel.roof, d.tunnel.lamp);
      }

      // Breakable junk hides the entrance where the corridor crosses the main wall.
      let ue = 0;
      for (let k = 0; k < path.n; k++) {
        if (Math.abs(main.locate(path.X[k], path.Z[k], -1, this._ml).d) > this.WALL) {
          ue = k * path.step;
          break;
        }
      }
      this.addBarricade(path, ue + 1, half, d.entrance || th.secret || 'boxes');

      for (const u of d.crates || []) {
        const p = path.sampleAt(u * path.L, {});
        for (const dd of [-2.8, 0, 2.8]) this.crateSpots.push({ x: p.x + p.rx * dd, y: p.y + 1.15, z: p.z + p.rz * dd });
      }
      for (const u of d.pads || []) this.pads.push({ sc, u: u * path.L, d: 0 });
      this.shortcuts.push(sc);
    }

    addBarricade(path, u, half, kind) {
      const T = THREE;
      if (!Track.boxTex) {
        Track.boxTex = BB.canvasTexture(64, 64, (g, w, h) => {
          g.fillStyle = '#b08a5a';
          g.fillRect(0, 0, w, h);
          BB.speckle(g, w, h, 300, ['#a07a4a', '#c09a6a'], 1.5);
          g.fillStyle = '#8a6a40';
          g.fillRect(0, h / 2 - 3, w, 6);
          g.font = 'bold 13px Impact, sans-serif';
          g.fillStyle = '#c01f1f';
          g.textAlign = 'center';
          g.fillText('KEEP', w / 2, 20);
          g.fillText('OUT', w / 2, 52);
        }, false);
      }
      const p = path.sampleAt(u, {});
      const S = BB.sharedMats();
      const mats = {
        boxes: new T.MeshLambertMaterial({ map: Track.boxTex }),
        bags: new T.MeshLambertMaterial({ color: 0x1c2a1c }),
        planks: new T.MeshLambertMaterial({ color: 0x8a5a32 }),
      };
      const mat = mats[kind] || mats.boxes;
      const geo = kind === 'bags' ? S.geo.sph : S.geo.box;
      for (let row = 0; row < (kind === 'planks' ? 1 : 2); row++) {
        for (let dd = -half + 0.9; dd <= half - 0.9; dd += 1.8) {
          const m = new T.Mesh(geo, mat);
          const x = p.x + p.rx * (dd + (row ? 0.9 : 0));
          const z = p.z + p.rz * (dd + (row ? 0.9 : 0));
          const sz = kind === 'bags' ? [0.9, 0.7, 0.9] : kind === 'planks' ? [1.8, 1.4, 0.15] : [1.6, 1.4, 1.6];
          m.scale.set(sz[0], sz[1], sz[2]);
          const y = p.y + sz[1] / 2 + row * sz[1] * 0.95;
          m.position.set(x, y, z);
          m.rotation.y = Math.atan2(p.tx, p.tz) + (kind === 'planks' ? Math.PI / 2 : (Math.random() - 0.5) * 0.4);
          m.castShadow = true;
          this.group.add(m);
          this.pieces.push({ m, x, y, z, broken: false, t: 0, mat, geo, sz });
        }
      }
    }

    // ---------- start gantry with countdown lights ----------

    buildGantry() {
      const T = THREE;
      const S = BB.sharedMats();
      const p = this.sampleAt(4);
      const g = new T.Group();
      g.position.set(p.x, p.y, p.z);
      g.rotation.y = Math.atan2(p.tx, p.tz);
      const steel = new T.MeshLambertMaterial({ color: 0x2d2a30 });
      for (const sd of [-1, 1]) {
        const post = new T.Mesh(S.geo.box, steel);
        post.scale.set(0.8, 8, 0.8);
        post.position.set(sd * (this.WALL + 0.8), 4, 0);
        post.castShadow = true;
        g.add(post);
      }
      const beam = new T.Mesh(S.geo.box, steel);
      beam.scale.set((this.WALL + 1.2) * 2, 1.6, 0.9);
      beam.position.set(0, 8, 0);
      g.add(beam);
      const banner = (text) =>
        BB.canvasTexture(1024, 96, (c, w, h) => {
          c.fillStyle = '#141014';
          c.fillRect(0, 0, w, h);
          c.font = 'bold 74px Impact, "Arial Black", sans-serif';
          c.textAlign = 'center';
