          <p class="verdict">${msg}</p>
          ${(c.unlocked || []).map((p) => `<div class="unlock"><i style="background:${BB.paintSwatch(p.id, BB.racerById(c.player))}"></i><div><b>UNLOCKED: ${BB.esc(p.name.toUpperCase())} PAINT</b><span>${BB.esc(p.how)} Every racer can wear it now. Pick it on the racer screen.</span></div></div>`).join('')}
          ${this.credBox(c.cred, 'CIRCUIT BONUS')}
          ${this.standingsTable(c)}
        </div>`;
    }
  }

  BB.Menu = Menu;
})();
</script>
<script>
/* ---- js/main.js ---- */
/* BuggyBoom — starts the game and runs the main loop.
   Modes: 'menu' (an all-CPU race plays behind the title screen), 'race', 'paused',
   'paused-online' (the menu is open but an online race carries on) and 'results'.
   Up to 4 players share the screen: each gets a view (camera) and a HUD. With 3 players the
   spare quarter shows a TV camera following the leader.
   Frame order: input -> race (karts, items, hazards, laps) -> effects -> cameras -> HUDs -> render. */
(function () {
  'use strict';
  const BB = window.BB;

  // Screen areas (x, y, w, h as fractions; y from the top) for 1-4 players.
  const LAYOUTS = {
    1: [[0, 0, 1, 1]],
    2: [[0, 0, 1, 0.5], [0, 0.5, 1, 0.5]],
    3: [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]],
    4: [[0, 0, 0.5, 0.5], [0.5, 0, 0.5, 0.5], [0, 0.5, 0.5, 0.5], [0.5, 0.5, 0.5, 0.5]],
  };

  class Game {
    constructor() {
      const T = THREE;
      this.canvas = document.getElementById('view');
      const r = (this.renderer = new T.WebGLRenderer({ canvas: this.canvas, antialias: true, powerPreference: 'high-performance' }));
      r.shadowMap.enabled = BB.settings.shadows;
      r.shadowMap.type = T.PCFSoftShadowMap;

      this.scene = new T.Scene();
      this.input = new BB.Input();
      this.audio = new BB.Audio();
      this.music = new BB.Music(this.audio);
      this.track = new BB.Track(this.scene, BB.trackById(BB.settings.track));
      this.views = [];
      this.setViews(1);
      this.effects = new BB.Effects(this);
      this.huds = [0, 1, 2, 3].map(() => new BB.HUD(this));
      this.menu = new BB.Menu(this);
      this.net = null;
      this.race = null;
      this.circuit = null;
      this.mode = 'menu';
      this.time = 0;
      this.last = performance.now();
      this.frame = this.frame.bind(this);

      window.addEventListener('resize', () => this.resize());
      BB.onSettings(() => this.applySettings());
      this.resize();
    }

    // n player views. With 3 players a 4th "TV" view watches the leader.
    setViews(n) {
      const rects = LAYOUTS[Math.max(1, n)];
      this.views = rects.map((rect, i) => ({
        camera: new THREE.PerspectiveCamera(72, 1, 0.1, 2000),
        rect,
        player: i < Math.max(1, n) ? i : -1, // -1 = TV camera
        cam: { pos: new THREE.Vector3(), look: new THREE.Vector3(), yaw: 0, kart: null },
        fov: 72,
      }));
      this.audio.listeners = this.views.map((v) => v.camera.position);
      this.resize();
    }

    // ---------- tracks ----------

    setTrack(id) {
      if (this.track && this.track.id === id) return;
      if (this.race) {
        this.race.dispose();
        this.race = null;
      }
      this.effects.clear();
      this.track.dispose();
      this.track = new BB.Track(this.scene, BB.trackById(id));
      this.effects.track = this.track;
      for (const h of this.huds) h.buildMap();
      this.applySettings();
    }

    // ---------- modes ----------

    newRace(opts) {
      if (this.race) this.race.dispose();
      this.effects.clear();
      this.race = new BB.Race(this, opts);
      for (const v of this.views) v.cam.kart = null;
    }

    stopEngines() {
      this.audio.stopEngine();
    }

    // An engine sound for each player on this computer.
    startEngines() {
      const n = this.race.locals.length;
      for (const k of this.race.locals) this.audio.startEngine(k.local, n);
    }

    // The race is over (or we've been sent the results): engines off, HUDs away, menu music.
    endRace() {
      this.mode = 'results';
      this.stopEngines();
      this.input.capture = false;
      for (const h of this.huds) h.hide();
      this.music.play('menu');
    }

    startAttract(trackId, keepNet) {
      this.stopEngines();
      if (this.net && !keepNet) {
        this.net.close();
        this.net = null;
      }
      this.setTrack(trackId || BB.settings.track);
      this.setViews(1);
      this.newRace({ attract: true });
      this.mode = 'menu';
      for (const h of this.huds) h.hide();
      this.input.capture = false;
      this.music.duck(false);
      this.music.play('menu');
    }

    // Start racing with opts for Race. Sets up a view, a HUD and an engine sound per local player.
    beginRace(opts) {
      this.newRace(opts);
      const n = this.race.locals.length;
      this.setViews(n);
      const size = n === 1 ? 'full' : n === 2 ? 'half' : 'quarter';
      this.views.forEach((v, i) => {
        const h = this.huds[i];
        const k = this.race.locals[i];
        if (k) {
          h.place(...v.rect);
          h.show(this.race, k, size, BB.controlsText(i, n));
        } else h.hide();
      });
      for (let i = this.views.length; i < 4; i++) this.huds[i].hide();
      this.mode = 'race';
      this.menu.hide();
      this.input.capture = true;
      this.audio.ensure();
      this.stopEngines();
      this.startEngines();
      this.music.duck(false);
      this.music.play(this.track.def.music || 'dumpster');
      this.last = performance.now();
    }

    // The players on this computer, as field entries.
    localHumans(n) {
      return BB.partyPicks()
        .slice(0, n)
        .map((racer, i) => ({ racer, kind: 'human', local: i }));
    }

    // A single race on the chosen track: local players plus CPUs.
    startRace() {
      const st = BB.settings;
      this.circuit = null;
      this.trialMode = false;
      this.setTrack(st.track);
      const n = BB.clamp(st.players, 1, 4);
      this.beginRace({ entries: BB.makeField(this.localHumans(n)), laps: st.laps, cpuText: BB.cpuSummary(n) });
    }

    // Alone on the track against the ghost of your best lap.
    startTrial() {
      const st = BB.settings;
      this.circuit = null;
      this.trialMode = true;
      this.setTrack(st.track);
      this.beginRace({ entries: BB.makeField(this.localHumans(1), { noCpus: true }), laps: st.laps, trial: true });
    }

    startCircuit() {
      const st = BB.settings;
      this.trialMode = false;
      const n = BB.clamp(st.players, 1, 4);
      this.circuit = new BB.Circuit(BB.circuitById(st.circuit), BB.makeField(this.localHumans(n)), st.laps, st.difficulty);
      this.runCircuitRace();
    }

    runCircuitRace() {
      const c = this.circuit;
      this.setTrack(c.trackId);
      this.beginRace({ entries: c.entries(), laps: c.laps, circuitLabel: c.label() });
    }

    // Restart from the pause menu: the same race again.
    restart() {
      if (this.net) return this.net.restart();
      if (this.circuit) this.runCircuitRace();
      else if (this.trialMode) this.startTrial();
      else this.startRace();
    }

    nextCircuitRace() {
      if (!this.circuit) return this.quitToTitle();
      if (this.net && !this.circuit.done) return this.net.startRace();
      if (this.circuit.done) {
        // Paint jobs unlock on how the circuit went (the best player on this computer counts).
        const c = this.circuit;
        const st = c.standings();
        const mine = st.filter((r) => c.isLocal(r.id));
        const best = mine[0];
        if (best) {
          const place = st.indexOf(best) + 1;
          c.unlocked = BB.checkUnlocks({ circuit: c.def.id, place, kills: Math.max(...mine.map((r) => r.kills)), difficulty: c.difficulty });
          // The trophy bonus, once per circuit.
          if (!c.cred) {
            const levels = c.entries().filter((e) => e.kind === 'cpu').map((e) => e.level);
            c.cred = BB.bankCred(BB.circuitCred(place, c.count, BB.credMult(levels)));
          }
        }
        this.menu.show('podium', c);
      } else this.runCircuitRace();
    }

    pause() {
      if (this.mode !== 'race') return;
      if (this.net) {
        // Online the race can't stop; the menu just opens over it.
        this.menu.show('pause');
        this.mode = 'paused-online';
        return;
      }
      this.mode = 'paused';
      this.stopEngines();
      this.music.duck(true);
      this.input.capture = false;
      this.menu.show('pause');
    }

    resume() {
      if (this.mode === 'paused-online') {
        this.mode = 'race';
        this.menu.hide();
        return;
      }
      if (this.mode !== 'paused') return;
      this.mode = 'race';
      this.menu.hide();
      this.input.capture = true;
      this.startEngines();
      this.music.duck(false);
      this.last = performance.now();
    }

    showResults() {
      this.endRace();
      if (this.race.trial) {
        const res = this.race.trialResults();
        res.cred = BB.bankCred(BB.trialCred(res), { races: 1 });
        return this.menu.show('trial', res);
      }
      const rows = this.race.results();
      if (this.circuit) this.circuit.record(rows);
      if (this.net) this.net.sendResults(rows, this.circuit);
      const cred = this.awardCred(rows);
      this.menu.show('results', { rows, circuit: this.circuit, online: !!this.net, host: !!this.net, cred });
    }

    // Cred for everyone on this computer, from the final standings. Split-screen players all
    // add to the same pot.
    awardCred(rows) {
      const r = this.race;
      if (!r || r.attract || !r.locals.length || r.credDone) return null;
      r.credDone = true;
      const mult = BB.credMult(r.karts.filter((k) => k.kind === 'cpu').map((k) => k.level));
      const per = [];
      let total = 0;
      let wins = 0;
      for (const k of r.locals) {
        const row = rows.find((x) => x.id === k.r.id);
        if (!row) continue;
        const got = BB.credFor(row, { laps: r.laps, racers: rows.length, mult, tricks: k.tricks, shortcuts: k.shortcuts });
        per.push({ label: r.locals.length > 1 ? 'P' + (k.local + 1) : '', name: k.r.short, total: got.total, parts: got.parts });
        total += got.total;
        if (row.place === 1) wins++;
      }
      const res = BB.addCred(total, { races: 1, wins });
      res.per = per;
      return res;
    }

    // ---------- online ----------

    hostOnline(name) {
      if (this.net) this.net.close();
      this.net = new BB.Net(this);
      this.net.host(name);
    }

    joinOnline(code, name) {
      if (this.net) this.net.close();
      this.net = new BB.Net(this);
      this.net.join(code, name);
    }

    // The lobby, with the chosen track racing behind it.
    showLobby() {
      const st = BB.settings;
      this.circuit = this.net && this.net.role === 'host' ? this.circuit : null;
      this.startAttract(st.mode === 'circuit' ? BB.circuitById(st.circuit).tracks[0] : st.track, true);
      this.menu.show('lobby');
    }

    // A client gets the results from the host.
    netResults(m) {
      if (!this.race) return;
      this.endRace();
      const mine = this.race.player ? this.race.player.r.id : null;
      const hostName = this.net && this.net.lobby ? this.net.lobby.players[0].name : 'host';
      for (const r of m.rows) {
        if (r.id === mine) {
          r.isPlayer = true;
          r.who = 'you';
        } else {
          r.isPlayer = false;
          if (r.who === 'you') r.who = hostName;
        }
      }
      const cred = this.awardCred(m.rows);
      this.menu.show('results', { rows: m.rows, online: true, client: true, netCircuit: m.circuit, standings: m.standings, track: m.track, cred });
    }

    // Lost the connection (or the host quit).
    netLost(msg) {
      this.net = null;
      this.circuit = null;
      this.startAttract();
      this.menu.netNote = msg;
      this.menu.show('online');
    }

    leaveOnline() {
      if (this.net) this.net.close();
      this.net = null;
      this.quitToTitle();
    }

    quitToTitle(screen) {
      this.circuit = null;
      if (this.net) {
        this.net.close();
        this.net = null;
      }
      this.startAttract();
      this.menu.show(screen || 'title');
    }

    applySettings() {
      const s = BB.settings;
      if (this.renderer.shadowMap.enabled !== s.shadows) {
        this.renderer.shadowMap.enabled = s.shadows;
        this.scene.traverse((o) => {
          if (o.material) {
            const ms = Array.isArray(o.material) ? o.material : [o.material];
            for (const m of ms) m.needsUpdate = true;
          }
        });
      }
      if (this.audio.ctx) this.audio.context();
      if (this.music) this.music.refresh();
    }

    resize() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const pr = Math.min(window.devicePixelRatio || 1, 2);
      this.renderer.setPixelRatio(pr);
      this.renderer.setSize(w, h);
      for (const v of this.views) {
        v.camera.aspect = (v.rect[2] * w) / (v.rect[3] * h);
        v.camera.updateProjectionMatrix();
      }
    }

    // ---------- cameras ----------

    updateCamera(view, dt) {
      const race = this.race;
      const k = view.player >= 0 ? race.camKart(view.player) : race.leader();
      const cam = view.camera;
      const c = view.cam;
      const snap = c.kart !== k;
      if (snap) {
        c.kart = k;
        c.yaw = k.yaw;
      }
      const wide = race.attract || view.player < 0; // TV-style camera
      const sp = Math.max(0, k.speed);
      const lookBack = this.mode === 'race' && view.player >= 0 && race.locals[view.player] && this.inputs && this.inputs[view.player] && this.inputs[view.player].lookBack;
      c.yaw = BB.lerpAngle(c.yaw, k.yaw + k.driftVis * 0.6, 1 - Math.exp(-(wide ? 3 : 5.5) * dt));
      let yaw = c.yaw + (lookBack ? Math.PI : 0);
      if (wide) yaw += Math.sin(race.time * 0.15) * 0.7;
      const fx = Math.sin(yaw);
      const fz = Math.cos(yaw);
      const dist = wide ? 10 : 5.3 + sp * 0.03;
      const height = wide ? 4.2 : 2.3;
      let px = k.pos.x - fx * dist;
      let pz = k.pos.z - fz * dist;
      let py = k.pos.y + height;
      let lx = k.pos.x + fx * 5;
      let ly = k.pos.y + 1.0;
      let lz = k.pos.z + fz * 5;

      // Countdown: swoop from in front of the kart round to behind it.
      if (race.state === 'countdown' && race.clock < -2.2) {
        const t = BB.smoothstep(-5.2, -2.4, race.clock);
        const rx = -fz;
        const rz = fx;
        const sx = k.pos.x + fx * 9 + rx * 5;
        const sz = k.pos.z + fz * 9 + rz * 5;
        const sy = k.pos.y + 2.2;
        px = BB.lerp(sx, px, t);
        py = BB.lerp(sy, py, t) + Math.sin(t * Math.PI) * 4;
        pz = BB.lerp(sz, pz, t);
        lx = BB.lerp(k.pos.x, lx, t);
        lz = BB.lerp(k.pos.z, lz, t);
        ly = BB.lerp(k.pos.y + 0.9, ly, t);
      }
      if (k.dead && !snap) {
        // Hang back and watch the wreck.
        px = c.pos.x;
        pz = c.pos.z;
        py = c.pos.y + dt * 0.8;
        lx = k.pos.x;
        ly = k.pos.y + 0.6;
        lz = k.pos.z;
      }
      const gy = this.track.groundAt(px, pz, k.hint);
      py = Math.max(py, gy + 1.2);
      if (k.info.sc && !k.dead) py = Math.min(py, k.pos.y + 3.6); // stay under tunnel roofs
      if (snap) {
        c.pos.set(px, py, pz);
        c.look.set(lx, ly, lz);
      } else {
        const r = race.state === 'countdown' ? 30 : 11;
        c.pos.x = BB.damp(c.pos.x, px, r, dt);
        c.pos.z = BB.damp(c.pos.z, pz, r, dt);
        c.pos.y = BB.damp(c.pos.y, py, 7, dt);
        c.look.x = BB.damp(c.look.x, lx, 16, dt);
        c.look.y = BB.damp(c.look.y, ly, 10, dt);
        c.look.z = BB.damp(c.look.z, lz, 16, dt);
      }
      cam.position.copy(c.pos);
      const sh = this.effects.shake;
      if (sh > 0) {
        const a = sh * sh * 0.5;
        cam.position.x += (Math.random() - 0.5) * a;
        cam.position.y += (Math.random() - 0.5) * a;
        cam.position.z += (Math.random() - 0.5) * a;
      }
      cam.lookAt(c.look);

      const fov = (wide ? 62 : 72) + BB.clamp(sp / 30, 0, 1.4) * 6 + (k.boostT > 0 && !wide ? 9 : 0);
      view.fov = BB.damp(view.fov, fov, 6, dt);
      if (Math.abs(cam.fov - view.fov) > 0.01) {
        cam.fov = view.fov;
        cam.updateProjectionMatrix();
      }
      view.kart = k;
    }

    // Draw every view into its part of the canvas.
    render() {
      const r = this.renderer;
      const W = window.innerWidth;
      const H = window.innerHeight;
      const many = this.views.length > 1;
      r.setScissorTest(many);
      for (const v of this.views) {
        const [x, y, w, h] = v.rect;
        const px = x * W;
        const py = (1 - y - h) * H;
        r.setViewport(px, py, w * W, h * H);
        if (many) r.setScissor(px, py, w * W, h * H);
        const cam = v.camera;
        this.track.sky.position.copy(cam.position);
        this.effects.setScale((h * H * r.getPixelRatio()) / (2 * Math.tan((cam.fov * BB.DEG) / 2)));
        // Shadows follow whoever this view is watching.
        const k = v.kart;
        if (k) {
          const sun = this.track.sun;
          sun.target.position.set(k.pos.x, k.pos.y, k.pos.z);
          sun.position.copy(this.track.sunDir).multiplyScalar(140).add(sun.target.position);
        }
        // Name tags: hide your own, and far-away ones.
        if (this.race) {
          for (const o of this.race.karts) {
            if (!o.tag) continue;
            const dist = Math.abs(cam.position.x - o.pos.x) + Math.abs(cam.position.z - o.pos.z);
            o.tag.visible = !o.dead && o !== k && dist > 9 && dist < 70; // not your own, not in your face
          }
        }
        r.render(this.scene, cam);
      }
      r.setScissorTest(false);
    }

    // ---------- the loop ----------

    start() {
      this.startAttract();
      this.menu.show('title');
      requestAnimationFrame(this.frame);
    }

    frame(now) {
      requestAnimationFrame(this.frame);
      let dt = (now - this.last) / 1000;
      this.last = now;
      if (!(dt > 0)) dt = 0.001;
      if (dt > 0.05) dt = 0.05;
      this.huds[0].tickFps(dt);
      this.input.poll();
      const n = this.race ? Math.max(1, this.race.locals.length) : 1;
      this.inputs = [0, 1, 2, 3].slice(0, n).map((i) => this.input.read(i, n));

      // Pause / back, and gamepad buttons for menus.
      if (this.input.pause) {
        if (this.mode === 'race') this.pause();
        else if (this.mode === 'paused' || this.mode === 'paused-online') {
          if (this.menu.screen === 'pause') this.resume();
          else this.menu.back();
        } else if (this.mode === 'menu') this.menu.back();
      } else if (this.menu.visible()) {
        if (this.input.padHit.has(0)) this.menu.primary();
        else if (this.input.padHit.has(1)) this.menu.back();
      }

      if (this.mode !== 'paused' && this.race) {
        this.time += dt;
        const driving = this.mode === 'race' || this.mode === 'paused-online';
        // While the online pause menu is open, your kart just coasts.
        const inputs = this.mode === 'race' ? this.inputs : null;
        this.race.update(dt, driving ? inputs : null);
        this.effects.update(dt);
        this.track.update(dt, this.time);
        for (const v of this.views) this.updateCamera(v, dt);
        if (this.mode === 'race') {
          for (const k of this.race.locals) {
            const inp = this.inputs[k.local];
            this.audio.setEngine(k.local, k.dead ? 0 : k.speed, k.dead || !inp ? 0 : inp.throttle, !!k.drift, k.boostT > 0, k.flameT > 0);
          }
        }
      }
      for (const h of this.huds) h.update(dt);
      this.render();
      this.input.endFrame();
    }
  }

  BB.Game = Game;

  function boot() {
    if (!window.THREE) {
      const m = document.getElementById('menu');
      m.innerHTML =
        '<div class="m-panel narrow"><h2>BuggyBoom could not start</h2><p>The 3D engine (Three.js) did not load. BuggyBoom needs an internet connection the first time it loads.</p></div>';
      m.className = 'on';
      return;
    }
    // ?track=landfill picks a track (for testing); ?autostart starts a race straight away.
    const t = BB.params.get('track');
    if (t && BB.TRACKS.some((d) => d.id === t)) BB.settings.track = t;
    const game = new Game();
    BB.game = game;
    game.start();
    if (BB.params.has('autostart')) game.startRace();
  }

  boot();
})();
</script>
</body>
</html>
