      k.ai = new BB.AIDriver(k, this.race);
      this.race.humans = this.race.karts.filter((x) => x.human);
      if (k.tag) {
        k.m.root.remove(k.tag);
        this.race.addTag(k);
      }
    }

    // The field for a race: the host, everyone online, and CPUs in the empty spots.
    field() {
      const humans = this.lobby.players.map((p) => (p.id === 'host' ? { racer: p.racer, kind: 'human', local: 0, name: p.name } : { racer: p.racer, kind: 'remote', peer: p.id, name: p.name, paint: p.paint, kart: p.kart || 'buggy' }));
      return BB.makeField(humans).map((e) => Object.assign({}, e, { paint: e.paint || BB.paintFor(e.racer) }));
    }

    // Host: start a race (or the next one in a circuit) for everyone.
    startRace() {
      const g = this.game;
      const st = BB.settings;
      this.lobby.state = 'race';
      this.lobby.players[0].racer = BB.partyPicks()[0];
      if (st.mode === 'circuit') {
        if (!g.circuit || g.circuit.done) g.circuit = new BB.Circuit(BB.circuitById(st.circuit), this.field(), st.laps, st.difficulty);
        const c = g.circuit;
        this.begin(c.trackId, c.entries(), c.laps, c.label());
      } else {
        g.circuit = null;
        this.begin(st.track, this.field(), st.laps, '');
      }
    }

    begin(trackId, entries, laps, circuitLabel) {
      const g = this.game;
      const cpuText = BB.cpuSummary(this.lobby.players.length);
      this.broadcast({ t: 'start', track: trackId, entries, laps, circuitLabel, cpuText });
      g.setTrack(trackId);
      g.beginRace({ entries, laps, circuitLabel, cpuText, net: this });
      this.sendT = 0;
    }

    restart() {
      if (this.role === 'host') this.startRace();
    }

    // Back to the lobby after a race.
    toLobby() {
      if (this.role !== 'host') return;
      this.lobby.state = 'lobby';
      this.game.circuit = null;
      this.sendLobby();
      this.broadcast({ t: 'tolobby' });
      this.game.showLobby();
    }

    // ---------- joining ----------

    join(code, name) {
      if (!BB.netAvailable()) return this.fail('Online play needs the internet (PeerJS did not load).');
      this.role = 'client';
      this.error = '';
      this.code = String(code || '').trim().toUpperCase();
      if (this.code.length < 4) return this.fail('Type the room code the host gave you.');
      this.status = 'Connecting to ' + this.code + '...';
      this.changed();
      this.peer = new window.Peer(undefined, { debug: 0 });
      this.peer.on('open', (id) => {
        this.myId = id;
        const conn = (this.conn = this.peer.connect(PREFIX + this.code, { reliable: true, serialization: 'json' }));
        conn.on('open', () => {
          this.status = 'Joined. Waiting for the host...';
          const racer = BB.partyPicks()[0];
          conn.send({ t: 'hello', v: BB.GAME_VERSION, name, racer, paint: BB.paintFor(racer), kart: BB.kartFor(racer) });
          this.startBeat();
          this.changed();
        });
        conn.on('data', (m) => this.clientRecv(m));
        conn.on('close', () => this.hostGone());
        conn.on('error', () => this.hostGone());
      });
      this.peer.on('error', (e) => this.fail(e.type === 'peer-unavailable' ? 'No race with code ' + this.code + '. Check it with the host.' : 'Could not connect: ' + (e.message || e.type)));
    }

    send(m) {
      if (this.conn && this.conn.open) this.conn.send(m);
    }

    pick(racer) {
      this.send({ t: 'pick', racer, paint: BB.paintFor(racer), kart: BB.kartFor(racer) });
    }

    hostGone() {
      if (this.role !== 'client' || this.closed) return;
      this.close(); // hang up our end too
      this.game.netLost('The host left the race.');
    }

    clientRecv(m) {
      this.hostHeard = Date.now();
      const g = this.game;
      const race = this.race;
      switch (m.t) {
        case 'nope':
          this.fail(m.why);
          break;
        case 'lobby':
          this.lobby = m.lobby;
          this.setup = m.setup;
          this.changed();
          break;
        case 'tolobby':
          g.showLobby();
          break;
        case 'start': {
          // Our own kart is ours; everyone else is shown as the host says.
          const entries = m.entries.map((e) => (e.peer === this.myId ? Object.assign({}, e, { kind: 'human', local: 0 }) : Object.assign({}, e, e.kind === 'human' ? { kind: 'remote' } : {})));
          g.setTrack(m.track);
          g.beginRace({ entries, laps: m.laps, circuitLabel: m.circuitLabel, cpuText: m.cpuText, net: this });
          this.clearShotMeshes();
          this.sendT = 0;
          break;
        }
        case 'snap':
          if (race && race.net === this) this.applySnap(m);
          break;
        case 'fx':
          if (race) {
            race.fx.explode(m.x, m.y, m.z, m.s);
            race.audio.explosion(race.audio.at(m.x, m.y, m.z), m.s);
          }
          break;
        case 'die': {
          const k = race && race.karts[m.i];
          if (k && !k.isPlayer && !k.dead) k.die(race.karts[m.by] || null, m.cause);
          break;
        }
        case 'hit': {
          const me = race && race.player;
          if (!me) break;
          const by = race.karts[m.by] || null;
          if (m.cause === 'spin') me.spinOut(m.opt.spin);
          else me.damage(m.a, by, m.cause, m.opt);
          if (m.cause === 'puke') race.onPuke(me, by);
          break;
        }
        case 'fin': {
          const k = race && race.karts[m.i];
          if (!k || k.finished) break;
          k.finished = true;
          k.finishTime = m.time;
          k.finishPlace = m.place;
          race.finishOrder.push(k);
          if (k.isPlayer) race.finishFanfare(k);
          break;
        }
        case 'cpu': {
          const k = race && race.karts[m.i];
          if (k) {
            k.human = false;
            k.kind = 'cpu';
            k.pname = (k.pname || 'Player') + ' (CPU)';
            if (k.tag) {
              k.m.root.remove(k.tag);
              race.addTag(k);
            }
          }
          break;
        }
        case 'results':
          g.netResults(m);
          break;
        case 'end':
          this.hostGone();
          break;
      }
    }

    // ---------- during a race ----------

    // Host: a hit on a kart someone else drives. Collected and sent on the next tick.
    forwardHit(k, amount, by, cause, opt) {
      if (by && by !== k) k.netLastHit = { by: by.idx, t: Date.now() }; // for kill credit (see 'died')
      const h = this.hits.get(k);
      const o = { spin: opt.spin || 0, kx: opt.kx || 0, kz: opt.kz || 0, vy: opt.vy || 0, quiet: !!opt.quiet, burn: opt.burn || 0 };
      if (h && h.cause === cause) {
        h.a += amount;
        h.opt.spin = Math.max(h.opt.spin, o.spin);
        h.opt.kx += o.kx;
        h.opt.kz += o.kz;
        h.opt.vy = Math.max(h.opt.vy, o.vy);
        h.opt.burn = Math.max(h.opt.burn, o.burn);
      } else {
        if (h) this.flushHit(k, h);
        this.hits.set(k, { a: amount, by: by ? by.idx : -1, cause, opt: o });
      }
      if (by && by.isPlayer && by !== k) this.game.audio.hitConfirm();
    }

    flushHit(k, h) {
      this.sendTo(k.peer, { t: 'hit', a: r2(h.a), by: h.by, cause: h.cause, opt: h.opt });
    }

    // Host: an explosion everyone should see.
    fx(x, y, z, s) {
      if (this.role === 'host') this.broadcast({ t: 'fx', x: r2(x), y: r2(y), z: r2(z), s: r2(s) });
    }

    onKill(killer, victim, cause) {
      if (this.role === 'host') this.broadcast({ t: 'die', i: victim.idx, by: killer ? killer.idx : -1, cause }, victim.peer || undefined);
      else if (victim.isPlayer) this.send({ t: 'died', by: killer ? killer.idx : -1, cause });
    }

    onFinish(k) {
      if (this.role === 'host') this.broadcast({ t: 'fin', i: k.idx, place: k.finishPlace, time: k.finishTime });
    }

    // Host: the results, after the circuit (if any) has added them up.
    sendResults(rows, circuit) {
      if (this.role !== 'host') return;
      const standings = circuit ? circuit.standings().map((s) => ({ id: s.id, name: s.name, color: s.color, pts: s.pts, kills: s.kills, who: s.who, places: s.places })) : null;
      this.broadcast({ t: 'results', rows, track: this.game.track.name, circuit: circuit ? { name: circuit.def.name, idx: circuit.idx, count: circuit.count, done: circuit.done } : null, standings });
    }

    // Client: use our item. Things that move our own kart happen here at once; the host does the rest.
    useItem(k, back) {
      const it = k.item;
      if (!it || k.rollT > 0 || k.dead || k.useCD > 0) return;
      this.race.items.applyToSelf(k, BB.ITEMS[it.id].kind);
      k.useCD = 0.35;
      it.uses--;
      if (it.uses <= 0) k.item = null;
      this.itemHold = 0.5; // ignore the host's item count until it has caught up
      this.send({ t: 'use', back });
    }

    // Every frame, from Race.update.
    tick(dt) {
      const race = this.race;
      if (!race) return;
      this.itemHold = Math.max(0, (this.itemHold || 0) - dt);
      if (this.role === 'host') {
        for (const k of race.karts) if (k.remote) this.follow(k, dt);
        for (const [k, h] of this.hits) this.flushHit(k, h);
        this.hits.clear();
      } else {
        for (const k of race.karts) if (k.puppet) this.follow(k, dt);
        for (const k of race.locals) if (k.flameT > 0) k.flameT = Math.max(0, k.flameT - dt);
        race.items.clientUpdate(dt, this.crates);
        this.updateShotMeshes(dt);
      }
      this.sendT -= dt;
      if (this.sendT > 0) return;
      this.sendT = SEND_EVERY;
      if (this.role === 'host') this.broadcast(this.snapshot());
      else if (race.player) {
        const k = race.player;
        this.send({ t: 'me', x: r2(k.pos.x), y: r2(k.pos.y), z: r2(k.pos.z), yaw: r3(k.yaw), sp: r2(k.speed), vy: r2(k.vy), f: flagsOf(k), hp: Math.round(k.hp) });
      }
    }

    snapshot() {
      const race = this.race;
      const it = race.items;
      return {
        t: 'snap',
        time: r2(race.time),
        clock: r2(race.clock),
        k: race.karts.map((k) => [r2(k.pos.x), r2(k.pos.y), r2(k.pos.z), r3(k.yaw), r2(k.speed), flagsOf(k), Math.round(k.hp), k.lap, Math.round(k.raceDist), k.rank, k.item ? BB.ITEM_IDS.indexOf(k.item.id) : -1, k.item ? k.item.uses : 0, r2(Math.max(0, k.rollT)), k.rollItem ? BB.ITEM_IDS.indexOf(k.rollItem) : -1]),
        s: it.shots.map((s) => [s.id, s.type === 'rocket' ? 0 : 1, r2(s.x), r2(s.y), r2(s.z), r3(Math.atan2(s.dx, s.dz))]),
        h: it.hazards.map((h) => [h.id, h.type === 'mine' ? 0 : 1, r2(h.x), r2(h.y), r2(h.z), r3(h.m.rotation.y)]),
        d: it.drones.map((d) => [d.id, r2(d.x), r2(d.y), r2(d.z), d.phase === 'dive' ? 1 : 0, d.target ? d.target.idx : -1]),
        cr: it.crateMask(),
      };
    }

    // Host: a player's kart, as their computer says.
    applyRemote(peerId, m) {
      const k = this.kartOf(peerId);
      if (!k || !k.remote) return;
      if (![m.x, m.y, m.z, m.yaw, m.sp].every(Number.isFinite)) return;
      // No faster than any kart can go (boosts and lag included). A respawn sets you back about 12 m, which fits.
      const now = Date.now();
      const prev = k.netT || k.pos;
      const dt = Math.max(0.05, (now - (k.netAt || now)) / 1000); // (since the last report we took, so a lag spike catches up)
      if (Math.hypot(m.x - prev.x, m.z - prev.z) > 60 * dt + 15) return;
      k.netAt = now;
      k.netT = { x: m.x, y: m.y, z: m.z, yaw: m.yaw, sp: BB.clamp(m.sp, -30, 60), vy: Number.isFinite(m.vy) ? m.vy : 0, age: 0 };
      applyFlags(k, m.f);
      k.hp = BB.clamp(Number.isFinite(m.hp) ? m.hp : k.hp, 0, k.maxHp);
      const dead = !!(m.f & (1 << 6));
      if (!dead && k.dead) k.revive();
    }

    // Client: the whole race, as the host says.
    applySnap(m) {
      const race = this.race;
      // Keep our race clock in step with the host's (the geysers and tanks run on it).
      const off = m.clock - race.clock;
      if (Math.abs(off) > 0.3) {
        race.clock = m.clock;
        race.time = m.time;
      } else {
        race.clock += off * 0.1;
        race.time += (m.time - race.time) * 0.1;
      }
      if (race.state === 'countdown' && race.clock >= 0) race.state = 'race';
      m.k.forEach((a, i) => {
        const k = race.karts[i];
        if (!k) return;
        k.rank = a[9];
        if (k.isPlayer) {
          // Our own kart: only the item comes from the host.
          if (this.itemHold <= 0) {
            const was = k.rollT > 0;
            k.rollT = a[12];
            k.rollItem = a[13] >= 0 ? BB.ITEM_IDS[a[13]] : null;
            k.item = a[10] >= 0 ? { id: BB.ITEM_IDS[a[10]], uses: a[11] } : null;
            if (was && k.rollT <= 0 && k.item) race.audio.itemGet();
          }
          return;
        }
        k.netT = { x: a[0], y: a[1], z: a[2], yaw: a[3], sp: a[4], vy: 0, age: 0 };
        applyFlags(k, a[5]);
        k.hp = a[6];
        k.lap = a[7];
        k.raceDist = a[8];
        const dead = !!(a[5] & (1 << 6));
        if (!dead && k.dead) k.revive();
      });
      race.order = race.karts.slice().sort((a, b) => a.rank - b.rank);
      this.crates = m.cr;
      this.snapShots = m;
    }

    // Glide a network-driven kart toward where it was reported, carrying on at its speed.
    follow(k, dt) {
      const t = k.netT;
      if (!t) return;
      // Carry on at its speed between updates, but don't guess for long if they stop coming.
      t.age += dt;
      if (!k.dead && t.age < 0.3) {
        t.x += Math.sin(t.yaw) * t.sp * dt;
        t.z += Math.cos(t.yaw) * t.sp * dt;
      }
      const a = 1 - Math.exp(-14 * dt);
      const far = Math.abs(t.x - k.pos.x) + Math.abs(t.z - k.pos.z) > 25;
      k.pos.x = far ? t.x : BB.lerp(k.pos.x, t.x, a);
      k.pos.y = far ? t.y : BB.lerp(k.pos.y, t.y, a);
      k.pos.z = far ? t.z : BB.lerp(k.pos.z, t.z, a);
      k.yaw = BB.lerpAngle(k.yaw, t.yaw, a);
      k.speed = t.sp;
      k.vy = t.vy;
      this.game.track.probe(k.pos.x, k.pos.z, k.st, k.info);
      if (k.trick) k.trick.t += dt;
      if (k.spinT > 0) k.spinT -= dt;
      k.invT = Math.max(0, k.invT - dt);
    }

    // ---------- client: rockets, saws, bombs and drones the host reports ----------

    clearShotMeshes() {
      for (const o of this.shotMeshes.values()) o.m.parent && o.m.parent.remove(o.m);
      this.shotMeshes.clear();
      this.snapShots = null;
    }

    updateShotMeshes(dt) {
      const m = this.snapShots;
      const race = this.race;
      if (!m || !race) return;
      const it = race.items;
      const seen = new Set();
      const get = (key, make) => {
        seen.add(key);
        let o = this.shotMeshes.get(key);
        if (!o) {
          o = { m: make(), t: 0 };
          it.group.add(o.m);
          this.shotMeshes.set(key, o);
        }
        o.t += dt;
        return o;
      };
      for (const s of m.s) {
        const o = get('s' + s[0], () => {
          if (s[1] === 0) return it.rocketProto.clone();
          const saw = it.sawProto.clone();
          saw.userData.disc = saw.children[0];
          return saw;
        });
        const p = o.m.position;
        p.set(BB.lerp(p.x || s[2], s[2], 0.5), BB.lerp(p.y || s[3], s[3], 0.5), BB.lerp(p.z || s[4], s[4], 0.5));
        if (s[1] === 0) {
          o.m.rotation.set(0, s[5], o.t * 8);
          race.fx.fire(p.x - Math.sin(s[5]) * 0.7, p.y, p.z - Math.cos(s[5]) * 0.7, 2, 0.5, 0, 0, 0, 0.8);
        } else {
          o.m.rotation.y = s[5];
          o.m.userData.disc.rotation.x -= dt * 30;
        }
      }
      for (const h of m.h) {
        const o = get('h' + h[0], () => {
          if (h[1] === 0) return it.mineProto.clone();
          const pm = new THREE.Mesh(race.fx.decalGeo, it.pukeMat);
          pm.scale.set(4, 1, 4);
          return pm;
        });
        o.m.position.set(h[2], h[3] + (h[1] === 1 ? 0.06 : 0), h[4]);
        o.m.rotation.y = h[5];
      }
      for (const d of m.d) {
        const o = get('d' + d[0], () => it.droneProto.clone());
        o.m.position.set(d[1], d[2], d[3]);
        o.m.rotation.x = d[4] ? 0.6 : 0.15;
      }
      for (const [key, o] of this.shotMeshes) {
        if (seen.has(key)) continue;
        o.m.parent && o.m.parent.remove(o.m);
        this.shotMeshes.delete(key);
      }
    }

    // Is a drone hunting this kart? (client HUD warning)
    droneOn(k) {
      const m = this.snapShots;
      return !!(m && m.d.some((d) => d[5] === k.idx));
    }

    // ---------- staying in touch ----------

    // A tiny message every second both ways. A closed tab or a dead connection can take ages to
    // show up on its own, so a few seconds of silence counts as gone. Timers keep running when the
    // tab is in the background, so someone who just switched windows stays in.
    startBeat() {
      if (this.hb) return;
      this.hostHeard = Date.now();
      this.hb = setInterval(() => this.beat(), 1000);
    }

    stopBeat() {
      if (this.hb) clearInterval(this.hb);
      this.hb = null;
    }

    beat() {
      const now = Date.now();
      if (this.role === 'host') {
        this.broadcast({ t: 'hb' });
        for (const [id, c] of this.conns) {
          if (now - (this.heard.get(id) || now) < SILENT_MS) continue;
          try {
            c.close();
          } catch (e) {
            /* already gone */
          }
          this.dropped(id);
        }
      } else if (this.conn && this.conn.open) {
        this.send({ t: 'hb' });
        if (now - this.hostHeard > SILENT_MS + 2000) this.hostGone();
      }
    }

    // ---------- leaving ----------

    // Say goodbye and hang up. now: the page is closing, so hang up at once; otherwise wait a
    // moment so the goodbye gets through.
    close(now) {
      if (this.closed) return;
      this.closed = true;
      this.stopBeat();
      try {
        if (this.role === 'host') this.broadcast({ t: 'end' });
        else this.send({ t: 'bye' });
      } catch (e) {
        /* already gone */
      }
      const hangUp = () => {
        try {
          if (this.peer) this.peer.destroy();
        } catch (e) {
          /* already gone */
        }
      };
      if (now) hangUp();
      else setTimeout(hangUp, 300);
      this.clearShotMeshes();
    }
  }

  BB.Net = Net;
})();
</script>
<script>
/* ---- js/hud.js ---- */
/* BuggyBoom — the race HUD: lap and time, item slot, minimap, health, position, speed, kill feed,
   the big announcer text, warnings, and blood / puke on the screen. One HUD per player on this
   computer, each laid over that player's part of the screen. */
(function () {
  'use strict';
  const BB = window.BB;

  const COLORS = { red: '#ff3b3b', yellow: '#ffd23f', green: '#8bdc3b', white: '#f6efe4' };

  class HUD {
    constructor(game) {
      this.game = game;
      this.root = document.getElementById('hud');
      const el = (this.el = document.createElement('div'));
      el.className = 'hudv';
      this.root.appendChild(el);
      el.innerHTML = `
        <div class="ov ov-hurt"></div>
        <div class="ov ov-blood"></div>
        <div class="ov ov-puke"></div>
        <div class="ov ov-poop"></div>
        <div class="h-lap">
          <div class="h-lap-n">LAP <b>1</b><span>/3</span></div>
          <div class="h-time">0:00.00</div>
          <div class="h-circ"></div>
          <div class="h-laps"></div>
        </div>
        <div class="h-item">
          <div class="h-item-box"><div class="h-item-icon"></div><div class="h-item-uses"></div></div>
          <div class="h-item-name"></div>
        </div>
        <div class="h-map"><canvas></canvas></div>
        <div class="h-feed"></div>
        <div class="h-health">
          <div class="h-name"></div>
          <div class="h-bar"><i></i></div>
        </div>
        <div class="h-pos"><b>8</b><sup>th</sup><small>/8</small></div>
        <div class="h-best"><span>BEST LAP</span><b>-:--.--</b></div>
        <div class="h-speed"><b>0</b><span>km/h</span><div class="h-drift"><i></i><i></i><i></i></div></div>
        <div class="h-ann"><div class="h-ann-t"></div><div class="h-ann-s"></div></div>
        <div class="h-warn"></div>
        <div class="h-help"></div>
        <div class="h-fps"></div>`;
      const q = (s) => el.querySelector(s);
      this.r = {
        lapN: q('.h-lap-n b'), lapOf: q('.h-lap-n span'), time: q('.h-time'), laps: q('.h-laps'),
        item: q('.h-item'), itemIcon: q('.h-item-icon'), itemUses: q('.h-item-uses'), itemName: q('.h-item-name'),
        map: q('.h-map canvas'), feed: q('.h-feed'),
        name: q('.h-name'), bar: q('.h-bar i'),
        pos: q('.h-pos b'), posSup: q('.h-pos sup'), posOf: q('.h-pos small'),
        speed: q('.h-speed b'), drift: el.querySelectorAll('.h-drift i'),
        ann: q('.h-ann'), annT: q('.h-ann-t'), annS: q('.h-ann-s'),
        warn: q('.h-warn'), help: q('.h-help'), fps: q('.h-fps'),
        hurt: q('.ov-hurt'), blood: q('.ov-blood'), puke: q('.ov-puke'), poop: q('.ov-poop'), circ: q('.h-circ'), best: q('.h-best b'),
      };
      this.cache = {};
      this.annT = 0;
      this.hurtA = 0;
      this.bloodA = 0;
      this.pukeA = 0;
      this.poopA = 0;
      this.feedItems = [];
      this.rollTick = 0;
      this.fpsT = 0;
      this.fpsN = 0;
      this.wrong = false;
      this.mapCtx = this.r.map.getContext('2d');
      this.buildMap();
    }

    // Show this HUD for one kart. size: 'full', 'half' or 'quarter' of the screen.
    show(race, kart, size, controls) {
      this.race = race;
      this.kart = kart;
      this.root.classList.add('on');
      this.el.classList.add('on');
      this.el.classList.remove('full', 'half', 'quarter');
      this.el.classList.add(size || 'full');
      this.r.feed.innerHTML = '';
      this.feedItems = [];
      this.cache = {};
      this.annT = 0;
      this.r.ann.classList.remove('on');
      this.hurtA = this.bloodA = this.pukeA = this.poopA = 0;
      this.helpT = 14;
      this.r.circ.textContent = race.trial ? 'TIME TRIAL' : race.circuitLabel || '';
      this.el.classList.toggle('trial', !!race.trial);
      this.buildMap();
      const p = kart;
      if (p) {
        this.r.name.textContent = (race.locals.length > 1 ? 'P' + (p.local + 1) + ' · ' : '') + p.name;
        this.r.name.style.color = BB.ink(p.r.color);
      }
      this.r.help.innerHTML = controls || BB.controlsText(0, 1);
    }

    // Where on the screen this HUD sits (fractions of the window).
    place(x, y, w, h) {
      const st = this.el.style;
      st.left = x * 100 + '%';
      st.top = y * 100 + '%';
      st.width = w * 100 + '%';
      st.height = h * 100 + '%';
    }

    hide() {
      this.el.classList.remove('on');
      if (![...this.root.children].some((c) => c.classList.contains('on'))) this.root.classList.remove('on');
      this.race = null;
      this.kart = null;
    }

    // ---------- the minimap ----------

    buildMap() {
      const tr = this.game.track;
      const size = 190;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      this.mapSize = size;
      this.mapDpr = dpr;
      this.r.map.width = size * dpr;
      this.r.map.height = size * dpr;
      const b = tr.bounds;
      const span = Math.max(b.maxX - b.minX, b.maxZ - b.minZ) + 40;
      this.mapScale = size / span;
      this.mapCx = b.cx;
      this.mapCz = b.cz;
      const off = document.createElement('canvas');
      off.width = size * dpr;
      off.height = size * dpr;
      const g = off.getContext('2d');
      g.scale(dpr, dpr);
      g.lineJoin = g.lineCap = 'round';
      const path = () => {
        g.beginPath();
        for (let i = 0; i <= tr.N; i += 4) {
          const j = i % tr.N;
          const [x, y] = this.mapXY(tr.X[j], tr.Z[j]);
          if (i === 0) g.moveTo(x, y);
          else g.lineTo(x, y);
        }
        g.closePath();
      };
      path();
      g.strokeStyle = 'rgba(0,0,0,0.6)';
      g.lineWidth = 11;
      g.stroke();
      g.strokeStyle = '#d8d2c6';
      g.lineWidth = 6;
      g.stroke();
      g.strokeStyle = '#4a4650';
      g.lineWidth = 3.5;
      g.stroke();
      // Secret shortcuts you've found, dashed.
      const known = BB.store.get('buggyboom.secrets', {});
      for (const sc of tr.shortcuts) {
        if (!known[sc.id]) continue;
        g.beginPath();
        for (let i = 0; i < sc.path.n; i += 3) {
          const [x, y] = this.mapXY(sc.path.X[i], sc.path.Z[i]);
          if (i === 0) g.moveTo(x, y);
          else g.lineTo(x, y);
        }
        g.setLineDash([3, 3]);
        g.strokeStyle = '#8bdc3b';
        g.lineWidth = 2.5;
        g.stroke();
        g.setLineDash([]);
      }
      const [sx, sy] = this.mapXY(tr.X[0], tr.Z[0]);
      g.fillStyle = '#fff';
      g.fillRect(sx - 1.5, sy - 6, 3, 12);
      this.mapImg = off;
    }

    mapXY(x, z) {
      const s = this.mapScale;
      return [(x - this.mapCx) * s + this.mapSize / 2, (z - this.mapCz) * s + this.mapSize / 2];
    }

    drawMap() {
      const g = this.mapCtx;
      const dpr = this.mapDpr;
      g.setTransform(1, 0, 0, 1, 0, 0);
      g.clearRect(0, 0, this.r.map.width, this.r.map.height);
      g.drawImage(this.mapImg, 0, 0);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      const race = this.race;
      // Rockets and drones.
      g.fillStyle = '#ff5a3a';
      const snap = race.isClient ? race.net.snapShots : null;
      const shots = snap ? snap.s.map((a) => ({ x: a[2], z: a[4] })) : race.items.shots;
      const drones = snap ? snap.d.map((a) => ({ x: a[1], z: a[3] })) : race.items.drones;
      for (const s of shots) {
        const [x, y] = this.mapXY(s.x, s.z);
        g.fillRect(x - 1.5, y - 1.5, 3, 3);
      }
      for (const d of drones) {
        const [x, y] = this.mapXY(d.x, d.z);
        g.fillStyle = '#ff2a2a';
        g.beginPath();
        g.arc(x, y, 4, 0, 7);
        g.fill();
      }
      if (race.ghostPos) {
        const [x, y] = this.mapXY(race.ghostPos.x, race.ghostPos.z);
        g.beginPath();
        g.arc(x, y, 5, 0, 7);
        g.fillStyle = 'rgba(255,255,255,0.45)';
        g.fill();
        g.lineWidth = 1.5;
        g.strokeStyle = 'rgba(255,255,255,0.9)';
        g.stroke();
      }
      const me = this.kart;
      const ks = race.karts.slice().sort((a, b) => (a === me ? 1 : 0) - (b === me ? 1 : 0));
      for (const k of ks) {
        const [x, y] = this.mapXY(k.pos.x, k.pos.z);
        const r = k === me ? 5.5 : k.human ? 4.8 : 4;
        g.beginPath();
        g.arc(x, y, r, 0, 7);
        g.fillStyle = k.dead ? '#555' : k.r.color === '#22222b' ? '#bbb' : k.r.color;
        g.fill();
        g.lineWidth = k === me ? 2.5 : k.human ? 2 : 1.5;
        g.strokeStyle = k === me ? '#fff' : k.human ? 'rgba(255,255,255,0.7)' : 'rgba(0,0,0,0.8)';
        g.stroke();
      }
    }

    // ---------- events ----------

    announce(title, sub, color, dur) {
      const r = this.r;
      r.annT.innerHTML = BB.text(title);
      r.annS.innerHTML = sub ? BB.text(sub) : '';
      r.annT.style.color = COLORS[color] || COLORS.white;
      r.ann.classList.remove('on');
      void r.ann.offsetWidth; // restart the pop animation
      r.ann.classList.add('on');
      this.annT = dur || 1.5;
    }

    feed(killer, victim, cause) {
      if (!this.race) return;
      const col = (k) => BB.ink(k.r.color);
      let html;
      if (killer) html = `<b style="color:${col(killer)}">${BB.esc(killer.name)}</b> ${BB.text(BB.killVerb(cause))} <b style="color:${col(victim)}">${BB.esc(victim.name)}</b>`;
      else html = `<b style="color:${col(victim)}">${BB.esc(victim.name)}</b> ${BB.text(BB.selfDeath(cause))}`;
      const mine = (killer && killer === this.kart) || victim === this.kart;
      this.pushFeed(html, mine ? 'kill mine' : 'kill');
    }

    taunt(k, line) {
      if (!this.race) return;
      this.pushFeed(`<b style="color:${BB.ink(k.r.color)}">${BB.esc(k.r.short)}:</b> <i>"${BB.text(line)}"</i>`, 'taunt');
    }

    pushFeed(html, cls) {
      const d = document.createElement('div');
      d.className = 'f ' + cls;
      d.innerHTML = html;
      this.r.feed.appendChild(d);
      this.feedItems.push({ d, t: 6 });
      while (this.feedItems.length > 6) this.feedItems.shift().d.remove();
    }

    hurt(f) {
      this.hurtA = Math.min(0.85, this.hurtA + 0.25 + f * 0.6);
    }

    splatter() {
      if (!BB.settings.gore) return;
      this.r.blood.style.background = this.blobs(['rgba(120,6,10,0.9)', 'rgba(150,10,16,0.85)', 'rgba(90,4,8,0.9)'], 9);
      this.bloodA = 1;
    }

    puke() {
      this.r.puke.style.background = this.blobs(['rgba(150,190,40,0.85)', 'rgba(120,160,30,0.8)', 'rgba(180,170,60,0.8)'], 8);
      this.pukeA = 1;
    }

    poop() {
      this.r.poop.style.background = this.blobs(['rgba(240,238,228,0.95)', 'rgba(220,220,200,0.92)', 'rgba(170,170,140,0.9)'], 3);
      this.poopA = 1.3;
    }

    blobs(cols, n) {
      const out = [];
      for (let i = 0; i < n; i++) {
        const x = Math.random() * 100;
        const y = Math.random() < 0.5 ? Math.random() * 30 : 70 + Math.random() * 30;
        const r = 4 + Math.random() * 10;
        out.push(`radial-gradient(circle at ${x}% ${y}%, ${BB.pick(cols)} 0, ${BB.pick(cols)} ${r}vmin, transparent ${r + 0.6}vmin)`);
        for (let k = 0; k < 4; k++) {
          const a = Math.random() * BB.TAU;
          const d = r + 2 + Math.random() * 6;
          out.push(`radial-gradient(circle at calc(${x}% + ${Math.cos(a) * d}vmin) calc(${y}% + ${Math.sin(a) * d}vmin), ${cols[0]} 0, ${cols[0]} ${0.6 + Math.random() * 1.4}vmin, transparent ${2.2}vmin)`);
        }
      }
      return out.join(',');
    }

    wrongWay(on) {
      this.wrong = on;
    }

    // ---------- every frame ----------

    set(key, el, prop, val) {
      if (this.cache[key] === val) return;
      this.cache[key] = val;
      el[prop] = val;
    }

    tickFps(dt) {
      this.fpsT += dt;
      this.fpsN++;
      if (this.fpsT >= 0.5) {
        this.r.fps.textContent = BB.settings.showFps ? Math.round(this.fpsN / this.fpsT) + ' fps' : '';
        this.fpsT = 0;
        this.fpsN = 0;
      }
    }

    update(dt) {
      const r = this.r;
      // Overlays fade whether or not a race HUD is showing.
      this.hurtA = Math.max(0, this.hurtA - dt * 1.6);
      this.bloodA = Math.max(0, this.bloodA - dt * 0.4);
      this.pukeA = Math.max(0, this.pukeA - dt * 0.45);
      this.poopA = Math.max(0, this.poopA - dt * 0.3);
      r.poop.style.opacity = Math.min(1, this.poopA).toFixed(3);
      r.hurt.style.opacity = this.hurtA.toFixed(3);
      r.blood.style.opacity = Math.min(1, this.bloodA * 1.5).toFixed(3);
      r.puke.style.opacity = Math.min(1, this.pukeA * 1.5).toFixed(3);

      const race = this.race;
      if (!race) return;
      if (this.annT > 0) {
        this.annT -= dt;
        if (this.annT <= 0) r.ann.classList.remove('on');
      }
      for (let i = this.feedItems.length - 1; i >= 0; i--) {
        const f = this.feedItems[i];
        f.t -= dt;
        if (f.t < 0.6) f.d.style.opacity = Math.max(0, f.t / 0.6);
        if (f.t <= 0) {
          f.d.remove();
          this.feedItems.splice(i, 1);
        }
      }
      const p = this.kart;
      if (!p) return;

      this.set('lapN', r.lapN, 'textContent', String(BB.clamp(p.lap, 1, race.laps)));
      this.set('lapOf', r.lapOf, 'textContent', '/' + race.laps);
      const t = p.finished ? p.finishTime : Math.max(0, race.clock);
      this.set('time', r.time, 'textContent', BB.fmtTime(t));
      this.set('laps', r.laps, 'innerHTML', p.lapTimes.map((lt, i) => `<div>L${i + 1} <b>${BB.fmtTime(lt)}</b></div>`).join(''));

      // Item slot (with the roulette spinning while a crate rolls).
      let icon = '';
      let name = '';
      let uses = '';
      if (p.rollT > 0) {
        this.rollTick -= dt;
        if (this.rollTick <= 0) {
          this.rollTick = 0.07;
          this.rollIcon = BB.ITEMS[BB.pick(BB.ITEM_IDS)].icon;
          this.game.audio.tick();
        }
        icon = this.rollIcon || '';
        name = '...';
      } else if (p.item) {
        const it = BB.ITEMS[p.item.id];
        icon = it.icon;
        name = it.name;
        uses = p.item.uses > 1 ? '×' + p.item.uses : '';
      }
      this.set('icon', r.itemIcon, 'textContent', icon);
      this.set('iname', r.itemName, 'textContent', name);
      this.set('uses', r.itemUses, 'textContent', uses);
      const flaming = p.flameT > 0 ? ' fire' : '';
      const cls = 'h-item' + (p.item && p.rollT <= 0 ? ' ready' : '') + (p.rollT > 0 ? ' rolling' : '') + flaming;
      this.set('icls', r.item, 'className', cls);

      // Health.
      const hpf = BB.clamp(p.hp / p.maxHp, 0, 1);
      const hpw = Math.round(hpf * 1000) / 10 + '%';
      this.set('hpw', r.bar.style, 'width', hpw);
      this.set('hpc', r.bar.style, 'background', hpf > 0.5 ? '#8bdc3b' : hpf > 0.25 ? '#ffd23f' : '#ff3b3b');

      if (race.trial) this.set('best', r.best, 'textContent', race.best && race.best.lap ? BB.fmtTime(race.best.lap) : 'none yet');
      const place = p.finished ? p.finishPlace : p.rank + 1;
      this.set('pos', r.pos, 'textContent', String(place));
      this.set('posSup', r.posSup, 'textContent', BB.ordinal(place));
      this.set('posOf', r.posOf, 'textContent', '/' + race.karts.length);

      this.set('speed', r.speed, 'textContent', String(Math.round(Math.abs(p.speed) * 3.6 * 1.5)));
      for (let i = 0; i < 3; i++) this.set('d' + i, r.drift[i], 'className', p.drift && p.tier > i ? 'on t' + (i + 1) : '');

      // Warnings.
      let warn = '';
      const drone = race.isClient ? race.net.droneOn(p) : race.items.droneOn(p);
      if (drone && !p.dead) warn = '⚠ DRONE STRIKE INCOMING ⚠';
      else if (this.wrong && !p.dead) warn = BB.say('WRONG WAY, {DUMBASS}!');
      this.set('warn', r.warn, 'textContent', warn);
      this.set('warnOn', r.warn, 'className', warn ? 'h-warn on' : 'h-warn');

      if (this.helpT > 0) {
        this.helpT -= dt;
        r.help.style.opacity = BB.clamp(this.helpT / 1.5, 0, 1).toFixed(2);
      }

      this.drawMap();
    }
  }

  BB.HUD = HUD;
})();
</script>
<script>
/* ---- js/menu.js ---- */
/* BuggyBoom — menus: title, racer and event select, how to play, settings, pause, results,
   circuit standings and the podium. Every button carries a data-act; one click handler routes them. */
(function () {
  'use strict';
  const BB = window.BB;

  const STAT_NAMES = BB.STAT_NAMES;
  const ink = BB.ink;

  // A row of option buttons: opts = [[value, label], ...], cur = the value that's on.
  // extra: more attributes for every button (such as which racer the row is for).
  const seg = (act, cur, opts, extra) => opts.map(([v, label]) => `<button data-act="${act}" data-v="${v}" ${extra || ''} class="${String(cur) === String(v) ? 'on' : ''}">${label}</button>`).join('');

  // One stat with its pips. cls(i) gives each pip's class.
  const statRow = (label, n, cls) => {
    let pips = '';
    for (let i = 1; i <= n; i++) pips += `<i class="${cls(i)}"></i>`;
    return `<div class="stat"><span>${label}</span><div class="pips">${pips}</div></div>`;
  };

  // "62 cred to rank 7", or a line for the top rank.
  const toGoText = (ri, top) => (ri.hi ? ri.toGo + ' cred to rank ' + (ri.rank + 1) : top);

  // A rank bar: the rank, how far there is to go, and the bar itself (inner = what fills it).
  const rankBar = (ri, inner, big) =>
    `<div class="rankbar${big ? ' big' : ''}"><div class="rb-top"><b>Rank ${ri.rank} · ${BB.esc(BB.rankName(ri.rank))}</b><span>${toGoText(ri, 'Top rank. Nothing left to prove.')}</span></div><div class="rb">${inner}</div></div>`;

  // What a locked racer or kart needs.
  const lockedHint = (name, rank) => '🔒 ' + name + ': reach rank ' + rank + ' (' + BB.rankName(rank) + '). You are rank ' + BB.rank() + '.';

  class Menu {
    constructor(game) {
      this.game = game;
      this.el = document.getElementById('menu');
      this.screen = null;
      this.prev = 'title';
      this.data = null;
      this.el.addEventListener('click', (e) => this.click(e));
      this.el.addEventListener('input', (e) => this.input(e));
      window.addEventListener('keydown', (e) => {
        if (!this.visible()) return;
        if (e.code === 'Enter' || e.code === 'NumpadEnter') {
          e.preventDefault();
          this.primary();
        }
      });
    }

    visible() {
      return this.el.classList.contains('on');
    }

    show(screen, data) {
      if (screen === 'lobby') this.inLobby = true;
      else if (screen === 'title' || screen === 'online') this.inLobby = false;
      if (screen === 'select' && this.inLobby && this.game.net) screen = 'lobby';
      const side = ['settings', 'howto', 'unlocks'];
      if (side.includes(screen) && !side.includes(this.screen)) this.prev = this.screen || 'title';
      this.screen = screen;
      if (data !== undefined) this.data = data;
      this.el.className = 'on s-' + screen;
      const scroll = this.el.querySelector('.m-panel');
      const top = scroll && screen === this.lastScreen ? scroll.scrollTop : 0;
      this.el.innerHTML = this[screen]();
      if (screen === 'lobby' && this.game.net && this.game.net.role === 'host' && this.game.net.lobby) this.game.net.sendLobbyQuiet();
      this.lastScreen = screen;
      const panel = this.el.querySelector('.m-panel');
      if (panel) panel.scrollTop = top;
      const first = this.el.querySelector('.primary');
      if (first) first.focus({ preventScroll: true });
    }

    hide() {
      this.el.className = '';
      this.el.innerHTML = '';
      this.screen = null;
    }

    // Enter / gamepad A.
    primary() {
      const b = this.el.querySelector('.primary');
      if (b) b.click();
    }

    // Esc / gamepad B.
    back() {
      const s = this.screen;
      if (s === 'select') this.show('title');
      else if (s === 'cpus') this.show('select');
      else if (s === 'online') this.show('title');
      else if (s === 'lobby') this.game.leaveOnline();
      else if (s === 'settings' || s === 'howto' || s === 'unlocks') this.show(this.prev);
      else if (s === 'pause') this.game.resume();
    }

    click(e) {
      const b = e.target.closest('[data-act]');
      if (!b) return;
      const act = b.dataset.act;
      const g = this.game;
      g.audio.ui();
      const st = BB.settings;
      const save = (screen) => {
        BB.saveSettings();
        if (screen) this.show(screen);
      };
      switch (act) {
        case 'single':
          if (st.mode === 'circuit') st.mode = 'single';
          save();
          this.preview();
          this.show('select');
          break;
        case 'circuit':
          st.mode = 'circuit';
          save();
          this.preview();
          this.show('select');
          break;
        case 'howto': this.show('howto'); break;
        case 'settings': this.show('settings'); break;
        case 'back': this.back(); break;
        case 'pick': {
          const r = BB.racerById(b.dataset.id);
          if (!BB.racerUnlocked(r.id)) {
            this.hint = lockedHint(r.name, r.unlock);
            this.show('select');
            break;
          }
          BB.setPick(this.pickerIndex(), r.id);
          this.hint = '';
          save('select');
          break;
        }
        case 'kart': {
          const kb = BB.kartById(b.dataset.id);
          if (BB.kartUnlocked(kb.id)) {
            st.karts[BB.partyPicks()[this.pickerIndex()]] = kb.id;
            this.hint = '';
            save('select');
          } else {
            this.hint = lockedHint(kb.name, kb.unlock);
            this.show('select');
          }
          break;
        }
        case 'unlocks':
          this.show('unlocks');
          break;
        case 'players':
          st.players = +b.dataset.v;
          this.picker = 0;
          save('select');
          break;
        case 'picker':
          this.picker = +b.dataset.v;
          this.hint = '';
          this.show('select');
          break;
        case 'cpus':
          this.show('cpus');
          break;
        case 'cpuPreset':
          st.difficulty = b.dataset.v;
          save('cpus');
          break;
        case 'cpuCount':
          st.cpuCount = +b.dataset.v;
          save('cpus');
          break;
        case 'cpuLevel':
          st.cpuCustom[b.dataset.id] = b.dataset.v;
          save('cpus');
          break;
        case 'cpuAll':
          for (const r of BB.unlockedRacers()) st.cpuCustom[r.id] = b.dataset.v;
          save('cpus');
          break;
        case 'cpusDone':
          this.show('select');
          break;
        case 'online':
          this.netNote = '';
          this.show('online');
          break;
        case 'host':
          st.name = this.nameValue();
          save();
          g.hostOnline(st.name || 'Host');
          this.show('online');
          break;
        case 'join':
          st.name = this.nameValue();
          save();
          g.joinOnline(this.joinCode || '', st.name || 'Player');
          this.show('online');
          break;
        case 'lobbyPick':
          if (!g.net || !BB.racerUnlocked(b.dataset.id)) break;
          st.racer = b.dataset.id;
          save();
          if (g.net.role === 'host') g.net.sendLobby();
          else g.net.pick(st.racer);
          this.show('lobby');
          break;
        case 'lobbyKart': {
          if (!g.net || !g.net.lobby || !BB.kartUnlocked(b.dataset.id)) break;
          const meId = g.net.role === 'host' ? 'host' : g.net.myId;
          const mine = g.net.lobby.players.find((p) => p.id === meId);
          const racer = mine ? mine.racer : st.racer;
          st.karts[racer] = b.dataset.id;
          save();
          if (g.net.role === 'host') g.net.sendLobby();
          else g.net.pick(racer);
          this.show('lobby');
          break;
        }
        case 'netStart':
          if (g.net && g.net.role === 'host') g.net.startRace();
          break;
        case 'netAgain':
          if (g.net) g.net.startRace();
          break;
        case 'netLobby':
          if (g.net) g.net.toLobby();
          break;
        case 'leave':
          g.leaveOnline();
          break;
        case 'paint': {
          const paint = BB.paintById(b.dataset.id);
          if (BB.paintUnlocked(paint.id)) {
            st.paints[BB.partyPicks()[this.pickerIndex()]] = paint.id;
            this.hint = '';
            save('select');
          } else {
            this.hint = '🔒 ' + paint.name + ': ' + paint.how;
            this.show('select');
          }
          break;
        }
        case 'mode':
          st.mode = b.dataset.v;
          save();
          this.preview();
          this.show('select');
          break;
        case 'track':
          st.track = b.dataset.id;
          save();
          this.preview();
          this.show('select');
          break;
        case 'pickCircuit':
          st.circuit = b.dataset.id;
          save();
          this.preview();
          this.show('select');
          break;
        case 'laps':
          st.laps = +b.dataset.v;
          save('select');
          break;
        case 'start':
          if (st.mode === 'circuit') g.startCircuit();
          else if (st.mode === 'trial') g.startTrial();
          else g.startRace();
          break;
        case 'resume': g.resume(); break;
        case 'restart': g.restart(); break;
        case 'again': g.restart(); break;
        case 'standings': this.show('standings', g.circuit); break;
        case 'next': g.nextCircuitRace(); break;
        case 'circuitAgain': g.startCircuit(); break;
        case 'quit': g.quitToTitle(); break;
        case 'change': g.quitToTitle('select'); break;
        case 'toggle':
          st[b.dataset.key] = !st[b.dataset.key];
          save('settings');
          break;
        case 'reset':
          BB.resetSettings();
          this.show('settings');
          break;
      }
    }

    // Which player on this computer the racer screen is picking for (0 = P1).
    pickerIndex() {
      return Math.min(this.picker || 0, BB.settings.players - 1);
    }

    // Show the chosen track (or the circuit's first track) racing behind the menu.
    preview() {
      const st = BB.settings;
      const id = st.mode === 'circuit' ? BB.circuitById(st.circuit).tracks[0] : st.track;
      if (this.game.track.id !== id) this.game.startAttract(id, true);
    }

    nameValue() {
      const el = this.el.querySelector('input[data-key=name]');
      return el ? el.value.trim().slice(0, 16) : BB.settings.name;
    }

    input(e) {
      const t = e.target;
      const key = t.dataset.key;
      if (key === 'code') this.joinCode = t.value.toUpperCase();
      if (key === 'name') BB.settings.name = t.value.slice(0, 16);
      if (key === 'volume' || key === 'music') {
        BB.settings[key] = +t.value / 100;
        const out = this.el.querySelector('output[data-for=' + key + ']');
        if (out) out.textContent = t.value + '%';
        BB.saveSettings();
      }
    }

    // ---------- screens ----------

    title() {
      return `
        <div class="m-title">
          <div class="logo"><span class="l1">BUGGY</span><span class="l2">BOOM</span></div>
          <div class="tagline">${BB.text('Kart racing for people who should know better.')}</div>
          ${this.rankChip()}
          <div class="m-btns">
            <button class="big primary" data-act="single">RACE</button>
            <button class="big" data-act="circuit">CIRCUITS</button>
            <button class="big" data-act="online">ONLINE</button>
            <button class="big" data-act="unlocks">UNLOCKS</button>
            <button class="big" data-act="howto">HOW TO PLAY</button>
            <button class="big" data-act="settings">SETTINGS</button>
          </div>
          <div class="rating"><b>R</b><span>Cartoon gore · Crude humor · Strong language<br><small>Gore and swearing can be switched off in Settings.</small></span></div>
          <div class="ver">v${BB.GAME_VERSION}</div>
        </div>`;
    }

    select() {
      const st = BB.settings;
      const players = BB.clamp(st.players, 1, 4);
      if (players > 1 && st.mode === 'trial') st.mode = 'single'; // time trials are one player
      const circuitMode = st.mode === 'circuit';
      const picks = BB.partyPicks().slice(0, players);
      const picker = Math.min(this.picker || 0, players - 1);
      const cards = BB.RACERS.map((r) => {
        const stats = STAT_NAMES.map(([k, label]) => statRow(label, 5, (i) => (i <= r.stats[k] ? 'on' : ''))).join('');
        if (!BB.racerUnlocked(r.id)) {
          return `
          <button class="card locked" data-act="pick" data-id="${r.id}" style="--c:${ink(r.color)};--n:${ink(r.color)}">
            <div class="card-band"></div>
            <div class="card-name">🔒 ${BB.esc(r.name)}</div>
            <div class="card-bio">Unlocks at rank ${r.unlock}: <b>${BB.esc(BB.rankName(r.unlock))}</b>.</div>
            <div class="card-stats">${stats}</div>
          </button>`;
        }
        const who = picks.indexOf(r.id);
        const badge = who >= 0 && players > 1 ? `<span class="pbadge p${who + 1}">P${who + 1}</span>` : '';
        return `
          <button class="card${who === picker ? ' on' : who >= 0 ? ' taken' : ''}" data-act="pick" data-id="${r.id}" style="--c:${ink(r.color)};--n:${ink(r.color)}">
            <div class="card-band"></div>${badge}
            <div class="card-name">${BB.esc(r.name)}</div>
            <div class="card-bio">${BB.text(r.bio)}</div>
            <div class="card-stats">${stats}</div>
          </button>`;
      }).join('');
      const me = BB.racerById(picks[picker]);
      const trialMode = st.mode === 'trial';
      let tiles;
      let blurb;
      if (trialMode) {
        tiles = BB.TRACKS.map((t) => {
          const b = BB.bestTimes(t.id);
          const race = b.race[String(st.laps)];
          const times = b.lap ? `Best lap ${BB.fmtTime(b.lap)}${race ? ' · ' + st.laps + ' laps ' + BB.fmtTime(race) : ''}${BB.loadGhost(t.id) ? ' · 👻' : ''}` : 'No time set yet';
          return `<button class="tile${st.track === t.id ? ' on' : ''}" data-act="track" data-id="${t.id}"><b>${BB.esc(t.name)}</b><span>${times}</span></button>`;
        }).join('');
        const t = BB.trackById(st.track);
        blurb = `<b>Time trial on ${BB.esc(t.name)}.</b> Just you, three nitros and the ghost of your best lap. No crates, no opponents. The hazards are still there.`;
      } else if (circuitMode) {
        tiles = BB.CIRCUITS.map((c) => {
          const names = c.tracks.map((id) => BB.esc(BB.trackById(id).short)).join(' · ');
          return `<button class="tile${st.circuit === c.id ? ' on' : ''}" data-act="pickCircuit" data-id="${c.id}"><b>${BB.esc(c.name)}</b><span>${c.tracks.length} races: ${names}</span></button>`;
        }).join('');
        const c = BB.circuitById(st.circuit);
        blurb = `<b>${BB.esc(c.name)}.</b> ${BB.esc(c.blurb)} Points for each place (15 for 1st down to 1 for 8th) plus 1 per kill.`;
      } else {
        tiles = BB.TRACKS.map((t) => `<button class="tile${st.track === t.id ? ' on' : ''}" data-act="track" data-id="${t.id}"><b>${BB.esc(t.name)}</b><span>${BB.esc(t.features)}</span></button>`).join('');
        const t = BB.trackById(st.track);
        blurb = `<b>${BB.esc(t.name)}.</b> ${BB.esc(t.blurb)}`;
      }
      const myKart = BB.kartById(BB.kartFor(me.id));
      const karts = BB.KARTS.map((kb) => {
        const open = BB.kartUnlocked(kb.id);
        return `<button class="kartb${myKart.id === kb.id ? ' on' : ''}${open ? '' : ' locked'}" data-act="kart" data-id="${kb.id}" title="${BB.esc(kb.name + ' — ' + kb.blurb)}"><em>${kb.icon}</em><span><b>${open ? '' : '🔒 '}${BB.esc(kb.name)}</b><small>${open ? BB.esc(BB.kartModText(kb)) : 'Rank ' + kb.unlock}</small></span></button>`;
      }).join('');
      const fin = BB.kartStats(me, myKart);
      // Green pips: what the kart adds. Red outlines: what it takes away.
      const kartSum = STAT_NAMES.map(([k, label]) => {
        const base = me.stats[k];
        return statRow(label, 6, (i) => (i <= Math.min(base, fin[k]) ? 'on' : i <= fin[k] ? 'up' : i <= base ? 'down' : ''));
      }).join('');
      const chosen = BB.paintFor(me.id);
      const paints = BB.PAINTS.map((pt) => {
        const open = BB.paintUnlocked(pt.id);
        return `<button class="paint${chosen === pt.id ? ' on' : ''}${open ? '' : ' locked'}" data-act="paint" data-id="${pt.id}" title="${BB.esc(pt.name + ' — ' + pt.how)}"><i style="background:${BB.paintSwatch(pt.id, me)}"></i><span>${open ? BB.esc(pt.name) : '🔒 ' + BB.esc(pt.name)}</span></button>`;
      }).join('');
      return `
        <div class="m-panel wide">
          <div class="m-head"><h2>${players > 1 ? 'PICK YOUR DEGENERATES' : 'PICK YOUR DEGENERATE'}</h2><div class="head-btns"><button class="ghost" data-act="back">← Back</button><button class="big primary" data-act="start">${circuitMode ? 'START CIRCUIT' : trialMode ? 'TIME TRIAL' : 'RACE'}${players > 1 ? ' · ' + players + ' PLAYERS' : ' AS ' + BB.esc(me.short.toUpperCase())} ▶</button></div></div>
          <div class="m-row tight">
            <div class="opt-group"><label>Players on this computer</label><div class="seg">${seg('players', players, [[1, '1'], [2, '2'], [3, '3'], [4, '4']])}</div></div>
            ${players > 1 ? `<div class="opt-group"><label>Picking for</label><div class="seg">${seg('picker', picker, picks.map((id, i) => [i, 'P' + (i + 1) + ' · ' + BB.esc(BB.racerById(id).short)]))}</div></div>` : ''}
            ${players > 1 ? `<div class="small ctl-note">P1 uses WASD, P2 the arrow keys. Each player can also use their own gamepad; P3 and P4 need one.</div>` : ''}
          </div>
          <div class="cards">${cards}</div>
          <div class="karts"><label>Kart for ${players > 1 ? 'P' + (picker + 1) + ' · ' : ''}${BB.esc(me.short)}</label>${karts}</div>
          <div class="kart-sum" style="--c:${ink(me.color)}"><span>${BB.esc(me.short)} in the ${BB.esc(myKart.name)}: <em>${BB.esc(myKart.blurb)}</em></span><div class="kart-stats">${kartSum}</div></div>
          <div class="paints"><label>Paint for ${players > 1 ? 'P' + (picker + 1) + ' · ' : ''}${BB.esc(me.short)}</label>${paints}</div>
          ${this.hint ? `<div class="hint">${BB.esc(this.hint)}</div>` : ''}
          <div class="m-row">
            <div class="opt-group"><label>Mode</label><div class="seg">${seg('mode', st.mode, players > 1 ? [['single', 'Single race'], ['circuit', 'Circuit']] : [['single', 'Single race'], ['circuit', 'Circuit'], ['trial', 'Time trial']])}</div></div>
            <div class="opt-group"><label>Laps</label><div class="seg">${seg('laps', st.laps, [[1, '1'], [3, '3'], [5, '5']])}</div></div>
            ${trialMode ? '' : `<div class="opt-group"><label>CPU racers</label><button class="cpu-btn" data-act="cpus">${BB.esc(BB.cpuSummary(players))} ▸</button></div>`}
          </div>
          <div class="tiles">${tiles}</div>
          <div class="m-row"><div class="blurb">${blurb}</div></div>
        </div>`;
    }

    online() {
      const net = this.game.net;
      if (net && net.lobby) {
        // Connected: straight into the lobby.
        setTimeout(() => this.show('lobby'), 0);
      }
      const st = BB.settings;
      const status = net && net.status ? `<p class="status">${BB.esc(net.status)}</p>` : '';
      const err = (net && net.error) || this.netNote ? `<p class="hint">${BB.esc((net && net.error) || this.netNote)}</p>` : '';
      return `
        <div class="m-panel narrow">
          <div class="m-head"><h2>ONLINE RACING</h2><button class="ghost" data-act="back">← Back</button></div>
          <div class="opt-group"><label>Your name</label><input class="text" type="text" maxlength="16" data-key="name" value="${BB.esc(st.name)}" placeholder="What should we call you?"></div>
          <div class="online-cols">
            <div>
              <h3>Host a race</h3>
              <p class="small">You get a room code to send your friends. Your computer runs the race, so keep the game open.</p>
              <button class="big primary" data-act="host">HOST ▶</button>
            </div>
            <div>
              <h3>Join a race</h3>
              <p class="small">Type the code the host sent you.</p>
              <div class="join-row"><input class="text code" type="text" maxlength="6" data-key="code" value="${BB.esc(this.joinCode || '')}" placeholder="CODE"><button class="big" data-act="join">JOIN</button></div>
            </div>
          </div>
          ${status}${err}
          <p class="small">Up to 8 racers. CPUs fill every empty spot, and take over for anyone who drops out. Everyone needs the internet and the same version of BuggyBoom (this is v${BB.GAME_VERSION}). Players connect straight to each other through the free PeerJS service.</p>
        </div>`;
    }

    lobby() {
      const g = this.game;
      const net = g.net;
      if (!net || !net.lobby) return this.online();
      const st = BB.settings;
      const L = net.lobby;
      const isHost = net.role === 'host';
      const me = isHost ? 'host' : net.myId;
      const rows = L.players
        .map((p) => {
          const r = BB.racerById(p.racer);
          return `<div class="lobby-row${p.id === me ? ' me' : ''}"><b>${BB.esc(p.name)}</b><span style="color:${ink(r.color)}">${BB.esc(r.name)}</span><span class="dim">${BB.kartById(p.kart).icon} ${BB.esc(BB.kartById(p.kart).name)}</span>${p.id === 'host' ? '<em>host</em>' : ''}</div>`;
        })
        .join('');
      const cpuNote = `<div class="lobby-row cpu"><b>Empty spots</b><span>${BB.esc(BB.cpuSummary(L.players.length))}</span></div>`;
      // Everyone picks their own racer and kart here. Taken and locked racers can't be picked.
      const taken = L.players.filter((p) => p.id !== me).map((p) => p.racer);
      const mine = (L.players.find((p) => p.id === me) || {}).racer;
      const myKart = BB.kartFor(mine || st.racer);
      const racerPicks = BB.RACERS.map((r) => {
        const open = BB.racerUnlocked(r.id);
        return `<button class="rpick${r.id === mine ? ' on' : ''}" data-act="lobbyPick" data-id="${r.id}" ${taken.includes(r.id) || !open ? 'disabled' : ''} ${open ? '' : `title="Reach rank ${r.unlock}"`} style="--c:${ink(r.color)}">${open ? '' : '🔒 '}${BB.esc(r.name)}</button>`;
      }).join('');
      const kartPicks = BB.KARTS.map((kb) => {
        const open = BB.kartUnlocked(kb.id);
        return `<button class="rpick kp${kb.id === myKart ? ' on' : ''}" data-act="lobbyKart" data-id="${kb.id}" ${open ? '' : `disabled title="Reach rank ${kb.unlock}"`}>${open ? kb.icon : '🔒'} ${BB.esc(kb.name)}</button>`;
      }).join('');
      const myPicks = `
          <div class="opt-group"><label>Your racer</label><div class="rpicks">${racerPicks}</div></div>
          <div class="opt-group lobby-karts"><label>Your kart</label><div class="rpicks">${kartPicks}</div></div>`;
      let controls;
      if (isHost) {
        const circuitMode = st.mode === 'circuit';
        const tiles = circuitMode
          ? BB.CIRCUITS.map((c) => `<button class="tile${st.circuit === c.id ? ' on' : ''}" data-act="pickCircuit" data-id="${c.id}"><b>${BB.esc(c.name)}</b><span>${c.tracks.length} races</span></button>`).join('')
          : BB.TRACKS.map((t) => `<button class="tile${st.track === t.id ? ' on' : ''}" data-act="track" data-id="${t.id}"><b>${BB.esc(t.name)}</b><span>${BB.esc(t.features)}</span></button>`).join('');
        if (st.mode === 'trial') st.mode = 'single';
        controls = `
          <div class="m-row">
            <div class="opt-group"><label>Mode</label><div class="seg">${seg('mode', st.mode, [['single', 'Single race'], ['circuit', 'Circuit']])}</div></div>
            <div class="opt-group"><label>Laps</label><div class="seg">${seg('laps', st.laps, [[1, '1'], [3, '3'], [5, '5']])}</div></div>
            <div class="opt-group"><label>CPU racers</label><button class="cpu-btn" data-act="cpus">${BB.esc(BB.cpuSummary(L.players.length))} ▸</button></div>
          </div>
          <div class="tiles">${tiles}</div>
          ${myPicks}`;
      } else {
        controls = `
          <p class="small">The host picked: <b>${BB.esc(net.setup || '...')}</b></p>
          ${myPicks}
          <div class="waiting">Waiting for the host to start...</div>`;
      }
      return `
        <div class="m-panel wide">
          <div class="m-head"><h2>ONLINE LOBBY</h2><div class="head-btns"><button class="ghost" data-act="leave">Leave</button>${isHost ? '<button class="big primary" data-act="netStart">START RACE ▶</button>' : ''}</div></div>
          <div class="lobby-top">
            <div class="room"><label>Room code</label><b>${BB.esc(L.code)}</b><span>${isHost ? 'Send this to your friends. They pick ONLINE, then JOIN.' : 'You\'re in.'}</span></div>
            <div class="lobby-list"><label>Racers (${L.players.length} of 8)</label>${rows}${cpuNote}</div>
          </div>
          ${controls}
        </div>`;
    }

    cpus() {
      const st = BB.settings;
      const players = BB.clamp(st.players, 1, 4);
      const taken = BB.partyPicks().slice(0, players);
      const levels = BB.CPU_LEVEL_IDS.map((id) => [id, BB.cpuLevel(id).name]);
      const custom = st.difficulty === 'custom';
      const free = BB.MAX_RACERS - players;
      let body;
      if (custom) {
        const open = BB.unlockedRacers().filter((r) => !taken.includes(r.id));
        let used = 0;
        const rows = open
          .map((r) => {
            const cur = st.cpuCustom[r.id] || 'normal';
            const sits = cur !== 'out' && ++used > free;
            return `<div class="cpu-row${sits ? ' sits' : ''}"><b style="color:${ink(r.color)}">${BB.esc(r.name)}${sits ? '<em>No room, sits out</em>' : ''}</b><div class="seg">${seg('cpuLevel', cur, [['out', 'Out']].concat(levels), `data-id="${r.id}"`)}</div></div>`;
          })
          .join('');
        const full = open.length > free ? ` Only ${free} fit${players > 1 ? ' with ' + players + ' players' : ''}: set some to Out to choose who races. Anyone lower down the list sits out first.` : '';
        body = `
          <p class="small">Set each CPU on its own, or leave some out. Racers your players picked aren't listed.${full}</p>
          <div class="opt-group"><label>Set them all to</label><div class="seg">${seg('cpuAll', '', levels)}</div></div>
          <div class="cpu-list">${rows}</div>`;
      } else {
        const counts = [];
        for (let n = 0; n <= free; n++) counts.push([n, String(n)]);
        body = `
          <div class="opt-group"><label>How many CPUs</label><div class="seg">${seg('cpuCount', Math.min(st.cpuCount, free), counts)}</div></div>
          <p class="small">They fill the spots nobody's in (up to 8 racers), and get random racers.</p>`;
      }
      const desc = BB.CPU_LEVEL_IDS.map((id) => `<li><b>${BB.cpuLevel(id).name}:</b> ${BB.cpuLevel(id).blurb}</li>`).join('');
      return `
        <div class="m-panel">
          <div class="m-head"><h2>CPU RACERS</h2><div class="head-btns"><button class="big primary" data-act="cpusDone">DONE ▶</button></div></div>
          <div class="opt-group"><label>Difficulty</label><div class="seg">${seg('cpuPreset', st.difficulty, levels.concat([['custom', 'Custom']]))}</div></div>
          ${body}
          <ul class="tips">${desc}</ul>
          <p class="small">Now: <b>${BB.esc(BB.cpuSummary(players))}</b>. Online, CPUs also fill empty spots and take over for anyone who drops out.</p>
        </div>`;
    }

    howto() {
      const items = BB.ITEM_IDS.filter((id) => id !== 'rocket3' && id !== 'nitro3')
        .map((id) => {
          const it = BB.ITEMS[id];
          return `<div class="it"><span class="ic">${it.icon}</span><div><b>${BB.esc(it.name)}</b><span>${BB.text(it.tip)}</span></div></div>`;
        })
        .join('');
      const tracks = BB.TRACKS.map((t) => `<li><b>${BB.esc(t.name)}:</b> ${BB.esc(t.features)}.</li>`).join('');
      return `
        <div class="m-panel">
          <div class="m-head"><h2>HOW TO PLAY</h2><button class="ghost primary" data-act="back">← Back</button></div>
          <div class="cols">
            <div>
              <h3>Controls</h3>
              <table class="keys">
                <tr><td>Gas / brake</td><td><kbd>W</kbd> <kbd>S</kbd> or <kbd>↑</kbd> <kbd>↓</kbd></td></tr>
                <tr><td>Steer</td><td><kbd>A</kbd> <kbd>D</kbd> or <kbd>←</kbd> <kbd>→</kbd></td></tr>
                <tr><td>Hop and drift</td><td>Hold <kbd>Space</kbd> or <kbd>Shift</kbd> while turning</td></tr>
                <tr><td>Air trick</td><td>Tap <kbd>Space</kbd> in the air off a jump</td></tr>
                <tr><td>Use item</td><td><kbd>E</kbd></td></tr>
                <tr><td>Use item backward</td><td><kbd>Q</kbd></td></tr>
                <tr><td>Look back</td><td><kbd>C</kbd></td></tr>
                <tr><td>Stuck? Reset</td><td><kbd>R</kbd></td></tr>
                <tr><td>Pause</td><td><kbd>Esc</kbd> or <kbd>P</kbd></td></tr>
                <tr><td>Gamepad</td><td>Stick steer · A/RT gas · B/LT brake · RB drift and tricks · X item (stick down = backward) · Y look back</td></tr>
              </table>
              <h3>Tips</h3>
              <ul class="tips">
                <li><b>Drift</b> through corners. Sparks go yellow, orange, then red. Let go for a boost: hotter sparks, longer boost.</li>
                <li><b>Tricks:</b> tap drift in the air off a jump or geyser. Land it for a boost. Land mid-spin and you eat it.</li>
                <li><b>Secret shortcuts:</b> every track has one, hidden behind junk you can smash through. Find it once and it shows on your map.</li>
                <li><b>Rocket start:</b> hit the gas just before GO. Too early and you flood the engine.</li>
                <li><b>You can die.</b> Your kart blows up and you come back a few seconds later, behind where you died. Health doesn't come back on its own: kills and finishing a lap patch you up.</li>
                <li><b>Off-road</b> is half speed. Orange arrows on the road are boost pads.</li>
                <li><b>Circuits:</b> several races in a row. 15 points for 1st down to 1 for 8th, plus 1 per kill.</li>
                <li><b>Cred and ranks:</b> every race earns cred. Rank up to unlock new racers, karts and paint jobs. See UNLOCKS on the title screen.</li>
              </ul>
            </div>
            <div>
              <h3>Items</h3>
              <div class="items">${items}</div>
              <p class="small">Smash through the yellow <b>?</b> crates to get one. <kbd>Q</kbd> fires rockets, saws and the shotgun behind you, and lobs bombs and puke ahead.</p>
              <h3>Tracks</h3>
              <ul class="tips">${tracks}</ul>
            </div>
          </div>
        </div>`;
    }

    // ---------- rank and unlocks ----------

    rankChip() {
      const ri = BB.rankInfo();
      return `<button class="rankchip" data-act="unlocks"><span>RANK ${ri.rank}</span><b>${BB.esc(BB.rankName(ri.rank))}</b><i class="rb"><i style="width:${(ri.pct * 100).toFixed(1)}%"></i></i><em>${toGoText(ri, 'Top rank')} ▸</em></button>`;
    }

    // A small picture for a reward: a racer's colours, a kart's icon or a paint swatch.
    rewardIcon(u) {
      if (u.type === 'racer') {
        const r = BB.racerById(u.id);
        return `<i class="u-racer" style="background:linear-gradient(135deg, ${r.color} 0 60%, ${r.accent} 60%)">${BB.esc(r.short[0])}</i>`;
      }
      if (u.type === 'kart') return `<i class="u-kart">${BB.kartById(u.id).icon}</i>`;
      return `<i style="background:${BB.paintSwatch(u.id, BB.racerById(BB.partyPicks()[0]))}"></i>`;
    }

    unlockCard(u) {
      let title;
      let note;
      if (u.type === 'racer') {
        const r = BB.racerById(u.id);
        title = 'NEW RACER: ' + r.name.toUpperCase();
        note = BB.text(r.bio) + ' Pick them on the racer screen.';
      } else if (u.type === 'kart') {
        const kb = BB.kartById(u.id);
        title = 'NEW KART: ' + kb.name.toUpperCase();
        note = BB.esc(kb.blurb + ' ' + BB.kartModText(kb) + '. Pick it on the racer screen.');
      } else {
        title = 'NEW PAINT: ' + BB.paintById(u.id).name.toUpperCase();
        note = 'Every racer can wear it now. Pick it on the racer screen.';
      }
      return `<div class="unlock">${this.rewardIcon(u)}<div><b>${BB.esc(title)}</b><span>${note}</span></div></div>`;
    }

    // What a race earned, the rank bar filling up, and anything it unlocked.
    credBox(c, head) {
      if (!c) return '';
      const fmt = (n) => (n < 0 ? '−' : '+') + Math.abs(n);
      const multi = (c.per || []).length > 1;
      const lines = (c.per || [])
        .map((p) => `<div class="cred-line">${p.label ? `<b class="who">${BB.esc(p.label + ' · ' + p.name)}</b>` : ''}${p.parts.map(([l, n]) => `<span>${BB.esc(l)} <i class="${n < 0 ? 'neg' : ''}">${fmt(n)}</i></span>`).join('')}${multi ? `<b class="sum">${fmt(p.total)}</b>` : ''}</div>`)
        .join('');
      const a = BB.rankInfo(c.cred);
      const from = c.after > c.before ? 0 : BB.rankInfo(c.cred - c.gained).pct;
      const bar = rankBar(a, `<i style="--from:${(from * 100).toFixed(1)}%;--to:${(a.pct * 100).toFixed(1)}%"></i>`); // fills from before to after
      const up = c.after > c.before ? `<div class="rankup">RANK UP! ${BB.esc(BB.rankName(c.after).toUpperCase())}</div>` : '';
      return `<div class="cred"><div class="cred-l"><div class="cred-head"><b>${head ? BB.esc(head) + ' ' : ''}+${c.gained} CRED</b>${lines}</div>${up}</div><div class="cred-r">${bar}${(c.unlocked || []).map((u) => this.unlockCard(u)).join('')}</div></div>`;
    }

    unlocks() {
      const p = BB.progress();
      const ri = BB.rankInfo();
      const rewards = BB.rewards();
      const rows = BB.RANKS.map((name, i) => {
        const n = i + 1;
        const got = ri.rank >= n;
        const list = rewards.filter((u) => u.rank === n);
        const what = n === 1 ? '<span class="rw">The first 8 racers and the Buggy</span>' : list.map((u) => `<span class="rw">${this.rewardIcon(u)}${BB.esc(u.name)}<small>${u.type}</small></span>`).join('');
        const status = got ? '<em class="ok">✔ Unlocked</em>' : `<em>${BB.credForRank(n) - p.cred} cred to go</em>`;
        return `<div class="rank-row${got ? ' got' : ''}${n === ri.rank ? ' now' : ''}"><b class="rn">${n}</b><div class="rt"><b>${BB.esc(name)}</b><div class="rws">${what}</div></div>${status}</div>`;
      }).join('');
      const me = BB.racerById(BB.partyPicks()[0]);
      const paints = BB.PAINTS.filter((pt) => pt.test)
        .map((pt) => {
          const open = BB.paintUnlocked(pt.id);
          return `<div class="paint${open ? '' : ' locked'}"><i style="background:${BB.paintSwatch(pt.id, me)}"></i><span>${open ? '' : '🔒 '}${BB.esc(pt.name)}<small>${BB.esc(pt.how)}</small></span></div>`;
        })
        .join('');
      return `
        <div class="m-panel">
          <div class="m-head"><h2>RANK &amp; UNLOCKS</h2><button class="ghost primary" data-act="back">← Back</button></div>
          <div class="rank-top">
            ${rankBar(ri, `<i style="width:${(ri.pct * 100).toFixed(1)}%"></i>`, true)}
            <div class="rank-stats"><span><b>${p.cred}</b> cred</span><span><b>${p.races}</b> races</span><span><b>${p.wins}</b> wins</span></div>
          </div>
          <p class="small">Every race earns cred: for finishing, for every racer you beat, a win, kills, tricks and secret shortcuts. Longer races pay more, and tougher CPUs pay up to ×1.75 (Pushover pays half). Circuits add a trophy bonus. Time trials pay for laps and new records. Split-screen players all add to the same pot.</p>
          <div class="rank-list">${rows}</div>
          <h3 class="sub-h">Paint jobs from circuits</h3>
          <div class="paints wrap">${paints}</div>
        </div>`;
    }

    settings() {
      const st = BB.settings;
      const tog = (key, label, note) => `
        <div class="opt"><span>${label}</span><button class="switch${st[key] ? ' on' : ''}" data-act="toggle" data-key="${key}"><i></i></button>${note ? `<div class="note">${note}</div>` : ''}</div>`;
      const slider = (key, label) => {
        const v = Math.round(st[key] * 100);
        return `<div class="opt"><span>${label}</span><div class="ctl"><input type="range" min="0" max="100" value="${v}" data-key="${key}"><output data-for="${key}">${v}%</output></div>${BB.forceMute ? '<div class="note">Muted by the address bar (?mute).</div>' : ''}</div>`;
      };
      return `
        <div class="m-panel narrow">
          <div class="m-head"><h2>SETTINGS</h2><button class="ghost primary" data-act="back">← Back</button></div>
          <div class="opts">
            ${slider('music', 'Music')}
            ${slider('volume', 'Sound effects')}
            ${tog('gore', 'Gore', 'Blood, body parts, splatter on the screen. Off: cartoon stars and smoke.')}
            ${tog('swearing', 'Swearing', 'Off turns every swear word into #@$%!.')}
            ${tog('shake', 'Screen shake')}
            ${tog('shadows', 'Shadows', 'Turn off if the game runs slowly.')}
            ${tog('showFps', 'Show FPS')}
          </div>
          <button class="ghost reset" data-act="reset">Reset to defaults</button>
        </div>`;
    }

    pause() {
      if (this.game.net) {
        return `
        <div class="m-panel narrow center">
          <h2 class="big-h">MENU</h2>
          <p class="small">Online races don't stop. Your kart is coasting!</p>
          <div class="m-btns">
            <button class="big primary" data-act="resume">BACK TO THE RACE</button>
            <button class="big" data-act="settings">SETTINGS</button>
            <button class="big" data-act="leave">LEAVE ONLINE RACE</button>
          </div>
        </div>`;
      }
      const c = this.game.circuit;
      return `
        <div class="m-panel narrow center">
          <h2 class="big-h">PAUSED</h2>
          ${c ? `<p class="small">${BB.esc(c.label())}</p>` : ''}
          <div class="m-btns">
            <button class="big primary" data-act="resume">RESUME</button>
            <button class="big" data-act="restart">RESTART RACE</button>
            <button class="big" data-act="settings">SETTINGS</button>
            <button class="big" data-act="howto">HOW TO PLAY</button>
            <button class="big" data-act="quit">${c ? 'QUIT CIRCUIT' : 'QUIT TO TITLE'}</button>
          </div>
          <div class="ver">v${BB.GAME_VERSION}</div>
        </div>`;
    }

    results() {
      const d = this.data || {};
      const rows = d.rows || [];
      const circuit = d.circuit;
      const me = rows.find((r) => r.isPlayer);
      const body = rows
        .map(
          (r) => `<tr class="${r.isPlayer ? 'me' : r.human ? 'human' : ''}">
            <td class="pl">${r.place}<sup>${BB.ordinal(r.place)}</sup></td>
            <td class="nm" style="color:${ink(r.color)}">${BB.esc(r.name)} <em>(${BB.esc(r.who || '')})</em></td>
            <td>${r.projected ? '<span class="dim">~' + BB.fmtTime(r.time) + '</span>' : BB.fmtTime(r.time)}</td>
            <td>${isFinite(r.best) ? BB.fmtTime(r.best) : '—'}</td>
            <td>${r.kills}</td>
            <td>${r.deaths}</td>
            ${circuit ? `<td class="pts">+${r.earned}</td>` : ''}
          </tr>`
        )
        .join('');
      const head = me ? (me.place === 1 ? 'YOU WON. SOMEHOW.' : me.place <= 3 ? 'PODIUM, BABY' : me.place === rows.length ? BB.text('DEAD {FUCKING} LAST') : 'RACE OVER') : 'RACE OVER';
      const sub = circuit ? `<p class="small">${BB.esc(circuit.def.name)} · race ${circuit.idx} of ${circuit.count} · ${BB.esc(this.game.track.name)}</p>` : `<p class="small">${d.online ? 'Online · ' : ''}${BB.esc(d.track || this.game.track.name)}</p>`;
      let buttons = circuit
        ? `<button class="big primary" data-act="standings">STANDINGS ▶</button><button class="big" data-act="quit">QUIT CIRCUIT</button>`
        : `<button class="big primary" data-act="again">RACE AGAIN</button><button class="big" data-act="change">CHANGE RACER</button><button class="big" data-act="quit">TITLE</button>`;
      if (d.client) buttons = `<div class="waiting">Waiting for the host to start the next race...</div><button class="big" data-act="leave">LEAVE</button>`;
      else if (d.host && !circuit) buttons = `<button class="big primary" data-act="netAgain">RACE AGAIN</button><button class="big" data-act="netLobby">LOBBY</button><button class="big" data-act="leave">LEAVE</button>`;
      else if (d.host) buttons = `<button class="big primary" data-act="standings">STANDINGS ▶</button><button class="big" data-act="leave">LEAVE</button>`;
      const clientStand = d.client && d.standings ? `<h3>Standings · ${BB.esc(d.netCircuit.name)} · ${d.netCircuit.idx} of ${d.netCircuit.count}</h3><table class="results">${d.standings.map((r, i) => `<tr class="${r.id === (this.game.race && this.game.race.player && this.game.race.player.r.id) ? 'me' : ''}"><td class="pl">${i + 1}<sup>${BB.ordinal(i + 1)}</sup></td><td class="nm" style="color:${ink(r.color)}">${BB.esc(r.name)}</td><td>${r.kills} kills</td><td class="pts">${r.pts}</td></tr>`).join('')}</table>` : '';
      return `
        <div class="m-panel">
          <div class="m-head"><h2>${head}</h2><div class="head-btns">${buttons}</div></div>
          ${sub}
          <table class="results">
            <tr><th>Pos</th><th>Racer</th><th>Time</th><th>Best lap</th><th>Kills</th><th>Deaths</th>${circuit ? '<th>Points</th>' : ''}</tr>
            ${body}
          </table>
          ${clientStand}
          ${this.credBox(d.cred)}
        </div>`;
    }

    trial() {
      const d = this.data || {};
      const fastest = Math.min(...d.laps);
      const rows = d.laps
        .map((t, i) => `<tr class="${t === fastest ? 'me' : ''}"><td class="pl">Lap ${i + 1}</td><td>${BB.fmtTime(t)}</td><td class="dim">${t <= d.bestLap ? 'best ever' : '+' + (t - d.bestLap).toFixed(2)}</td></tr>`)
        .join('');
      const head = d.raceRecord ? 'NEW RECORD!' : d.lapRecord ? 'NEW BEST LAP!' : 'NOT YOUR BEST';
      const vsRace = d.raceRecord ? 'record' : d.bestRace > 0 ? '+' + (d.total - d.bestRace).toFixed(2) : '';
      return `
        <div class="m-panel narrow">
          <div class="m-head"><h2>${head}</h2></div>
          <p class="small">Time trial · ${BB.esc(d.track)} · ${d.lapCount} ${d.lapCount === 1 ? 'lap' : 'laps'}</p>
          <table class="results">
            ${rows}
            <tr><td class="pl">Total</td><td><b>${BB.fmtTime(d.total)}</b></td><td class="dim">${vsRace}</td></tr>
          </table>
          <p class="small">Best lap on this track: <b>${BB.fmtTime(d.bestLap)}</b>. Your ghost replays it every lap.${d.deaths ? ' You died ' + d.deaths + (d.deaths === 1 ? ' time' : ' times') + ', which did not help.' : ''}</p>
          ${this.credBox(d.cred)}
          <div class="m-row">
            <button class="big primary" data-act="again">TRY AGAIN</button>
            <button class="big" data-act="change">CHANGE TRACK</button>
            <button class="big" data-act="quit">TITLE</button>
          </div>
        </div>`;
    }

    standingsTable(c) {
      const rows = c.standings();
      const heads = c.def.tracks.map((id, i) => `<th title="${BB.esc(BB.trackById(id).name)}">R${i + 1}</th>`).join('');
      const body = rows
        .map((r, i) => {
          const isMe = c.isLocal(r.id);
          const places = c.def.tracks.map((_, j) => `<td class="dim">${r.places[j] ? r.places[j] + BB.ordinal(r.places[j]) : '—'}</td>`).join('');
          return `<tr class="${isMe ? 'me' : r.human ? 'human' : ''}"><td class="pl">${i + 1}<sup>${BB.ordinal(i + 1)}</sup></td><td class="nm" style="color:${ink(r.color)}">${BB.esc(r.name)} <em>(${BB.esc(r.who || '')})</em></td>${places}<td>${r.kills}</td><td class="pts">${r.pts}</td></tr>`;
        })
        .join('');
      return `<table class="results"><tr><th>Pos</th><th>Racer</th>${heads}<th>Kills</th><th>Points</th></tr>${body}</table>`;
    }

    standings() {
      const c = this.data;
      const next = c.done ? null : BB.trackById(c.trackId);
      return `
        <div class="m-panel">
          <div class="m-head"><h2>STANDINGS</h2></div>
          <p class="small">${BB.esc(c.def.name)} · ${c.idx} of ${c.count} races done</p>
          ${this.standingsTable(c)}
          <div class="m-row">
            <button class="big primary" data-act="next">${next ? 'NEXT: ' + BB.esc(next.name.toUpperCase()) + ' ▶' : 'FINAL RESULTS ▶'}</button>
            <button class="big" data-act="quit">QUIT CIRCUIT</button>
          </div>
        </div>`;
    }

    podium() {
      const c = this.data;
      const rows = c.standings();
      const mine = rows.findIndex((r) => c.isLocal(r.id));
      const top = rows
        .slice(0, 3)
        .map((r, i) => `<div class="pod p${i + 1}"><div class="trophy">${['🚽', '🏺', '🥉'][i]}</div><div class="pn" style="color:${ink(r.color)}">${BB.esc(r.name)}</div><div class="pt">${r.pts} pts</div><div class="tn">${BB.TROPHIES[i]}</div></div>`)
        .join('');
      const msg =
        mine === 0
          ? `You won the <b>Golden Toilet</b>. Put it somewhere everyone can see it.`
          : mine < 3
            ? `You took home the <b>${BB.TROPHIES[mine]}</b>. Close enough.`
            : BB.text(`You finished ${mine + 1}${BB.ordinal(mine + 1)}. No toilet for you, {dumbass}.`);
      return `
        <div class="m-panel">
          <div class="m-head"><h2>${BB.esc(c.def.name.toUpperCase())}: FINAL</h2><div class="head-btns">
            <button class="big primary" data-act="circuitAgain">RUN IT AGAIN</button>
            <button class="big" data-act="change">CHANGE RACER</button>
            <button class="big" data-act="quit">TITLE</button>
          </div></div>
          <div class="podium">${top}</div>
